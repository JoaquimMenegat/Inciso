const LAB_FILHOS=['Ana','Bruno','Clara','Diego','Elisa','Fábio'];
const LAB_NETOS=[['Bia','Caio','Dora'],['Eva','Gil','Hugo'],['Iara','Joel','Lia'],['Malu','Nina','Otto'],['Pia','Rui','Sara'],['Téo','Ugo','Vera']];
function labCfgToArgs(c){
  const F=c.filhos.map((f,i)=>({n:f.n,st:f.st,comum:c.conj?f.comum:true,netos:LAB_NETOS[i].slice(0,f.netos)}));
  return {F,conj:c.conj?{regime:c.regime,aq:c.aq,pt:c.pt}:null,total:c.conj?0:c.pt};
}
function labRun(c){const a=labCfgToArgs(c);return partilhaDesc(a.F,a.conj,a.total)}
const CASES=[
  {id:'k1',q:'Roberto morreu deixando R$ 600 mil, todos bens particulares. Era casado em comunhão parcial com Sônia, mãe dos três filhos dele. Quanto recebe Sônia?',who:'conj',
   cfg:{conj:true,regime:'cp',aq:0,pt:600000,filhos:[{n:'Ana',st:'vivo',comum:true,netos:0},{n:'Bruno',st:'vivo',comum:true,netos:0},{n:'Clara',st:'vivo',comum:true,netos:0}]},opts:[150000,0,200000,300000]},
  {id:'k2',q:'Helena, viúva, deixou R$ 300 mil e três filhos. Bruno renunciou. Ana morreu antes da mãe, deixando Bia e Caio. Clara está viva. Quanto recebe Bia?',who:'Bia',
   cfg:{conj:false,regime:'cp',aq:0,pt:300000,filhos:[{n:'Ana',st:'premorto',comum:true,netos:2},{n:'Bruno',st:'renunciou',comum:true,netos:1},{n:'Clara',st:'vivo',comum:true,netos:0}]},opts:[75000,50000,100000,0]},
  {id:'k3',q:'Marcos, casado em separação convencional com Lúcia, deixou R$ 1 milhão e quatro filhos, todos também de Lúcia. Quanto recebe cada filho?',who:'Ana',
   cfg:{conj:true,regime:'sc',aq:0,pt:1000000,filhos:[{n:'Ana',st:'vivo',comum:true,netos:0},{n:'Bruno',st:'vivo',comum:true,netos:0},{n:'Clara',st:'vivo',comum:true,netos:0},{n:'Diego',st:'vivo',comum:true,netos:0}]},opts:[187500,200000,250000,166667]},
  {id:'k4',q:'Paulo, casado em comunhão universal com Rita, deixou patrimônio de R$ 800 mil e dois filhos. Bruno foi declarado indigno e tem uma filha, Eva. Quanto recebe Eva?',who:'Eva',
   cfg:{conj:true,regime:'cu',aq:800000,pt:0,filhos:[{n:'Ana',st:'vivo',comum:true,netos:0},{n:'Bruno',st:'indigno',comum:true,netos:1}]},opts:[200000,0,100000,400000]}
];
function caseAnswer(k){const x=labRun(k.cfg);return k.who==='conj'?x.conj:(x.rows.find(r=>r.n===k.who)||{v:0}).v}
let LAB=null;
function labView(){
  const id=uid('lab');
  later(()=>{
    const root=$('#'+id);
    if(!LAB)LAB=JSON.parse(JSON.stringify(CASES[0].cfg));
    function renderIn(){
      $$('.lb-conj button',root).forEach(b=>b.setAttribute('aria-pressed',String(LAB.conj)===b.dataset.v));
      $$('.lb-cj',root).forEach(x=>x.hidden=!LAB.conj);$('.lb-pt-l',root).textContent=LAB.conj?'Bens particulares do falecido':'Patrimônio do falecido';
      $$('.lb-reg button',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===LAB.regime));
      $('.lb-aq',root).value=LAB.aq;$('.lb-pt',root).value=LAB.pt;
      $('.lb-filhos',root).innerHTML=LAB.filhos.map((f,i)=>`<li data-i="${i}"><b>${f.n}</b>
        <div class="seg mini">${ST.map(([k,l])=>`<button data-st="${k}" aria-pressed="${f.st===k}">${l}</button>`).join('')}</div>
        ${LAB.conj?`<button class="chip ${f.comum?'ok':'warn'} lb-comum">${f.comum?'filho do casal':'só do falecido'}</button>`:'<span></span>'}
        <div class="stp mini"><button data-n="-1" aria-label="Menos um neto">−</button><output class="num">${f.netos}</output><button data-n="1" aria-label="Mais um neto">+</button><small>netos</small></div>
        <button class="lb-del" aria-label="Remover ${f.n}">×</button></li>`).join('');
      $('.lb-add',root).disabled=LAB.filhos.length>=6;
      renderOut();
    }
    function renderOut(){
      const x=labRun(LAB),o=$('.lb-out',root),total=LAB.conj?LAB.aq+LAB.pt:LAB.pt;
      if(total<=0){o.innerHTML='<p class="eyebrow">Sem patrimônio</p><p>Informe o valor dos bens.</p>';return}
      if(x.vazio){o.innerHTML=`<p class="eyebrow">Nenhum descendente herda</p>${x.meacao?`<p>Meação do cônjuge: <b>${money(x.meacao)}</b></p>`:''}<ol class="rule">${x.why.map(w=>`<li>${w}</li>`).join('')}</ol>`;return}
      const C=['var(--sage)','color-mix(in srgb,var(--sage) 70%,var(--ink))','color-mix(in srgb,var(--sage) 55%,var(--paper))','var(--muted)','color-mix(in srgb,var(--sage) 40%,var(--brass))','color-mix(in srgb,var(--muted) 60%,var(--sage))'];
      const segs=[];if(x.meacao)segs.push(['Meação do cônjuge',x.meacao,'meacao']);if(x.conj)segs.push(['Herança do cônjuge',x.conj,'conj']);x.rows.forEach((r,i)=>segs.push([r.n,r.v,C[i%C.length],r.how]));
      o.innerHTML=`<div><p class="eyebrow">Monte-mor</p><p class="num" style="font-family:var(--serif);font-size:1.8rem">${money(total)}</p></div>
        <div class="stack">${segs.map(s=>`<i class="${s[2]==='meacao'?'seg-meacao':s[2]==='conj'?'seg-conj':''}" style="width:${s[1]/total*100}%;${s[2].startsWith('var')||s[2].startsWith('color')?'background:'+s[2]:''}" title="${s[0]}"></i>`).join('')}</div>
        <ul class="who">${segs.map(s=>`<li><i class="${s[2]==='meacao'?'seg-meacao':s[2]==='conj'?'seg-conj':''}" style="${s[2].startsWith('var')||s[2].startsWith('color')?'background:'+s[2]:''}"></i><span>${s[0]}${s[3]?` <small>${s[3]}</small>`:''}</span><b>${money(s[1])}</b></li>`).join('')}</ul>
        <ol class="rule">${x.why.map(w=>`<li>${w}</li>`).join('')}</ol>`;
    }
    root.addEventListener('click',e=>{
      const t=e.target;let b;
      if((b=t.closest('.lb-conj button'))){LAB.conj=b.dataset.v==='true';renderIn();return}
      if((b=t.closest('.lb-reg button'))){LAB.regime=b.dataset.r;renderIn();return}
      const li=t.closest('.lb-filhos li');
      if(li){const f=LAB.filhos[+li.dataset.i];
        if((b=t.closest('[data-st]'))){f.st=b.dataset.st;renderIn();return}
        if(t.closest('.lb-comum')){f.comum=!f.comum;renderIn();return}
        if((b=t.closest('[data-n]'))){f.netos=Math.max(0,Math.min(3,f.netos+(+b.dataset.n)));renderIn();return}
        if(t.closest('.lb-del')){LAB.filhos.splice(+li.dataset.i,1);renderIn();return}}
      if(t.closest('.lb-add')){const used=new Set(LAB.filhos.map(f=>f.n));const n=LAB_FILHOS.find(x=>!used.has(x));if(n){LAB.filhos.push({n,st:'vivo',comum:true,netos:0});LAB.filhos.sort((a,b)=>LAB_FILHOS.indexOf(a.n)-LAB_FILHOS.indexOf(b.n));renderIn()}}
    });
    $('.lb-aq',root).addEventListener('input',e=>{LAB.aq=Math.max(0,+e.target.value||0);renderOut()});
    $('.lb-pt',root).addEventListener('input',e=>{LAB.pt=Math.max(0,+e.target.value||0);renderOut()});
    root.addEventListener('lab:load',renderIn);
    renderIn();
  });
  return `<div class="labw" id="${id}"><div class="card lb-in">
      <div class="lbrow"><div><span class="lab">Deixou cônjuge ou companheiro?</span><div class="seg lb-conj"><button data-v="true">Sim</button><button data-v="false">Não</button></div></div>
        <div class="lb-cj"><span class="lab">Regime de bens</span><div class="seg lb-reg">${REGS.map(r=>`<button data-r="${r[0]}">${r[1]}</button>`).join('')}</div></div></div>
      <div class="lbrow"><div class="lb-cj"><label class="lab" for="${id}-aq">Bens adquiridos onerosamente no casamento</label><div class="money"><span>R$</span><input id="${id}-aq" class="lb-aq" type="number" min="0" step="50000" inputmode="numeric"></div></div>
        <div><label class="lab lb-pt-l" for="${id}-pt">Bens particulares do falecido</label><div class="money"><span>R$</span><input id="${id}-pt" class="lb-pt" type="number" min="0" step="50000" inputmode="numeric"></div></div></div>
      <div><span class="lab">Filhos</span><ul class="lb-filhos"></ul><button class="btn small lb-add">+ Adicionar filho</button></div>
    </div><div class="card cout lb-out" aria-live="polite"></div></div>`;
}
function casesView(){
  const id=uid('cs');
  later(()=>{
    const root=$('#'+id);
    root.addEventListener('click',e=>{
      const o=e.target.closest('.csopt');
      if(o){const card=o.closest('.case'),k=CASES[+card.dataset.i];if(card.dataset.done)return;card.dataset.done=1;
        const ans=caseAnswer(k),ok=Math.abs(+o.dataset.v-ans)<1;
        $$('.csopt',card).forEach(x=>{x.disabled=true;if(Math.abs(+x.dataset.v-ans)<1)x.classList.add('ok')});if(!ok)o.classList.add('no');
        const x=labRun(k.cfg);const w=$('.cswhy',card);w.innerHTML=`<b>${ok?'Correto.':'Não é essa.'}</b> A resposta é ${money(ans)}.<ol class="rule">${x.why.map(s=>`<li>${s}</li>`).join('')}</ol><button class="btn small csload">Abrir no laboratório</button>`;w.hidden=false;
        S.lab=S.lab||{solved:{}};S.lab.solved[k.id]=ok?1:0;bump(2);save();updateLessonBar('lab');return}
      const l=e.target.closest('.csload');
      if(l){const k=CASES[+l.closest('.case').dataset.i];LAB=JSON.parse(JSON.stringify(k.cfg));const lab=$('.labw');if(lab){lab.dispatchEvent(new Event('lab:load'));lab.scrollIntoView({behavior:'smooth',block:'start'})}}
    });
  });
  return `<div class="cases" id="${id}">${CASES.map((k,i)=>`<article class="case card" data-i="${i}"><p class="eyebrow">Caso ${i+1}</p><p class="csq">${k.q}</p>
    <div class="csopts">${shuffle(k.opts).map(v=>`<button class="csopt num" data-v="${v}">${money(v)}</button>`).join('')}</div><div class="cswhy" hidden></div></article>`).join('')}</div>`;
}

/* ---------- motores ---------- */
function regimeInicial(anos,reinc,tipo,favor){
  if(tipo==='detencao'){return anos>4||reinc?{r:'Semiaberto',d:'Na detenção não se começa em regime fechado. Acima de 4 anos, ou sendo reincidente, o início é no semiaberto (art. 33, caput).'}:{r:'Aberto',d:'Detenção de até 4 anos, réu não reincidente: regime aberto.'}}
  if(anos>8)return{r:'Fechado',d:'Pena superior a 8 anos começa no regime fechado (art. 33, §2º, a).'};
  if(anos>4)return reinc?{r:'Fechado',d:'Reincidente com pena acima de 4 anos começa no fechado.'}:{r:'Semiaberto',d:'Mais de 4 e até 8 anos, não reincidente: semiaberto (art. 33, §2º, b).'};
  if(reinc)return favor?{r:'Semiaberto',d:'Reincidente com pena de até 4 anos e circunstâncias favoráveis: semiaberto (Súmula 269, STJ).'}:{r:'Fechado',d:'Reincidente com circunstâncias desfavoráveis: o fechado é admitido mesmo com pena de até 4 anos.'};
  return{r:'Aberto',d:'Até 4 anos, não reincidente: regime aberto (art. 33, §2º, c).'};
}
function fmtPena(a){const t=Math.round(a*360);const y=Math.floor(t/360),m=Math.floor(t%360/30),d=t%30;const p=[];if(y)p.push(y+(y===1?' ano':' anos'));if(m)p.push(m+(m===1?' mês':' meses'));if(d)p.push(d+(d===1?' dia':' dias'));return p.join(', ')||'0'}

function execSim(){
  const id=uid('ex');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={tipo:'reclusao',reinc:false,viol:false,culp:false,favor:true};
    function render(){const a=+r.value/2;$('.exa',root).textContent=fmtPena(a);
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      const reg=regimeInicial(a,s.reinc,s.tipo,s.favor);
      const subst=(s.culp||(a<=4&&!s.viol))&&!s.reinc&&s.favor;
      const surs=!subst&&a<=2&&!s.reinc&&s.favor;
      const why=!subst?(s.reinc?'reincidente em crime doloso':!s.favor?'circunstâncias judiciais desfavoráveis':s.viol&&!s.culp?'crime com violência ou grave ameaça':'pena acima de 4 anos em crime doloso'):'';
      $('.exout',root).innerHTML=`<div class="exreg"><p class="eyebrow">Regime inicial</p><b>${reg.r}</b><p>${reg.d}</p></div>
        <div class="exrow ${subst?'ok':'no'}"><span>Restritiva de direitos</span><b>${subst?'Cabe':'Não cabe'}</b><small>${subst?'Pena substituída por prestação de serviços, prestação pecuniária e outras (arts. 43 e 44).':'Motivo: '+why+' (art. 44).'}</small></div>
        <div class="exrow ${surs?'ok':'no'}"><span>Sursis</span><b>${surs?'Cabe':'Não cabe'}</b><small>${surs?'Execução suspensa por 2 a 4 anos, sob condições (art. 77).':subst?'Não se aplica: cabe a restritiva de direitos, que tem preferência (art. 77, III).':'Exige pena de até 2 anos, réu não reincidente em crime doloso e circunstâncias favoráveis.'}</small></div>`;}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;s[k]=k==='tipo'?b.dataset.v:b.dataset.v==='true';render()});render();
  });
  const q=(k,l,o)=>`<div class="wzq"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="card exsim" id="${id}"><div class="exin"><label class="lab" for="${id}-r">Pena aplicada: <output class="exa num"></output></label><input id="${id}-r" type="range" min="1" max="30" value="6">
    <div class="wzqs">${q('tipo','Espécie de pena',[['reclusao','Reclusão'],['detencao','Detenção']])}${q('reinc','Réu reincidente em crime doloso?',[['true','Sim'],['false','Não']])}${q('viol','Crime com violência ou grave ameaça?',[['true','Sim'],['false','Não']])}${q('culp','Crime culposo?',[['true','Sim'],['false','Não']])}${q('favor','Circunstâncias judiciais favoráveis?',[['true','Sim'],['false','Não']])}</div></div>
    <div class="exout" aria-live="polite"></div></div>`;
}
const CRIMES=[['furto','Furto simples','art. 155',1,4],['estel','Estelionato','art. 171',1,5],['lesao','Lesão corporal grave','art. 129, §1º',1,5],['roubo','Roubo','art. 157',4,10],['homic','Homicídio simples','art. 121',6,20]];
const CIRC=['Culpabilidade','Antecedentes','Conduta social','Personalidade','Motivos','Circunstâncias','Consequências','Comportamento da vítima'];
function dosimetria(){
  const id=uid('ds');
  later(()=>{
    const root=$('#'+id),s={c:'roubo',neg:new Set(),ag:0,at:0,reinc:false,aum:0,dim:0};
    function calc(){const c=CRIMES.find(x=>x[0]===s.c),mn=c[3],mx=c[4],I=mx-mn;
      const base=Math.min(mx,mn+s.neg.size*I/8);
      const net=s.ag+(s.reinc?1:0)-s.at;let p2=base*(1+net/6);const clampLo=p2<mn,clampHi=p2>mx;p2=Math.max(mn,Math.min(mx,p2));
      const p3=p2*(1+s.aum)*(1-s.dim);return{c,mn,mx,base,p2,p3,clampLo,clampHi,net}}
    function render(){const x=calc(),M=Math.max(x.mx,x.p3)*1.08;
      $$('[data-crime]',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.crime===s.c));
      $$('[data-circ]',root).forEach(b=>b.setAttribute('aria-pressed',s.neg.has(+b.dataset.circ)));
      $('.ds-ag',root).textContent=s.ag;$('.ds-at',root).textContent=s.at;
      $$('[data-reinc]',root).forEach(b=>b.setAttribute('aria-pressed',String(s.reinc)===b.dataset.reinc));
      $$('[data-aum]',root).forEach(b=>b.setAttribute('aria-pressed',String(s.aum)===b.dataset.aum));
      $$('[data-dim]',root).forEach(b=>b.setAttribute('aria-pressed',String(s.dim)===b.dataset.dim));
      const P=v=>Math.min(100,v/M*100)+'%';
      $('.dsrange',root).style.left=P(x.mn);$('.dsrange',root).style.width=(x.mx-x.mn)/M*100+'%';
      $('.dsmin',root).textContent=x.mn+' a';$('.dsmax',root).textContent=x.mx+' a';
      [['.m1',x.base],['.m2',x.p2],['.m3',x.p3]].forEach(([k,v])=>$(k,root).style.left=P(v));
      const reg=regimeInicial(x.p3,s.reinc,'reclusao',s.neg.size<=2);
      $('.dsout',root).innerHTML=`<ol class="dsph">
        <li><span>1ª fase · pena-base</span><b class="num">${fmtPena(x.base)}</b><small>Mínimo de ${x.mn} ${x.mn===1?'ano':'anos'} + ${s.neg.size} de 8 circunstâncias desfavoráveis × 1/8 do intervalo (art. 59)</small></li>
        <li><span>2ª fase · pena provisória</span><b class="num">${fmtPena(x.p2)}</b><small>${x.net===0?'Agravantes e atenuantes se compensam ou não há nenhuma':(x.net>0?'+':'−')+Math.abs(x.net)+' × 1/6 sobre a pena-base'}${x.clampLo?'. Parou no mínimo legal (Súmula 231, STJ)':x.clampHi?'. Parou no máximo legal':''}</small></li>
        <li><span>3ª fase · pena definitiva</span><b class="num">${fmtPena(x.p3)}</b><small>${s.aum||s.dim?`${s.aum?'aumento de '+frac(s.aum):''}${s.aum&&s.dim?' e ':''}${s.dim?'diminuição de '+frac(s.dim):''}. Aqui a pena pode sair dos limites (art. 68)`:'Sem causas de aumento ou diminuição'}</small></li></ol>
        <div class="dsreg"><span>Regime inicial</span><b>${reg.r}</b><small>${reg.d}</small></div>`;}
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.crime){s.c=b.dataset.crime}else if(b.dataset.circ!=null){const i=+b.dataset.circ;s.neg.has(i)?s.neg.delete(i):s.neg.add(i)}
      else if(b.dataset.cnt){const k=b.dataset.cnt;s[k]=Math.max(0,Math.min(4,s[k]+(+b.dataset.d)))}else if(b.dataset.reinc){s.reinc=b.dataset.reinc==='true'}
      else if(b.dataset.aum){s.aum=+b.dataset.aum}else if(b.dataset.dim){s.dim=+b.dataset.dim}else return;render()});
    render();
  });
  const fr=[[0,'nenhum'],[1/3,'1/3'],[1/2,'1/2'],[2/3,'2/3']];
  return `<div class="ds" id="${id}">
    <div class="card"><span class="lab">Crime</span><div class="seg">${CRIMES.map(c=>`<button data-crime="${c[0]}">${c[1]} <small>${c[2]} · ${c[3]} a ${c[4]} anos</small></button>`).join('')}</div></div>
    <div class="dsgrid">
      <div class="card"><p class="eyebrow">1ª fase · circunstâncias judiciais</p><p class="hint">Toque nas que pesam contra o réu.</p><div class="dscirc">${CIRC.map((c,i)=>`<button data-circ="${i}" aria-pressed="false">${c}</button>`).join('')}</div></div>
      <div class="card"><p class="eyebrow">2ª fase · agravantes e atenuantes</p>
        <div class="steppers"><div><span class="lab">Agravantes</span><div class="stp"><button data-cnt="ag" data-d="-1" aria-label="Menos uma agravante">−</button><output class="num ds-ag">0</output><button data-cnt="ag" data-d="1" aria-label="Mais uma agravante">+</button></div></div>
        <div><span class="lab">Atenuantes</span><div class="stp"><button data-cnt="at" data-d="-1" aria-label="Menos uma atenuante">−</button><output class="num ds-at">0</output><button data-cnt="at" data-d="1" aria-label="Mais uma atenuante">+</button></div></div></div>
        <div class="wzq" style="margin-top:12px"><span>Réu reincidente?</span><div class="seg"><button data-reinc="true">Sim</button><button data-reinc="false">Não</button></div></div></div>
      <div class="card"><p class="eyebrow">3ª fase · causas de aumento e diminuição</p>
        <span class="lab">Aumento</span><div class="seg">${fr.map(f=>`<button data-aum="${f[0]}">${f[1]}</button>`).join('')}</div>
        <span class="lab" style="margin-top:12px">Diminuição</span><div class="seg">${fr.map(f=>`<button data-dim="${f[0]}">${f[1]}</button>`).join('')}</div>
        <p class="hint" style="margin:10px 0 0">Ex.: arma de fogo no roubo (+2/3), tentativa (−1/3 a −2/3).</p></div>
    </div>
    <div class="card dsscale"><div class="dstrack"><i class="dsrange"><span class="dsmin"></span><span class="dsmax"></span></i><i class="dsm m1" title="1ª fase">1</i><i class="dsm m2" title="2ª fase">2</i><i class="dsm m3" title="3ª fase">3</i></div><div class="dsout" aria-live="polite"></div></div>
  </div>`;
}
function frac(v){return v===1/3?'1/3':v===1/2?'1/2':v===2/3?'2/3':''}
function livramento(){

  later(()=>{
    const root=$('#'+id),r=$('input',root),s={reinc:false,bons:true,hed:false};

    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;s[k]=k==='modo'?b.dataset.v:b.dataset.v==='true';render()});render();
  });

function pressupostos(){
  const id=uid('ps');
  const P=[['conduta','Conduta','ação ou omissão voluntária'],['culpa','Culpa','dolo, negligência, imprudência ou imperícia'],['nexo','Nexo causal','a conduta causou o dano'],['dano','Dano','prejuízo material ou moral']];
  later(()=>{
    const root=$('#'+id),s={regime:'subj',conduta:true,culpa:true,nexo:true,dano:true};
    function render(){$$('[data-reg]',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.reg===s.regime));
      $$('.pp',root).forEach(el=>{const k=el.dataset.k,need=!(k==='culpa'&&s.regime==='obj');el.classList.toggle('on',s[k]);el.classList.toggle('skip',!need);$('.ppst',el).textContent=!need?'dispensada':s[k]?'presente':'ausente'});
      const miss=P.filter(([k])=>!(k==='culpa'&&s.regime==='obj')&&!s[k]).map(p=>p[1].toLowerCase());
      const o=$('.wzout',root);
      if(miss.length){o.className='wzout bad';o.innerHTML=`<b>Não há dever de indenizar</b><p>Falta ${miss.join(' e ')}. ${miss.includes('nexo causal')?'Sem nexo, a conduta não é causa do dano: é o que fazem as excludentes.':miss.includes('dano')?'Sem dano não há o que reparar, por mais grave que seja a conduta.':miss.includes('culpa')?'Na subjetiva, quem alega precisa provar a culpa.':''}</p>`}
      else{o.className='wzout ok';o.innerHTML=`<b>Deve indenizar</b><p>${s.regime==='obj'?'Na responsabilidade objetiva bastam conduta, nexo e dano; a culpa nem é discutida (art. 927, p.u.).':'Presentes os quatro pressupostos da responsabilidade subjetiva (arts. 186 e 927).'}</p>`}
      swapAnim(o)}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-reg]');if(b){s.regime=b.dataset.reg;render();return}const p=e.target.closest('.pp');if(p&&!p.classList.contains('skip')){s[p.dataset.k]=!s[p.dataset.k];render()}});render();
  });
  return `<div class="card" id="${id}"><span class="lab">Regime</span><div class="seg"><button data-reg="subj">Subjetiva</button><button data-reg="obj">Objetiva</button></div>
    <p class="hint" style="margin:12px 0 8px">Toque em um pressuposto para retirá-lo do caso.</p>
    <div class="pps">${P.map(([k,l,d],i)=>`<button class="pp on" data-k="${k}"><b>${rom(i+1)} –</b><strong>${l}</strong><small>${d}</small><span class="ppst"></span></button>`).join('')}</div><div class="wzout" aria-live="polite"></div></div>`;
}
function concorrente(){
  const id=uid('cc');
  later(()=>{
    const root=$('#'+id),ins=$$('input',root);
    function render(){const D=+ins[0].value,c=+ins[1].value/100;$('.ccd',root).textContent=money(D);$('.ccp',root).textContent=Math.round(c*100)+'%';
      $('.cc-a',root).style.width=(1-c)*100+'%';$('.cc-v',root).style.width=c*100+'%';
      $('.wzout',root).className='wzout '+(c>=1?'bad':c>0?'warn':'ok');
      $('.wzout',root).innerHTML=c>=1?`<b>Nada a indenizar</b><p>Culpa exclusiva da vítima rompe o nexo causal: o dano não decorre da conduta do agente.</p>`:`<b>${money(D*(1-c))}</b><p>${c?`A vítima arca com ${Math.round(c*100)}% do próprio prejuízo (${money(D*c)}), na proporção da gravidade da sua culpa (art. 945).`:'Sem culpa da vítima, a reparação é integral (art. 944).'}</p>`}
    ins.forEach(i=>i.addEventListener('input',render));render();
  });
  return `<div class="card" id="${id}"><div class="dvin"><div><label class="lab" for="${id}-d">Dano total: <output class="ccd num"></output></label><input id="${id}-d" type="range" min="10000" max="300000" step="10000" value="100000"></div>
    <div><label class="lab" for="${id}-c">Peso da culpa da vítima: <output class="ccp num"></output></label><input id="${id}-c" type="range" min="0" max="100" step="5" value="30"></div></div>
    <div class="ccbar"><i class="cc-a"><span>agente paga</span></i><i class="cc-v"><span>vítima arca</span></i></div><div class="wzout" aria-live="polite"></div></div>`;
}
function indenizacao(){
  const id=uid('in');
  later(()=>{
    const root=$('#'+id),ins=$$('input[type=range]',root);let red=false;
    function render(){const [em,renda,meses,mor,est,rp]=ins.map(i=>+i.value);
      const lc=renda*meses,parts=[['Dano emergente',em,'ink'],['Lucro cessante',lc,'brass'],['Dano moral',mor,'sage'],['Dano estético',est,'seal']];
      const tot=parts.reduce((s,p)=>s+p[1],0),fin=red?tot*(1-rp/100):tot;
      $$('output',root).forEach((o,k)=>o.textContent=k===2?meses+(meses===1?' mês':' meses'):k===5?rp+'%':money(+ins[k].value));
      $('.inbar',root).innerHTML=parts.map(p=>`<i style="width:${tot?p[1]/tot*100:0}%;background:var(--${p[2]})" title="${p[0]}"></i>`).join('');
      $('.inleg',root).innerHTML=parts.map(p=>`<li><i style="background:var(--${p[2]})"></i><span>${p[0]}</span><b class="num">${money(p[1])}</b></li>`).join('')+`<li class="tot"><i></i><span><b>${red?'Total após redução equitativa':'Total'}</b></span><b class="num">${money(fin)}</b></li>`;
      $$('[data-red]',root).forEach(b=>b.setAttribute('aria-pressed',String(red)===b.dataset.red));$('.inred',root).hidden=!red}
    ins.forEach(i=>i.addEventListener('input',render));root.addEventListener('click',e=>{const b=e.target.closest('[data-red]');if(!b)return;red=b.dataset.red==='true';render()});render();
  });
  const rg=(l,min,max,step,v)=>`<div><label class="lab">${l}: <output class="num"></output></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
  return `<div class="calc" id="${id}"><div class="card cin">${rg('Despesas médicas e conserto',0,100000,1000,18000)}${rg('Renda mensal perdida',0,15000,500,4000)}${rg('Meses sem trabalhar',0,24,1,3)}${rg('Dano moral',0,100000,1000,20000)}${rg('Dano estético',0,100000,1000,15000)}
    <div class="wzq"><span>Culpa levíssima e dano desproporcional?</span><div class="seg"><button data-red="true">Sim</button><button data-red="false">Não</button></div></div>
    <div class="inred" hidden>${rg('Redução equitativa',0,50,5,20)}</div></div>
    <div class="card cout"><p class="eyebrow">Composição da indenização</p><div class="stack inbar"></div><ul class="who inleg"></ul><p class="hint" style="margin:0">Lucro cessante = renda mensal × meses parados (art. 402). Dano moral e estético se cumulam (Súmula 387, STJ). A redução por equidade é exceção (art. 944, p.u.).</p></div></div>`;
}

function riscoCoisa(){
  const id=uid('rk');
  const R={
    'dar-perda-0':['Obrigação resolvida','A coisa pereceu para o dono (o devedor). Ninguém deve nada; se o preço foi pago, é devolvido.','Art. 234','ok'],
    'dar-perda-1':['Equivalente + perdas e danos','O devedor responde pelo valor da coisa e pelos prejuízos do credor.','Art. 234','bad'],
    'dar-det-0':['O credor escolhe','Pode resolver a obrigação ou aceitar a coisa no estado em que está, com abatimento do preço.','Art. 235','warn'],
    'dar-det-1':['Equivalente ou coisa no estado, + perdas e danos','O credor escolhe entre o equivalente e a coisa deteriorada; em ambos os casos, com indenização.','Art. 236','bad'],
    'rest-perda-0':['O credor sofre a perda','Na restituição, a coisa já é do credor: a perda é dele, ressalvados os direitos até o dia do fato.','Art. 238','warn'],
    'rest-perda-1':['Equivalente + perdas e danos','O devedor que perdeu por culpa a coisa alheia paga o equivalente e os prejuízos.','Art. 239','bad'],
    'rest-det-0':['O credor recebe como está','Sem culpa do devedor, a coisa é devolvida no estado em que se acha, sem indenização.','Art. 240','warn'],
    'rest-det-1':['Equivalente + perdas e danos','Com culpa, aplica-se a regra da perda culposa.','Art. 240','bad']};
  later(()=>{
    const root=$('#'+id),s={tipo:'dar',ev:'perda',culpa:'0'};
    function render(){$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',s[b.dataset.k]===b.dataset.v));
      const r=R[`${s.tipo}-${s.ev}-${s.culpa}`],o=$('.wzout',root);o.className='wzout '+r[3];o.innerHTML=`<b>${r[0]}</b><p>${r[1]}</p><span class="art">${r[2]}, CC</span>`;swapAnim(o);
      $('.rkdono',root).textContent=s.tipo==='dar'?'devedor (vendedor)':'credor (dono que emprestou)'}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.v;render()});render();
  });
  const q=(k,l,o)=>`<div class="wzq"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="wz" id="${id}"><div class="wzqs">${q('tipo','Que obrigação?',[['dar','Dar coisa certa'],['rest','Restituir']])}${q('ev','O que aconteceu antes da entrega?',[['perda','Perda total'],['det','Deterioração']])}${q('culpa','Houve culpa do devedor?',[['1','Sim'],['0','Não']])}
    <p class="hint" style="margin:6px 0 0">Até a entrega, o dono da coisa é o <b class="rkdono"></b>.</p></div><div class="wzout" aria-live="polite"></div></div>`;
}
function solidariedade(){
  const id=uid('sd');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={modo:'sol',insolv:false};
    function render(){const D=+r.value,n=+$('#'+id+'-n').textContent;$('.sdd',root).textContent=money(D);
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      const names=['Ana','Bruno','Caio','Davi','Eva'].slice(0,n),solv=s.insolv?n-1:n;
      $('.sdrows',root).innerHTML=names.map((nm,i)=>{const ins=s.insolv&&i===n-1;const cobra=s.modo==='sol'?D:D/n;const arca=ins?0:s.modo==='sol'?D/solv:D/n;
        return `<div class="sdrow ${ins?'ins':''}"><b>${nm}${ins?' <small>insolvente</small>':''}</b><div class="rb"><span>Credor pode cobrar</span><div class="track"><i style="width:${cobra/D*100}%;background:var(--seal)"></i></div><b class="num">${money(cobra)}</b></div><div class="rb"><span>Arca, no final</span><div class="track"><i style="width:${arca/D*100}%;background:var(--sage)"></i></div><b class="num">${money(arca)}</b></div></div>`}).join('');
      $('.rmsg',root).innerHTML=s.modo==='sol'?`<b>Solidária:</b> o credor escolhe de quem cobrar os ${money(D)} (art. 275). Quem pagar cobra a quota de cada um${s.insolv?', e a parte do insolvente se reparte entre os solventes':''} (art. 283).`:`<b>Divisível, sem solidariedade:</b> a dívida se parte em ${n} obrigações iguais e distintas (art. 257). Cada um só deve ${money(D/n)}${s.insolv?'; a parte do insolvente é prejuízo do credor':''}.`}
    onStep(root,render);r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.k==='modo'?b.dataset.v:b.dataset.v==='true';render()});render();
  });
  return `<div class="card" id="${id}"><div class="steppers">${stepper(id+'-n','Devedores',3,2,5)}<div><label class="lab" for="${id}-r">Dívida: <output class="sdd num"></output></label><input id="${id}-r" type="range" min="30000" max="300000" step="15000" value="90000"></div></div>
    <div class="wzqs" style="margin:12px 0"><div class="wzq"><span>Regime da dívida</span><div class="seg"><button data-k="modo" data-v="sol">Solidária</button><button data-k="modo" data-v="div">Divisível</button></div></div>
    <div class="wzq"><span>Um dos devedores ficou insolvente?</span><div class="seg"><button data-k="insolv" data-v="true">Sim</button><button data-k="insolv" data-v="false">Não</button></div></div></div>
    <div class="sdrows"></div><p class="rmsg" aria-live="polite"></p></div>`;
}

function prazoVicio(){
  const id=uid('pv');
  later(()=>{
    const root=$('#'+id),s={bem:'movel',posse:false,oculto:false};
    function render(){$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      let p,d;
      if(s.oculto){p=s.bem==='movel'?'até 180 dias':'até 1 ano';d=`O vício só podia ser percebido mais tarde: o prazo corre de quando o adquirente <b>teve ciência</b> do defeito, com o limite de ${s.bem==='movel'?'180 dias':'1 ano'} (art. 445, §1º).`}
      else if(s.posse){p=s.bem==='movel'?'15 dias':'6 meses';d='O comprador já estava na posse da coisa: o prazo conta da alienação e <b>cai pela metade</b> (art. 445, caput).'}
      else{p=s.bem==='movel'?'30 dias':'1 ano';d='Contado da <b>entrega efetiva</b> da coisa (art. 445, caput). Prazo decadencial: não se suspende nem se interrompe.'}
      const o=$('.wzout',root);o.className='wzout warn';o.innerHTML=`<b>${p}</b><p>${d}</p>`;swapAnim(o)}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;s[k]=k==='bem'?b.dataset.v:b.dataset.v==='true';render()});render();
  });
  const q=(k,l,o)=>`<div class="wzq"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="wz" id="${id}"><div class="wzqs">${q('bem','Que bem?',[['movel','Móvel'],['imovel','Imóvel']])}${q('posse','O comprador já estava na posse antes da venda?',[['true','Sim'],['false','Não']])}${q('oculto','O defeito, por natureza, só podia aparecer depois?',[['true','Sim'],['false','Não']])}</div><div class="wzout" aria-live="polite"></div></div>`;
}
function arras(){
  const id=uid('ar');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={tipo:'conf',quem:'deu'};
    function render(){const A=+r.value;$('.arv',root).textContent=money(A);$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',s[b.dataset.k]===b.dataset.v));
      let txt,dar,rec;
      if(s.tipo==='pen'){if(s.quem==='deu'){dar=-A;rec=A;txt=`Quem deu o sinal se arrependeu: <b>perde os ${money(A)}</b> para a outra parte. Sem indenização suplementar (art. 420).`}else{dar=A;rec=-A;txt=`Quem recebeu se arrependeu: <b>devolve os ${money(A)} mais o equivalente</b>, ${money(2*A)} no total. Sem indenização suplementar (art. 420).`}}
      else{if(s.quem==='deu'){dar=-A;rec=A;txt=`Quem deu o sinal não cumpriu: a outra parte pode desfazer o contrato e <b>reter os ${money(A)}</b>. Se provar prejuízo maior, pede a diferença; as arras são o mínimo (arts. 418 e 419).`}else{dar=A;rec=-A;txt=`Quem recebeu não cumpriu: quem deu pode desfazer o contrato e exigir <b>a devolução mais o equivalente</b> (${money(2*A)}), com correção, juros e honorários. Também pode pedir indenização suplementar (arts. 418 e 419).`}}
      $('.ar-d',root).textContent=(dar>0?'+ ':'− ')+money(Math.abs(dar));$('.ar-r',root).textContent=(rec>0?'+ ':'− ')+money(Math.abs(rec));
      $('.ar-d',root).className='ar-d num '+(dar>0?'up':'down');$('.ar-r',root).className='ar-r num '+(rec>0?'up':'down');
      const o=$('.rmsg',root);o.innerHTML=txt;swapAnim(o)}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.v;render()});render();
  });
  return `<div class="card" id="${id}"><div class="wzqs"><div class="wzq"><span>Tipo de arras</span><div class="seg"><button data-k="tipo" data-v="conf">Confirmatórias</button><button data-k="tipo" data-v="pen">Penitenciais</button></div></div>
    <div class="wzq"><span>Quem desistiu ou não cumpriu?</span><div class="seg"><button data-k="quem" data-v="deu">Quem deu o sinal</button><button data-k="quem" data-v="recebeu">Quem recebeu</button></div></div></div>
    <label class="lab" style="margin-top:12px;display:block" for="${id}-r">Valor do sinal: <output class="arv num"></output></label><input id="${id}-r" type="range" min="5000" max="100000" step="5000" value="20000">
    <div class="arbal"><div><small>Quem deu o sinal</small><b class="ar-d num"></b></div><div><small>Quem recebeu</small><b class="ar-r num"></b></div></div><p class="rmsg" aria-live="polite"></p></div>`;
}

function orgCrim(){
  const id=uid('oc');
  later(()=>{
    const root=$('#'+id),s={n:3,estrutura:false,pena:false,crimes:true};
    function render(){$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));$('.ocn',root).textContent=s.n;
      const o=$('.wzout',root);let v;
      if(!s.crimes)v={tone:'ok',t:'Não há crime associativo',d:'A reunião para contravenções, ou sem finalidade de cometer crimes, não configura associação criminosa.'};
      else if(s.n<3)v={tone:'ok',t:'Não há crime associativo',d:'Com duas pessoas pode haver concurso de agentes no crime cometido, mas não associação criminosa.'};
      else if(s.n>=4&&s.estrutura&&s.pena)v={tone:'bad',t:'Organização criminosa',d:'4 ou mais pessoas, estrutura ordenada com divisão de tarefas, visando crimes com pena máxima superior a 4 anos (Lei 12.850/13, art. 1º, §1º). Pena de 3 a 8 anos.'};
      else v={tone:'warn',t:'Associação criminosa',d:`${s.n} pessoas associadas para cometer crimes (CP, art. 288). Pena de 1 a 3 anos.${s.n>=4?' Para ser organização faltam a estrutura com divisão de tarefas ou o tipo de crime visado.':''}`};
      o.className='wzout '+v.tone;o.innerHTML=`<b>${v.t}</b><p>${v.d}</p>`;swapAnim(o)}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k],[data-n]');if(!b)return;if(b.dataset.n){s.n=Math.max(2,Math.min(8,s.n+(+b.dataset.n)))}else s[b.dataset.k]=b.dataset.v==='true';render()});render();
  });
  const q=(k,l)=>`<div class="wzq"><span>${l}</span><div class="seg"><button data-k="${k}" data-v="true">Sim</button><button data-k="${k}" data-v="false">Não</button></div></div>`;
  return `<div class="wz" id="${id}"><div class="wzqs"><div class="wzq"><span>Quantas pessoas?</span><div class="stp"><button data-n="-1" aria-label="Menos uma pessoa">−</button><output class="ocn num">3</output><button data-n="1" aria-label="Mais uma pessoa">+</button></div></div>
    ${q('crimes','Reuniram-se para cometer crimes (não só contravenções)?')}${q('estrutura','Há estrutura ordenada, com divisão de tarefas?')}${q('pena','Os crimes visados têm pena máxima acima de 4 anos?')}</div><div class="wzout" aria-live="polite"></div></div>`;
}

function pecWiz(){
  return W.wizard({qs:[['inic','Foi proposta por quem a Constituição admite (Presidente, 1/3 de uma Casa ou mais da metade das Assembleias)?'],['quorum','Teve 3/5 dos votos, em dois turnos, nas duas Casas?'],['crise','Está em vigor intervenção federal, estado de defesa ou de sítio?'],['petrea','Tende a abolir alguma cláusula pétrea?']],init:{inic:true,quorum:true,crise:false,petrea:false},
    verdict:a=>!a.inic?{tone:'bad',t:'Inconstitucional: vício de iniciativa',d:'O rol do art. 60, I a III é taxativo. Não há, por exemplo, PEC de iniciativa popular no plano federal.'}:
      !a.quorum?{tone:'bad',t:'Não aprovada',d:'Sem 3/5 em dois turnos em cada Casa, a proposta é rejeitada e não pode ser reapresentada na mesma sessão legislativa (art. 60, §§2º e 5º).'}:
      a.crise?{tone:'bad',t:'Inconstitucional: limite circunstancial',d:'A Constituição não pode ser emendada na vigência de intervenção federal, estado de defesa ou de sítio (art. 60, §1º).'}:
      a.petrea?{tone:'bad',t:'Inconstitucional: limite material',d:'Não é sequer objeto de deliberação a proposta tendente a abolir cláusula pétrea (art. 60, §4º).'}:
      {tone:'ok',t:'Emenda aprovada',d:'Promulgada pelas Mesas da Câmara e do Senado, sem sanção presidencial (art. 60, §3º).'}});
}
function anualidade(){
  const id=uid('an');
  later(()=>{
    const root=$('#'+id),r=$('input',root);
    function render(){const m=+r.value;$('.anm',root).textContent=m+(m===1?' mês':' meses');$('.pimark',root).style.left=Math.min(m,24)/24*100+'%';
      const o=$('.wzout',root),ok=m>=12;o.className='wzout '+(ok?'ok':'bad');
      o.innerHTML=ok?'<b>Vale para esta eleição</b><p>Passou mais de um ano entre a vigência da lei e o pleito (art. 16).</p>':`<b>Não vale para esta eleição</b><p>A lei já está em vigor, mas só se aplica às eleições seguintes. Nesta, continua valendo a regra antiga (ultratividade). Faltariam ${12-m} ${12-m===1?'mês':'meses'}.</p>`}
    r.addEventListener('input',render);render();
  });
  return `<div class="card" id="${id}"><div class="pitrack antrack"><i class="pi5"><span>1 ano</span></i><i class="pimark"></i></div>
    <label class="lab" for="${id}-r">Tempo entre a publicação da lei e a eleição: <output class="anm num"></output></label><input id="${id}-r" type="range" min="0" max="24" value="8"><div class="wzout" aria-live="polite"></div></div>`;
}

function veu(){
  const id=uid('veu');
  const SOC=[['A',[10,40,90,160],'Muito desigual e muito rica no topo'],['B',[25,35,45,55],'Mais igual, com piso mais alto'],['C',[5,60,70,80],'Média alta, mas um grupo abandonado']];
  later(()=>{
    const root=$('#'+id);let pick=null,pos=null;
    function render(){
      $$('.soc',root).forEach((el,i)=>{el.classList.toggle('sel',pick===i);$$('.socb i',el).forEach((b,k)=>{b.classList.toggle('me',pick===i&&pos===k)})});
      const o=$('.wzout',root);
      if(pick==null){o.className='wzout';o.innerHTML='<b>Escolha uma sociedade</b><p>Você não sabe em qual dos quatro grupos vai nascer. Cada barra é a renda de um grupo.</p>';return}
      const s=SOC[pick],v=s[1][pos],best=SOC.reduce((b,x,i)=>Math.min(...x[1])>Math.min(...SOC[b][1])?i:b,0);
      o.className='wzout '+(pick===best?'ok':'warn');
      o.innerHTML=`<b>Você nasceu no grupo ${pos+1}: renda ${v}</b><p>${pick===best?'Você escolheu como Rawls: a sociedade em que o pior lugar é o melhor possível (critério maximin). Sem saber quem você será, garantir o piso é a escolha racional.':`Rawls escolheria a sociedade ${SOC[best][0]}, cujo pior grupo recebe ${Math.min(...SOC[best][1])}. Na ${s[0]}, o pior grupo recebe ${Math.min(...s[1])}: sob o véu da ignorância, você arriscou nascer ali.`}</p>`;swapAnim(o)}
    root.addEventListener('click',e=>{const s=e.target.closest('.soc');if(s){pick=+s.dataset.i;pos=Math.floor(Math.random()*4);render()}});render();
  });
  return `<div id="${id}"><div class="socs">${SOC.map((s,i)=>`<button class="soc" data-i="${i}"><b>Sociedade ${s[0]}</b><div class="socb">${s[1].map(v=>`<i style="height:${v/160*100}%"><span>${v}</span></i>`).join('')}</div><small>${s[2]}</small></button>`).join('')}</div><div class="wzout" aria-live="polite"></div></div>`;
}

/* ================= motor de blocos dos pacotes (gerado por importar_pacote.py — não editar) =================

const PK_CSS="\n:host{display:block;color:var(--ink);font:400 1rem/1.62 var(--sans);margin:0 0 26px}\n*,*::before,*::after{box-sizing:border-box}\nh1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0}\np{margin:0 0 .9em;max-width:68ch}\nb,strong{font-weight:650}\nbutton{font:inherit;color:inherit;cursor:pointer}\nbutton:disabled{cursor:default}\n:focus-visible{outline:3px solid var(--brass);outline-offset:3px}\n.art-ref{color:var(--seal);font-weight:600;white-space:nowrap}\nmark{background:color-mix(in srgb,var(--brass) 26%,transparent);color:inherit;padding:0 .15em}\n@keyframes rise{to{transform:none}}\n@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}\n@keyframes swap{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}\n@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}\n@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}\n.swap{animation:swap .45s}\n.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}\n.reveal.vis{opacity:1;transform:none}\n/* ajustes do protótipo: nada vaza da largura do celular */\n.calc>*{min-width:0}\n.exp .art-ref{white-space:normal}\n/* texto */\n.txt p{font-size:1.04rem}\n.txt ul{margin:0 0 1em;padding-left:1.1em;max-width:68ch}\n.txt li{margin-bottom:.35em}\n.callout{border-left:4px solid var(--seal);padding:14px 18px;background:color-mix(in srgb,var(--seal) 7%,transparent);max-width:76ch}\n.callout.brass{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 9%,transparent)}\n.callout.sage{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 9%,transparent)}\n.callout .ct{font-weight:700;color:var(--seal);display:block;margin-bottom:4px}\n.callout.brass .ct{color:var(--brass)}.callout.sage .ct{color:var(--sage)}\n.callout p:last-child{margin-bottom:0}\n\n/* cartões que viram */\n.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax /* ================= adaptador dos pacotes do Claude.ai =================
   Converte um COURSE do pacote (mods[] com blocks[] e quiz[]) em matéria do protótipo:
   cada módulo vira uma aula, cada bloco com título vira uma seção, o quiz vai para o banco
   de questões e os cartões que viram geram os flashcards da revisão.
   Os blocos são desenhados pelo motor original (PKE, 54-pk-engine.js) dentro de shadow DOM,
   então mantêm o CSS e as animações do pacote sem colidir com o CSS do protótipo. */
const strip=h=>String(h||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
const clip=(s,n)=>{s=strip(s);if(s.length<=n)return s;const c=s.slice(0,n);return c.slice(0,c.lastIndexOf(' '))+'…'};
let PK_SHEET=null;
function pkSheet(){
  if(PK_SHEET===null){try{PK_SHEET=new CSSStyleSheet();PK_SHEET.replaceSync(PK_CSS)}catch(e){PK_SHEET=false}}
  return PK_SHEET;
}
/* um bloco do pacote: host vazio agora, conteúdo montado depois que a seção entra no DOM */
function pkBlock(b){
  const id=uid('pk');
  later(()=>{
    const host=$('#'+id);if(!host||!PKE.R[b.t])return;
    const root=host.attachShadow({mode:'open'}),sh=pkSheet();
    if(sh)root.adoptedStyleSheets=[sh];
    root.innerHTML=(sh?'':`<style>${PK_CSS}</style>`)+`<div class="reveal">${PKE.R[b.t](b)}</div>`;
    const el=root.querySelector('.reveal');
    if(PKE.B[b.t])PKE.B[b.t](el,b);
    /* revela ao rolar: dispara os traços, a linha do tempo, os números que contam e os carimbos */
    const show=()=>{if(el.classList.contains('vis'))return;el.classList.add('vis');const k=el.querySelector('.keys');if(k&&!k.dataset.done){k.dataset.done=1;PKE.B.keys(k)}};
    if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){show();io.disconnect()}}),{threshold:.12});io.observe(host);cleanups.push(()=>io.disconnect())}
    else show();
  });
  return `<div class="pkh" id="${id}"></div>`;
}
/* "Jurisdição, ação e processo" -> ["Jurisdição, ação", "e processo"] */
function pkTitle(t){
  t=strip(t);const w=t.split(' ');if(w.length<2)return[t,''];
  let cut=-1;w.forEach((x,i)=>{if(i>0&&/^(e|da|do|de|na|no|nos|nas|em|ou)$/.test(x)&&Math.abs(i-w.length/2)<Math.abs(cut-w.length/2))cut=i});
  if(cut<1)cut=Math.ceil(w.length/2);
  return[w.slice(0,cut).join(' '),w.slice(cut).join(' ')];
}

    const tid=cid+'-'+m.id,lid='pk-'+tid;

    /* seções: um bloco com título abre seção; blocos sem título entram na seção anterior */
    const secs=[];

/* ================= II ================= */
{id:`jurisdicao`,group:`Fundamentos`,title:`Características e princípios da jurisdição`,
intro:`A jurisdição tem traços que a distinguem de qualquer outra atividade do Estado, e princípios que limitam quem pode exercê-la e como.`,
blocks:[
{t:`flips`,h:`As três características`,items:[
[`Inércia`,`O Judiciário não age por conta própria: <em>depende de provocação</em> (${a(`CPC, art. 2º`)}). Iniciado, o processo anda por impulso oficial.`],
[`Substitutividade`,`O Estado proíbe a justiça pelas próprias mãos e <em>substitui a vontade das partes</em> pela sua, aplicando a lei ao caso.`],
[`Definitividade`,`Só a decisão judicial pode se tornar <em>imutável pela coisa julgada</em> (${a(`CPC, art. 502`)}), dando segurança jurídica.`]]},
{t:`table`,h:`Os princípios inerentes à jurisdição`,head:[`Princípio`,`O que garante`,`Fonte`],rows:[
[`Investidura`,`Só exerce jurisdição quem foi regularmente investido no cargo, por concurso de provas e títulos`,`${a(`CF, art. 37, II`)} e 93, I`],
[`Territorialidade`,`O juiz atua nos limites territoriais fixados em lei (aderência ao território)`,`Leis de organização judiciária`],
[`Indeclinabilidade`,`O juiz não pode se recusar a julgar, nem alegando lacuna da lei`,`${a(`CPC, art. 140`)}`],
[`Indelegabilidade`,`O poder de decidir não pode ser transferido a particulares ou a outro órgão`,`Decorre do juiz natural`],
[`Inafastabilidade`,`Nenhuma lesão ou ameaça a direito fica fora do Judiciário`,`${a(`CF, art. 5º, XXXV`)}; ${a(`CPC, art. 3º`)}`],
[`Juiz natural`,`Ninguém escolhe o juiz nem é julgado por tribunal de exceção`,`${a(`CF, art. 5º, XXXVII e LIII`)}`]]},
{t:`vs`,h:`Voluntária × contenciosa`,l:{t:`Jurisdição voluntária`,i:[`Sem lide: não há conflito entre as partes`,`Caráter administrativo: o juiz fiscaliza e homologa`,`Fala-se em interessados, não em partes`,`Exemplos: alvará, autorização de viagem de menor, divórcio consensual judicial`,`${a(`CPC, arts. 719 a 770`)}`]},r:{t:`Jurisdição contenciosa`,i:[`Há lide, com interesses opostos`,`O juiz decide o conflito com sentença de mérito`,`Forma coisa julgada material`,`Exemplos: cobrança, despejo, divórcio litigioso`,`Regra geral do CPC`]}},
{t:`chooser`,h:`Quem resolve o conflito?`,hint:`Do mais primitivo ao mais institucional.`,items:[
[`Autotutela`,`As próprias partes, pela força`,`<p>Em regra proibida; pode ser crime de exercício arbitrário das próprias razões (${a(`CP, art. 345`)}). Exceções: legítima defesa e desforço imediato da posse (${a(`CC, art. 1.210, §1º`)}).</p>`],
[`Autocomposição`,`As próprias partes, por acordo`,`<p>Transação, renúncia ou submissão. O Estado deve promovê-la sempre que possível (${a(`CPC, art. 3º, §§2º e 3º`)}).</p>`],
[`Conciliação`,`Terceiro que sugere soluções`,`<p>Indicada quando as partes não tinham vínculo anterior, como numa batida de carro entre desconhecidos (${a(`CPC, art. 165, §2º`)}).</p>`],
[`Mediação`,`Terceiro que reaproxima as partes`,`<p>O mediador ajuda a restabelecer o diálogo; as partes constroem a solução. Indicada quando há vínculo anterior, como entre sócios ou familiares (${a(`CPC, art. 165, §3º`)}; Lei 13.140/2015).</p>`],
[`Arbitragem`,`Árbitro escolhido pelas partes`,`<p>Só para direitos patrimoniais disponíveis. A sentença arbitral tem os mesmos efeitos da judicial e, se condenatória, é título executivo (${a(`Lei 9.307/96, arts. 1º e 31`)}).</p>`],
[`Jurisdição`,`Estado-juiz`,`<p>Decide de forma imperativa e definitiva, com aptidão para a coisa julgada.</p>`]]},
{t:`callout`,title:`Fungibilidade recursal`,html:`<p>Um recurso errado pode ser aproveitado como o correto se houver <b>dúvida objetiva</b> sobre qual cabia, <b>ausência de erro grosseiro</b> e interposição <b>no prazo do recurso correto</b>. O CPC prevê casos expressos: embargos de declaração recebidos como agravo interno (${a(`art. 1.024, §3º`)}), recurso especial remetido ao STF (${a(`art. 1.032`)}) e extraordinário remetido ao STJ (${a(`art. 1.033`)}).</p>`}],
quiz:[

[`Qual característica explica que o processo só começa com a petição inicial?`,[`Inércia`,`Definitividade`,`Substitutividade`],0,`Sem provocação, não há jurisdição (${a(`CPC, art. 2º`)}).`],
[`Sócios em conflito querem um terceiro que os ajude a retomar o diálogo. Qual método?`,[`Conciliação`,`Mediação`,`Arbitragem`],1,`Havendo vínculo anterior, mediação (${a(`CPC, art. 165, §3º`)}).`],
[`A sentença arbitral condenatória é:`,[`título executivo extrajudicial`,`título executivo judicial`,`mero parecer`],1,`${a(`CPC, art. 515, VII`)} e ${a(`Lei 9.307/96, art. 31`)}.`]]},

/* ================= III ================= */
{id:`principios`,group:`Princípios`,title:`Princípios do processo`,
intro:`Os princípios dão forma a todo o resto. Muitos estão na Constituição e foram repetidos nas normas fundamentais do CPC (arts. 1º a 12).`,
blocks:[
{t:`flips`,h:`Garantias constitucionais`,items:[
[`Devido processo legal`,`Ninguém é privado da liberdade ou dos bens sem processo justo (${a(`CF, art. 5º, LIV`)}). É a cláusula-mãe de onde derivam os demais.`],
[`Contraditório`,`Não se decide contra a parte sem ouvi-la antes (${a(`CPC, art. 9º`)}). Basta a <em>oportunidade</em> de falar. Vedada a decisão surpresa (${a(`art. 10`)}).`],
[`Ampla defesa`,`Defesa com todos os meios e recursos lícitos (${a(`CF, art. 5º, LV`)}). Não há contraditório sem defesa, nem defesa sem contraditório.`],
[`Isonomia`,`Paridade de armas (${a(`CPC, art. 7º`)}). Igualdade material: tratar desigualmente os desiguais, na medida da desigualdade.`],
[`Duração razoável`,`Solução integral do mérito em prazo razoável (${a(`CF, art. 5º, LXXVIII`)}, EC 45/2004; ${a(`CPC, art. 4º`)}).`],
[`Juiz natural e imparcial`,`Juiz previamente competente e sem interesse na causa (${a(`CF, art. 5º, XXXVII e LIII`)}; impedimento e suspeição, ${a(`CPC, arts. 144 e 145`)}).`],
[`Publicidade`,`Atos públicos, salvo segredo de justiça (${a(`CF, arts. 5º, LX, e 93, IX`)}; ${a(`CPC, art. 189`)}).`],
[`Motivação`,`Toda decisão fundamentada, sob pena de nulidade (${a(`CF, art. 93, IX`)}; ${a(`CPC, arts. 11 e 489, §1º`)}).`]]},
{t:`flips`,h:`Princípios do próprio processo`,items:[
[`Inércia e demanda`,`A parte provoca; o juiz fica adstrito ao pedido (${a(`CPC, arts. 2º, 141 e 492`)}). "O direito não socorre aos que dormem."`],
[`Instrumentalidade das formas`,`Ato feito de outro modo é válido se atingiu a finalidade (${a(`CPC, arts. 188 e 277`)}).`],
[`Economia processual`,`Máximo resultado com mínimo de atos: aproveitar atos (${a(`art. 283`)}), reunir ações conexas, admitir reconvenção.`],
[`Eficiência`,`Dever do juiz ao aplicar o ordenamento (${a(`CPC, art. 8º`)}). Corolário do devido processo legal.`],
[`Boa-fé e cooperação`,`Todos agem com lealdade e cooperam para a decisão justa (${a(`CPC, arts. 5º e 6º`)}). Má-fé gera multa (${a(`arts. 80 e 81`)}).`],
[`Duplo grau`,`Revisão por órgão superior. Implícito na CF; expresso na Convenção Americana (art. 8.2.h). Não é absoluto.`]]},
{t:`sorter`,h:`Qual princípio está em jogo?`,bins:[`Contraditório`,`Juiz natural`,`Motivação`,`Instrumentalidade`,`Duração razoável`],cards:[
[`O juiz quer reconhecer prescrição que nenhuma parte alegou, sem ouvi-las antes.`,0,`Vedada a decisão surpresa, mesmo em matéria de ofício (${a(`CPC, art. 10`)}).`],
[`Cria-se um tribunal especial, depois do fato, só para julgar aquele caso.`,1,`Proibido tribunal de exceção (${a(`CF, art. 5º, XXXVII`)}).`],
[`A liminar diz apenas: "presentes os pressupostos legais, defiro".`,2,`Fórmula genérica não é fundamentação (${a(`CPC, art. 489, §1º, III`)}).`],
[`A citação teve vício de forma, mas o réu compareceu e contestou tudo.`,3,`Atingida a finalidade, não se anula (${a(`CPC, art. 239, §1º e 277`)}).`],
[`Processo parado há anos aguardando um despacho de mero expediente.`,4,`${a(`CF, art. 5º, LXXVIII`)}.`]]},
{t:`table`,h:`O que não é fundamentação`,hint:`${a(`CPC, art. 489, §1º`)}. Decisão assim é omissa e desafia embargos de declaração.`,head:[`Inciso`,`Vício`],rows:[
[`I`,`Só reproduzir, indicar ou parafrasear a lei, sem ligar ao caso`],
[`II`,`Usar conceito jurídico indeterminado sem explicar por que incide`],
[`III`,`Invocar motivos que serviriam para qualquer decisão`],
[`IV`,`Não enfrentar argumentos capazes de mudar a conclusão`],
[`V`,`Citar precedente ou súmula sem identificar seus fundamentos determinantes`],
[`VI`,`Deixar de seguir precedente invocado sem demonstrar distinção ou superação`]]},
{t:`vs`,h:`Duplo grau não é o mesmo que recorribilidade`,l:{t:`Recurso sem duplo grau pleno`,i:[`Recurso especial e extraordinário: só discutem direito, não reexaminam provas`,`Embargos de declaração: julgados pelo mesmo órgão`]},r:{t:`Duplo grau sem recurso`,i:[`Remessa necessária: sentença contra a Fazenda sobe ao tribunal mesmo sem apelação (${a(`CPC, art. 496`)})`,`Competência originária do STF: não há instância acima`]}},
{t:`juris`,h:`Na jurisprudência`,items:[
{court:`Corte IDH`,year:`2012`,id:`Caso Mohamed vs. Argentina`,tese:`O condenado tem direito de recorrer da primeira condenação, mesmo quando ela reforma uma absolvição.`,html:`Fundamento: art. 8.2.h da Convenção Americana. O recurso deve permitir revisão ampla, de fato e de direito.`}]},
{t:`callout`,kind:`sage`,title:`Publicidade e segredo de justiça`,html:`<p>Tramitam em segredo (${a(`CPC, art. 189`)}): interesse público ou social; casamento, divórcio, união estável, filiação, alimentos e guarda; dados protegidos pela intimidade; arbitragem com confidencialidade comprovada. Terceiro com interesse jurídico pode pedir certidão do dispositivo da sentença.</p>`}],
quiz:[
[`O contraditório exige que a parte efetivamente se manifeste?`,[`Sim, sempre`,`Não, basta ter tido a oportunidade`,`Só no processo penal`],1,`O que se garante é a oportunidade de participar e influir.`],

/* ================= IV ================= */
{id:`internacional`,group:`Competência`,title:`Limites da jurisdição e cooperação`,
intro:`Antes de saber qual juiz brasileiro julga, é preciso saber se a causa pode ser julgada no Brasil. E, quando um ato precisa ser praticado em outro lugar, entram as cartas.`,
blocks:[
{t:`vs`,h:`Concorrente × exclusiva`,l:{t:`Concorrente (arts. 21 e 22)`,i:[`Réu domiciliado no Brasil`,`Obrigação a ser cumprida aqui`,`Fato ou ato praticado aqui`,`Alimentos com credor domiciliado aqui; relações de consumo com consumidor aqui`,`Ação no estrangeiro não induz litispendência (${a(`art. 24`)})`]},r:{t:`Exclusiva (art. 23)`,i:[`Ações sobre imóveis situados no Brasil`,`Sucessão: confirmar testamento particular, inventário e partilha de bens situados no Brasil`,`Divórcio, separação ou fim da união estável: partilha de bens situados no Brasil`,`Sentença estrangeira sobre isso não é homologada`]}},
{t:`callout`,title:`Atenção a um erro comum`,html:`<p>A competência exclusiva no divórcio não abrange o divórcio em si, apenas a <b>partilha dos bens situados no Brasil</b>. Um casal pode se divorciar no exterior; o que não pode é partilhar lá o apartamento que tem em Florianópolis.</p>`},
{t:`callout`,kind:`brass`,title:`Eleição de foro estrangeiro`,html:`<p>Em contrato internacional, a cláusula de foro exclusivo estrangeiro afasta a jurisdição brasileira se o réu a alegar na contestação (${a(`CPC, art. 25`)}), salvo nos casos de competência exclusiva.</p>`},
{t:`table`,h:`As cartas`,head:[`Carta`,`De quem para quem`,`Exemplo`],rows:[
[`Precatória`,`Entre juízos nacionais de comarcas diferentes`,`Ouvir testemunha que mora em outra cidade`],
[`Rogatória`,`De juízo brasileiro para autoridade estrangeira, ou o inverso`,`Citar réu que mora em Portugal; depende de exequatur do STJ quando vem de fora (${a(`CF, art. 105, I, i`)})`],
[`De ordem`,`De tribunal para juízo a ele vinculado`,`TJ manda o juiz colher prova`],
[`Arbitral`,`Do árbitro para o Judiciário`,`Cumprir medida decretada na arbitragem (${a(`CPC, art. 237, IV`)})`]]},
{t:`steps`,h:`Homologação de decisão estrangeira`,items:[
[`Decisão proferida no exterior`,`Sentença, decisão interlocutória ou sentença arbitral estrangeira precisa produzir efeitos aqui.`,`CPC, art. 960`],
[`Pedido ao STJ`,`A competência é do Superior Tribunal de Justiça.`,`CF, art. 105, I, i`],
[`Requisitos`,`Autoridade competente, citação regular, eficácia no país de origem, não ofender coisa julgada brasileira nem a ordem pública, tradução oficial.`,`CPC, art. 963`],
[`Exceção`,`Sentença estrangeira de divórcio consensual produz efeitos no Brasil sem homologação.`,`CPC, art. 961, §5º`]]}],
quiz:[
[`Inventário de bens situados no Brasil de quem morreu na Itália:`,[`pode ser feito na Itália e homologado`,`é de competência exclusiva brasileira`,`depende de tratado`],1,`${a(`CPC, art. 23, II`)}.`],
[`Para ouvir testemunha em outra comarca, expede-se carta:`,[`rogatória`,`precatória`,`de ordem`],1,`Comunicação entre juízos nacionais.`],
[`Quem homologa sentença estrangeira?`,[`STF`,`STJ`,`TJ do Estado`],1,`${a(`CF, art. 105, I, i`)}.`]]},

/* ================= V ================= */
{id:`competencia`,group:`Competência`,title:`Competência absoluta e relativa`,
intro:`Competência é a medida da jurisdição: diz qual órgão, entre todos os que têm jurisdição, deve julgar aquela causa. A diferença entre absoluta e relativa decide quem pode alegar, quando e o que acontece se ninguém alegar.`,
blocks:[
{t:`vs`,h:`Os critérios`,l:{t:`Absoluta`,i:[`Matéria (família, falência, trabalho)`,`Pessoa (União na Justiça Federal)`,`Função ou hierarquia (recursos, competência originária)`,`Interesse público: não se altera`]},r:{t:`Relativa`,i:[`Território (domicílio do réu, ${a(`art. 46`)})`,`Valor da causa`,`Interesse das partes: pode ser alterada`,`Exceção: território absoluto em imóveis e possessórias (${a(`art. 47`)})`]}},
{t:`chooser`,h:`O regime na prática`,items:[
[`Quem alega?`,`Absoluta: qualquer um, o juiz de ofício. Relativa: só o réu.`,`<p><b>Absoluta</b>: em qualquer tempo e grau, e o juiz declara de ofício (${a(`CPC, art. 64, §1º`)}). <b>Relativa</b>: o réu, em preliminar de contestação; o MP pode alegar nas causas em que atua (${a(`art. 65, parágrafo único`)}). O juiz não a reconhece de ofício (${a(`Súmula 33 do STJ`)}).</p>`],
[`E se ninguém alegar?`,`Absoluta: o vício permanece. Relativa: prorroga.`,`<p>A incompetência absoluta pode fundamentar ação rescisória (${a(`art. 966, II`)}). A relativa se prorroga e o juízo passa a ser competente (${a(`art. 65`)}).</p>`],
[`As partes podem mudar?`,`Só a relativa.`,`<p>A absoluta é inderrogável por convenção (${a(`art. 62`)}). A relativa pode ser modificada por eleição de foro em contrato escrito que mencione o negócio (${a(`art. 63`)}).</p>`],
[`Efeito da declaração`,`Remessa ao juízo competente.`,`<p>Declarada a incompetência, os autos vão ao juízo competente, e as decisões do incompetente conservam efeitos até outra decisão (${a(`art. 64, §§3º e 4º`)}).</p>`]]},
{t:`sorter`,h:`Absoluta ou relativa?`,bins:[`Absoluta`,`Relativa`],cards:[
[`Ação de família proposta na vara cível, existindo vara de família na comarca.`,0,`Critério de matéria.`],
[`Cobrança proposta fora do domicílio do réu.`,1,`Critério territorial (${a(`art. 46`)}).`],
[`União é ré, e a ação corre na Justiça Estadual.`,0,`Critério de pessoa (${a(`CF, art. 109, I`)}).`],
[`Ação possessória sobre imóvel proposta fora do foro do imóvel.`,0,`Exceção territorial absoluta (${a(`CPC, art. 47, §2º`)}).`],
[`Contrato com foro de eleição em Joaçaba; ação proposta em Chapecó.`,1,`Eleição de foro é critério territorial.`]]},
{t:`callout`,kind:`brass`,title:`Cláusula de eleição abusiva`,html:`<p>Antes da citação, o juiz pode reputar ineficaz, de ofício, a cláusula de foro abusiva e remeter os autos ao foro do domicílio do réu (${a(`art. 63, §3º`)}). Citado, cabe ao réu alegar na contestação, sob pena de preclusão (§4º).</p>`},
{t:`keys`,h:`Números que caem em prova`,items:[[`40`,`salários mínimos`,`teto do Juizado Especial Cível estadual (Lei 9.099/95, art. 3º)`],[`60`,`salários mínimos`,`teto dos Juizados Federais e da Fazenda Pública`],[`33`,`Súmula do STJ`,`incompetência relativa não se declara de ofício`]]}],
quiz:[
[`O juiz pode declarar de ofício a incompetência territorial?`,[`Sim`,`Não, salvo cláusula abusiva antes da citação`,`Só em segundo grau`],1,`${a(`Súmula 33 do STJ`)} e ${a(`CPC, art. 63, §3º`)}.`],
[`O réu não alegou incompetência relativa. Consequência?`,[`Nulidade`,`Prorrogação`,`Extinção`],1,`${a(`CPC, art. 65`)}.`],
[`Competência em razão da matéria é:`,[`relativa`,`absoluta`,`depende do valor`],1,`Critério de interesse público.`]]},

/* ================= VI ================= */
{id:`modificacao`,group:`Competência`,title:`Modificação e conflito de competência`,
intro:`Só a competência relativa se modifica. Os caminhos são a vontade das partes (derrogação), a inércia do réu (prorrogação) e a ligação entre ações (conexão e continência).`,
blocks:[
{t:`tl`,h:`Quatro formas de modificar`,items:[
[`Derrogação`,`Antes do processo: as partes elegem o foro no contrato (${a(`art. 63`)}). Vincula herdeiros e sucessores.`],
[`Prorrogação`,`No processo: o réu não alega a incompetência relativa (${a(`art. 65`)}).`],
[`Conexão`,`Duas ações com o mesmo pedido ou a mesma causa de pedir são reunidas (${a(`art. 55`)}).`],
[`Continência`,`Mesmas partes e causa de pedir, e o pedido de uma abrange o da outra (${a(`art. 56`)}).`]]},
{t:`svg`,h:`Conexão e continência em imagem`,html:`<svg viewBox="0 0 720 260" role="img" aria-label="Conexão: dois círculos que se tocam; continência: um círculo dentro do outro">

{t:`table`,h:`O que acontece com as ações`,head:[`Situação`,`Consequência`,`Base`],rows:[
[`Conexão`,`Reunião para decisão conjunta no juízo prevento, salvo se uma já foi sentenciada`,`${a(`art. 55, §1º`)}; ${a(`Súmula 235 do STJ`)}`],
[`Execução e ação de conhecimento sobre o mesmo ato`,`São consideradas conexas`,`${a(`art. 55, §2º`)}`],
[`Risco de decisões conflitantes, mesmo sem conexão`,`Reunião`,`${a(`art. 55, §3º`)}`],

[`Continência, com a contida proposta antes`,`Reunião das ações`,`${a(`art. 57`)}`],
[`Juízo prevento`,`O do registro ou distribuição da primeira ação`,`${a(`arts. 58 e 59`)}`]]},
{t:`sorter`,h:`Conexão, continência ou nada?`,bins:[`Conexão`,`Continência`,`Nenhuma`],cards:[
[`A: despejo por falta de pagamento. B: consignação dos mesmos aluguéis.`,0,`Causa de pedir comum: o mesmo contrato e o mesmo débito.`],
[`A: anular o contrato inteiro. B: anular só a cláusula 5ª. Mesmas partes e causa de pedir.`,1,`O pedido de A abrange o de B.`],

[`A: execução de nota promissória. B: ação para anular a mesma nota.`,0,`${a(`art. 55, §2º, I`)}.`]]},
{t:`chooser`,h:`Conflito de competência`,hint:`${a(`CPC, art. 66 e arts. 951 a 959`)}.`,items:[
[`Positivo`,`Dois ou mais juízes se dizem competentes`,`<p>${a(`art. 66, I`)}. O relator pode sobrestar o processo e designar um juiz para medidas urgentes (${a(`art. 955`)}).</p>`],
[`Negativo`,`Dois ou mais juízes se dizem incompetentes`,`<p>${a(`art. 66, II`)}. Quem não acolher a competência declinada deve suscitar o conflito, salvo se atribuí-la a terceiro juízo.</p>`],
[`Sobre reunião`,`Divergência sobre reunir ou separar processos`,`<p>${a(`art. 66, III`)}.</p>`],
[`Quem suscita`,`Partes, MP ou juiz`,`<p>O juiz por ofício; partes e MP por petição (${a(`arts. 951 e 953`)}). Não pode suscitar a parte que arguiu incompetência relativa (${a(`art. 952`)}).</p>`],
[`Quem julga`,`O tribunal com ascendência sobre ambos`,`<p>Entre juízes do mesmo TJ, o TJ; entre juízes vinculados a tribunais diversos, o STJ (${a(`CF, art. 105, I, d`)}). O relator julga de plano se houver súmula ou tese repetitiva (${a(`art. 955, parágrafo único`)}).</p>`]]}],
quiz:[
[`Ação continente proposta depois da contida. O que ocorre?`,[`Extinção da contida`,`Reunião`,`Suspensão da continente`],1,`${a(`CPC, art. 57`)}: se a contida veio antes, reúnem-se.`],
[`Um processo já foi sentenciado. Cabe reunião por conexão?`,[`Sim`,`Não`],1,`${a(`art. 55, §1º`)} e ${a(`Súmula 235 do STJ`)}.`],

/* ================= VII ================= */
{id:`capacidade`,group:`Sujeitos e terceiros`,title:`Capacidade, representação e procuração`,
intro:`Para estar em juízo não basta ser pessoa. São três capacidades diferentes, e cada uma tem seu remédio quando falta.`,
blocks:[
{t:`steps`,h:`As três capacidades`,items:[
[`Capacidade de ser parte`,`Ter personalidade jurídica, ou ser ente despersonalizado a quem a lei dá essa aptidão (espólio, massa falida, condomínio).`,`CPC, art. 75`],
[`Capacidade de estar em juízo`,`Estar no exercício dos próprios direitos (${a(`art. 70`)}). Incapazes são representados ou assistidos.`,`CPC, arts. 70 e 71`],
[`Capacidade postulatória`,`Falar nos autos. Em regra, só o advogado inscrito na OAB (${a(`art. 103`)}). Exceções: Juizado Especial até 20 salários mínimos (${a(`Lei 9.099/95, art. 9º`)}).`,`CPC, art. 103`]]},
{t:`table`,h:`Incapazes no processo`,head:[`Quem`,`Como atua`],rows:[
[`Absolutamente incapaz (menor de 16)`,`Representado pelos pais ou tutor`],
[`Relativamente incapaz (16 a 18, ébrios habituais, pródigos, quem não pode exprimir vontade)`,`Assistido pelos pais, tutor ou curador`],
[`Incapaz sem representante ou com interesses colidentes`,`Curador especial (${a(`art. 72, I`)})`],
[`Réu preso revel, ou citado por edital ou hora certa e revel`,`Curador especial, função da Defensoria (${a(`art. 72, II e parágrafo único`)})`]]},
{t:`flips`,h:`A procuração`,items:[
[`Regra`,`O advogado não postula sem procuração (${a(`art. 104`)}).`],
[`Exceção`,`Para evitar preclusão, decadência ou prescrição, ou praticar ato urgente. Deve exibir a procuração em <em>15 dias, prorrogáveis por mais 15</em>.`],
[`Ato não ratificado`,`É <em>ineficaz</em> em relação à parte, e o advogado responde por despesas e perdas e danos (${a(`art. 104, §2º`)}).`],
[`Poderes especiais`,`Receber citação, confessar, reconhecer a procedência, transigir, desistir, renunciar, dar quitação, firmar compromisso e declarar hipossuficiência exigem cláusula específica (${a(`art. 105`)}).`],
[`Fim do mandato`,`Revogação ou renúncia; morte ou interdição; mudança de estado; fim do prazo ou do negócio (${a(`CC, art. 682`)}).`]]}],
quiz:[
[`Espólio pode ser parte?`,[`Não, não tem personalidade`,`Sim, a lei lhe dá capacidade de ser parte`],1,`${a(`CPC, art. 75, VII`)}.`],
[`Advogado sem procuração pode agir para evitar a prescrição?`,[`Não`,`Sim, apresentando-a em 15 dias prorrogáveis`],1,`${a(`CPC, art. 104, §1º`)}.`],
[`Réu citado por edital e revel recebe:`,[`curador especial`,`nada, segue revel`,`tutor`],0,`${a(`CPC, art. 72, II`)}.`]]},

/* ================= VIII ================= */
{id:`litisconsorcio`,group:`Sujeitos e terceiros`,title:`Litisconsórcio`,
intro:`Litisconsórcio é a pluralidade de partes num mesmo polo. Serve à economia processual e à coerência das decisões.`,
blocks:[
{t:`callout`,kind:`brass`,title:`Quando é possível (art. 113)`,html:`<p>Duas ou mais pessoas litigam juntas quando houver <b>comunhão</b> de direitos ou obrigações; <b>conexão</b> pelo pedido ou causa de pedir; ou <b>afinidade</b> de questões por ponto comum de fato ou de direito.</p>`},
{t:`table`,h:`As classificações`,head:[`Critério`,`Espécies`,`O que define`],rows:[
[`Obrigatoriedade`,`Necessário × facultativo`,`Necessário quando a lei exige ou a relação só pode ser decidida com todos (${a(`art. 114`)})`],
[`Resultado`,`Unitário × simples`,`Unitário quando o mérito tem de ser igual para todos (${a(`art. 116`)})`],
[`Posição`,`Ativo, passivo ou misto`,`Vários autores, vários réus, ou ambos`],
[`Momento`,`Inicial × ulterior`,`Desde a inicial ou formado depois`]]},
{t:`chooser`,h:`Faltou um litisconsorte necessário`,hint:`${a(`CPC, art. 115`)}.`,items:[
[`Unitário`,`Sentença nula`,`<p>Se o litisconsórcio era necessário e unitário, a sentença proferida sem um deles é <b>nula</b> para todos.</p>`],
[`Simples`,`Sentença ineficaz para o ausente`,`<p>Se era necessário mas simples, a sentença é <b>ineficaz</b> apenas para quem não foi citado.</p>`],
[`Remédio`,`Juiz manda citar`,`<p>O juiz determina ao autor que requeira a citação de todos, em prazo que fixar, sob pena de extinção (${a(`art. 115, parágrafo único`)}).</p>`]]},
{t:`flips`,h:`Regras de convivência`,items:[
[`Autonomia`,`Litisconsortes são litigantes distintos: os atos de um não prejudicam nem beneficiam os outros, <em>salvo no unitário</em> (${a(`art. 117`)}).`],
[`Multitudinário`,`O juiz pode limitar o facultativo quando o número de partes atrapalhar a defesa ou a rapidez (${a(`art. 113, §1º`)}). O pedido de limitação interrompe o prazo de resposta (§2º).`],
[`Prazo em dobro`,`Com procuradores diferentes, de escritórios distintos, em <em>autos físicos</em> (${a(`art. 229`)}). Cessa se, de dois réus, só um se defende.`]]},
{t:`sorter`,h:`Classifique`,bins:[`Necessário e unitário`,`Facultativo e simples`,`Facultativo e unitário`],cards:[
[`Ação para anular casamento proposta pelo MP contra os dois cônjuges.`,0,`A relação é incindível e a lei exige os dois.`],
[`Vários passageiros do mesmo voo cancelado pedem indenização juntos.`,1,`Podiam processar separadamente; cada um recebe sua indenização.`],
[`Dois condôminos, em conjunto, reivindicam o imóvel comum.`,2,`Cada um poderia agir sozinho (${a(`CC, art. 1.314`)}), mas a decisão sobre a coisa é uma só.`]]}],
quiz:[
[`Sentença sem litisconsorte necessário unitário é:`,[`válida`,`nula`,`ineficaz só para o ausente`],1,`${a(`CPC, art. 115, I`)}.`],
[`Prazo em dobro do art. 229 vale em autos eletrônicos?`,[`Sim`,`Não`],1,`${a(`art. 229, §2º`)}.`],
[`O juiz pode limitar o litisconsórcio necessário?`,[`Sim`,`Não, só o facultativo`],1,`${a(`art. 113, §1º`)}.`]]}
]};

/* ================= IX ================= */
{id:`terceiros`,group:`Sujeitos e terceiros`,title:`Intervenção de terceiros`,
intro:`Terceiro é quem não é parte, mas tem razão jurídica para entrar no processo. O CPC prevê cinco figuras (arts. 119 a 138).`,
blocks:[
{t:`table`,h:`As cinco figuras`,head:[`Figura`,`Quem provoca`,`Para quê`,`Artigos`],rows:[
[`Assistência`,`O próprio terceiro`,`Ajudar uma parte a vencer, por ter interesse jurídico no resultado`,`119 a 124`],
[`Denunciação da lide`,`Autor ou réu`,`Trazer quem deve indenizar em regresso`,`125 a 129`],
[`Chamamento ao processo`,`Só o réu`,`Trazer os coobrigados solidários`,`130 a 132`],
[`Desconsideração da personalidade`,`Parte ou MP`,`Alcançar bens de sócios ou da empresa`,`133 a 137`],
[`Amicus curiae`,`O juiz, de ofício ou a pedido`,`Contribuir tecnicamente em tema relevante`,`138`]]},
{t:`vs`,h:`Assistência simples × litisconsorcial`,l:{t:`Simples (arts. 121 a 123)`,i:[`O assistente tem relação jurídica com o assistido que pode ser afetada pela sentença`,`Atua como auxiliar; não pode contrariar o assistido`,`Se o assistido for revel, o assistente atua como seu substituto processual`,`Não impede desistência ou acordo do assistido`]},r:{t:`Litisconsorcial (art. 124)`,i:[`A sentença influirá na relação entre o assistente e o adversário do assistido`,`É tratado como litisconsorte do assistido`,`Exemplo: condômino que ingressa na ação reivindicatória movida por outro condômino`]}},
{t:`callout`,title:`Efeito da intervenção (art. 123)`,html:`<p>Transitada a sentença, o assistente não pode discutir a justiça da decisão em outro processo, salvo se provar que foi impedido de produzir provas pelo estado em que recebeu o processo, ou que o assistido, por dolo ou culpa, deixou de usar alegações ou provas que ele desconhecia.</p>`},
{t:`sorter`,h:`Que intervenção é essa?`,bins:[`Assistência`,`Denunciação`,`Chamamento`,`Desconsideração`,`Amicus curiae`],cards:[
