[`O réu de uma ação por acidente quer que sua seguradora o reembolse ali mesmo.`,1,`Regresso por contrato (${a(`art. 125, II`)}).`],
[`O sublocatário quer ajudar o locatário a vencer a ação de despejo.`,0,`Interesse jurídico no resultado (${a(`art. 119`)}).`],
[`O credor quer alcançar os bens dos sócios de empresa esvaziada.`,3,`Incidente dos ${a(`arts. 133 a 137`)}.`],
[`Uma entidade científica quer opinar num processo sobre tema de grande repercussão.`,4,`${a(`art. 138`)}.`],
[`Comprador evicto quer trazer quem lhe vendeu o imóvel.`,1,`${a(`art. 125, I`)}: evicção.`]]},
{t:`flips`,h:`Detalhes que decidem questões`,items:[
[`Denunciação não é obrigatória`,`Se não for feita ou for indeferida, o direito de regresso pode ser exercido em ação autônoma (${a(`art. 125, §1º`)}). Só se admite uma denunciação sucessiva (§2º).`],
[`Seguradora condenada direto`,`Denunciada, pode ser condenada direta e solidariamente com o segurado, nos limites da apólice (${a(`Súmula 537 do STJ`)}).`],
[`Chamamento gera título`,`A sentença vale como título para quem pagar cobrar do devedor principal ou dos demais a quota de cada um (${a(`art. 132`)}).`],
[`Desconsideração`,`Cabe em qualquer fase; suspende o processo, salvo se pedida na inicial; o sócio é citado e tem 15 dias. Pode ser inversa. Decide-se por interlocutória agravável (${a(`art. 1.015, IV`)}).`],
[`Amicus curiae`,`Decisão de admissão é irrecorrível. Não altera a competência. Só recorre por embargos de declaração e no IRDR (${a(`art. 138, §§1º e 3º`)}).`]]},
{t:`juris`,h:`Súmula aplicável`,items:[{court:`STJ`,year:`Súm. 537`,id:`Súmula 537 do STJ`,tese:`Na denunciação da lide, a seguradora pode ser condenada direta e solidariamente com o segurado, nos limites da apólice.`}]}],
quiz:[
[`O chamamento ao processo pode ser feito pelo autor?`,[`Sim`,`Não, só pelo réu`],1,`${a(`CPC, art. 130`)}.`],
[`A denunciação da lide é obrigatória para preservar o direito de regresso?`,[`Sim`,`Não`],1,`${a(`art. 125, §1º`)}.`],
[`Do que o amicus curiae pode recorrer?`,[`De qualquer decisão`,`Só embargos de declaração e decisão do IRDR`,`De nada`],1,`${a(`art. 138, §§1º e 3º`)}.`]]},

/* ================= X ================= */
{id:`sujeitos`,group:`Sujeitos e terceiros`,title:`Juiz, MP, Advocacia Pública e Defensoria`,
intro:`Além das partes, o processo tem sujeitos com funções próprias: quem julga e quem desempenha funções essenciais à justiça.`,
blocks:[
{t:`p`,h:`Poderes e deveres do juiz`,html:`<p>O juiz dirige o processo (${a(`CPC, art. 139`)}) e deve, entre outras coisas: assegurar igualdade; velar pela duração razoável; prevenir atos contrários à dignidade da justiça; determinar medidas indutivas, coercitivas, mandamentais ou sub-rogatórias; promover a autocomposição; <b>dilatar prazos e alterar a ordem das provas</b>; mandar suprir pressupostos processuais; e oficiar o MP e a Defensoria para ações coletivas. Não pode deixar de decidir por lacuna (${a(`art. 140`)}) e responde por perdas e danos se agir com dolo ou fraude (${a(`art. 143`)}).</p>`},
{t:`vs`,h:`Impedimento × suspeição`,l:{t:`Impedimento (art. 144)`,i:[`Critério objetivo: basta o fato`,`Atuou como advogado, perito, MP ou testemunha`,`Já decidiu a causa em outro grau`,`Ele, cônjuge ou parente até o 3º grau é parte ou advogado (se já atuava antes)`,`Sócio ou diretor de pessoa jurídica parte; herdeiro, donatário ou empregador de parte`,`Gera nulidade e permite ação rescisória (${a(`art. 966, II`)})`]},r:{t:`Suspeição (art. 145)`,i:[`Critério subjetivo: risco à imparcialidade`,`Amigo íntimo ou inimigo da parte ou do advogado`,`Recebeu presentes, aconselhou a parte ou custeou o litígio`,`Parte é credora ou devedora dele ou de parentes`,`Interessado no julgamento; foro íntimo, sem declarar razões`,`Não autoriza rescisória`]}},
{t:`callout`,kind:`brass`,title:`Suspeição provocada não vale`,html:`<p>É ilegítima a alegação de suspeição provocada por quem a alega ou feita por quem já praticou ato de aceitação do juiz (${a(`art. 145, §2º`)}). Ofender o juiz para depois chamá-lo de inimigo não funciona. A arguição se faz em 15 dias do conhecimento do fato (${a(`art. 146`)}) e suspende o processo (${a(`art. 313, III`)}).</p>`},
{t:`table`,h:`As funções essenciais à justiça no processo civil`,head:[``,`Ministério Público`,`Advocacia Pública`,`Defensoria Pública`],rows:[
[`Missão`,`Ordem jurídica, regime democrático, interesses sociais e individuais indisponíveis (${a(`CF, art. 127`)})`,`Representar e defender União, Estados, DF, Municípios, autarquias e fundações públicas`,`Orientação jurídica, direitos humanos e defesa dos necessitados`],
[`Como atua`,`Parte ou fiscal da ordem jurídica (${a(`CPC, arts. 177 e 178`)})`,`Representação judicial, consultoria e assessoria`,`Parte ou curadora especial; pode propor ação civil pública`],
[`Prazo`,`Em dobro (${a(`art. 180`)})`,`Em dobro (${a(`art. 183`)})`,`Em dobro, inclusive núcleos de prática jurídica conveniados (${a(`art. 186`)})`],
[`Intimação`,`Pessoal: carga, remessa ou meio eletrônico`,`Pessoal`,`Pessoal; pode pedir intimação pessoal do assistido`],
[`Responsabilidade`,`Regressiva por dolo ou fraude (${a(`art. 181`)})`,`Regressiva por dolo ou fraude (${a(`art. 184`)})`,`Regressiva por dolo ou fraude (${a(`art. 187`)})`]]},
{t:`chooser`,h:`Quando o MP intervém como fiscal`,hint:`${a(`CPC, art. 178`)}. Intimado, tem vista depois das partes e é intimado de todos os atos (art. 179).`,items:[
[`Interesse público ou social`,`Intervém`,`<p>Inciso I.</p>`],[`Interesse de incapaz`,`Intervém`,`<p>Inciso II. Sem a intimação, o processo é nulo a partir de quando deveria intervir (${a(`art. 279`)}).</p>`],[`Litígio coletivo pela posse de terra`,`Intervém`,`<p>Inciso III, rural ou urbana.</p>`],[`Fazenda Pública é parte`,`Por si só, não`,`<p>A participação da Fazenda não configura, sozinha, interesse público (${a(`art. 178, parágrafo único`)}).</p>`]]},
{t:`callout`,kind:`sage`,title:`Prazo próprio afasta o dobro`,html:`<p>O prazo em dobro não se aplica quando a lei fixa prazo específico para o ente público (${a(`arts. 180, §2º, 183, §2º e 186, §4º`)}). Empresas públicas e sociedades de economia mista não têm a prerrogativa: são pessoas de direito privado.</p>`}],
quiz:[
[`Juiz que é amigo íntimo do advogado da parte é:`,[`impedido`,`suspeito`],1,`${a(`CPC, art. 145, I`)}.`],
[`Cabe ação rescisória por suspeição?`,[`Sim`,`Não`],1,`Só o impedimento autoriza (${a(`art. 966, II`)}).`],
[`A presença da Fazenda Pública obriga a intervenção do MP?`,[`Sim`,`Não, por si só`],1,`${a(`art. 178, parágrafo único`)}.`],
[`Empresa pública tem prazo em dobro?`,[`Sim`,`Não`],1,`Só pessoas jurídicas de direito público.`]]},

/* ================= XI ================= */
{id:`atos`,group:`Atos, prazos e nulidades`,title:`Atos processuais e pronunciamentos`,
intro:`O processo é feito de atos: das partes, do juiz e dos auxiliares. Cada um tem forma, tempo e lugar.`,
blocks:[
{t:`flips`,h:`Atos das partes`,items:[
[`Efeito imediato`,`Os atos das partes produzem efeitos desde logo (${a(`CPC, art. 200`)}).`],
[`A exceção da desistência`,`A desistência da ação só produz efeitos depois de <em>homologada</em> (${a(`art. 200, parágrafo único`)}; ${a(`art. 485, VIII`)}). Após a contestação, depende de consentimento do réu (${a(`art. 485, §4º`)}), e só cabe até a sentença (§5º).`],
[`Unilaterais e bilaterais`,`Petição inicial e contestação são unilaterais; transação e negócio processual são bilaterais.`],
[`Sem rabiscos`,`São vedadas cotas marginais ou interlineares nos autos (${a(`art. 202`)}).`]]},
{t:`callout`,kind:`brass`,title:`Negócio jurídico processual (art. 190)`,html:`<p>Em causas que admitem autocomposição, partes plenamente capazes podem ajustar o procedimento e convencionar sobre ônus, poderes, faculdades e deveres, antes ou durante o processo. O juiz controla a validade e recusa a convenção nula, abusiva em contrato de adesão ou que explore vulnerabilidade. Exemplo típico: o <b>calendário processual</b> (${a(`art. 191`)}), fixado pelo juiz e pelas partes, que vincula todos e dispensa intimações.</p>`},
{t:`table`,h:`Pronunciamentos do juiz`,head:[`Pronunciamento`,`Conceito`,`Recurso`],rows:[
[`Sentença`,`Põe fim à fase de conhecimento ou extingue a execução, com fundamento nos arts. 485 ou 487 (${a(`art. 203, §1º`)})`,`Apelação`],
[`Decisão interlocutória`,`Todo pronunciamento decisório que não é sentença (${a(`art. 203, §2º`)})`,`Agravo de instrumento, se no rol do art. 1.015; senão, preliminar de apelação`],
[`Despacho`,`Sem conteúdo decisório, só impulsiona (${a(`art. 203, §3º`)})`,`Irrecorrível (${a(`art. 1.001`)})`],
[`Ato ordinatório`,`Praticado pelo servidor, como juntada e vista obrigatória (${a(`art. 203, §4º`)})`,`Revisável pelo juiz`],
[`Decisão monocrática`,`Do relator, sozinho, no tribunal`,`Agravo interno`],
[`Acórdão`,`Julgamento colegiado do tribunal (${a(`art. 204`)})`,`REsp, RE, recurso ordinário, embargos`]]},
{t:`sorter`,h:`Que pronunciamento é esse?`,bins:[`Despacho`,`Interlocutória`,`Sentença`],cards:[
[`"Intime-se o autor para se manifestar sobre os documentos."`,0,`Só impulsiona o processo.`],
[`"Indefiro o pedido de gratuidade da justiça."`,1,`Decide, sem encerrar a fase.`],
[`"Julgo procedente o pedido e condeno o réu..."`,2,`Encerra a fase de conhecimento com base no art. 487.`],
[`"Defiro a tutela de urgência."`,1,`Decisão no curso do processo.`]]},
{t:`keys`,h:`Tempo e lugar dos atos`,items:[[`6h–20h`,`horário dos atos`,`em dias úteis (${a(`art. 212`)}); ato iniciado pode ser concluído se o adiamento causar dano`],[`24h`,`processo eletrônico`,`até as 24 horas do último dia (${a(`art. 213`)})`],[`20/12–20/1`,`recesso`,`prazos suspensos (${a(`art. 220`)})`]]},
{t:`p`,html:`<p><b>Mesmo nas férias e feriados</b> se praticam citações, intimações e penhoras (${a(`art. 212, §2º`)}), tutelas de urgência (${a(`art. 214`)}), e tramitam jurisdição voluntária, alimentos e nomeação ou remoção de tutor e curador (${a(`art. 215`)}).</p><p><b>Lugar:</b> em regra, na sede do juízo. Exceções: deferência a autoridades (como ouvir o Presidente da República onde ele indicar, ${a(`art. 454`)}), interesse da justiça, natureza do ato ou obstáculo criado por quem quer impedi-lo (${a(`art. 217`)}).</p>`}],
quiz:[
[`Despacho que manda intimar a parte admite recurso?`,[`Agravo`,`Não, é irrecorrível`],1,`${a(`CPC, art. 1.001`)}.`],
[`Depois da contestação, o autor pode desistir sozinho?`,[`Sim`,`Não, depende do consentimento do réu`],1,`${a(`art. 485, §4º`)}.`],
[`Penhora pode ser feita durante as férias forenses?`,[`Não`,`Sim`],1,`${a(`art. 212, §2º`)}.`]]},

/* ================= XII ================= */
{id:`prazos`,group:`Atos, prazos e nulidades`,title:`Prazos processuais`,
intro:`Perder um prazo costuma ser irreversível. Por isso vale dominar de onde ele vem, quando começa e como se conta.`,
blocks:[
{t:`steps`,h:`De onde vem o prazo`,items:[
[`Legal`,`Fixado em lei, como os 15 dias da contestação.`,`CPC, art. 218`],
[`Judicial`,`Fixado pelo juiz quando a lei for omissa, considerando a complexidade do ato.`,`art. 218, §1º`],
[`Subsidiário`,`Sem lei nem decisão: 5 dias para a parte.`,`art. 218, §3º`],
[`Comparecimento`,`Intimação para comparecer: pelo menos 48 horas de antecedência.`,`art. 218, §2º`]]},
{t:`calc`,kind:`prazo`,h:`Calcule um prazo de verdade`,hint:`Dias úteis, exclusão do dia do começo, recesso de fim de ano, feriados nacionais e prazo em dobro.`},
{t:`table`,h:`Quando o prazo começa`,hint:`${a(`CPC, art. 231`)}. Depois desse marco, aplica-se a contagem do art. 224.`,head:[`Forma de comunicação`,`Dia do começo`],rows:[
[`Correio`,`Juntada do aviso de recebimento`],
[`Oficial de justiça (inclusive hora certa)`,`Juntada do mandado cumprido`],
[`Escrivão ou chefe de secretaria`,`Data em que ocorreu`],
[`Edital`,`Dia útil seguinte ao fim da dilação fixada pelo juiz`],
[`Intimação eletrônica`,`Dia útil seguinte à consulta ou ao fim do prazo de 10 dias corridos para consultar (Lei 11.419/06, art. 5º, §3º)`],
[`Carta precatória ou rogatória`,`Juntada da comunicação do cumprimento ou da carta cumprida`],
[`Diário da Justiça eletrônico`,`Publicação: considera-se publicado no primeiro dia útil após a disponibilização, e o prazo começa no dia útil seguinte (${a(`art. 224, §§2º e 3º`)})`],
[`Carga dos autos`,`Dia da carga`],
[`Citação eletrônica`,`Quinto dia útil após a confirmação do recebimento, que deve ocorrer em até 3 dias úteis (${a(`art. 246, §1º-A`)})`]]},
{t:`flips`,h:`Regras de contagem`,items:[
[`Só dias úteis`,`Para prazos processuais em dias (${a(`art. 219`)}). Prazos materiais, como a dilação do edital ou a prescrição, correm em dias corridos.`],
[`Exclui e inclui`,`Exclui o dia do começo e inclui o do vencimento (${a(`art. 224`)}). Protrai se o expediente começar tarde, acabar cedo ou o sistema cair.`],
[`Antes do prazo vale`,`Ato praticado antes do termo inicial é tempestivo (${a(`art. 218, §4º`)}).`],
[`Renúncia`,`A parte pode renunciar ao prazo estabelecido só em seu favor, de forma expressa (${a(`art. 225`)}).`],
[`Justa causa`,`Evento alheio à vontade que impediu o ato permite praticá-lo em prazo fixado pelo juiz (${a(`art. 223`)}).`],
[`Prorrogação`,`Até 2 meses em comarca de difícil transporte; mais em calamidade pública (${a(`art. 222`)}).`]]},
{t:`keys`,h:`Prazos do juiz e do servidor`,hint:`São prazos impróprios: o descumprimento não gera preclusão.`,items:[[`5`,`dias`,`despachos (${a(`art. 226, I`)})`],[`10`,`dias`,`decisões interlocutórias (II)`],[`30`,`dias`,`sentenças (III)`],[`1`,`dia`,`servidor remeter os autos conclusos (${a(`art. 228`)})`]]},
{t:`chooser`,h:`Prazo em dobro`,items:[
[`Ministério Público`,`Dobro`,`<p>${a(`art. 180`)}, contado da intimação pessoal.</p>`],[`Fazenda Pública`,`Dobro`,`<p>${a(`art. 183`)}.</p>`],[`Defensoria e NPJ`,`Dobro`,`<p>${a(`art. 186`)}, inclusive escritórios de prática jurídica de faculdades e entidades conveniadas (§3º).</p>`],[`Litisconsortes`,`Dobro, com ressalvas`,`<p>Procuradores diferentes, de escritórios distintos, em autos físicos (${a(`art. 229`)}). Cessa se, de dois réus, só um contestar.</p>`],[`Lei com prazo próprio`,`Sem dobro`,`<p>Quando a lei fixa prazo específico para o ente.</p>`]]}],
quiz:[
[`Intimação publicada no DJe que foi disponibilizado na segunda-feira. Quando começa o prazo?`,[`Na segunda`,`Na terça`,`Na quarta`],2,`Publicação na terça (primeiro dia útil seguinte) e início na quarta (${a(`art. 224, §§2º e 3º`)}).`],
[`O prazo para o juiz sentenciar é preclusivo?`,[`Sim`,`Não, é impróprio`],1,`${a(`art. 226`)}.`],
[`Sem prazo na lei ou na decisão, a parte tem:`,[`5 dias`,`15 dias`,`48 horas`],0,`${a(`art. 218, §3º`)}.`]]},

/* ================= XIII ================= */
{id:`nulidades`,group:`Atos, prazos e nulidades`,title:`Nulidades processuais`,
intro:`No processo, nenhuma invalidade age sozinha: ela precisa ser decretada pelo juiz. E o sistema prefere aproveitar o ato a anulá-lo.`,
blocks:[
{t:`svg`,h:`Os três planos do ato`,html:`<svg viewBox="0 0 700 220" role="img" aria-label="Escada de três degraus: existência, validade, eficácia">
<path class="draw" d="M40,190 H240 V130 H440 V70 H640" fill="none" stroke="var(--brass)" stroke-width="4"/>
<g class="pop" style="transition-delay:.4s"><text x="140" y="178" text-anchor="middle" font-size="18" fill="var(--ink)" font-weight="700">Existência</text><text x="140" y="210" text-anchor="middle" font-size="12" fill="var(--muted)">o ato existe?</text></g>
<g class="pop" style="transition-delay:.7s"><text x="340" y="118" text-anchor="middle" font-size="18" fill="var(--seal)" font-weight="700">Validade</text><text x="340" y="150" text-anchor="middle" font-size="12" fill="var(--muted)">é aqui que moram as nulidades</text></g>
<g class="pop" style="transition-delay:1s"><text x="540" y="58" text-anchor="middle" font-size="18" fill="var(--ink)" font-weight="700">Eficácia</text><text x="540" y="90" text-anchor="middle" font-size="12" fill="var(--muted)">produz efeitos?</text></g></svg>`},
{t:`table`,h:`Espécies de vício`,head:[`Espécie`,`O que é`,`Como se trata`],rows:[
[`Inexistência`,`Falta elemento essencial (sentença sem dispositivo, processo sem citação)`,`Pode ser reconhecida a qualquer tempo, até por ação própria (querela nullitatis)`],
[`Nulidade absoluta`,`Viola norma de ordem pública`,`De ofício e a qualquer tempo, ouvidas antes as partes (${a(`art. 10`)})`],
[`Nulidade relativa`,`Viola norma dispositiva, de interesse da parte`,`Depende de alegação, na primeira oportunidade`],
[`Mera irregularidade`,`Defeito sem relevância`,`Não invalida nada`]]},
{t:`flips`,h:`As regras do sistema`,items:[
[`Quem causou não alega`,`A parte que deu causa à nulidade não pode pedir sua decretação (${a(`art. 276`)}).`],
[`Finalidade atingida`,`Ato feito de outro modo é válido se alcançou a finalidade (${a(`art. 277`)}).`],
[`Primeira oportunidade`,`Alega-se na primeira vez em que couber falar nos autos, sob pena de preclusão, salvo nulidade de ofício ou impedimento legítimo (${a(`art. 278`)}).`],
[`Sem prejuízo, sem nulidade`,`O ato não se repete se não houver prejuízo à parte (${a(`art. 282, §1º`)}): <em>pas de nullité sans grief</em>.`],
[`Primazia do mérito`,`Se o juiz puder decidir o mérito a favor de quem aproveitaria a nulidade, não a pronuncia (${a(`art. 282, §2º`)}).`],
[`Contaminação`,`Anulado o ato, caem os subsequentes que dele dependam; partes independentes se salvam (${a(`art. 281`)}).`]]},
{t:`callout`,title:`MP não intimado`,html:`<p>Se o MP deveria intervir e não foi intimado, anulam-se os atos a partir de quando deveria ter sido chamado. Mas o juiz só decreta depois de ouvir o MP sobre a existência de prejuízo (${a(`art. 279, §§1º e 2º`)}).</p>`},
{t:`wizard`,h:`Devo anular este ato?`,tree:{q:`O ato tem um vício de forma?`,a:[[`Sim`,{q:`Mesmo assim, ele atingiu a finalidade?`,a:[[`Sim`,{end:`Ato válido`,txt:`Instrumentalidade das formas (${a(`arts. 188 e 277`)}).`}],[`Não`,{q:`Houve prejuízo para alguma parte?`,a:[[`Não`,{end:`Não se anula`,txt:`Sem prejuízo, não há nulidade (${a(`art. 282, §1º`)}).`}],[`Sim`,{q:`O juiz pode julgar o mérito a favor de quem seria beneficiado pela anulação?`,a:[[`Sim`,{end:`Julga o mérito`,txt:`Primazia do mérito (${a(`art. 282, §2º`)}).`}],[`Não`,{q:`Quem alega foi quem deu causa ao vício?`,a:[[`Sim`,{end:`Não pode alegar`,txt:`${a(`art. 276`)}.`}],[`Não`,{end:`Decreta a nulidade`,txt:`O juiz declara os atos atingidos e manda repeti-los ou retificá-los (${a(`art. 282`)}). Os atos dependentes também caem (${a(`art. 281`)}).`}]]}]]}]]}]]}],[`Não`,{end:`Nada a anular`,txt:`Sem vício, segue o processo.`}]]}}],
quiz:[
[`Advogado que causou o vício pode pedir a nulidade?`,[`Sim`,`Não`],1,`${a(`art. 276`)}.`],
[`Nulidade relativa não alegada na primeira oportunidade:`,[`preclui`,`pode ser alegada na apelação`,`é declarada de ofício`],0,`${a(`art. 278`)}.`],
[`Citação com vício, mas o réu contestou tudo. O que se faz?`,[`Anula-se`,`Considera-se suprida`],1,`Comparecimento supre a falta ou nulidade (${a(`art. 239, §1º`)}).`]]},

/* ================= XIV ================= */
{id:`valor`,group:`Custos e ciclo do processo`,title:`Valor da causa`,
intro:`Toda causa tem valor, mesmo sem conteúdo econômico imediato (art. 291). Ele define custas, honorários, competência dos Juizados e até o cabimento de alguns atos.`,
blocks:[
{t:`calc`,kind:`valorcausa`,h:`Simulador do art. 292`,hint:`Escolha o tipo de ação e mude os números.`},
{t:`table`,h:`O art. 292, inciso por inciso`,head:[`Inciso`,`Ação`,`Valor da causa`],rows:[
[`I`,`Cobrança`,`Principal corrigido + juros de mora vencidos + penalidades até a propositura`],
[`II`,`Existência, validade, cumprimento, modificação, resolução, resilição ou rescisão de ato jurídico`,`Valor do ato ou da parte controvertida`],
[`III`,`Alimentos`,`Soma de 12 prestações mensais`],
[`IV`,`Divisão, demarcação e reivindicação`,`Valor de avaliação da área ou do bem`],
[`V`,`Indenização, inclusive dano moral`,`Valor pretendido`],
[`VI`,`Pedidos cumulados`,`Soma de todos`],
[`VII`,`Pedidos alternativos`,`O de maior valor`],
[`VIII`,`Pedido subsidiário`,`O do pedido principal`]]},
{t:`flips`,h:`Ajustes e controle`,items:[
[`Vencidas e vincendas`,`Somam-se as duas (${a(`§1º`)}). Vincendas: uma prestação anual se a obrigação for por prazo indeterminado ou superior a 1 ano; se inferior, a soma das restantes (§2º).`],
[`Correção de ofício`,`O juiz corrige por arbitramento quando o valor não corresponder ao proveito econômico, e manda complementar custas (${a(`§3º`)}).`],
[`Impugnação do réu`,`Em preliminar de contestação, sob pena de preclusão (${a(`arts. 293 e 337, III`)}).`]]}],
quiz:[
[`Ação de alimentos de R$ 800 por mês. Valor da causa?`,[`R$ 800`,`R$ 9.600`,`R$ 4.800`],1,`12 × 800 (${a(`art. 292, III`)}).`],
[`Pedidos alternativos de R$ 20 mil e R$ 35 mil. Valor da causa?`,[`R$ 55 mil`,`R$ 35 mil`,`R$ 20 mil`],1,`O de maior valor (VII).`],
[`O réu discordou do valor só na apelação. Pode?`,[`Sim`,`Não, precluiu`],1,`Deve impugnar na contestação (${a(`art. 293`)}).`]]},

/* ================= XV ================= */
{id:`despesas`,group:`Custos e ciclo do processo`,title:`Despesas e honorários`,
intro:`Quem paga o processo? Durante o caminho, quem pede o ato adianta. No final, quem perdeu, ou quem deu causa, reembolsa.`,
blocks:[
{t:`tl`,h:`O ciclo do dinheiro no processo`,items:[
[`Adiantamento`,`Cada parte antecipa as despesas dos atos que requer; o autor adianta os determinados de ofício ou a pedido do MP fiscal (${a(`art. 82, §1º`)}). Exceção: gratuidade da justiça (${a(`arts. 98 a 102`)}).`],
[`Despesas`,`Custas (taxa paga ao Judiciário), indenização de viagem, remuneração de assistente técnico e diária de testemunha (${a(`art. 84`)}).`],
[`Sentença`,`Condena o vencido a ressarcir o que o vencedor antecipou (${a(`art. 82, §2º`)}) e a pagar honorários (${a(`art. 85`)}).`],
[`Recurso`,`O tribunal majora os honorários pelo trabalho adicional, até os tetos legais (${a(`art. 85, §11`)}).`]]},
{t:`callout`,kind:`brass`,title:`Caução do autor que mora fora (art. 83)`,html:`<p>Autor, brasileiro ou estrangeiro, que reside fora do país ou deixa de residir durante o processo, sem imóveis no Brasil, presta caução para custas e honorários. Dispensada por tratado (como o Protocolo de Las Leñas, Decreto 6.891/2009), na execução de título extrajudicial, no cumprimento de sentença e na reconvenção.</p>`},
{t:`keys`,h:`Honorários de sucumbência (art. 85)`,items:[[`10–20%`,`regra geral`,`sobre condenação, proveito econômico ou valor atualizado da causa`],[`5%`,`monitória cumprida`,`honorários reduzidos para quem paga no prazo (art. 701)`],[`alimentar`,`natureza`,`vedada a compensação na sucumbência parcial (§14)`]]},

{id:`audiencia334`,group:`Fase postulatória`,title:`Audiência de conciliação ou mediação`,
intro:`Desde 2015, a regra é tentar o acordo antes da defesa. Se a inicial está em ordem e não é caso de improcedência liminar, o juiz marca a audiência.`,
blocks:[
{t:`keys`,h:`Os números do art. 334`,items:[[`30`,`dias`,`antecedência mínima da audiência`],[`20`,`dias`,`antecedência mínima da citação do réu`],[`10`,`dias`,`antes da audiência, prazo para o réu dizer que não quer`],[`2%`,`multa`,`por ausência injustificada`],[`2`,`meses`,`limite para sessões adicionais`],[`20`,`minutos`,`intervalo mínimo entre audiências na pauta`]]},
{t:`gauge`,h:`A audiência vai acontecer?`,hint:`Ligue as manifestações. A audiência só deixa de ocorrer se ambos recusarem, ou se o direito não admitir acordo.`,mode:`all`,items:[[`O autor disse na inicial que não quer`,`${a(`art. 319, VII`)}`],[`O réu peticionou recusando com 10 dias de antecedência`,`${a(`art. 334, §5º`)}; em litisconsórcio, todos (§6º)`]],on:[`Audiência cancelada`,`Dupla negativa (${a(`art. 334, §4º, I`)}). O prazo da contestação corre do protocolo do pedido de cancelamento do réu (${a(`art. 335, II`)}).`],off:[`Audiência mantida`,`Se um quer, tem. Ela só não ocorre também se o direito não admitir autocomposição (${a(`§4º, II`)}).`]},
{t:`flips`,h:`Regras da sessão`,items:[[`Quem conduz`,`Conciliador (sem vínculo anterior entre as partes) ou mediador (com vínculo).`],[`Intimação do autor`,`Na pessoa do advogado (${a(`§3º`)}).`],[`Eletrônica`,`Pode ser por meio eletrônico (${a(`§7º`)}).`],[`Ausência`,`Injustificada é ato atentatório à dignidade da justiça: multa de até 2% da vantagem pretendida ou do valor da causa, para a União ou o Estado (${a(`§8º`)}).`],[`Representante`,`A parte pode mandar representante com procuração específica com poderes para negociar e transigir (${a(`§10`)}), acompanhada de advogado (§9º).`],[`Acordo`,`Reduzido a termo e homologado por sentença de mérito (${a(`§11`)}; ${a(`art. 487, III`)}).`]]}],
quiz:[[`O autor não quer audiência, mas o réu nada disse. Há audiência?`,[`Sim`,`Não`],0,`Só a dupla negativa a afasta.`],[`Multa por faltar sem justificativa:`,[`até 2%`,`até 10%`,`até 20%`],0,`${a(`art. 334, §8º`)}.`],[`Acordo na audiência gera sentença:`,[`terminativa`,`de mérito`],1,`${a(`art. 487, III, b`)}.`]]},
/* VI */
{id:`contestacao`,group:`Resposta do réu`,title:`Contestação`,
intro:`A contestação concentra toda a defesa. O que não for dito ali, em regra, não poderá ser dito depois.`,
blocks:[
{t:`chooser`,h:`Quando começam os 15 dias`,hint:`${a(`art. 335`)}. Dobro para Fazenda, MP e Defensoria.`,items:[
[`Audiência sem acordo`,`Da audiência`,`<p>Da audiência ou da última sessão, inclusive se uma parte faltou (${a(`inciso I`)}).</p>`],
[`Dupla negativa`,`Do pedido de cancelamento do réu`,`<p>Do protocolo do pedido de cancelamento apresentado pelo réu (${a(`inciso II`)}). Em litisconsórcio, de cada réu (§1º).</p>`],
[`Sem audiência`,`Do art. 231`,`<p>Quando o direito não admite autocomposição, conforme a forma de citação (${a(`inciso III`)}). Vários réus: a última das datas (${a(`art. 231, §1º`)}).</p>`],
[`Desistência quanto a um réu`,`Da intimação da homologação`,`<p>Se o autor desiste em relação a réu ainda não citado, os demais contam da intimação da decisão que homologar a desistência (${a(`§2º`)}).</p>`]]},
{t:`table`,h:`Preliminares (art. 337)`,hint:`Vêm antes do mérito. O juiz conhece de ofício todas, exceto convenção de arbitragem e incompetência relativa (§5º).`,head:[`Inciso`,`Preliminar`],rows:[[`I`,`Inexistência ou nulidade da citação`],[`II`,`Incompetência absoluta e relativa`],[`III`,`Incorreção do valor da causa`],[`IV`,`Inépcia da inicial`],[`V`,`Perempção`],[`VI`,`Litispendência`],[`VII`,`Coisa julgada`],[`VIII`,`Conexão`],[`IX`,`Incapacidade, defeito de representação ou falta de autorização`],[`X`,`Convenção de arbitragem`],[`XI`,`Ilegitimidade ou falta de interesse`],[`XII`,`Falta de caução ou prestação exigida como preliminar`],[`XIII`,`Indevida concessão de gratuidade`]]},
{t:`callout`,kind:`sage`,title:`Mnemônico`,html:`<p><b>6 IN</b> (inexistência de citação, incompetência, inépcia, incorreção do valor, incapacidade, indevida gratuidade) · <b>2 CON</b> (conexão, convenção de arbitragem) · <b>PERELICO</b> (perempção, litispendência, coisa julgada) · <b>falta de caução</b> · <b>CONLI</b> (condições: legitimidade e interesse).</p>`},
{t:`sorter`,h:`Litispendência, coisa julgada ou perempção?`,bins:[`Litispendência`,`Coisa julgada`,`Perempção`],cards:[
[`O autor repete ação idêntica que ainda está em curso.`,0,`Mesmas partes, causa de pedir e pedido, com a primeira pendente (${a(`art. 337, §3º`)}).`],
[`O autor repete ação idêntica já decidida com trânsito em julgado.`,1,`${a(`art. 337, §4º`)}.`],
[`O autor abandonou a mesma ação três vezes e propõe a quarta.`,2,`${a(`art. 486, §3º`)}: não pode propor de novo, mas pode alegar o direito em defesa.`]]},
{t:`flips`,h:`Ônus e limites da defesa`,items:[
[`Eventualidade`,`Toda a matéria de defesa, com razões de fato e de direito e provas (${a(`art. 336`)}).`],
[`Impugnação específica`,`Fato não impugnado presume-se verdadeiro, salvo se não admitir confissão, faltar instrumento essencial ou contradizer a defesa como um todo (${a(`art. 341`)}).`],
[`Negativa geral`,`Permitida só a defensor público, advogado dativo e curador especial (${a(`art. 341, parágrafo único`)}).`],
[`Depois da contestação`,`Só fato ou direito superveniente, matéria de ofício ou autorizada por lei a qualquer tempo (${a(`art. 342`)}).`],
[`Arbitragem não alegada`,`Implica aceitar a jurisdição estatal e renunciar ao juízo arbitral (${a(`art. 337, §6º`)}).`]]},
{t:`chooser`,h:`O réu diz que não é o réu`,hint:`${a(`arts. 338 e 339`)}.`,items:[
[`Substituir`,`Troca o réu`,`<p>O autor pode, em 15 dias, alterar a inicial e substituir o réu, reembolsando despesas e pagando honorários de 3% a 5% do valor da causa ao excluído (ou por equidade, se irrisório).</p>`],
[`Incluir`,`Litisconsórcio`,`<p>O autor pode manter o réu e incluir o indicado como litisconsorte passivo (${a(`art. 339, §2º`)}).</p>`],
[`Manter`,`Segue o processo`,`<p>Silenciar mantém o réu original; o risco fica com o autor.</p>`],
[`Dever do réu`,`Indicar o certo`,`<p>Sempre que souber, o réu indica o sujeito passivo correto, sob pena de arcar com despesas e indenizar o autor (${a(`art. 339`)}).</p>`]]},
{t:`callout`,kind:`brass`,title:`Contestação no foro do réu (art. 340)`,html:`<p>Alegando incompetência, o réu pode protocolar a contestação no foro do seu domicílio, que a comunica ao juízo da causa, de preferência por meio eletrônico. Se foi citado por precatória, junta aos autos da carta. Reconhecida a competência do foro do réu, este fica prevento. A audiência do art. 334 fica suspensa até a definição.</p>`}],
quiz:[[`O juiz pode reconhecer de ofício a convenção de arbitragem?`,[`Sim`,`Não`],1,`${a(`art. 337, §5º`)}.`],[`Curador especial pode contestar por negação geral?`,[`Sim`,`Não`],0,`${a(`art. 341, parágrafo único`)}.`],[`Autor troca o réu ilegítimo. Paga ao excluído honorários de:`,[`10% a 20%`,`3% a 5%`],1,`${a(`art. 338, parágrafo único`)}.`]]},
/* VII */
{id:`reconvencao`,group:`Resposta do réu`,title:`Reconvenção`,
intro:`Na reconvenção o réu deixa de só se defender e passa a pedir algo contra o autor, no mesmo processo.`,
blocks:[
{t:`svg`,h:`Os papéis se cruzam`,html:`<svg viewBox="0 0 700 220" role="img" aria-label="Autor e réu com setas cruzadas">
<g class="pop"><rect x="40" y="70" width="180" height="70" fill="var(--seal)"/><text x="130" y="100" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Autor</text><text x="130" y="122" text-anchor="middle" fill="#fff" font-size="12">na reconvenção: reconvindo</text></g>
<g class="pop" style="transition-delay:.2s"><rect x="480" y="70" width="180" height="70" fill="var(--ink)"/><text x="570" y="100" text-anchor="middle" fill="var(--paper)" font-size="16" font-weight="700">Réu</text><text x="570" y="122" text-anchor="middle" fill="var(--paper)" font-size="12">na reconvenção: reconvinte</text></g>
<path class="draw" d="M225,85 C320,30 380,30 475,85" fill="none" stroke="var(--seal)" stroke-width="3" marker-end="url(#ar)"/>

<text class="pop" style="transition-delay:.8s" x="350" y="30" text-anchor="middle" font-size="13" fill="var(--ink)">ação principal</text>
<text class="pop" style="transition-delay:1s" x="350" y="200" text-anchor="middle" font-size="13" fill="var(--ink)">reconvenção, na própria contestação</text></svg>`},
{t:`flips`,h:`As regras do art. 343`,items:[[`Onde`,`Na própria contestação. Pode-se reconvir mesmo sem contestar (§6º).`],[`Conexão`,`Com a ação principal ou com o fundamento da defesa.`],[`Resposta`,`O autor é intimado, na pessoa do advogado, para responder em 15 dias (§1º).`],[`Autonomia`,`A desistência ou extinção da ação principal não impede a reconvenção (§2º).`],[`Terceiros`,`Pode ser proposta contra o autor e terceiro (§3º), ou pelo réu com terceiro (§4º).`],[`Substituto processual`,`Se o autor age como substituto, o reconvinte deve afirmar direito contra o substituído (§5º).`]]},
{t:`callout`,kind:`brass`,title:`Quando não cabe`,html:`<p>Nas ações dúplices, como as possessórias (${a(`art. 556`)}), o réu já pode pedir na contestação; e nos Juizados, a reconvenção é vedada, admitindo-se só o pedido contraposto (${a(`Lei 9.099/95, art. 31`)}). A reconvenção tem valor da causa e custas próprios.</p>`}],
quiz:[[`O autor desistiu da ação. A reconvenção:`,[`é extinta junto`,`prossegue`],1,`${a(`art. 343, §2º`)}.`],[`O réu pode reconvir sem contestar?`,[`Sim`,`Não`],0,`${a(`art. 343, §6º`)}.`]]},
/* VIII */
{id:`revelia`,group:`Resposta do réu`,title:`Revelia`,
intro:`Revelia é a ausência de contestação. Ela pode fazer presumir verdadeiros os fatos do autor, mas não garante que ele vença.`,
blocks:[
{t:`gauge`,h:`Simulador de revelia`,hint:`O réu não contestou. Ligue as circunstâncias e veja se a presunção se aplica.`,mode:`any`,items:[[`Há vários réus e algum contestou`,`${a(`art. 345, I`)}`],[`O litígio é sobre direito indisponível`,`${a(`II`)}`],[`Falta o instrumento que a lei considera indispensável à prova do ato`,`${a(`III`)}; ex.: certidão de casamento no divórcio`],[`As alegações são inverossímeis ou contrariam a prova dos autos`,`${a(`IV`)}`]],on:[`Presunção afastada`,`Uma exceção do art. 345 se aplica. O autor ainda tem de provar o que alegou, e o juiz manda especificar provas (${a(`art. 348`)}).`],off:[`Fatos presumidos verdadeiros`,`Efeito material da revelia (${a(`art. 344`)}). Se ninguém pedir provas, cabe julgamento antecipado (${a(`art. 355, II`)}).`]},
{t:`vs`,h:`Os dois efeitos`,l:{t:`Material`,i:[`Presunção relativa de veracidade dos fatos`,`Não alcança o direito: o juiz ainda pode julgar improcedente`,`Afastado pelas exceções do art. 345`]},r:{t:`Processual`,i:[`Prazos contra o revel sem advogado correm da publicação no órgão oficial (${a(`art. 346`)})`,`O revel pode intervir a qualquer tempo, recebendo o processo no estado em que está`,`Pode produzir provas contrapostas se ingressar a tempo (${a(`art. 349`)})`]}},
{t:`callout`,title:`Revelia própria e imprópria`,html:`<p>A doutrina chama de imprópria a revelia que decorre de vício não sanado depois da contestação, como não regularizar a representação (${a(`art. 76, §1º, II`)}) ou não constituir novo advogado após a morte do anterior (${a(`art. 313, §3º`)}).</p>`}],
quiz:[[`Revelia leva sempre à procedência?`,[`Sim`,`Não`],1,`A presunção é relativa e não alcança o direito.`],[`Dois réus, um contesta fato comum. Para o revel:`,[`o fato se presume verdadeiro`,`não há presunção quanto a ele`],1,`${a(`art. 345, I`)}.`],[`O revel pode entrar no processo depois?`,[`Sim, no estado em que estiver`,`Não`],0,`${a(`art. 346, parágrafo único`)}.`]]}
]};

/* IX */
{id:`preliminares`,group:`Organização do processo`,title:`Providências preliminares`,
intro:`Terminada a resposta do réu, o juiz arruma a casa antes de decidir o rumo. Nem sempre há providências; quando há, elas abrem espaço para o autor falar e para corrigir vícios.`,
blocks:[
{t:`chooser`,h:`O que o juiz pode determinar`,items:[
[`Revelia sem efeito`,`Autor especifica provas`,`<p>Se a revelia não produziu o efeito material (${a(`art. 345`)}), o autor é intimado a especificar as provas que pretende produzir (${a(`art. 348`)}).</p>`],
[`Defesa indireta`,`Réplica em 15 dias`,`<p>Se o réu alegou fato impeditivo, modificativo ou extintivo do direito do autor, este responde em 15 dias, podendo produzir prova (${a(`art. 350`)}).</p>`],
[`Preliminares`,`Réplica em 15 dias`,`<p>Se o réu alegou matérias do art. 337, o autor responde em 15 dias, com prova (${a(`art. 351`)}).</p>`],
[`Vício sanável`,`Correção em até 30 dias`,`<p>O juiz manda corrigir em prazo não superior a 30 dias (${a(`art. 352`)}).</p>`]]},
{t:`vs`,h:`Preliminares dilatórias × peremptórias`,l:{t:`Dilatórias`,i:[`Só atrasam o processo`,`Incompetência, nulidade de citação, incorreção do valor, conexão, incapacidade, gratuidade indevida`]},r:{t:`Peremptórias`,i:[`Encerram o processo sem mérito`,`Perempção, litispendência, coisa julgada, convenção de arbitragem, inépcia não sanada, ilegitimidade`]}},
{t:`vs`,h:`Defesa direta × indireta`,l:{t:`Direta`,i:[`Nega o fato ou suas consequências jurídicas`,`"Não houve batida"`,`Não gera réplica obrigatória`]},r:{t:`Indireta`,i:[`Admite o fato, mas opõe outro que impede, modifica ou extingue o direito`,`"Houve a dívida, mas já paguei"`,`Gera réplica (${a(`art. 350`)})`]}}],
quiz:[[`O réu alegou pagamento. O autor:`,[`nada faz`,`é ouvido em 15 dias`],1,`Defesa indireta gera réplica (${a(`art. 350`)}).`],[`Prazo máximo para corrigir vício sanável:`,[`15 dias`,`30 dias`],1,`${a(`art. 352`)}.`]]},
/* X */
{id:`estado`,group:`Organização do processo`,title:`Julgamento conforme o estado do processo`,
intro:`Depois das providências preliminares, o juiz escolhe entre quatro caminhos. Só um deles leva à fase de provas.`,
blocks:[
{t:`wizard`,h:`Que caminho o juiz toma?`,tree:{q:`Há causa de extinção do art. 485, ou prescrição, decadência ou homologação do art. 487?`,a:[[`Sim`,{end:`Extinção do processo`,txt:`${a(`art. 354`)}. Se atingir só parte do processo, é decisão interlocutória, impugnável por agravo de instrumento (parágrafo único).`}],[`Não`,{q:`Ainda é preciso produzir provas sobre todo o objeto?`,a:[[`Não`,{end:`Julgamento antecipado do mérito`,txt:`${a(`art. 355`)}: não há necessidade de outras provas, ou o réu é revel com efeito material e não pediu provas.`}],[`Só sobre parte`,{end:`Julgamento antecipado parcial`,txt:`${a(`art. 356`)}: um pedido ou parcela incontroverso ou pronto para julgamento. Decisão interlocutória de mérito, agravável (${a(`§5º`)}), executável desde logo, sem caução, e que faz coisa julgada.`}],[`Sim`,{end:`Saneamento e organização`,txt:`${a(`art. 357`)}: o juiz organiza a fase de provas.`}]]}]]}},
{t:`sorter`,h:`Classifique`,bins:[`Extinção`,`Antecipado`,`Antecipado parcial`,`Saneamento`],cards:[
[`As partes fizeram acordo e pedem homologação.`,0,`${a(`art. 487, III, b`)} via ${a(`art. 354`)}.`],
[`A causa é só de direito: discute-se a validade de uma cláusula.`,1,`${a(`art. 355, I`)}.`],
[`O réu reconheceu o dano material; o dano moral depende de prova.`,2,`Parcela incontroversa (${a(`art. 356, I`)}).`],
[`Há versões opostas sobre quem avançou o sinal, e testemunhas a ouvir.`,3,`${a(`art. 357`)}.`]]},
{t:`callout`,kind:`brass`,title:`Decisão parcial de mérito`,html:`<p>É interlocutória pela forma, mas sentença pelo conteúdo: resolve definitivamente parte do mérito. Por isso cabe agravo de instrumento (${a(`art. 1.015, II`)}), pode ser liquidada e cumprida desde logo (${a(`art. 356, §§2º a 4º`)}) e transita em julgado.</p>`}],
quiz:[[`Contra a decisão de julgamento antecipado parcial cabe:`,[`apelação`,`agravo de instrumento`],1,`${a(`art. 356, §5º`)}.`],[`Causa só de direito permite:`,[`julgamento antecipado`,`saneamento obrigatório`],0,`${a(`art. 355, I`)}.`]]},
/* XI */
{id:`saneamento`,group:`Organização do processo`,title:`Saneamento e ônus da prova`,
intro:`A decisão de saneamento é o planejamento da instrução. Popularmente chamada de "despacho saneador", é uma decisão: resolve questões e define o rumo.`,
blocks:[
{t:`steps`,h:`O conteúdo do art. 357`,items:[
[`Resolver questões processuais pendentes`,`Depura o processo de vícios ou declara que ele está em ordem.`,`inciso I`],
[`Delimitar as questões de fato`,`Separa o controvertido do incontroverso e define os meios de prova admitidos: os temas da prova.`,`inciso II`],
[`Distribuir o ônus da prova`,`Diz a quem cabe provar o quê, inclusive se houver inversão.`,`inciso III`],
[`Delimitar as questões de direito`,`As teses jurídicas relevantes para a decisão de mérito.`,`inciso IV`],
[`Designar audiência`,`Se houver prova oral.`,`inciso V`]]},
{t:`vs`,h:`Questão de fato × questão de direito`,l:{t:`De fato`,i:[`O que aconteceu?`,`Depende de prova`,`Ex.: quem avançou o sinal; se houve pagamento`,`Não se reexamina em recurso especial (${a(`Súmula 7 do STJ`)})`]},r:{t:`De direito`,i:[`Qual norma se aplica e como?`,`Não depende de prova`,`Ex.: responsabilidade objetiva ou subjetiva; prazo prescricional`,`Pode ser decidida sem instrução`]}},
{t:`flips`,h:`Depois da decisão`,items:[[`Ajustes`,`As partes têm 5 dias para pedir esclarecimentos ou ajustes; depois, a decisão se estabiliza (${a(`§1º`)}).`],[`Saneamento consensual`,`As partes podem apresentar delimitação conjunta, que, homologada, vincula partes e juiz (${a(`§2º`)}).`],[`Saneamento compartilhado`,`Em causa complexa, o juiz designa audiência para sanear em cooperação com as partes (${a(`§3º`)}).`],[`Testemunhas`,`Rol em até 15 dias; no máximo 10, sendo 3 por fato (${a(`§§4º e 6º`)}).`],[`Perícia`,`O juiz nomeia o perito e, se possível, fixa calendário (${a(`§8º`)}).`],[`Efeitos`,`Abre a instrução, estabiliza a demanda e torna preclusas as questões resolvidas.`]]},
{t:`chooser`,h:`Ônus da prova (art. 373)`,items:[
[`Regra estática`,`Cada um prova o que alega`,`<p>Ao autor, o fato constitutivo do seu direito; ao réu, o fato impeditivo, modificativo ou extintivo.</p>`],
[`Distribuição dinâmica`,`O juiz redistribui`,`<p>Diante de impossibilidade ou excessiva dificuldade de uma parte, ou maior facilidade da outra, por decisão fundamentada e dando oportunidade de se desincumbir (${a(`§1º`)}). Não pode gerar prova impossível (§2º). Cabe agravo de instrumento (${a(`art. 1.015, XI`)}).</p>`],
[`Convencional`,`As partes combinam`,`<p>Permitida, salvo direito indisponível ou quando tornar excessivamente difícil o exercício do direito (${a(`§3º`)}).</p>`],
[`Consumidor`,`Inversão do CDC`,`<p>Quando verossímil a alegação ou hipossuficiente o consumidor (${a(`CDC, art. 6º, VIII`)}).</p>`]]}],
quiz:[[`Prazo para pedir ajustes no saneamento:`,[`5 dias`,`15 dias`],0,`${a(`art. 357, §1º`)}.`],[`Máximo de testemunhas por fato:`,[`2`,`3`,`10`],1,`${a(`art. 357, §6º`)}.`],[`Decisão que redistribui o ônus da prova é agravável?`,[`Sim`,`Não`],0,`${a(`art. 1.015, XI`)}.`]]},
/* XII */
{id:`aij`,group:`Organização do processo`,title:`Audiência de instrução e julgamento`,
intro:`Designada no saneamento, a audiência reúne a prova oral, os debates e, se possível, a sentença.`,
blocks:[
{t:`tl`,h:`A sequência da audiência`,items:[
[`Pregão`,`Abertura e chamada das partes e advogados (${a(`art. 358`)}).`],
[`Conciliação`,`O juiz tenta o acordo antes de tudo (${a(`art. 359`)}).`],
[`Perito e assistentes técnicos`,`Respondem aos quesitos de esclarecimento (${a(`art. 361, I`)}).`],
[`Depoimentos pessoais`,`Primeiro o autor, depois o réu (${a(`II`)}).`],
[`Testemunhas`,`Primeiro as do autor, depois as do réu (${a(`III`)}). A ordem é preferencial.`],
[`Debates orais`,`20 minutos para cada parte e para o MP, prorrogáveis por 10 (${a(`art. 364`)}). Causa complexa: memoriais em 15 dias sucessivos.`],
[`Sentença`,`Na audiência ou em 30 dias (${a(`art. 366`)}).`]]},

{t:`flips`,h:`Regras gerais (arts. 294 a 302)`,items:[[`Precária`,`Conserva eficácia durante o processo, mas pode ser revogada ou modificada a qualquer tempo (${a(`art. 296`)}).`],[`Caução`,`O juiz pode exigir caução real ou fidejussória, dispensada para quem não pode oferecê-la (${a(`art. 300, §1º`)}).`],[`Liminar ou após justificação`,`Pode ser concedida sem ouvir o réu ou após audiência de justificação (${a(`§2º`)}).`],[`Irreversibilidade`,`A antecipada não se concede se houver perigo de irreversibilidade dos efeitos (${a(`§3º`)}). A jurisprudência relativiza quando o dano de negar também é irreversível.`],[`Responsabilidade`,`O requerente responde objetivamente pelos prejuízos se a sentença lhe for desfavorável ou a medida perder eficácia (${a(`art. 302`)}).`],[`Recurso`,`Decisão sobre tutela: agravo de instrumento (${a(`art. 1.015, I`)}). Na sentença: apelação sem efeito suspensivo nesse capítulo (${a(`art. 1.012, §1º, V`)}).`]]},
{t:`wizard`,h:`Que tutela pedir?`,tree:{q:`Há perigo de dano ou risco ao resultado útil do processo?`,a:[[`Sim`,{q:`Você quer assegurar o direito ou já satisfazê-lo?`,a:[[`Assegurar`,{end:`Cautelar`,txt:`Arresto, sequestro, arrolamento de bens, protesto contra alienação ou outra medida idônea (${a(`art. 301`)}). Ex.: bloquear valores para evitar dilapidação.`}],[`Satisfazer`,{q:`A urgência é contemporânea à propositura, sem tempo para a inicial completa?`,a:[[`Sim`,{end:`Antecipada antecedente`,txt:`A inicial pode se limitar ao pedido de tutela (${a(`art. 303`)}). Pode estabilizar se o réu não recorrer (${a(`art. 304`)}).`}],[`Não`,{end:`Antecipada incidental`,txt:`Pedida na inicial completa ou no curso do processo, sem custas (${a(`arts. 295 e 300`)}).`}]]}]]}],[`Não`,{q:`Alguma hipótese do art. 311 está presente?`,a:[[`Sim`,{end:`Evidência`,txt:`Dispensa perigo de dano. Liminar só nas hipóteses II e III.`}],[`Não`,{end:`Sem tutela provisória`,txt:`O pedido aguarda a sentença.`}]]}]]}},
{t:`steps`,h:`Antecipada antecedente (arts. 303 e 304)`,items:[
[`Petição sumarizada`,`Indica o pedido de tutela e o pedido final, expõe a lide, o direito e o perigo, informa o valor da causa considerando o pedido final e declara que usa o benefício do art. 303.`,`art. 303, caput e §§4º e 5º`],
[`Se concedida`,`O autor adita a inicial em 15 dias (ou mais, se o juiz fixar), nos mesmos autos e sem novas custas. Sem aditamento, extinção sem mérito.`,`art. 303, §§1º a 3º`],
[`Se negada`,`Emenda em até 5 dias, sob pena de extinção.`,`art. 303, §6º`],
[`Estabilização`,`Se o réu não recorrer da decisão concessiva, o processo é extinto e a tutela continua produzindo efeitos.`,`art. 304`],
[`Revisão`,`Qualquer parte pode propor ação para rever, reformar ou invalidar a tutela em 2 anos da ciência da extinção. Não há coisa julgada.`,`art. 304, §§2º, 5º e 6º`]]},
{t:`steps`,h:`Cautelar antecedente (arts. 305 a 310)`,items:[
[`Petição`,`Indica a lide, seu fundamento, o direito e o perigo. Se o juiz achar que é antecipada, segue o art. 303 (fungibilidade).`,`art. 305`],
[`Defesa`,`Réu citado para contestar em 5 dias; sem contestação, presumem-se aceitos os fatos e o juiz decide em 5 dias.`,`arts. 306 e 307`],
[`Efetivação e pedido principal`,`Efetivada a medida, o pedido principal deve ser apresentado em 30 dias, nos mesmos autos, sem novas custas.`,`art. 308`],
[`Cessa a eficácia`,`Se o pedido principal não vier em 30 dias, se a medida não for efetivada em 30 dias ou se o pedido principal for improcedente ou extinto.`,`art. 309`],
[`Indeferida`,`Não impede o pedido principal, salvo se o motivo for prescrição ou decadência.`,`art. 310`]]},

{t:`callout`,kind:`brass`,title:`Por que só II e III admitem liminar`,html:`<p>Em I e IV, a evidência depende do comportamento ou da defesa do réu; sem ouvi-lo, não há como saber se houve abuso ou se a defesa é fraca. Em II e III, o documento e o precedente bastam.</p>`},

{id:`sentenca`,group:`Tutelas e decisão`,title:`Sentença`,
intro:`A sentença encerra a fase de conhecimento. Pode resolver o mérito ou apenas reconhecer que não há como resolvê-lo.`,
blocks:[
{t:`vs`,h:`Terminativa × definitiva`,l:{t:`Sem mérito (art. 485)`,i:[`Indeferimento da inicial`,`Paralisação por mais de 1 ano por negligência das partes`,`Abandono pelo autor por mais de 30 dias`,`Falta de pressupostos processuais`,`Perempção, litispendência ou coisa julgada`,`Ilegitimidade ou falta de interesse`,`Convenção de arbitragem`,`Desistência homologada`,`Morte da parte em ação intransmissível`]},r:{t:`Com mérito (art. 487)`,i:[`Acolher ou rejeitar o pedido`,`Prescrição ou decadência`,`Homologar reconhecimento do pedido`,`Homologar transação`,`Homologar renúncia à pretensão`]}},
{t:`flips`,h:`Detalhes das terminativas`,items:[[`Abandono`,`Antes de extinguir, a parte é intimada pessoalmente para suprir em 5 dias (${a(`art. 485, §1º`)}). Após a contestação, depende de requerimento do réu (${a(`§6º`)}; ${a(`Súmula 240 do STJ`)}).`],[`De ofício`,`Pressupostos, perempção, litispendência, coisa julgada, condições da ação e intransmissibilidade (${a(`§3º`)}).`],[`Retratação`,`Na apelação, o juiz pode se retratar em 5 dias (${a(`§7º`)}).`],[`Repropositura`,`Possível, salvo perempção, litispendência e coisa julgada. Nos casos de inépcia, pressupostos, condições e arbitragem, corrigindo o vício e pagando custas e honorários (${a(`art. 486`)}).`],[`Primazia do mérito`,`Se puder decidir o mérito a favor de quem aproveitaria a extinção, o juiz julga o mérito (${a(`art. 488`)}).`]]},
{t:`steps`,h:`Elementos da sentença (art. 489)`,items:[[`Relatório`,`Nomes das partes, resumo do pedido e da contestação, registro das principais ocorrências.`,`inciso I`],[`Fundamentação`,`Análise das questões de fato e de direito, sem as falhas do §1º.`,`inciso II`],[`Dispositivo`,`Resolve as questões principais. É a parte que transita em julgado.`,`inciso III`]]},
{t:`sorter`,h:`Que vício tem a sentença?`,bins:[`Ultra petita`,`Extra petita`,`Citra petita`],cards:[
[`Pediu R$ 10 mil de dano moral; o juiz deu R$ 15 mil.`,0,`Foi além do pedido: reduz-se ao limite.`],
[`Pediu rescisão do contrato; o juiz declarou nulidade de outro contrato.`,1,`Decidiu fora do pedido: nula nessa parte.`],
[`Pediu dano material e moral; a sentença ignorou o moral.`,2,`Omissão: cabem embargos de declaração.`]]},
{t:`chooser`,h:`Outras regras`,items:[[`Congruência`,`Limite do pedido`,`<p>É vedado decidir de natureza diversa, condenar em quantidade superior ou objeto diverso (${a(`arts. 141 e 492`)}). A decisão deve ser certa, ainda que a relação seja condicional.</p>`],[`Quantia certa`,`Tudo explicitado`,`<p>Fixa a extensão da obrigação, o índice de correção, a taxa e o termo inicial dos juros e a capitalização (${a(`art. 491`)}).</p>`],[`Fato novo`,`Considerado`,`<p>Fato constitutivo, modificativo ou extintivo superveniente é considerado de ofício ou a pedido, ouvidas as partes (${a(`art. 493`)}).</p>`],[`Depois de publicada`,`Só erro material ou embargos`,`<p>${a(`art. 494`)}.</p>`],[`Hipoteca judiciária`,`Garantia imediata`,`<p>A sentença condenatória vale como título para hipoteca, mesmo sem trânsito e sem urgência. O credor informa o registro ao juízo em 15 dias e responde objetivamente se a sentença cair (${a(`art. 495`)}).</p>`],[`Remessa necessária`,`Sentença contra a Fazenda`,`<p>Sobe ao tribunal sem recurso, salvo abaixo de 1.000 salários mínimos (União), 500 (Estados e capitais) ou 100 (demais municípios), ou se fundada em precedente vinculante (${a(`art. 496`)}).</p>`]]}],

{id:`coisajulgada`,group:`Tutelas e decisão`,title:`Coisa julgada`,
intro:`Coisa julgada é a autoridade que torna a decisão de mérito imutável e indiscutível quando não cabe mais recurso (art. 502). É a lei entre as partes.`,
blocks:[
{t:`vs`,h:`Formal × material`,l:{t:`Formal`,i:[`Imutabilidade dentro do processo`,`Atinge também sentenças terminativas`,`Permite repropor a ação`]},r:{t:`Material`,i:[`Imutabilidade fora do processo`,`Só decisões de mérito`,`Impede nova ação idêntica`]}},
{t:`flips`,h:`Limites`,items:[[`Objetivos`,`Faz coisa julgada o dispositivo, nos limites da questão principal (${a(`art. 503`)}).`],[`Prejudicial`,`A questão prejudicial decidida expressa e incidentemente também transita se dela depender o mérito, houver contraditório efetivo (não vale na revelia) e o juízo for competente para ela como questão principal (${a(`art. 503, §1º`)}).`],[`O que não transita`,`Os motivos, ainda que importantes, e a verdade dos fatos (${a(`art. 504`)}).`],[`Subjetivos`,`Vale para as partes e não prejudica terceiros (${a(`art. 506`)}).`],[`Trato continuado`,`Alterado o estado de fato ou de direito, pode-se rever, como na revisão de alimentos (${a(`art. 505, I`)}).`],[`Eficácia preclusiva`,`Consideram-se deduzidas e repelidas todas as alegações que a parte poderia ter feito (${a(`art. 508`)}).`]]},
{t:`keys`,h:`Para desfazer a coisa julgada`,items:[[`2`,`anos`,`prazo da ação rescisória, do trânsito da última decisão (${a(`art. 975`)})`],[`966`,`artigo`,`hipóteses taxativas da rescisória`]]}],

/* XVI */
{id:`arbitragem`,group:`Tutelas e decisão`,title:`Arbitragem`,
intro:`A arbitragem é uma jurisdição privada: as partes escolhem quem vai julgar, e a decisão vale como sentença.`,
blocks:[
{t:`flips`,h:`O essencial da Lei 9.307/96`,items:[[`Objeto`,`Só direitos patrimoniais disponíveis (${a(`art. 1º`)}). A Administração Pública também pode usar (§1º).`],[`Convenção`,`Cláusula compromissória (antes do conflito, no contrato) ou compromisso arbitral (depois do conflito) (${a(`art. 3º`)}).`],[`Árbitro`,`Pessoa capaz da confiança das partes, não precisa ser jurista. É juiz de fato e de direito (${a(`art. 18`)}).`],[`Sentença`,`Não se sujeita a recurso nem homologação, e tem os mesmos efeitos da judicial; se condenatória, é título executivo judicial (${a(`art. 31`)}; ${a(`CPC, art. 515, VII`)}).`],[`Urgência`,`Antes de instituída a arbitragem, a parte pede tutela ao Judiciário; depois, os árbitros mantêm ou revogam (${a(`arts. 22-A e 22-B`)}).`],[`Anulação`,`Ação em 90 dias (${a(`art. 33`)}).`]]},
{t:`callout`,kind:`sage`,title:`No processo civil`,html:`<p>A convenção de arbitragem é preliminar da contestação que o juiz não conhece de ofício (${a(`art. 337, X e §5º`)}). Se o réu não alegar, entende-se que renunciou ao juízo arbitral (§6º). Acolhida, o processo é extinto sem mérito (${a(`art. 485, VII`)}). A cooperação entre árbitro e juiz se faz por carta arbitral (${a(`art. 237, IV`)}). O STF reconheceu a constitucionalidade da lei (SE 5.206, 2001).</p>`},

{t:`callout`,kind:`brass`,title:`O comum se acha por exclusão`,html:`<p>Não há lista do que segue o procedimento comum. A lista fechada é a dos especiais: se a ação não está nela, o rito é comum. E o comum se aplica subsidiariamente aos especiais (${a(`CPC, art. 318, parágrafo único`)}).</p>`},

{id:`consignacao`,group:`Procedimentos especiais`,title:`Consignação em pagamento`,
intro:`Pagar é dever, mas também é direito do devedor. Se o credor cria obstáculo, o devedor deposita e se libera (CC, art. 334).`,
blocks:[
{t:`flips`,h:`Quando cabe (CC, art. 335)`,items:[[`Recusa`,`Credor não pode ou, sem justa causa, recusa receber ou dar quitação.`],[`Omissão`,`Credor não vai nem manda receber no lugar, tempo e condição devidos.`],[`Credor inacessível`,`Incapaz, desconhecido, ausente, em lugar incerto ou de acesso perigoso.`],[`Dúvida`,`Não se sabe a quem pagar.`],[`Litígio`,`Há disputa sobre o objeto do pagamento.`]]},
{t:`keys`,h:`Dados gerais`,items:[[`539`,`a 549 do CPC`,`base processual`],[`devedor`,`ou terceiro`,`legitimidade ativa`],[`lugar`,`do pagamento`,`foro (${a(`art. 540`)}); imóvel: situação`]]},
{t:`wizard`,h:`A via extrajudicial (art. 539, §§1º a 4º)`,tree:{q:`A obrigação é em dinheiro?`,a:[[`Sim`,{q:`O devedor depositou em banco oficial do lugar do pagamento e cientificou o credor por carta com AR. Em 10 dias, o credor...`,a:[[`Aceitou`,{end:`Obrigação extinta`,txt:`O devedor fica liberado.`}],[`Ficou em silêncio`,{end:`Obrigação extinta`,txt:`O silêncio equivale à aceitação (${a(`§2º`)}).`}],[`Recusou por escrito ao banco`,{end:`Ação em 1 mês`,txt:`O devedor propõe a consignação judicial em 1 mês, com a prova do depósito e da recusa (${a(`§3º`)}). Se não propuser, o depósito perde efeito e pode ser levantado (§4º).`}]]}],[`Não`,{end:`Só judicial`,txt:`A via bancária é exclusiva para dinheiro.`}]]}},
{t:`table`,h:`O que o réu pode alegar (art. 544)`,hint:`A defesa é limitada.`,head:[`Inciso`,`Alegação`],rows:[[`I`,`Não houve recusa ou mora em receber`],[`II`,`A recusa foi justa`],[`III`,`O depósito não foi feito no prazo ou no lugar do pagamento`],[`IV`,`O depósito não é integral, indicando o montante devido`]]},
{t:`chooser`,h:`Situações do processo`,items:[[`Depósito`,`5 dias`,`<p>Deferido o pedido, o autor deposita em 5 dias, sob pena de extinção sem mérito (${a(`art. 542`)}). Prestações sucessivas podem ser depositadas no mesmo processo até 5 dias após cada vencimento (${a(`art. 541`)}).</p>`],[`Insuficiência`,`Complementar em 10 dias`,`<p>O autor pode completar em 10 dias. O réu levanta desde logo o incontroverso e a discussão segue só quanto à diferença (${a(`art. 545`)}).</p>`],[`Caráter dúplice`,`Autor pode sair condenado`,`<p>A sentença que reconhece a insuficiência fixa o valor devido e vale como título para o réu, sem reconvenção (${a(`art. 545, §2º`)}).</p>`],[`Procedência`,`Declara extinta a obrigação`,`<p>Com condenação do réu em custas e honorários (${a(`art. 546`)}). Faz coisa julgada material.</p>`],[`Dúvida sobre o credor`,`Os pretendentes disputam`,`<p>Citam-se os possíveis titulares. Ninguém aparece: arrecadação como bens de ausentes. Um aparece: o juiz decide. Vários: declara o depósito feito e extinta a obrigação, e os pretendentes disputam entre si (${a(`art. 548`)}).</p>`]]},
{t:`juris`,h:`Como a consignatória falha na prática`,items:[
{court:`TJSC`,year:`2026`,id:`ApCiv 5021111-82.2023.8.24.0008`,tese:`Depósito inferior ao devido não quita: improcedência.`,html:`Locatária consignava o aluguel pelo índice antigo, mas o contrato permitia reajuste livre a preço de mercado após a prorrogação. A majoração de R$ 2.500 para R$ 3.000 não era abusiva.`},
{court:`TJSC`,year:`2026`,id:`ApCiv 5001516-76.2025.8.24.0930`,tese:`Consignatória não serve para descobrir quanto se deve.`,html:`O autor não provou a recusa e o débito dependia de recálculo: a ação foi usada como sucedâneo para discutir o valor.`}]}],
quiz:[[`Credor fica em silêncio após o depósito bancário. Efeito?`,[`Obrigação persiste`,`Obrigação extinta`],1,`${a(`art. 539, §2º`)}.`],[`Prazo para propor a ação após a recusa bancária:`,[`10 dias`,`1 mês`,`5 dias`],1,`${a(`art. 539, §3º`)}.`],[`Depósito insuficiente: o autor pode complementar em:`,[`5 dias`,`10 dias`],1,`${a(`art. 545`)}.`]]},

{id:`possessorias`,group:`Procedimentos especiais`,title:`Ações possessórias`,
intro:`A posse é protegida como situação de fato, independentemente da propriedade. Quem é possuidor, mesmo sem ser dono, pode defendê-la (arts. 554 a 568; CC, arts. 1.196 a 1.224).`,
blocks:[
{t:`chooser`,h:`As três ações`,items:[[`Reintegração`,`Esbulho: perda total da posse`,`<p>Pede a restituição da posse (${a(`art. 560`)}). Ex.: o vizinho ergue uma cerca englobando parte do terreno.</p>`],[`Manutenção`,`Turbação: perda parcial de poderes`,`<p>Pede que cesse a turbação e o possuidor seja mantido (${a(`art. 560`)}). Ex.: o vizinho passa canos de água pelo terreno.</p>`],[`Interdito proibitório`,`Ameaça fundada`,`<p>Mandado proibitório com pena pecuniária se o réu transgredir (${a(`arts. 567 e 568`)}). Tutela inibitória; cabe ao possuidor direto ou indireto. Ex.: ameaça de murar uma servidão.</p>`]]},
{t:`sorter`,h:`Que ação cabe?`,bins:[`Reintegração`,`Manutenção`,`Interdito`],cards:[[`Invasores ocuparam todo o galpão.`,0,`Perda total.`],[`O vizinho passa diariamente pela sua área para cortar caminho.`,1,`Moléstia parcial.`],[`O vizinho avisou que vai fechar a passagem na semana que vem.`,2,`Ameaça.`]]},
{t:`flips`,h:`Características do rito`,items:[[`Fungibilidade`,`Pediu uma, era outra? O juiz concede a proteção correspondente ao que foi provado (${a(`art. 554`)}).`],[`Cumulação`,`Perdas e danos, frutos, pena para nova moléstia e desfazimento de construção ou plantação (${a(`art. 555`)}).`],[`Dúplice`,`O réu pede proteção possessória e indenização na contestação, sem reconvenção (${a(`art. 556`)}).`],[`Posse x domínio`,`Na pendência da possessória, não se discute propriedade entre as mesmas partes, salvo contra terceiro (${a(`art. 557`)}). Alegar propriedade não impede a proteção.`],[`Caução`,`Se o autor beneficiado pela liminar não tiver idoneidade financeira, o réu pede caução em 5 dias, sob pena de depósito da coisa, salvo hipossuficiente (${a(`art. 559`)}).`],[`Sentença`,`Cumpre-se por mandado, sem execução. Apelação com efeito suspensivo, salvo na parte que confirma a liminar (${a(`art. 1.012, §1º, V`)}).`]]},
{t:`table`,h:`Competência`,head:[`Situação`,`Foro ou justiça`],rows:[[`Bem imóvel`,`Situação do imóvel, competência absoluta (${a(`art. 47, §2º`)})`],[`Bem móvel`,`Domicílio do réu (${a(`art. 46`)})`],[`União, autarquias e empresas públicas federais`,`Justiça Federal (${a(`CF, art. 109, I`)})`],[`Greve de trabalhadores da iniciativa privada`,`Justiça do Trabalho (${a(`Súmula Vinculante 23`)})`]]},
{t:`steps`,h:`Litígio coletivo pela posse`,items:[[`Citação`,`Pessoal dos ocupantes encontrados (o oficial procura uma vez) e por edital dos demais.`,`art. 554, §§1º e 2º`],[`Intimações`,`MP como fiscal da ordem jurídica e Defensoria se houver pessoas em situação de vulnerabilidade.`,`art. 554, §1º`],[`Publicidade`,`Anúncios em jornal ou rádio locais, cartazes na região e outros meios.`,`art. 554, §3º`],[`Força velha`,`Audiência de mediação em até 30 dias antes de apreciar a liminar.`,`art. 565`],[`Liminar não cumprida`,`Se não executada em 1 ano da distribuição, nova mediação. O juiz pode ir ao local e chamar órgãos de política agrária e urbana.`,`art. 565, §§1º a 4º`]]},
{t:`juris`,h:`Súmulas`,items:[{court:`STF`,year:`SV 23`,id:`Súmula Vinculante 23`,tese:`Possessória ajuizada em razão do exercício do direito de greve por trabalhadores da iniciativa privada é da Justiça do Trabalho.`},{court:`STJ`,year:`Súm. 619`,id:`Súmula 619 do STJ`,tese:`Ocupação indevida de bem público é mera detenção, sem direito a retenção ou indenização por acessões e benfeitorias.`}]}],
quiz:[[`Pediu manutenção, mas houve esbulho. O juiz:`,[`extingue`,`concede a reintegração`],1,`Fungibilidade (${a(`art. 554`)}).`],[`O réu da possessória precisa reconvir para pedir indenização?`,[`Sim`,`Não`],1,`Caráter dúplice (${a(`art. 556`)}).`],[`Possessória sobre imóvel tem foro:`,[`relativo`,`absoluto da situação`],1,`${a(`art. 47, §2º`)}.`]]},
/* V */
{id:`forca`,group:`Procedimentos especiais`,title:`Força nova e força velha`,
intro:`O divisor é o prazo de ano e dia entre a moléstia e o ajuizamento. Ele muda o rito, não o direito.`,
blocks:[
{t:`calc`,kind:`forca`,h:`Calcule: nova ou velha?`,hint:`Escolha as datas.`},
{t:`vs`,h:`O que muda`,l:{t:`Força nova (até ano e dia)`,i:[`Rito especial (${a(`arts. 560 a 566`)})`,`Liminar possessória (${a(`art. 562`)})`,`Basta provar posse, moléstia, data e perda ou continuação da posse (${a(`art. 561`)})`,`Dispensa perigo de dano: tem natureza de tutela de evidência`,`Audiência de justificação se faltar prova documental`]},r:{t:`Força velha (passado ano e dia)`,i:[`Procedimento comum (${a(`art. 558, parágrafo único`)})`,`Não perde o caráter possessório`,`Tutela provisória genérica: exige probabilidade e perigo (${a(`art. 300`)})`,`Coletivo: mediação obrigatória antes da liminar (${a(`art. 565`)})`]}},
{t:`steps`,h:`O rito da força nova`,items:[[`Inicial`,`Requisitos do art. 319 mais as provas do art. 561.`,`arts. 319 e 561`],[`Liminar`,`Com prova documental suficiente, de plano e sem ouvir o réu; senão, audiência de justificação, citando o réu para comparecer.`,`art. 562`],[`Pessoa de direito público`,`Liminar só após ouvir seus representantes judiciais.`,`art. 562, parágrafo único`],[`Citação`,`Com ou sem liminar, o autor promove a citação em 5 dias.`,`art. 564`],[`Contestação`,`15 dias; havendo justificação, contados da intimação da decisão sobre a liminar.`,`art. 564, parágrafo único`],[`Depois`,`Procedimento comum.`,`art. 566`]]},
{t:`callout`,title:`Erro conceitual comum`,html:`<p>Passar do ano e dia não faz o autor perder a ação, nem transfere a posse ao esbulhador. A única consequência é procedimental. Na força velha, a tutela provisória continua possível pelos requisitos gerais (STJ, AgRg no REsp 1.139.629/RJ, 2012).</p>`}],
quiz:[[`Esbulho em 1/1/2025, ação em 10/1/2026. Força:`,[`nova`,`velha`],1,`O limite era 2/1/2026.`],[`Na força nova, a liminar exige perigo de dano?`,[`Sim`,`Não`],1,`${a(`art. 562`)}.`],[`Passado ano e dia, a ação perde o caráter possessório?`,[`Sim`,`Não`],1,`${a(`art. 558, parágrafo único`)}.`]]},
/* VI */
{id:`embargos-terceiro`,group:`Procedimentos especiais`,title:`Embargos de terceiro`,
intro:`Quem não é parte e tem seu bem atingido por constrição judicial, ou ameaçado de ser, defende-se por embargos de terceiro (arts. 674 a 681).`,
blocks:[
{t:`flips`,h:`Quem é terceiro (art. 674, §2º)`,hint:`Rol exemplificativo. Pode ser proprietário, inclusive fiduciário, ou possuidor (§1º).`,items:[[`Cônjuge ou companheiro`,`Defendendo bens próprios ou sua meação.`],[`Adquirente`,`Cujo bem foi constrito por decisão que declarou ineficaz a venda em fraude à execução.`],[`Sócio ou empresa`,`Atingido por desconsideração da personalidade de cujo incidente não participou.`],[`Credor com garantia real`,`Não intimado dos atos de expropriação do bem dado em garantia.`]]},
{t:`vs`,h:`Até quando`,l:{t:`No processo de conhecimento`,i:[`A qualquer tempo, enquanto não transitada a sentença (${a(`art. 675`)})`]},r:{t:`No cumprimento ou na execução`,i:[`Até 5 dias após a adjudicação, a alienação por iniciativa particular ou a arrematação`,`Sempre antes de assinada a carta respectiva`]}},
{t:`table`,h:`O procedimento`,head:[`Etapa`,`Regra`],rows:[[`Competência`,`Por dependência ao juízo que ordenou a constrição, em autos apartados; por carta, no juízo deprecado, salvo se o deprecante indicou o bem (${a(`art. 676`)})`],[`Inicial`,`Prova sumária da posse ou do domínio e da qualidade de terceiro, documentos e testemunhas (${a(`art. 677`)})`],[`Valor da causa`,`Valor do bem, ou da meação; não ultrapassa o valor da dívida`],[`Réus`,`Quem se beneficia da constrição e o adversário dele, se foi quem indicou o bem (${a(`art. 677, §4º`)})`],[`Liminar`,`Provado o domínio ou a posse, suspendem-se as medidas e pode haver manutenção ou reintegração; caução, salvo hipossuficiente (${a(`art. 678`)})`],[`Defesa`,`Contestação em 15 dias, depois procedimento comum (${a(`art. 679`)})`],[`Sentença`,`Procedente: cancela a constrição e reconhece domínio, manutenção ou reintegração definitiva (${a(`art. 681`)})`]]},
{t:`callout`,title:`Fraude contra credores não`,html:`<p>Nos embargos de terceiro discute-se fraude à execução, mas não fraude contra credores, que exige ação pauliana (${a(`Súmula 195 do STJ`)}).</p>`},
{t:`juris`,h:`Súmulas e julgados`,items:[{court:`STJ`,year:`Súm. 303`,id:`Súmula 303 do STJ`,tese:`Quem deu causa à constrição indevida paga os honorários.`,html:`Princípio da causalidade. No AgInt nos EDcl nos EDcl no AREsp 1.222.042/SP (2019), o adquirente que não registrou a compra pagou honorários mesmo vencendo os embargos.`},{court:`STJ`,year:`Súm. 84`,id:`Súmula 84 do STJ`,tese:`O compromisso de compra e venda sem registro também legitima embargos de terceiro.`}]}],
quiz:[[`Prazo na execução após a arrematação:`,[`15 dias`,`5 dias, antes da carta`],1,`${a(`art. 675`)}.`],[`Fraude contra credores se discute nos embargos?`,[`Sim`,`Não`],1,`${a(`Súmula 195 do STJ`)}.`],[`Embargante vencedor pode pagar honorários?`,[`Não`,`Sim, se deu causa à constrição`],1,`${a(`Súmula 303 do STJ`)}.`]]},

{id:`monitoria`,group:`Procedimentos especiais`,title:`Ação monitória`,
intro:`Quem tem prova escrita do crédito, mas sem força de título executivo, usa a monitória para formar um título judicial rapidamente (arts. 700 a 702).`,
blocks:[
{t:`flips`,h:`Pressupostos`,items:[[`Prova escrita`,`Sem eficácia de título executivo. Ex.: cheque prescrito (${a(`Súmula 299 do STJ`)}), contrato sem testemunhas, troca de e-mails. Prova oral documentada também serve (${a(`art. 700, §1º`)}).`],[`Devedor capaz`,`Não cabe contra incapaz.`],[`Objeto`,`Quantia; coisa fungível ou infungível, móvel ou imóvel; obrigação de fazer ou não fazer.`],[`Contra a Fazenda`,`Cabe (${a(`art. 700, §6º`)}; ${a(`Súmula 339 do STJ`)}).`],[`Citação`,`Por qualquer meio, inclusive edital (${a(`§7º`)}; ${a(`Súmula 282 do STJ`)}).`],[`Inicial`,`Valor com memória de cálculo, valor da coisa ou proveito econômico, que definem o valor da causa (${a(`§§2º e 3º`)}).`]]},

{t:`vs`,h:`Comparação`,l:{t:`Demarcatória (art. 569, I)`,i:[`Proprietário contra confinante`,`Fixar novos limites ou aviventar os apagados`,`Inicial: títulos, situação e denominação do imóvel, limites e todos os confinantes (${a(`art. 574`)})`,`Direito material: ${a(`CC, art. 1.297`)}, despesas repartidas proporcionalmente`]},r:{t:`Divisória (art. 569, II)`,i:[`Condômino contra os demais`,`Transformar a cota ideal em parte certa`,`Inicial: título de domínio (posse não basta), origem da comunhão, características, todos os condôminos, benfeitorias (${a(`art. 588`)})`,`Laudo: comodidade, preferência por terrenos contíguos às casas e benfeitorias, evitar retalhar glebas (${a(`art. 595`)})`]}},
{t:`flips`,h:`Regras comuns`,items:[[`Cumulação`,`É lícita: faz-se primeiro a demarcação, citando confinantes e condôminos (${a(`art. 570`)}).`],[`Extrajudicial`,`Por escritura pública, se todos forem maiores, capazes e concordes (${a(`art. 571`)}).`],[`Foro`,`Situação do imóvel, sem opção pelo foro do réu ou de eleição (${a(`art. 47, §1º`)}).`],[`Valor da causa`,`Avaliação da área ou do bem (${a(`art. 292, IV`)}).`],[`Defesa`,`Prazo comum de 15 dias; depois, procedimento comum (${a(`arts. 577, 578 e 589`)}).`],[`Recurso`,`Apelação contra a homologação da divisão ou demarcação não tem efeito suspensivo (${a(`art. 1.012, §1º, I`)}).`]]},
{t:`steps`,h:`As duas fases`,items:[[`1ª fase: o direito`,`Citação, perícia, eventual audiência e sentença que fixa a linha demarcanda ou decide sobre a divisão.`,`arts. 576 a 582; 588 a 596`],[`2ª fase: o campo`,`Depois do trânsito, peritos e agrimensor colocam marcos ou demarcam os quinhões, com memorial descritivo.`,`arts. 582 a 586; 596 e 597`],[`Encerramento`,`Partes falam sobre o relatório; lavra-se o auto de demarcação ou de divisão, assinado por juiz, agrimensor e arbitradores; sentença homologatória.`,`arts. 586, 587 e 597, §2º`]]},
{t:`callout`,kind:`sage`,title:`Caso de revisão`,html:`<p>Ricardo, Paula e Fernanda herdaram uma fazenda em condomínio. Ricardo quer sua parte individualizada: <b>divisão</b>. Ao mesmo tempo, o vizinho contesta a linha porque os marcos sumiram após obras: <b>demarcação</b>, para aviventar os rumos. Cumuladas, demarca-se primeiro.</p>`}],
quiz:[[`Para pedir divisão, a posse basta?`,[`Sim`,`Não, exige título de domínio`],1,`${a(`art. 588`)}.`],[`Cumuladas, o que vem primeiro?`,[`Divisão`,`Demarcação`],1,`${a(`art. 570`)}.`],[`As partes podem eleger foro para demarcação?`,[`Sim`,`Não`],1,`${a(`art. 47, §1º`)}.`]]}

{id:`dissolucao`,group:`Procedimentos especiais`,title:`Dissolução parcial de sociedade`,
intro:`Quando um sócio sai, morre ou é excluído, a sociedade continua com os demais. O processo resolve o vínculo daquele sócio e apura quanto lhe é devido (arts. 599 a 609).`,
blocks:[
{t:`flips`,h:`Objeto e legitimados`,items:[[`Objeto (art. 599)`,`Resolução da sociedade em relação ao sócio falecido, excluído, retirante ou dissidente; apuração dos haveres; ou só uma das duas. A inicial vem com o <em>contrato social consolidado</em>.`],[`S.A. fechada`,`Cabe se acionistas com 5% ou mais do capital demonstrarem que ela não pode preencher seu fim (${a(`§2º`)}). O STJ exige que prevaleça o vínculo pessoal entre os sócios.`],[`Quem propõe (art. 600)`,`Espólio, se nem todos os sucessores entrarem; sucessores, após a partilha; a sociedade, se os sócios não admitirem os sucessores ou se a lei não permitir exclusão extrajudicial; o sócio retirante após 10 dias; o sócio excluído.`],[`Ex-cônjuge`,`Pode apurar seus haveres, pagos à conta da quota do sócio, sem virar sócio (${a(`art. 600, parágrafo único`)}).`],[`Citação (art. 601)`,`Sócios e sociedade, para concordar ou contestar em 15 dias. Citados todos os sócios, a sociedade é dispensada, mas fica sujeita à coisa julgada.`],[`Concordância unânime`,`Decreta-se a dissolução sem honorários e com custas rateadas pela participação no capital (${a(`art. 603`)}). Contestada, segue o comum, mas a liquidação segue o capítulo.`]]},
{t:`calc`,kind:`resolucao`,h:`Qual é a data da resolução?`,hint:`${a(`art. 605`)}. Ela é a linha de corte do que o ex-sócio recebe.`},
{t:`steps`,h:`Apuração de haveres`,items:[[`O juiz organiza`,`Fixa a data da resolução, define o critério conforme o contrato e nomeia o perito, de preferência especialista em avaliação de sociedades.`,`arts. 604 e 606, parágrafo único`],[`Depósito do incontroverso`,`A sociedade ou os sócios depositam o que reconhecem; o ex-sócio levanta desde logo. Ex.: reconhecem R$ 330 mil de R$ 400 mil pedidos: R$ 330 mil são depositados.`,`art. 604, §§1º e 2º`],[`Critério na omissão`,`Balanço de determinação na data da resolução, com ativo tangível e intangível e passivo a preço de saída.`,`art. 606`],[`Revisão`,`Data e critério podem ser revistos a pedido da parte até o início da perícia.`,`art. 607`],[`O que entra`,`Até a resolução: lucros, juros sobre capital e pró-labore. Depois: só correção e juros.`,`art. 608`],[`Pagamento`,`Conforme o contrato; no silêncio, em dinheiro, em 90 dias.`,`art. 609; CC, art. 1.031, §2º`]]},
{t:`juris`,h:`Na jurisprudência`,items:[{court:`STJ`,year:`2018`,id:`REsp 1.731.464/SP`,tese:`Citados todos os sócios, é desnecessária a citação da sociedade.`,html:`Aplica o art. 601, parágrafo único: a sociedade fica sujeita à coisa julgada mesmo sem ser parte, exceção aos limites do art. 506.`},{court:`STJ`,year:`2021`,id:`AgInt no AREsp 1.861.293/RS`,tese:`É possível dissolução parcial de S.A. fechada em que prepondere o vínculo pessoal entre os sócios, por quebra da affectio societatis.`},{court:`STJ`,year:`2015`,id:`REsp 1.410.686/SP`,tese:`Na dissolução parcial, o valor da causa é o capital social correspondente ao sócio afastado; na total, o valor do contrato.`}]}],
quiz:[[`Retirada imotivada: data da resolução?`,[`O dia da notificação`,`O 60º dia após a notificação`],1,`${a(`art. 605, II`)}.`],[`Todos os sócios concordaram. Há honorários?`,[`Sim`,`Não`],1,`${a(`art. 603, §1º`)}.`],[`Depois da data da resolução, o ex-sócio recebe lucros?`,[`Sim`,`Não, só correção e juros`],1,`${a(`art. 608, parágrafo único`)}.`]]},

{id:`inventario`,group:`Sucessões no processo`,title:`Inventário e partilha`,
intro:`Inventário é descrever e avaliar o patrimônio deixado por quem morreu (o autor da herança). Partilha é dividi-lo. Não há partilha sem inventário, mas pode haver inventário sem partilha: no inventário negativo e quando há um só herdeiro (adjudicação).`,
blocks:[
{t:`calc`,kind:`inventario`,h:`Linha do tempo dos prazos`,hint:`Informe a data do óbito.`},
{t:`wizard`,h:`Cartório ou juiz?`,tree:{q:`Há testamento?`,a:[[`Sim`,{q:`O testamento já foi aberto, registrado e mandado cumprir pelo juiz?`,a:[[`Sim`,{q:`Todos os herdeiros são capazes e estão de acordo?`,a:[[`Sim`,{end:`Extrajudicial possível`,txt:`As normas do CNJ (Res. 35/2007, alterada pela Res. 571/2024) admitem escritura nesse caso. Confira a regra vigente.`}],[`Não`,{end:`Judicial`,txt:`${a(`CPC, art. 610`)}.`}]]}],[`Não`,{end:`Judicial`,txt:`Primeiro, ação de abertura, registro e cumprimento do testamento (${a(`arts. 735 a 737`)}).`}]]}],[`Não`,{q:`Há herdeiro incapaz?`,a:[[`Não`,{q:`Todos concordam com a partilha?`,a:[[`Sim`,{end:`Escritura pública`,txt:`Com advogado ou defensor de todos (${a(`art. 610, §§1º e 2º`)}). A escritura serve para registro e para levantar valores em bancos. O tabelião é de livre escolha.`}],[`Não`,{end:`Judicial`,txt:`Sem consenso não há escritura.`}]]}],[`Sim`,{q:`A partilha é em partes ideais iguais em todos os bens, sem cessão, doação ou compensação?`,a:[[`Sim`,{end:`Em regra judicial, com exceções`,txt:`O ${a(`art. 610`)} manda o inventário judicial, mas normas recentes do CNJ e, em SC, a Circular CGJ-SC 52/2023 admitem escritura nesse cenário. Confira a regra vigente.`}],[`Não`,{end:`Judicial`,txt:`Qualquer disposição que possa prejudicar o incapaz exige o juiz.`}]]}]]}]]}},
{t:`table`,h:`Ordem para nomear inventariante (art. 617)`,head:[`Ordem`,`Quem`],rows:[[`I`,`Cônjuge ou companheiro sobrevivente que convivia com o falecido ao tempo da morte`],[`II`,`Herdeiro na posse e administração do espólio`],[`III`,`Qualquer herdeiro`],[`IV`,`Herdeiro menor, por seu representante`],[`V`,`Testamenteiro, se lhe coube a administração ou toda a herança está em legados`],[`VI`,`Cessionário do herdeiro ou legatário`],[`VII`,`Inventariante judicial`],[`VIII`,`Pessoa estranha idônea`]]},
{t:`steps`,h:`O procedimento judicial`,items:[[`Requerimento`,`Por quem está na posse e administração do espólio, com a certidão de óbito; outros interessados também podem.`,`arts. 615 e 616`],[`Compromisso`,`O inventariante nomeado presta compromisso em 5 dias.`,`art. 617, parágrafo único`],[`Primeiras declarações`,`Em 20 dias do compromisso: herdeiros, bens, dívidas.`,`art. 620`],[`Citações e impugnações`,`Herdeiros, cônjuge, legatários, Fazenda e MP se houver incapaz; impugnações em 15 dias.`,`arts. 626 e 627`],[`Avaliação, colação e imposto`,`Avalia-se, trazem-se à colação as doações e calcula-se o ITCMD.`,`arts. 630 a 641`],[`Credores`,`Antes da partilha, pedem pagamento de dívidas vencidas e exigíveis.`,`art. 642`],[`Sentença de partilha`,`Pago o ITCMD e juntada certidão negativa da Fazenda (ou dívida garantida).`,`art. 654`],[`Formal de partilha`,`Após o trânsito; pode ser substituído por certidão se o quinhão não passar de 5 salários mínimos.`,`art. 655`]]},
{t:`flips`,h:`Pontos de prova`,items:[[`Cognição limitada`,`O juiz decide o que está provado por documento; o que exige outras provas, como união estável com testemunhas, vai às vias ordinárias (${a(`art. 612`)}).`],[`Atos com autorização`,`Alienar bens, transigir, pagar dívidas e fazer despesas de conservação exigem ouvir os interessados <em>e</em> autorização do juiz (${a(`art. 619`)}).`],[`Remoção`,`De ofício ou a requerimento, se não prestar declarações, atrasar, deixar bens se deteriorarem, não defender o espólio, não prestar contas ou sonegar bens (${a(`art. 622`)}).`],[`Competência`,`Domicílio do autor da herança no Brasil, ainda que morto no exterior, também para ações contra o espólio (${a(`art. 48`)}).`],[`Inventário conjunto`,`Mesmas pessoas, heranças dos dois cônjuges ou dependência entre partilhas: um só processo (${a(`art. 672`)}).`],[`Anulação`,`Partilha amigável homologada é anulável em 1 ano por dolo, coação, erro ou incapaz (${a(`art. 657`)}); a judicial é rescindível (${a(`art. 658`)}).`]]},
{t:`juris`,h:`Súmula`,items:[{court:`STF`,year:`Súm. 542`,id:`Súmula 542 do STF`,tese:`Não é inconstitucional a multa estadual pelo atraso no início ou na conclusão do inventário.`,html:`Em SC, a multa sobre o ITCMD é de 20%.`}]}],
quiz:[[`Prazo para instaurar o inventário:`,[`30 dias`,`2 meses`,`12 meses`],1,`${a(`CPC, art. 611`)} prevalece sobre o ${a(`CC, art. 1.796`)}.`],[`Cônjuge separado de fato tem preferência para ser inventariante?`,[`Sim`,`Não`],1,`Exige convivência ao tempo da morte (${a(`art. 617, I`)}).`],[`União estável que depende de testemunhas se decide no inventário?`,[`Sim`,`Não, vias ordinárias`],1,`${a(`art. 612`)}.`],[`O inventariante pode vender bem do espólio sozinho?`,[`Sim`,`Não`],1,`${a(`art. 619`)}.`]]},
