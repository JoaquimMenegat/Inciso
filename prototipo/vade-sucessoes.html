/* ---------- motores ---------- */
function regimeInicial(anos,reinc,tipo,favor){
  if(tipo==='detencao'){return anos>4||reinc?{r:'Semiaberto',d:'Na detenção não se começa em regime fechado. Acima de 4 anos, ou sendo reincidente, o início é no semiaberto (art. 33, caput).'}:{r:'Aberto',d:'Detenção de até 4 anos, réu não reincidente: regime aberto.'}}
  if(anos>8)return{r:'Fechado',d:'Pena superior a 8 anos começa no regime fechado (art. 33, §2º, a).'};
  if(anos>4)return reinc?{r:'Fechado',d:'Reincidente com pena acima de 4 anos começa no fechado.'}:{r:'Semiaberto',d:'Mais de 4 e até 8 anos, não reincidente: semiaberto (art. 33, §2º, b).'};
  if(reinc)return favor?{r:'Semiaberto',d:'Reincidente com pena de até 4 anos e circunstâncias favoráveis: semiaberto (Súmula 269, STJ).'}:{r:'Fechado',d:'Reincidente com circunstâncias desfavoráveis: o fechado é admitido mesmo com pena de até 4 anos.'};
  return{r:'Aberto',d:'Até 4 anos, não reincidente: regime aberto (art. 33, §2º, c).'};
}
function fmtPena(a){const t=Math.round(a*360);const y=Math.floor(t/360),m=Math.floor(t%360/30),d=t%30;const p=[];if(y)p.push(y+(y===1?' ano':' anos'));if(m)p.push(m+(m===1?' mês':' meses'));if(d)p.push(d+(d===1?' dia':' dias'));return p.join(', ')||'0'}

function execSim(){
  const id=uid('ex');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={tipo:'reclusao',reinc:false,viol:false,culp:false,favor:true};
    function render(){const a=+r.value/2;$('.exa',root).textContent=fmtPena(a);
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      const reg=regimeInicial(a,s.reinc,s.tipo,s.favor);
      const subst=(s.culp||(a<=4&&!s.viol))&&!s.reinc&&s.favor;
      const surs=!subst&&a<=2&&!s.reinc&&s.favor;
      const why=!subst?(s.reinc?'reincidente em crime doloso':!s.favor?'circunstâncias judiciais desfavoráveis':s.viol&&!s.culp?'crime com violência ou grave ameaça':'pena acima de 4 anos em crime doloso'):'';
      $('.exout',root).innerHTML=`<div class="exreg"><p class="eyebrow">Regime inicial</p><b>${reg.r}</b><p>${reg.d}</p></div>
        <div class="exrow ${subst?'ok':'no'}"><span>Restritiva de direitos</span><b>${subst?'Cabe':'Não cabe'}</b><small>${subst?'Pena substituída por prestação de serviços, prestação pecuniária e outras (arts. 43 e 44).':'Motivo: '+why+' (art. 44).'}</small></div>
        <div class="exrow ${surs?'ok':'no'}"><span>Sursis</span><b>${surs?'Cabe':'Não cabe'}</b><small>${surs?'Execução suspensa por 2 a 4 anos, sob condições (art. 77).':subst?'Não se aplica: cabe a restritiva de direitos, que tem preferência (art. 77, III).':'Exige pena de até 2 anos, réu não reincidente em crime doloso e circunstâncias favoráveis.'}</small></div>`;}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;s[k]=k==='tipo'?b.dataset.v:b.dataset.v==='true';render()});render();
  });
  const q=(k,l,o)=>`<div class="wzq"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="card exsim" id="${id}"><div class="exin"><label class="lab" for="${id}-r">Pena aplicada: <output class="exa num"></output></label><input id="${id}-r" type="range" min="1" max="30" value="6">
    <div class="wzqs">${q('tipo','Espécie de pena',[['reclusao','Reclusão'],['detencao','Detenção']])}${q('reinc','Réu reincidente em crime doloso?',[['true','Sim'],['false','Não']])}${q('viol','Crime com violência ou grave ameaça?',[['true','Sim'],['false','Não']])}${q('culp','Crime culposo?',[['true','Sim'],['false','Não']])}${q('favor','Circunstâncias judiciais favoráveis?',[['true','Sim'],['false','Não']])}</div></div>
    <div class="exout" aria-live="polite"></div></div>`;
}
const CRIMES=[['furto','Furto simples','art. 155',1,4],['estel','Estelionato','art. 171',1,5],['lesao','Lesão corporal grave','art. 129, §1º',1,5],['roubo','Roubo','art. 157',4,10],['homic','Homicídio simples','art. 121',6,20]];
const CIRC=['Culpabilidade','Antecedentes','Conduta social','Personalidade','Motivos','Circunstâncias','Consequências','Comportamento da vítima'];
function dosimetria(){
  const id=uid('ds');
  later(()=>{
    const root=$('#'+id),s={c:'roubo',neg:new Set(),ag:0,at:0,reinc:false,aum:0,dim:0};
    function calc(){const c=CRIMES.find(x=>x[0]===s.c),mn=c[3],mx=c[4],I=mx-mn;
      const base=Math.min(mx,mn+s.neg.size*I/8);
      const net=s.ag+(s.reinc?1:0)-s.at;let p2=base*(1+net/6);const clampLo=p2<mn,clampHi=p2>mx;p2=Math.max(mn,Math.min(mx,p2));
      const p3=p2*(1+s.aum)*(1-s.dim);return{c,mn,mx,base,p2,p3,clampLo,clampHi,net}}
    function render(){const x=calc(),M=Math.max(x.mx,x.p3)*1.08;
      $$('[data-crime]',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.crime===s.c));
      $$('[data-circ]',root).forEach(b=>b.setAttribute('aria-pressed',s.neg.has(+b.dataset.circ)));
      $('.ds-ag',root).textContent=s.ag;$('.ds-at',root).textContent=s.at;
      $$('[data-reinc]',root).forEach(b=>b.setAttribute('aria-pressed',String(s.reinc)===b.dataset.reinc));
      $$('[data-aum]',root).forEach(b=>b.setAttribute('aria-pressed',String(s.aum)===b.dataset.aum));
      $$('[data-dim]',root).forEach(b=>b.setAttribute('aria-pressed',String(s.dim)===b.dataset.dim));
      const P=v=>Math.min(100,v/M*100)+'%';
      $('.dsrange',root).style.left=P(x.mn);$('.dsrange',root).style.width=(x.mx-x.mn)/M*100+'%';
      $('.dsmin',root).textContent=x.mn+' a';$('.dsmax',root).textContent=x.mx+' a';
      [['.m1',x.base],['.m2',x.p2],['.m3',x.p3]].forEach(([k,v])=>$(k,root).style.left=P(v));
      const reg=regimeInicial(x.p3,s.reinc,'reclusao',s.neg.size<=2);
      $('.dsout',root).innerHTML=`<ol class="dsph">
        <li><span>1ª fase · pena-base</span><b class="num">${fmtPena(x.base)}</b><small>Mínimo de ${x.mn} ${x.mn===1?'ano':'anos'} + ${s.neg.size} de 8 circunstâncias desfavoráveis × 1/8 do intervalo (art. 59)</small></li>
        <li><span>2ª fase · pena provisória</span><b class="num">${fmtPena(x.p2)}</b><small>${x.net===0?'Agravantes e atenuantes se compensam ou não há nenhuma':(x.net>0?'+':'−')+Math.abs(x.net)+' × 1/6 sobre a pena-base'}${x.clampLo?'. Parou no mínimo legal (Súmula 231, STJ)':x.clampHi?'. Parou no máximo legal':''}</small></li>
        <li><span>3ª fase · pena definitiva</span><b class="num">${fmtPena(x.p3)}</b><small>${s.aum||s.dim?`${s.aum?'aumento de '+frac(s.aum):''}${s.aum&&s.dim?' e ':''}${s.dim?'diminuição de '+frac(s.dim):''}. Aqui a pena pode sair dos limites (art. 68)`:'Sem causas de aumento ou diminuição'}</small></li></ol>
        <div class="dsreg"><span>Regime inicial</span><b>${reg.r}</b><small>${reg.d}</small></div>`;}
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.crime){s.c=b.dataset.crime}else if(b.dataset.circ!=null){const i=+b.dataset.circ;s.neg.has(i)?s.neg.delete(i):s.neg.add(i)}
      else if(b.dataset.cnt){const k=b.dataset.cnt;s[k]=Math.max(0,Math.min(4,s[k]+(+b.dataset.d)))}else if(b.dataset.reinc){s.reinc=b.dataset.reinc==='true'}
      else if(b.dataset.aum){s.aum=+b.dataset.aum}else if(b.dataset.dim){s.dim=+b.dataset.dim}else return;render()});
    render();
  });
  const fr=[[0,'nenhum'],[1/3,'1/3'],[1/2,'1/2'],[2/3,'2/3']];
  return `<div class="ds" id="${id}">
    <div class="card"><span class="lab">Crime</span><div class="seg">${CRIMES.map(c=>`<button data-crime="${c[0]}">${c[1]} <small>${c[2]} · ${c[3]} a ${c[4]} anos</small></button>`).join('')}</div></div>
    <div class="dsgrid">
      <div class="card"><p class="eyebrow">1ª fase · circunstâncias judiciais</p><p class="hint">Toque nas que pesam contra o réu.</p><div class="dscirc">${CIRC.map((c,i)=>`<button data-circ="${i}" aria-pressed="false">${c}</button>`).join('')}</div></div>
      <div class="card"><p class="eyebrow">2ª fase · agravantes e atenuantes</p>
        <div class="steppers"><div><span class="lab">Agravantes</span><div class="stp"><button data-cnt="ag" data-d="-1" aria-label="Menos uma agravante">−</button><output class="num ds-ag">0</output><button data-cnt="ag" data-d="1" aria-label="Mais uma agravante">+</button></div></div>
        <div><span class="lab">Atenuantes</span><div class="stp"><button data-cnt="at" data-d="-1" aria-label="Menos uma atenuante">−</button><output class="num ds-at">0</output><button data-cnt="at" data-d="1" aria-label="Mais uma atenuante">+</button></div></div></div>
        <div class="wzq" style="margin-top:12px"><span>Réu reincidente?</span><div class="seg"><button data-reinc="true">Sim</button><button data-reinc="false">Não</button></div></div></div>
      <div class="card"><p class="eyebrow">3ª fase · causas de aumento e diminuição</p>
        <span class="lab">Aumento</span><div class="seg">${fr.map(f=>`<button data-aum="${f[0]}">${f[1]}</button>`).join('')}</div>
        <span class="lab" style="margin-top:12px">Diminuição</span><div class="seg">${fr.map(f=>`<button data-dim="${f[0]}">${f[1]}</button>`).join('')}</div>
        <p class="hint" style="margin:10px 0 0">Ex.: arma de fogo no roubo (+2/3), tentativa (−1/3 a −2/3).</p></div>
    </div>
    <div class="card dsscale"><div class="dstrack"><i class="dsrange"><span class="dsmin"></span><span class="dsmax"></span></i><i class="dsm m1" title="1ª fase">1</i><i class="dsm m2" title="2ª fase">2</i><i class="dsm m3" title="3ª fase">3</i></div><div class="dsout" aria-live="polite"></div></div>
  </div>`;
}
function frac(v){return v===1/3?'1/3':v===1/2?'1/2':v===2/3?'2/3':''}
function livramento(){
  const id=uid('lv');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={reinc:false,bons:true,hed:false};
    function render(){const a=+r.value;$('.lva',root).textContent=a+(a===1?' ano':' anos');
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      const f=s.hed?2/3:s.reinc?1/2:s.bons?1/3:1/2;const need=a*f;
      const o=$('.wzout',root);
      if(a<2){o.className='wzout bad';o.innerHTML='<b>Não cabe</b><p>O livramento exige pena privativa de liberdade igual ou superior a 2 anos (art. 83).</p>';$('.lvfill',root).style.width='0%';$('.lvmark',root).style.left='0%';return}
      o.className='wzout ok';o.innerHTML=`<b>Depois de mais de ${fmtPena(need)}</b><p>${s.hed?'Crime hediondo ou equiparado, sem reincidência específica: mais de 2/3 (art. 83, V).':s.reinc?'Reincidente em crime doloso: mais da metade (art. 83, II).':s.bons?'Primário com bons antecedentes: mais de 1/3 (art. 83, I).':'Primário com maus antecedentes: a jurisprudência exige mais da metade.'} Também é preciso bom comportamento, nenhuma falta grave nos últimos 12 meses e reparação do dano, salvo impossibilidade.</p>`;
      $('.lvfill',root).style.width=f*100+'%';$('.lvmark',root).style.left=f*100+'%';$('.lvmark span',root).textContent=f===1/3?'1/3':f===1/2?'1/2':'2/3'}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.v==='true';render()});render();
  });
  const q=(k,l)=>`<div class="wzq"><span>${l}</span><div class="seg"><button data-k="${k}" data-v="true">Sim</button><button data-k="${k}" data-v="false">Não</button></div></div>`;
  return `<div class="card" id="${id}"><label class="lab" for="${id}-r">Pena total: <output class="lva num"></output></label><input id="${id}-r" type="range" min="1" max="30" value="9">
    <div class="wzqs" style="margin-top:12px">${q('reinc','Reincidente em crime doloso?')}${q('bons','Tem bons antecedentes?')}${q('hed','Crime hediondo ou equiparado?')}</div>
    <div class="lvtrack"><i class="lvfill"></i><i class="lvmark"><span></span></i></div><div class="wzout" aria-live="polite"></div></div>`;
}
function depurador(){
  const id=uid('dp');
  later(()=>{
    const root=$('#'+id),r=$('input',root);
    function render(){const y=+r.value;$('.dpy',root).textContent=y+(y===1?' ano':' anos');$('.pimark',root).style.left=y/10*100+'%';
      const o=$('.wzout',root);const v=y<=5?{tone:'bad',t:'Reincidente',d:'O novo crime veio dentro dos 5 anos do período depurador. Agrava a pena na 2ª fase (arts. 61, I e 63).'}:{tone:'warn',t:'Não é reincidente, mas tem maus antecedentes',d:'Passados 5 anos, a condenação deixa de gerar reincidência (art. 64, I). Ainda pesa na 1ª fase, como antecedente (art. 59).'};
      o.className='wzout '+v.tone;o.innerHTML=`<b>${v.t}</b><p>${v.d}</p>`}
    r.addEventListener('input',render);render();
  });

}
const P109=[[12,Infinity,20,'superior a 12'],[8,12,16,'mais de 8 até 12'],[4,8,12,'mais de 4 até 8'],[2,4,8,'mais de 2 até 4'],[1,2,4,'de 1 até 2'],[0,1,3,'inferior a 1 ano']];
function prescricao(){
  const id=uid('pr');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={modo:'abs',jovem:false,idoso:false,reinc:false};
    function prazo(p){if(p<1)return P109[5];if(p<=2)return P109[4];return P109.find(x=>p>x[0]&&p<=x[1])}
    function render(){const p=+r.value/2;$('.pra',root).textContent=fmtPena(p);
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      $('.pr-reinc',root).hidden=s.modo!=='exec';
      const row=prazo(p);
      let anos=row[2]*(s.modo==='exec'&&s.reinc?4/3:1);const metade=s.jovem||s.idoso;if(metade)anos=anos/2;
      $$('.prtab tr[data-i]',root).forEach(tr=>tr.classList.toggle('on',+tr.dataset.i===P109.indexOf(row)));
      $('.prres',root).innerHTML=`<b class="num">${fmtPena(anos)}</b><p>${s.modo==='abs'?'Pretensão punitiva em abstrato: conta-se pelo <b>máximo</b> da pena cominada (art. 109).':'Pretensão executória: conta-se pela <b>pena aplicada</b>'+(s.reinc?', e o prazo aumenta de 1/3 pela reincidência':'')+' (art. 110).'}${metade?' Prazo reduzido de metade (art. 115).':''}</p>`;swapAnim($('.prres',root))}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;s[k]=k==='modo'?b.dataset.v:b.dataset.v==='true';render()});render();
  });
  const q=(k,l,o)=>`<div class="wzq ${k==='reinc'?'pr-reinc':''}"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="prw" id="${id}"><div class="card"><div class="wzqs">${q('modo','Antes ou depois da condenação definitiva?',[['abs','Antes (punitiva)'],['exec','Depois (executória)']])}
      <label class="lab" style="margin-top:6px" for="${id}-r">Pena máxima do crime ou pena aplicada: <output class="pra num"></output></label><input id="${id}-r" type="range" min="1" max="40" value="8">
      ${q('jovem','Menor de 21 anos na data do crime?',[['true','Sim'],['false','Não']])}${q('idoso','Maior de 70 anos na data da sentença?',[['true','Sim'],['false','Não']])}${q('reinc','Condenado reincidente?',[['true','Sim'],['false','Não']])}</div>
      <div class="prres" aria-live="polite"></div></div>
    <div class="card"><p class="eyebrow">Tabela do art. 109</p><div class="tablewrap"><table class="prtab" style="min-width:0"><thead><tr><th>Pena</th><th class="r">Prescreve em</th></tr></thead><tbody>${P109.map((x,i)=>`<tr data-i="${i}"><td>${x[3]}</td><td class="r num">${x[2]} anos</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

function pressupostos(){
  const id=uid('ps');
  const P=[['conduta','Conduta','ação ou omissão voluntária'],['culpa','Culpa','dolo, negligência, imprudência ou imperícia'],['nexo','Nexo causal','a conduta causou o dano'],['dano','Dano','prejuízo material ou moral']];
  later(()=>{
    const root=$('#'+id),s={regime:'subj',conduta:true,culpa:true,nexo:true,dano:true};
    function render(){$$('[data-reg]',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.reg===s.regime));
      $$('.pp',root).forEach(el=>{const k=el.dataset.k,need=!(k==='culpa'&&s.regime==='obj');el.classList.toggle('on',s[k]);el.classList.toggle('skip',!need);$('.ppst',el).textContent=!need?'dispensada':s[k]?'presente':'ausente'});
      const miss=P.filter(([k])=>!(k==='culpa'&&s.regime==='obj')&&!s[k]).map(p=>p[1].toLowerCase());
      const o=$('.wzout',root);
      if(miss.length){o.className='wzout bad';o.innerHTML=`<b>Não há dever de indenizar</b><p>Falta ${miss.join(' e ')}. ${miss.includes('nexo causal')?'Sem nexo, a conduta não é causa do dano: é o que fazem as excludentes.':miss.includes('dano')?'Sem dano não há o que reparar, por mais grave que seja a conduta.':miss.includes('culpa')?'Na subjetiva, quem alega precisa provar a culpa.':''}</p>`}
      else{o.className='wzout ok';o.innerHTML=`<b>Deve indenizar</b><p>${s.regime==='obj'?'Na responsabilidade objetiva bastam conduta, nexo e dano; a culpa nem é discutida (art. 927, p.u.).':'Presentes os quatro pressupostos da responsabilidade subjetiva (arts. 186 e 927).'}</p>`}
      swapAnim(o)}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-reg]');if(b){s.regime=b.dataset.reg;render();return}const p=e.target.closest('.pp');if(p&&!p.classList.contains('skip')){s[p.dataset.k]=!s[p.dataset.k];render()}});render();
  });
  return `<div class="card" id="${id}"><span class="lab">Regime</span><div class="seg"><button data-reg="subj">Subjetiva</button><button data-reg="obj">Objetiva</button></div>
    <p class="hint" style="margin:12px 0 8px">Toque em um pressuposto para retirá-lo do caso.</p>
    <div class="pps">${P.map(([k,l,d],i)=>`<button class="pp on" data-k="${k}"><b>${rom(i+1)} –</b><strong>${l}</strong><small>${d}</small><span class="ppst"></span></button>`).join('')}</div><div class="wzout" aria-live="polite"></div></div>`;
}
function concorrente(){
  const id=uid('cc');
  later(()=>{
    const root=$('#'+id),ins=$$('input',root);
    function render(){const D=+ins[0].value,c=+ins[1].value/100;$('.ccd',root).textContent=money(D);$('.ccp',root).textContent=Math.round(c*100)+'%';
      $('.cc-a',root).style.width=(1-c)*100+'%';$('.cc-v',root).style.width=c*100+'%';
      $('.wzout',root).className='wzout '+(c>=1?'bad':c>0?'warn':'ok');
      $('.wzout',root).innerHTML=c>=1?`<b>Nada a indenizar</b><p>Culpa exclusiva da vítima rompe o nexo causal: o dano não decorre da conduta do agente.</p>`:`<b>${money(D*(1-c))}</b><p>${c?`A vítima arca com ${Math.round(c*100)}% do próprio prejuízo (${money(D*c)}), na proporção da gravidade da sua culpa (art. 945).`:'Sem culpa da vítima, a reparação é integral (art. 944).'}</p>`}
    ins.forEach(i=>i.addEventListener('input',render));render();
  });
  return `<div class="card" id="${id}"><div class="dvin"><div><label class="lab" for="${id}-d">Dano total: <output class="ccd num"></output></label><input id="${id}-d" type="range" min="10000" max="300000" step="10000" value="100000"></div>
    <div><label class="lab" for="${id}-c">Peso da culpa da vítima: <output class="ccp num"></output></label><input id="${id}-c" type="range" min="0" max="100" step="5" value="30"></div></div>
    <div class="ccbar"><i class="cc-a"><span>agente paga</span></i><i class="cc-v"><span>vítima arca</span></i></div><div class="wzout" aria-live="polite"></div></div>`;
}
function indenizacao(){
  const id=uid('in');
  later(()=>{
    const root=$('#'+id),ins=$$('input[type=range]',root);let red=false;
    function render(){const [em,renda,meses,mor,est,rp]=ins.map(i=>+i.value);
      const lc=renda*meses,parts=[['Dano emergente',em,'ink'],['Lucro cessante',lc,'brass'],['Dano moral',mor,'sage'],['Dano estético',est,'seal']];
      const tot=parts.reduce((s,p)=>s+p[1],0),fin=red?tot*(1-rp/100):tot;
      $$('output',root).forEach((o,k)=>o.textContent=k===2?meses+(meses===1?' mês':' meses'):k===5?rp+'%':money(+ins[k].value));
      $('.inbar',root).innerHTML=parts.map(p=>`<i style="width:${tot?p[1]/tot*100:0}%;background:var(--${p[2]})" title="${p[0]}"></i>`).join('');
      $('.inleg',root).innerHTML=parts.map(p=>`<li><i style="background:var(--${p[2]})"></i><span>${p[0]}</span><b class="num">${money(p[1])}</b></li>`).join('')+`<li class="tot"><i></i><span><b>${red?'Total após redução equitativa':'Total'}</b></span><b class="num">${money(fin)}</b></li>`;
      $$('[data-red]',root).forEach(b=>b.setAttribute('aria-pressed',String(red)===b.dataset.red));$('.inred',root).hidden=!red}
    ins.forEach(i=>i.addEventListener('input',render));root.addEventListener('click',e=>{const b=e.target.closest('[data-red]');if(!b)return;red=b.dataset.red==='true';render()});render();
  });
  const rg=(l,min,max,step,v)=>`<div><label class="lab">${l}: <output class="num"></output></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
  return `<div class="calc" id="${id}"><div class="card cin">${rg('Despesas médicas e conserto',0,100000,1000,18000)}${rg('Renda mensal perdida',0,15000,500,4000)}${rg('Meses sem trabalhar',0,24,1,3)}${rg('Dano moral',0,100000,1000,20000)}${rg('Dano estético',0,100000,1000,15000)}
    <div class="wzq"><span>Culpa levíssima e dano desproporcional?</span><div class="seg"><button data-red="true">Sim</button><button data-red="false">Não</button></div></div>
    <div class="inred" hidden>${rg('Redução equitativa',0,50,5,20)}</div></div>
    <div class="card cout"><p class="eyebrow">Composição da indenização</p><div class="stack inbar"></div><ul class="who inleg"></ul><p class="hint" style="margin:0">Lucro cessante = renda mensal × meses parados (art. 402). Dano moral e estético se cumulam (Súmula 387, STJ). A redução por equidade é exceção (art. 944, p.u.).</p></div></div>`;
}

function riscoCoisa(){
  const id=uid('rk');
  const R={
    'dar-perda-0':['Obrigação resolvida','A coisa pereceu para o dono (o devedor). Ninguém deve nada; se o preço foi pago, é devolvido.','Art. 234','ok'],
    'dar-perda-1':['Equivalente + perdas e danos','O devedor responde pelo valor da coisa e pelos prejuízos do credor.','Art. 234','bad'],
    'dar-det-0':['O credor escolhe','Pode resolver a obrigação ou aceitar a coisa no estado em que está, com abatimento do preço.','Art. 235','warn'],
    'dar-det-1':['Equivalente ou coisa no estado, + perdas e danos','O credor escolhe entre o equivalente e a coisa deteriorada; em ambos os casos, com indenização.','Art. 236','bad'],
    'rest-perda-0':['O credor sofre a perda','Na restituição, a coisa já é do credor: a perda é dele, ressalvados os direitos até o dia do fato.','Art. 238','warn'],
    'rest-perda-1':['Equivalente + perdas e danos','O devedor que perdeu por culpa a coisa alheia paga o equivalente e os prejuízos.','Art. 239','bad'],
    'rest-det-0':['O credor recebe como está','Sem culpa do devedor, a coisa é devolvida no estado em que se acha, sem indenização.','Art. 240','warn'],
    'rest-det-1':['Equivalente + perdas e danos','Com culpa, aplica-se a regra da perda culposa.','Art. 240','bad']};
  later(()=>{
    const root=$('#'+id),s={tipo:'dar',ev:'perda',culpa:'0'};
    function render(){$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',s[b.dataset.k]===b.dataset.v));
      const r=R[`${s.tipo}-${s.ev}-${s.culpa}`],o=$('.wzout',root);o.className='wzout '+r[3];o.innerHTML=`<b>${r[0]}</b><p>${r[1]}</p><span class="art">${r[2]}, CC</span>`;swapAnim(o);
      $('.rkdono',root).textContent=s.tipo==='dar'?'devedor (vendedor)':'credor (dono que emprestou)'}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.v;render()});render();
  });
  const q=(k,l,o)=>`<div class="wzq"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="wz" id="${id}"><div class="wzqs">${q('tipo','Que obrigação?',[['dar','Dar coisa certa'],['rest','Restituir']])}${q('ev','O que aconteceu antes da entrega?',[['perda','Perda total'],['det','Deterioração']])}${q('culpa','Houve culpa do devedor?',[['1','Sim'],['0','Não']])}
    <p class="hint" style="margin:6px 0 0">Até a entrega, o dono da coisa é o <b class="rkdono"></b>.</p></div><div class="wzout" aria-live="polite"></div></div>`;
}
function solidariedade(){
  const id=uid('sd');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={modo:'sol',insolv:false};
    function render(){const D=+r.value,n=+$('#'+id+'-n').textContent;$('.sdd',root).textContent=money(D);
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      const names=['Ana','Bruno','Caio','Davi','Eva'].slice(0,n),solv=s.insolv?n-1:n;
      $('.sdrows',root).innerHTML=names.map((nm,i)=>{const ins=s.insolv&&i===n-1;const cobra=s.modo==='sol'?D:D/n;const arca=ins?0:s.modo==='sol'?D/solv:D/n;
        return `<div class="sdrow ${ins?'ins':''}"><b>${nm}${ins?' <small>insolvente</small>':''}</b><div class="rb"><span>Credor pode cobrar</span><div class="track"><i style="width:${cobra/D*100}%;background:var(--seal)"></i></div><b class="num">${money(cobra)}</b></div><div class="rb"><span>Arca, no final</span><div class="track"><i style="width:${arca/D*100}%;background:var(--sage)"></i></div><b class="num">${money(arca)}</b></div></div>`}).join('');
      $('.rmsg',root).innerHTML=s.modo==='sol'?`<b>Solidária:</b> o credor escolhe de quem cobrar os ${money(D)} (art. 275). Quem pagar cobra a quota de cada um${s.insolv?', e a parte do insolvente se reparte entre os solventes':''} (art. 283).`:`<b>Divisível, sem solidariedade:</b> a dívida se parte em ${n} obrigações iguais e distintas (art. 257). Cada um só deve ${money(D/n)}${s.insolv?'; a parte do insolvente é prejuízo do credor':''}.`}
    onStep(root,render);r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.k==='modo'?b.dataset.v:b.dataset.v==='true';render()});render();
  });
  return `<div class="card" id="${id}"><div class="steppers">${stepper(id+'-n','Devedores',3,2,5)}<div><label class="lab" for="${id}-r">Dívida: <output class="sdd num"></output></label><input id="${id}-r" type="range" min="30000" max="300000" step="15000" value="90000"></div></div>
    <div class="wzqs" style="margin:12px 0"><div class="wzq"><span>Regime da dívida</span><div class="seg"><button data-k="modo" data-v="sol">Solidária</button><button data-k="modo" data-v="div">Divisível</button></div></div>
    <div class="wzq"><span>Um dos devedores ficou insolvente?</span><div class="seg"><button data-k="insolv" data-v="true">Sim</button><button data-k="insolv" data-v="false">Não</button></div></div></div>
    <div class="sdrows"></div><p class="rmsg" aria-live="polite"></p></div>`;
}

function prazoCalc(){
  const id=uid('pz');
  later(()=>{
    const root=$('#'+id),di=$('input[type=date]',root),s={dias:15,dobro:false};
    const iso=d=>d.toISOString().slice(0,10);
    di.value=iso(new Date(Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate())));
    function render(){
      $$('[data-dias]',root).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.dias===s.dias));$$('[data-dobro]',root).forEach(b=>b.setAttribute('aria-pressed',String(s.dobro)===b.dataset.dobro));
      const n=s.dias*(s.dobro?2:1);if(!di.value)return;const start=new Date(di.value+'T12:00:00Z');
      const util=d=>{const w=d.getUTCDay();return w!==0&&w!==6};const cells=[];let d=new Date(start),count=0,end=null;
      cells.push({d:new Date(d),k:'start'});
      while(count<n){d=new Date(d.getTime()+864e5);if(util(d)){count++;cells.push({d:new Date(d),k:'util',n:count});if(count===n)end=new Date(d)}else cells.push({d:new Date(d),k:'off'})}
      const fmt=x=>x.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',timeZone:'UTC'});
      const show=cells.length>40?cells.slice(0,6).concat([{k:'gap'}],cells.slice(-12)):cells;
      $('.pzcal',root).innerHTML=show.map(c=>c.k==='gap'?'<span class="pzc gap">…</span>':`<span class="pzc ${c.k}${c.n===n?' end':''}" title="${fmt(c.d)}"><small>${c.d.toLocaleDateString('pt-BR',{weekday:'narrow',timeZone:'UTC'})}</small><b>${c.d.getUTCDate()}</b>${c.k==='util'?`<i>${c.n}</i>`:''}</span>`).join('');
      $('.pzres',root).innerHTML=`<p class="eyebrow">Último dia do prazo</p><b>${fmt(end)}</b><p>${n} dias úteis contados a partir do dia seguinte à intimação; sábados e domingos não contam (arts. 219 e 224).${s.dobro?' Prazo em dobro (arts. 180, 183 e 186).':''} Feriados não foram descontados nesta simulação.</p>`;swapAnim($('.pzres',root))}
    di.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-dias],[data-dobro]');if(!b)return;if(b.dataset.dias)s.dias=+b.dataset.dias;else s.dobro=b.dataset.dobro==='true';render()});render();
  });
  return `<div class="card pz" id="${id}"><div class="pzin"><div><label class="lab" for="${id}-d">Data da intimação</label><input id="${id}-d" type="date" class="pzdate"></div>
    <div><span class="lab">Prazo</span><div class="seg">${[5,10,15,30].map(n=>`<button data-dias="${n}">${n} dias</button>`).join('')}</div></div>
    <div><span class="lab">Fazenda Pública, MP ou Defensoria?</span><div class="seg"><button data-dobro="true">Sim</button><button data-dobro="false">Não</button></div></div></div>
    <div class="pzcal" aria-hidden="true"></div><div class="pzres" aria-live="polite"></div></div>`;
}
function honorarios(){
  const id=uid('ho');
  later(()=>{
    const root=$('#'+id),ins=$$('input',root);
    function render(){const V=+ins[0].value,p=+ins[1].value/100,g=+ins[2].value/100;$$('output',root).forEach((o,k)=>o.textContent=k===0?money(+ins[0].value):ins[k].value+'%');
      const hAutor=V*g*p,hReu=V*(1-g)*p;
      $('.horows',root).innerHTML=`<div class="rb"><span>Réu paga ao advogado do autor</span><div class="track"><i style="width:${g*100}%;background:var(--sage)"></i></div><b class="num">${money(hAutor)}</b></div>
        <div class="rb"><span>Autor paga ao advogado do réu</span><div class="track"><i style="width:${(1-g)*100}%;background:var(--seal)"></i></div><b class="num">${money(hReu)}</b></div>`;
      $('.rmsg',root).innerHTML=g>=1?`<b>Vitória total do autor:</b> o réu paga ${Math.round(p*100)}% de honorários sobre ${money(V)} (art. 85, §2º).`:g<=0?'<b>Vitória total do réu:</b> o autor paga os honorários do advogado do réu.':`<b>Sucumbência recíproca:</b> cada parte paga os honorários do advogado da outra, na proporção em que perdeu. Os valores não se compensam (art. 85, §14).`}
    ins.forEach(i=>i.addEventListener('input',render));render();
  });
  return `<div class="card" id="${id}"><div class="dvin"><div><label class="lab">Valor em discussão: <output class="num"></output></label><input type="range" min="10000" max="500000" step="10000" value="100000"></div>
    <div><label class="lab">Percentual fixado: <output class="num"></output></label><input type="range" min="10" max="20" value="10"></div></div>
    <div style="margin-top:12px"><label class="lab">Quanto do pedido o autor ganhou: <output class="num"></output></label><input type="range" min="0" max="100" step="10" value="70"></div>
    <div class="rbars horows" style="margin-top:16px"></div><p class="rmsg" aria-live="polite"></p></div>`;
}

function prazoVicio(){
  const id=uid('pv');
  later(()=>{
    const root=$('#'+id),s={bem:'movel',posse:false,oculto:false};
    function render(){$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      let p,d;
      if(s.oculto){p=s.bem==='movel'?'até 180 dias':'até 1 ano';d=`O vício só podia ser percebido mais tarde: o prazo corre de quando o adquirente <b>teve ciência</b> do defeito, com o limite de ${s.bem==='movel'?'180 dias':'1 ano'} (art. 445, §1º).`}
      else if(s.posse){p=s.bem==='movel'?'15 dias':'6 meses';d='O comprador já estava na posse da coisa: o prazo conta da alienação e <b>cai pela metade</b> (art. 445, caput).'}
      else{p=s.bem==='movel'?'30 dias':'1 ano';d='Contado da <b>entrega efetiva</b> da coisa (art. 445, caput). Prazo decadencial: não se suspende nem se interrompe.'}
      const o=$('.wzout',root);o.className='wzout warn';o.innerHTML=`<b>${p}</b><p>${d}</p>`;swapAnim(o)}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;s[k]=k==='bem'?b.dataset.v:b.dataset.v==='true';render()});render();
  });
  const q=(k,l,o)=>`<div class="wzq"><span>${l}</span><div class="seg">${o.map(([v,t])=>`<button data-k="${k}" data-v="${v}">${t}</button>`).join('')}</div></div>`;
  return `<div class="wz" id="${id}"><div class="wzqs">${q('bem','Que bem?',[['movel','Móvel'],['imovel','Imóvel']])}${q('posse','O comprador já estava na posse antes da venda?',[['true','Sim'],['false','Não']])}${q('oculto','O defeito, por natureza, só podia aparecer depois?',[['true','Sim'],['false','Não']])}</div><div class="wzout" aria-live="polite"></div></div>`;
}
function arras(){
  const id=uid('ar');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={tipo:'conf',quem:'deu'};
    function render(){const A=+r.value;$('.arv',root).textContent=money(A);$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',s[b.dataset.k]===b.dataset.v));
      let txt,dar,rec;
      if(s.tipo==='pen'){if(s.quem==='deu'){dar=-A;rec=A;txt=`Quem deu o sinal se arrependeu: <b>perde os ${money(A)}</b> para a outra parte. Sem indenização suplementar (art. 420).`}else{dar=A;rec=-A;txt=`Quem recebeu se arrependeu: <b>devolve os ${money(A)} mais o equivalente</b>, ${money(2*A)} no total. Sem indenização suplementar (art. 420).`}}
      else{if(s.quem==='deu'){dar=-A;rec=A;txt=`Quem deu o sinal não cumpriu: a outra parte pode desfazer o contrato e <b>reter os ${money(A)}</b>. Se provar prejuízo maior, pede a diferença; as arras são o mínimo (arts. 418 e 419).`}else{dar=A;rec=-A;txt=`Quem recebeu não cumpriu: quem deu pode desfazer o contrato e exigir <b>a devolução mais o equivalente</b> (${money(2*A)}), com correção, juros e honorários. Também pode pedir indenização suplementar (arts. 418 e 419).`}}
      $('.ar-d',root).textContent=(dar>0?'+ ':'− ')+money(Math.abs(dar));$('.ar-r',root).textContent=(rec>0?'+ ':'− ')+money(Math.abs(rec));
      $('.ar-d',root).className='ar-d num '+(dar>0?'up':'down');$('.ar-r',root).className='ar-r num '+(rec>0?'up':'down');
      const o=$('.rmsg',root);o.innerHTML=txt;swapAnim(o)}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.v;render()});render();
  });
  return `<div class="card" id="${id}"><div class="wzqs"><div class="wzq"><span>Tipo de arras</span><div class="seg"><button data-k="tipo" data-v="conf">Confirmatórias</button><button data-k="tipo" data-v="pen">Penitenciais</button></div></div>
    <div class="wzq"><span>Quem desistiu ou não cumpriu?</span><div class="seg"><button data-k="quem" data-v="deu">Quem deu o sinal</button><button data-k="quem" data-v="recebeu">Quem recebeu</button></div></div></div>
    <label class="lab" style="margin-top:12px;display:block" for="${id}-r">Valor do sinal: <output class="arv num"></output></label><input id="${id}-r" type="range" min="5000" max="100000" step="5000" value="20000">
    <div class="arbal"><div><small>Quem deu o sinal</small><b class="ar-d num"></b></div><div><small>Quem recebeu</small><b class="ar-r num"></b></div></div><p class="rmsg" aria-live="polite"></p></div>`;
}

function orgCrim(){
  const id=uid('oc');
  later(()=>{
    const root=$('#'+id),s={n:3,estrutura:false,pena:false,crimes:true};
    function render(){$$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));$('.ocn',root).textContent=s.n;
      const o=$('.wzout',root);let v;
      if(!s.crimes)v={tone:'ok',t:'Não há crime associativo',d:'A reunião para contravenções, ou sem finalidade de cometer crimes, não configura associação criminosa.'};
      else if(s.n<3)v={tone:'ok',t:'Não há crime associativo',d:'Com duas pessoas pode haver concurso de agentes no crime cometido, mas não associação criminosa.'};
      else if(s.n>=4&&s.estrutura&&s.pena)v={tone:'bad',t:'Organização criminosa',d:'4 ou mais pessoas, estrutura ordenada com divisão de tarefas, visando crimes com pena máxima superior a 4 anos (Lei 12.850/13, art. 1º, §1º). Pena de 3 a 8 anos.'};
      else v={tone:'warn',t:'Associação criminosa',d:`${s.n} pessoas associadas para cometer crimes (CP, art. 288). Pena de 1 a 3 anos.${s.n>=4?' Para ser organização faltam a estrutura com divisão de tarefas ou o tipo de crime visado.':''}`};
      o.className='wzout '+v.tone;o.innerHTML=`<b>${v.t}</b><p>${v.d}</p>`;swapAnim(o)}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k],[data-n]');if(!b)return;if(b.dataset.n){s.n=Math.max(2,Math.min(8,s.n+(+b.dataset.n)))}else s[b.dataset.k]=b.dataset.v==='true';render()});render();
  });
  const q=(k,l)=>`<div class="wzq"><span>${l}</span><div class="seg"><button data-k="${k}" data-v="true">Sim</button><button data-k="${k}" data-v="false">Não</button></div></div>`;
  return `<div class="wz" id="${id}"><div class="wzqs"><div class="wzq"><span>Quantas pessoas?</span><div class="stp"><button data-n="-1" aria-label="Menos uma pessoa">−</button><output class="ocn num">3</output><button data-n="1" aria-label="Mais uma pessoa">+</button></div></div>
    ${q('crimes','Reuniram-se para cometer crimes (não só contravenções)?')}${q('estrutura','Há estrutura ordenada, com divisão de tarefas?')}${q('pena','Os crimes visados têm pena máxima acima de 4 anos?')}</div><div class="wzout" aria-live="polite"></div></div>`;
}

function pecWiz(){
  return W.wizard({qs:[['inic','Foi proposta por quem a Constituição admite (Presidente, 1/3 de uma Casa ou mais da metade das Assembleias)?'],['quorum','Teve 3/5 dos votos, em dois turnos, nas duas Casas?'],['crise','Está em vigor intervenção federal, estado de defesa ou de sítio?'],['petrea','Tende a abolir alguma cláusula pétrea?']],init:{inic:true,quorum:true,crise:false,petrea:false},
    verdict:a=>!a.inic?{tone:'bad',t:'Inconstitucional: vício de iniciativa',d:'O rol do art. 60, I a III é taxativo. Não há, por exemplo, PEC de iniciativa popular no plano federal.'}:
      !a.quorum?{tone:'bad',t:'Não aprovada',d:'Sem 3/5 em dois turnos em cada Casa, a proposta é rejeitada e não pode ser reapresentada na mesma sessão legislativa (art. 60, §§2º e 5º).'}:
      a.crise?{tone:'bad',t:'Inconstitucional: limite circunstancial',d:'A Constituição não pode ser emendada na vigência de intervenção federal, estado de defesa ou de sítio (art. 60, §1º).'}:
      a.petrea?{tone:'bad',t:'Inconstitucional: limite material',d:'Não é sequer objeto de deliberação a proposta tendente a abolir cláusula pétrea (art. 60, §4º).'}:
      {tone:'ok',t:'Emenda aprovada',d:'Promulgada pelas Mesas da Câmara e do Senado, sem sanção presidencial (art. 60, §3º).'}});
}
function anualidade(){
  const id=uid('an');
  later(()=>{
    const root=$('#'+id),r=$('input',root);
    function render(){const m=+r.value;$('.anm',root).textContent=m+(m===1?' mês':' meses');$('.pimark',root).style.left=Math.min(m,24)/24*100+'%';
      const o=$('.wzout',root),ok=m>=12;o.className='wzout '+(ok?'ok':'bad');
      o.innerHTML=ok?'<b>Vale para esta eleição</b><p>Passou mais de um ano entre a vigência da lei e o pleito (art. 16).</p>':`<b>Não vale para esta eleição</b><p>A lei já está em vigor, mas só se aplica às eleições seguintes. Nesta, continua valendo a regra antiga (ultratividade). Faltariam ${12-m} ${12-m===1?'mês':'meses'}.</p>`}
    r.addEventListener('input',render);render();
  });
  return `<div class="card" id="${id}"><div class="pitrack antrack"><i class="pi5"><span>1 ano</span></i><i class="pimark"></i></div>
    <label class="lab" for="${id}-r">Tempo entre a publicação da lei e a eleição: <output class="anm num"></output></label><input id="${id}-r" type="range" min="0" max="24" value="8"><div class="wzout" aria-live="polite"></div></div>`;
}

function revelia(){
  return W.wizard({qs:[['contestou','O réu apresentou contestação no prazo?'],['litis','Algum litisconsorte contestou os mesmos fatos?'],['indisp','O litígio é sobre direitos indisponíveis?'],['doc','Falta à inicial documento indispensável à prova do ato?'],['inveros','As alegações do autor são inverossímeis ou contrariadas pela prova?']],init:{contestou:false,litis:false,indisp:false,doc:false,inveros:false},
    verdict:a=>a.contestou?{tone:'ok',t:'Não há revelia',d:'O réu contestou: os fatos controvertidos dependem de prova.'}:
      a.litis?{tone:'warn',t:'Revel, mas sem presunção de veracidade',d:'A contestação de um litisconsorte aproveita ao revel quanto aos fatos comuns (art. 345, I).'}:
      a.indisp?{tone:'warn',t:'Revel, mas sem presunção de veracidade',d:'Direitos indisponíveis não admitem a presunção (art. 345, II).'}:
      a.doc?{tone:'warn',t:'Revel, mas sem presunção de veracidade',d:'Sem o instrumento que a lei considera indispensável, os fatos não se presumem provados (art. 345, III).'}:
      a.inveros?{tone:'warn',t:'Revel, mas sem presunção de veracidade',d:'Alegações inverossímeis ou em contradição com a prova não se presumem verdadeiras (art. 345, IV).'}:
      {tone:'bad',t:'Revelia com efeito material',d:'Presumem-se verdadeiras as alegações de fato do autor (art. 344). Os prazos correm da publicação no diário oficial para o revel sem advogado (art. 346), e o juiz pode julgar antecipadamente (art. 355, II).'}});
}
function tutelaWiz(){
  return W.wizard({qs:[['urg','Há perigo de dano ou risco ao resultado útil do processo?'],['prob','O direito é provável?'],['satisf','O autor quer já receber o próprio bem pedido (e não só garanti-lo)?'],['evid','O caso está numa hipótese do art. 311 (abuso de defesa, tese repetitiva com prova documental, depósito, prova documental sem contraprova)?']],init:{urg:true,prob:true,satisf:true,evid:false},
    verdict:a=>a.urg&&a.prob?(a.satisf?{tone:'ok',t:'Tutela de urgência antecipada',d:'Satisfativa: entrega desde já, provisoriamente, o que se pede ao final. Não cabe se houver perigo de irreversibilidade (art. 300, §3º).'}:{tone:'ok',t:'Tutela de urgência cautelar',d:'Assecuratória: arresto, sequestro, arrolamento de bens, registro de protesto, para proteger o resultado útil do processo (art. 301).'}):
      a.evid?{tone:'ok',t:'Tutela da evidência',d:'Dispensa a urgência: o direito é tão evidente que esperar não se justifica (art. 311). Sempre incidental.'}:
      !a.prob?{tone:'bad',t:'Nenhuma tutela provisória',d:'Sem probabilidade do direito, não há tutela provisória possível.'}:
      {tone:'bad',t:'Nenhuma tutela provisória',d:'Sem urgência e fora das hipóteses do art. 311, o autor espera a sentença.'}});
}

function possessoria(){
  const id=uid('ps2');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={tipo:'esbulho'};
    function render(){const m=+r.value;$('.psm',root).textContent=m<12?m+(m===1?' mês':' meses'):m===12?'1 ano':Math.floor(m/12)+(m<24?' ano':' anos')+(m%12?' e '+m%12+' meses':'');
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',s[b.dataset.k]===b.dataset.v));$('.pimark',root).style.left=Math.min(m,36)/36*100+'%';
      const acao={esbulho:'Reintegração de posse',turbacao:'Manutenção de posse',ameaca:'Interdito proibitório'}[s.tipo];
      const nova=m<=12;const o=$('.wzout',root);o.className='wzout '+(nova?'ok':'warn');
      o.innerHTML=s.tipo==='ameaca'?`<b>${acao}</b><p>Diante de ameaça, o possuidor pede ao juiz que o proteja, com pena pecuniária se a ordem for descumprida (art. 567). Não se conta ano e dia: a moléstia ainda não aconteceu.</p>`:
        nova?`<b>${acao}, força nova</b><p>Dentro de ano e dia: rito especial e liminar possessória, que exige só prova da posse e da moléstia, sem demonstrar perigo de dano (arts. 558 e 562).</p>`:
        `<b>${acao}, força velha</b><p>Passado ano e dia: procedimento comum, sem perder o caráter possessório. Liminar só como tutela de urgência, provando probabilidade do direito e perigo de dano (art. 300).</p>`;swapAnim(o)}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s.tipo=b.dataset.v;render()});render();
  });
  return `<div class="card" id="${id}"><div class="wzq"><span>O que aconteceu?</span><div class="seg"><button data-k="tipo" data-v="esbulho">Perdeu a posse</button><button data-k="tipo" data-v="turbacao">Foi perturbado</button><button data-k="tipo" data-v="ameaca">Foi ameaçado</button></div></div>
    <div class="pitrack fntrack"><i class="pi5"><span>ano e dia</span></i><i class="pimark"></i></div>
    <label class="lab" for="${id}-r">Tempo desde a moléstia até a ação: <output class="psm num"></output></label><input id="${id}-r" type="range" min="1" max="36" value="8"><div class="wzout" aria-live="polite"></div></div>`;
}
function juizado(){
  return W.wizard({qs:[['valor','A causa vale até 40 salários mínimos?'],['fazenda','O réu é ente público (União, Estado, Município, autarquia)?'],['estado','É causa de família, falência, de estado ou capacidade das pessoas?'],['complexa','Exige perícia complexa?']],init:{valor:true,fazenda:false,estado:false,complexa:false},
    verdict:a=>a.estado?{tone:'bad',t:'Não cabe no Juizado',d:'Ficam excluídas as causas de natureza alimentar, falimentar, fiscal, de interesse da Fazenda, acidentes de trabalho, resíduos e estado e capacidade das pessoas (Lei 9.099/95, art. 3º, §2º).'}:
      a.fazenda?{tone:'warn',t:'Juizado da Fazenda Pública ou Federal',d:'Contra Estados e Municípios, o Juizado da Fazenda Pública (Lei 12.153/09); contra a União, o Juizado Especial Federal (Lei 10.259/01). Teto de 60 salários mínimos.'}:
      a.complexa?{tone:'bad',t:'Não cabe no Juizado',d:'A necessidade de perícia complexa afasta a menor complexidade exigida (CF, art. 98, I).'}:
      !a.valor?{tone:'warn',t:'Cabe, renunciando ao excedente',d:'A opção pelo Juizado importa renúncia ao crédito que passar de 40 salários mínimos, salvo conciliação (Lei 9.099/95, art. 3º, §3º).'}:
      {tone:'ok',t:'Cabe no Juizado Especial Cível',d:'Até 20 salários mínimos, sem advogado obrigatório; de 20 a 40, com advogado (art. 9º).'}});
}

function veu(){
  const id=uid('veu');
  const SOC=[['A',[10,40,90,160],'Muito desigual e muito rica no topo'],['B',[25,35,45,55],'Mais igual, com piso mais alto'],['C',[5,60,70,80],'Média alta, mas um grupo abandonado']];
  later(()=>{
    const root=$('#'+id);let pick=null,pos=null;
    function render(){
      $$('.soc',root).forEach((el,i)=>{el.classList.toggle('sel',pick===i);$$('.socb i',el).forEach((b,k)=>{b.classList.toggle('me',pick===i&&pos===k)})});
      const o=$('.wzout',root);
      if(pick==null){o.className='wzout';o.innerHTML='<b>Escolha uma sociedade</b><p>Você não sabe em qual dos quatro grupos vai nascer. Cada barra é a renda de um grupo.</p>';return}
      const s=SOC[pick],v=s[1][pos],best=SOC.reduce((b,x,i)=>Math.min(...x[1])>Math.min(...SOC[b][1])?i:b,0);
      o.className='wzout '+(pick===best?'ok':'warn');
      o.innerHTML=`<b>Você nasceu no grupo ${pos+1}: renda ${v}</b><p>${pick===best?'Você escolheu como Rawls: a sociedade em que o pior lugar é o melhor possível (critério maximin). Sem saber quem você será, garantir o piso é a escolha racional.':`Rawls escolheria a sociedade ${SOC[best][0]}, cujo pior grupo recebe ${Math.min(...SOC[best][1])}. Na ${s[0]}, o pior grupo recebe ${Math.min(...s[1])}: sob o véu da ignorância, você arriscou nascer ali.`}</p>`;swapAnim(o)}
    root.addEventListener('click',e=>{const s=e.target.closest('.soc');if(s){pick=+s.dataset.i;pos=Math.floor(Math.random()*4);render()}});render();
  });
  return `<div id="${id}"><div class="socs">${SOC.map((s,i)=>`<button class="soc" data-i="${i}"><b>Sociedade ${s[0]}</b><div class="socb">${s[1].map(v=>`<i style="height:${v/160*100}%"><span>${v}</span></i>`).join('')}</div><small>${s[2]}</small></button>`).join('')}</div><div class="wzout" aria-live="polite"></div></div>`;
}

/* ================= estado ================= */
/* G: estado do aluno (matéria atual e atividade diária); S: estado da matéria aberta */
const GKEY='inciso-global-v3',CKEY=id=>'inciso-'+id+'-v3';
/* matérias liberadas no lançamento; as demais aparecem como "em breve" */
const LIVE=['tgp','conhecimento','procesp'],isLive=id=>LIVE.includes(id);
let G,S;
function blankLessons(){return Object.fromEntries(MODS.map(m=>[m.live,{seen:{},quiz:null}]))}
function seedCourse(){
  const T=today(),r=rng(20261010),c=COURSE.seed;
  const s={v:3,attempts:[],cards:{},newIntro:{},lessons:blankLessons(),lab:{solved:{}},lastLesson:MODS[0].live,filter:'all'};
  if(!c)return s;
  c.full.forEach(id=>{LESSONS[id].sections.forEach(x=>s.lessons[id].seen[x.id]=1);s.lessons[id].quiz=5});
  Object.entries(c.partial).forEach(([id,secs])=>secs.forEach(k=>s.lessons[id].seen[k]=1));
  s.lastLesson=c.last;
  const order=c.order,p=c.p;
  for(let back=30;back>=1;back--){
    const d=T-back;
    if(back>4&&r()<.35)continue;
    const reach=Math.min(order.length,1+Math.floor((30-back)/3.8));
    const n=3+Math.floor(r()*6);
    for(let i=0;i<n;i++){
      const t=order[Math.min(reach-1,Math.floor(Math.pow(r(),.6)*reach))];
      const pool=BANK.filter(q=>q.t===t),q=pool[Math.floor(r()*pool.length)];
      const prob=Math.min(.97,p[t]-.12+.24*(1-back/30));
      s.attempts.push({q:q.id,t:t,ok:r()<prob,d:d});
    }
    G.activity[d]=(G.activity[d]||0)+n+2+Math.floor(r()*6);
  }
  CARDS.forEach(cd=>{
    const idx=order.indexOf(cd.t);if(idx<0||idx>3)return;
    const ivl=1+Math.floor(r()*8),due=r()<.45?T-Math.floor(r()*3):T+1+Math.floor(r()*8);
    s.cards[cd.id]={ivl:ivl,ease:2.3+r()*.4,due:due,n:2+Math.floor(r()*4)};
  });
  return s;
}
function readJSON(k){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):null}catch(e){return null}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let MEM={};
function loadCourse(id){
  useCourse(id);
  const o=MEM[id]||readJSON(CKEY(id));
  if(o&&o.v===3){S=o;MODS.forEach(m=>{if(!S.lessons[m.live])S.lessons[m.live]={seen:{},quiz:null}});S.lab=S.lab||{solved:{}}}
  else S=seedCourse();
  MEM[id]=S;save();
}
function load(){
  const g=readJSON(GKEY);G=g&&g.v===3?g:{v:3,course:LIVE[0],activity:{}};
  if(!isLive(G.course))G.course=LIVE[0];
  /* garante que toda matéria tenha estado; a de exemplo já vem com histórico */
  LIVE.forEach(id=>{if(!readJSON(CKEY(id))&&!MEM[id])loadCourse(id)});
  loadCourse(G.course);
}
function save(){if(S&&COURSE){MEM[COURSE.id]=S;writeJSON(CKEY(COURSE.id),S)}if(G)writeJSON(GKEY,G)}
function switchCourse(id){if(!COURSES[id]||!isLive(id))return;G.course=id;LAB=null;loadCourse(id);save();if(location.hash==='#painel')route();else location.hash='painel'}
function bump(n){if(!G)return;const T=today();G.activity[T]=(G.activity[T]||0)+(n||1)}

/* ================= métricas ================= */
function attemptsOf(t){return S.attempts.filter(a=>a.t===t)}
function mastery(t){
  const at=attemptsOf(t);if(!at.length)return null;
  const last=at.slice(-10),acc=last.filter(a=>a.ok).length/last.length;
  const cover=Math.min(1,new Set(at.map(a=>a.q)).size/Math.max(1,BANK.filter(q=>q.t===t).length));
  return acc*(.6+.4*cover);
}
function status(m){if(m==null)return['none','Não iniciado'];if(m<.5)return['bad','Atenção'];if(m<.8)return['warn','Em progresso'];return['ok','Dominado']}
function preparo(){return TOPICS.reduce((s,t)=>s+(mastery(t.id)||0),0)/TOPICS.length}
function streak(){const T=today();let d=G.activity[T]?T:T-1,n=0;while(G.activity[d]){n++;d--}return n}
function weakest(){let best=null;TOPICS.forEach(t=>{const m=mastery(t.id);if(m!=null&&(!best||m<best.m))best={id:t.id,m:m}});return best}
function weakSet(){
  const arr=TOPICS.map(t=>({id:t.id,m:mastery(t.id)})).filter(x=>x.m!=null).sort((a,b)=>a.m-b.m);
  const w=arr.filter(x=>x.m<.6).map(x=>x.id);
  return new Set(w.length?w:arr.slice(0,2).map(x=>x.id));
}
function lessonProgress(id){
  const def=LESSONS[id];if(def.progress)return Math.min(1,def.progress());
  const L=S.lessons[id],secs=def.sections.map(s=>s.id),seen=secs.filter(k=>L.seen[k]).length/secs.length;
  return def.noQuiz?seen:seen*.7+(L.quiz!=null?.3:0);
}
function modProg(m){return lessonProgress(m.live)}
function dueQueue(){
  const T=today(),studied=new Set(S.attempts.map(a=>a.t));
  const due=CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=T).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  const left=Math.max(0,5-(S.newIntro[T]||0));
  const fresh=CARDS.filter(c=>!S.cards[c.id]&&studied.has(c.t)).slice(0,left);
  return due.concat(fresh);
}
function record(q,ok,k){S.attempts.push({q:q.id,t:q.t,ok:ok,d:today(),c:k});bump(1);save();refreshNav()}

function dial(v,size,label){
  const C=326.73,off=(C*(1-v)).toFixed(2),n=Math.round(v*100);
  return `<div class="ring" style="width:${size}px;height:${size}px" role="img" aria-label="${label}: ${n}%"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--track)" stroke-width="8"/><circle data-a="ring" data-from="${C}" data-to="${off}" data-d="200" cx="60" cy="60" r="52" fill="none" stroke="var(--sage)" stroke-width="8" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b data-a="count" data-to="${n}" data-suf="%" data-d="200">${n}%</b></div>`;
}

function mountLesson(m){
  const id=m.live,def=LESSONS[id];
  S.lastLesson=id;save();
  if(!def.noQuiz)lessonQuiz(id,m.t);
  trackSections(id);
}
function updateLessonBar(id){const p=lessonProgress(id),b=$('#lprog'),t=$('#lpct');if(b)b.style.width=p*100+'%';if(t)t.textContent=pct(p)}
function lessonQuiz(id,topic){
  const root=$('#'+id+'-qz');if(!root)return;
  const qs=BANK.filter(q=>q.t===topic);
  function start(){mountQuiz(root,shuffle(qs),{onAnswer:record,onDone:(sc,n)=>{
    const L=S.lessons[id];L.quiz=Math.max(L.quiz||0,sc);bump(2);save();updateLessonBar(id);
    root.innerHTML=`<div class="qres swap"><p class="eyebrow">Resultado</p><p class="score num">${sc} de ${n}</p><p>${sc===n?'Gabaritou. O tema já conta como revisado no seu painel.':'Releia as seções em que errou e tente de novo. As questões erradas voltam primeiro nas suas sessões de prática.'}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary qagain">Refazer o teste</button><a class="btn" href="#painel" style="background:none;color:inherit;border-color:currentColor">Ver no painel</a></div></div>`;
    $('.qagain',root).onclick=start;toast('Resultado salvo no seu progresso');
  }})}
  start();
}
let cleanups=[];
function trackSections(id){
  if(!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const k=e.target.dataset.sec,L=S.lessons[id];if(!L.seen[k]){L.seen[k]=1;bump(1);save();updateLessonBar(id)}io.unobserve(e.target)}),{threshold:.2});
  $$('[data-sec]').forEach(s=>io.observe(s));cleanups.push(()=>io.disconnect());
}

function viewQuestoes(){
  const f=S.filter||'all';
  const opts=[['all','Todos os temas',BANK.length],['weak','Pontos fracos',null]].concat(TOPICS.map(t=>[t.id,t.nome,BANK.filter(q=>q.t===t.id).length]));
  const label=f==='all'?'Todos os temas':f==='weak'?'Pontos fracos: '+[...weakSet()].map(t=>TN[t]).join(', '):TN[f];
  return `<header class="vh"><div><p class="eyebrow">Banco de questões</p><h1>Questões</h1><p class="sub">${BANK.length} questões com correção comentada. Sessões de 5; cada resposta atualiza o seu domínio do tema.</p></div></header>
  <div class="filters" id="filters">${opts.map(([k,l,c])=>`<button data-f="${k}" aria-pressed="${k===f}">${l}${c!=null?`<small class="num">${c}</small>`:''}</button>`).join('')}</div>
  <div class="qz" id="qarea"><div class="qstart"><p class="eyebrow">Próxima sessão</p><h2>${label}</h2><p>Primeiro vêm as questões que você ainda não fez e as que errou da última vez.</p><button class="btn primary" id="qgo">Começar 5 questões</button></div></div>`;
}
function pickQs(f){
  let pool=f==='all'?BANK:f==='weak'?BANK.filter(q=>weakSet().has(q.t)):BANK.filter(q=>q.t===f);
  if(!pool.length)pool=BANK;
  const last={};S.attempts.forEach(a=>last[a.q]=a);const T=today();
  const sc=q=>{const l=last[q.id];if(!l)return Math.random();if(!l.ok)return 1+Math.random();return 2+(T-l.d>7?0:.5)+Math.random()*.5};
  return pool.map(q=>[sc(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,5).map(x=>x[1]);
}
function startPractice(){
  const area=$('#qarea');if(!area)return;
  const qs=pickQs(S.filter||'all'),before={};qs.forEach(q=>before[q.t]=mastery(q.t));
  mountQuiz(area,qs,{onAnswer:record,onDone:(sc,n,res,root)=>{
    const ts=[...new Set(qs.map(q=>q.t))];
    root.innerHTML=`<div class="qres swap"><p class="eyebrow">Sessão concluída</p><p class="score num">${sc} de ${n}</p><p>${sc===n?'Gabaritou. ':''}Seu domínio foi atualizado:</p>
      <ul>${ts.map(t=>{const b=before[t],a=mastery(t),d=b==null?null:a-b;return `<li><span>${TN[t]}</span><span class="num">${b==null?'novo':pct(b)} → <b>${pct(a)}</b>${d!=null&&Math.abs(d)>=.005?` <span class="delta ${d>0?'up':'down'}">${d>0?'▲':'▼'}</span>`:''}</span></li>`}).join('')}</ul>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="qagain">Nova sessão</button><a class="btn" href="#desempenho">Ver desempenho</a></div></div>`;
    $('#qagain').onclick=startPractice;
  }});
}
function mountQuestoes(){
  $('#filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;S.filter=b.dataset.f;save();route()});
  $('#qgo').onclick=startPractice;

function previewIvl(id,g){const c=S.cards[id]||{ivl:0,ease:2.5};if(g===0)return 0;if(g===1)return c.ivl<1?1:Math.round(c.ivl*c.ease);return c.ivl<1?3:Math.round(c.ivl*c.ease*1.3)}
const ivlTxt=d=>d===0?'agora':d===1?'amanhã':`em ${d} dias`;
function rate(id,g){
  const T=today();if(!S.cards[id])S.newIntro={[T]:(S.newIntro[T]||0)+1};
  const c=S.cards[id]||{ivl:0,ease:2.5,due:T,n:0},nv=previewIvl(id,g);
  if(g===0){c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=T}else{c.ivl=nv;c.due=T+nv;if(g===2)c.ease+=.15}
  c.n=(c.n||0)+1;S.cards[id]=c;bump(1);save();refreshNav();
}

  rt.onclick=e=>{const b=e.target.closest('button');if(!b)return;doRate(+b.dataset.g)};
}
function doRate(g){const id=rv.queue[rv.i];rate(id,g);if(g===0)rv.queue.push(id);else rv.done++;rv.i++;renderCard()}

function viewDesempenho(){
  const T=today(),A=S.attempts,acc=A.length?A.filter(a=>a.ok).length/A.length:0;
  const w1=A.filter(a=>a.d>T-7),w0=A.filter(a=>a.d<=T-7&&a.d>T-14);
  const a1=w1.length?w1.filter(a=>a.ok).length/w1.length:null,a0=w0.length?w0.filter(a=>a.ok).length/w0.length:null;
  const delta=a1!=null&&a0!=null?a1-a0:null,tracked=Object.keys(S.cards).length;
  const weeks=[];for(let w=4;w>=0;w--){const hi=T-w*7,lo=hi-6,x=A.filter(a=>a.d>=lo&&a.d<=hi);weeks.push({lo,hi,n:x.length,acc:x.length?x.filter(a=>a.ok).length/x.length:null})}
  const errs=[],seen=new Set();for(let i=A.length-1;i>=0&&errs.length<5;i--){const a=A[i];if(!a.ok&&!seen.has(a.q)){seen.add(a.q);errs.push(a)}}
  return `<header class="vh"><div><p class="eyebrow">Seu histórico</p><h1>Desempenho</h1><p class="sub">Como o seu acerto evolui e onde estão os erros que se repetem.</p></div></header>
  <div class="kpis4">
    <div class="kpi">${ic('questao','icd')}<small>Questões resolvidas</small><b class="num">${A.length}</b><span>desde o início</span></div>
    <div class="kpi">${ic('alvo','icd')}<small>Acerto geral</small><b class="num">${pct(acc)}</b><span>todas as questões</span></div>
    <div class="kpi">${ic('grafico','icd')}<small>Acerto em 7 dias</small><b class="num">${a1==null?'—':pct(a1)}</b>${delta!=null?`<span class="delta ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(Math.round(delta*100))} pontos sobre a semana anterior</span>`:'<span>sem comparação</span>'}</div>
    <div class="kpi">${ic('flash','icd')}<small>Flashcards em uso</small><b class="num">${tracked}</b><span>de ${CARDS.length} disponíveis</span></div>
  </div>
  <div class="two">
    <section class="card"><h2>Acerto por semana</h2><p class="hint">Percentual de questões certas em cada semana. A barra dourada é a semana atual.</p>
      <div class="vbars">${[25,50,75,100].map(v=>`<div class="gl" style="bottom:${v/100*196}px"><span>${v}%</span></div>`).join('')}
        ${weeks.map((w,i)=>`<div class="vb">${w.acc!=null?`<b class="num" style="bottom:calc(${w.acc*196}px + 4px)">${pct(w.acc)}</b>`:''}<i class="${i===4?'last':w.acc!=null?'has':''}" style="height:${(w.acc||0)*196}px"></i></div>`).join('')}</div>
      <div class="vlab">${weeks.map((w,i)=>`<span>${i===4?'Esta semana':fmtDay(w.lo)}<small class="num">${w.n} questões</small></span>`).join('')}</div>
    </section>
    <section class="card"><h2>Erros recentes</h2><p class="hint">Questões que você errou na última tentativa.</p>
      ${errs.length?`<ul class="errs">${errs.map(a=>{const q=QB[a.q];return `<li><div><p>${q.q.length>110?q.q.slice(0,108)+'…':q.q}</p><small>${TN[q.t]} · ${q.art} · ${fmtDay(a.d)}</small></div><button class="btn small" data-practice="${q.t}">Refazer</button></li>`}).join('')}</ul>`:'<p class="hint">Nenhum erro registrado.</p>'}
    </section>
  </div>
  <section class="card"><h2>Por tema</h2><p class="hint">Domínio considera o acerto nas últimas 10 tentativas e quantas questões diferentes do tema você já fez.</p>
    <div class="tablewrap"><table><thead><tr><th>Tema</th><th class="r">Tentativas</th><th class="r">Acerto</th><th>Domínio</th><th>Situação</th><th></th></tr></thead><tbody>
    ${TOPICS.map(t=>{const at=attemptsOf(t.id),m=mastery(t.id),s=status(m),ac=at.length?at.filter(a=>a.ok).length/at.length:null;
      return `<tr><td>${rom(t.mod)} – ${t.nome}</td><td class="r num">${at.length}</td><td class="r num">${ac==null?'—':pct(ac)}</td><td><div class="bar ${s[0]}"><i style="width:${(m||0)*100}%"></i></div></td><td>${chip(m)}</td><td class="r"><button class="btn small" data-practice="${t.id}">Praticar</button></td></tr>`}).join('')}
    </tbody></table></div>
  </section>`;
}

function turmaData(){
  const r=rng([...COURSE.id].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7)),n=TOPICS.length,dado=Math.max(2,Math.ceil(n*.75));
  const temas={};TOPICS.forEach((t,i)=>temas[t.id]=i<dado?Math.round((.38+r()*.5)*100)/100:null);
  const fracos=TOPICS.filter(t=>temas[t.id]!=null).sort((a,b)=>temas[a.id]-temas[b.id]);
  const erradas=fracos.slice(0,4).map(t=>{const q=BANK.find(x=>x.t===t.id);const wrong=q.o.find((_,k)=>k!==q.a);return[q.id,Math.round((1-temas[t.id]+r()*.1)*100)/100,wrong]});
  return{alunos:42,ativos:28+Math.floor(r()*8),acerto:Math.round((.58+r()*.12)*100)/100,temas,erradas,dias:Array.from({length:14},()=>8+Math.floor(r()*26)),risco:5+Math.floor(r()*6),pior:fracos[0]};
}
function viewTurma(){
  const T=today(),TURMA=turmaData();
  return `<header class="vh"><div><p class="eyebrow">Visão do professor · turma de exemplo</p><h1>Turma</h1><p class="sub">O que quem ensina vê: onde a turma erra, quem está parado e o que retomar em sala. Dados agregados, sem expor a nota individual de ninguém.</p></div></header>
  <div class="kpis4">
    <div class="kpi"><small>Alunos</small><b class="num">${TURMA.alunos}</b><span>matriculados na plataforma</span></div>
    <div class="kpi"><small>Ativos em 7 dias</small><b class="num">${TURMA.ativos}</b><span>${pct(TURMA.ativos/TURMA.alunos)} da turma</span></div>
    <div class="kpi"><small>Acerto médio</small><b class="num">${pct(TURMA.acerto)}</b><span>nas questões da semana</span></div>
    <div class="kpi alert"><small>Sem estudar há 7+ dias</small><b class="num">${TURMA.risco}</b><span>alunos</span></div>
  </div>
  <div class="insight"><small>Sugestão para a próxima aula</small><p>Retomar "${TURMA.pior.nome}" em sala: é o tema em que a turma mais erra, com ${pct(TURMA.temas[TURMA.pior.id])} de acerto.</p><button class="btn" id="tsend">Enviar revisão do tema à turma</button></div>
  <div class="two">
    <section class="card"><h2>Acerto da turma por tema</h2><p class="hint">A linha tracejada marca 60%, abaixo do qual o tema pede revisão em sala. Temas sem barra ainda não foram dados.</p>
      <div class="hbars">${TOPICS.map(t=>{const v=TURMA.temas[t.id],c=v==null?'':v<.5?'bad':v<.6?'warn':'';return `<div class="hb"><span>${rom(t.mod)} – ${t.nome}</span><div class="track">${v!=null?`<i class="${c}" style="width:${v*100}%"></i>`:''}</div><em class="num">${v==null?'—':pct(v)}</em></div>`}).join('')}</div>
    </section>
    <section class="card"><h2>Questões que a turma mais erra</h2><p class="hint">Com a alternativa errada mais marcada, para saber qual confusão atacar.</p>
      <ul class="wrong">${TURMA.erradas.map(([id,p,alt])=>`<li><b class="num">${pct(p)}</b><div><p>${QB[id].q}</p><small>Mais marcada: "${alt}" · ${QB[id].art}</small></div></li>`).join('')}</ul>
    </section>
  </div>
  <section class="card"><h2>Alunos ativos por dia</h2><p class="hint">Últimos 14 dias.</p>
    <div class="days">${TURMA.dias.map((v,i)=>`<div title="${v} alunos"><i style="height:${v/42*100}%"></i><span class="num">${fmtDay(T-13+i,{day:'2-digit',month:undefined}).slice(0,2)}</span></div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px"><p class="hint" style="margin:0">${TURMA.risco} alunos não estudam há mais de uma semana.</p><button class="btn small" id="tnudge">Enviar lembrete a eles</button></div>
  </section>`;
}
function courseProgress(id){
  const c=COURSES[id],st=MEM[id]||readJSON(CKEY(id));if(!st)return 0;
  return c.mods.reduce((sum,m)=>{const def=LESSONS[m.live],L=st.lessons[m.live]||{seen:{}};if(def.progress&&id===COURSE.id)return sum+Math.min(1,def.progress());
    const secs=def.sections.map(x=>x.id),seen=secs.filter(k=>L.seen&&L.seen[k]).length/secs.length;return sum+(def.noQuiz?seen:seen*.7+(L.quiz!=null?.3:0))},0)/c.mods.length;
}
function viewMaterias(){
  const live=LIVE.map(id=>COURSES[id]),order=['Direito Civil','Direito Penal','Direito Processual','Direito Constitucional','Direito Público','Formação geral'];
  const areas=[];live.forEach(c=>{if(!areas.includes(c.area))areas.push(c.area)});
  const soon=Object.values(COURSES).filter(c=>!isLive(c.id)).sort((x,y)=>order.indexOf(x.area)-order.indexOf(y.area));
  const total=live.reduce((s,c)=>[s[0]+c.mods.length,s[1]+c.bank.length],[0,0]);
  return `<header class="vh banner">${patHTML(48)}<div><p class="eyebrow">Inciso</p><h1>Suas matérias</h1><p class="sub">${live.length} matérias, ${total[0]} aulas interativas e ${total[1]} questões. Cada matéria tem sua trilha, flashcards e progresso; o seu histórico de cada uma fica guardado.</p></div></header>
  ${areas.map(area=>`<section class="unit"><h2>${area}</h2><div class="courses">${live.filter(c=>c.area===area).map(c=>{const p=courseProgress(c.id),cur=c.id===COURSE.id;
    return `<article class="course-card${cur?' cur':''}"><div class="cc-top"><small>${c.area}</small>${cur?'<span class="chip ok">Estudando agora</span>':''}</div>
      <h2>${c.nome}</h2><p>${c.desc}</p>
      <dl class="cc-stats"><div><dt>${ic('aula','icd')}Aulas</dt><dd class="num">${c.mods.length}</dd></div><div><dt>${ic('questao','icd')}Questões</dt><dd class="num">${c.bank.length}</dd></div><div><dt>${ic('flash','icd')}Flashcards</dt><dd class="num">${c.cards.length}</dd></div></dl>
      <div class="bar"><i style="width:${p*100}%"></i></div><small class="num">${pct(p)} da trilha</small>
      <button class="btn ${cur?'':'primary'}" data-course="${c.id}">${cur?'Continuar':'Estudar esta matéria'}</button></article>`}).join('')}</div></section>`).join('')}
  <section class="unit soonu"><h2>${spinSeal()}Em breve</h2><p class="hint">Novas matérias em produção. Elas chegam à plataforma ao longo do semestre.</p><ul class="soonlist">${soon.map((c,i)=>`<li style="--i:${i}">${loader(i*230)}<span>${c.nome}</span><small>${c.area}</small></li>`).join('')}</ul></section>`;
}
function mountMaterias(){const v=$('#view'),h=e=>{const b=e.target.closest('[data-course]');if(!b)return;const id=b.dataset.course;if(id===COURSE.id)location.hash='painel';else{switchCourse(id);toast('Agora estudando '+COURSES[id].nome)}};v.addEventListener('click',h);cleanups.push(()=>v.removeEventListener('click',h))}
function mountTurma(){
  $('#tsend').onclick=()=>toast('No produto, a turma recebe a revisão do tema no painel de cada aluno');
  $('#tnudge').onclick=()=>toast('No produto, esses alunos recebem um lembrete');
}

/* ================= roteamento ================= */
function route(){
  cleanups.forEach(f=>f());cleanups=[];PEND=[];
  const h=(location.hash||'#painel').slice(1),mm=h.match(/^modulo-(\d+)$/),v=$('#view');
  let html,after=null;
  if(mm){currentNav='trilha';const m=MODS.find(x=>x.n===+mm[1]);if(m){html=lessonView(m);after=()=>mountLesson(m)}else html=viewTrilha()}
  else{
    currentNav=['materias','painel','trilha','revisao','questoes','desempenho'].includes(h)?h:'painel';
    html={materias:viewMaterias,painel:viewPainel,trilha:viewTrilha,revisao:viewRevisao,questoes:viewQuestoes,desempenho:viewDesempenho,turma:viewTurma}[currentNav]();
    after={materias:mountMaterias,painel:()=>animateDials(v),revisao:renderCard,questoes:mountQuestoes,turma:mountTurma}[currentNav]||null;
  }
  v.innerHTML=html;refreshNav();runPending();if(after)after();Motion.play(v);
  v.classList.remove('vin');void v.offsetWidth;v.classList.add('vin');
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-practice]');
  if(p){S.filter=p.dataset.practice;S.autoStart=true;save();if(location.hash==='#questoes')route();else location.hash='questoes';return}
  const j=e.target.closest('[data-to]');
  if(j){const el=document.getElementById(j.dataset.to);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const f=e.target.closest('.flip');
  if(f){f.setAttribute('aria-pressed',f.getAttribute('aria-pressed')==='true'?'false':'true');return}
  const st=e.target.closest('.steps button');
  if(st){st.setAttribute('aria-expanded',st.getAttribute('aria-expanded')==='true'?'false':'true')}
});
document.addEventListener('keydown',e=>{
  if(currentNav!=='revisao'||!$('#fc')||e.target.closest('input,textarea'))return;
  if(e.key===' '){e.preventDefault();$('#fc').click()}
  else if(['1','2','3'].includes(e.key)&&!$('#rate').hidden)doRate(+e.key-1);
});
let armed;
$('#reset').addEventListener('click',function(){
  if(!this.classList.contains('armed')){this.classList.add('armed');this.textContent='Confirmar: apagar meu progresso';clearTimeout(armed);armed=setTimeout(()=>{this.classList.remove('armed');this.textContent='Recomeçar demonstração'},4000);return}
  clearTimeout(armed);this.classList.remove('armed');this.textContent='Recomeçar demonstração';
  Object.keys(COURSES).forEach(id=>{try{localStorage.removeItem(CKEY(id))}catch(e){}});try{localStorage.removeItem(GKEY)}catch(e){};MEM={};LAB=null;load();if(location.hash==='#painel'||!location.hash)route();else location.hash='painel';toast('Demonstração recomeçada');
});
function splash(){
  let seen=false;try{seen=!!sessionStorage.getItem('inciso-splash');sessionStorage.setItem('inciso-splash','1')}catch(e){}
  if(seen||Motion.reduce())return;
  const el=document.createElement('div');el.className='splash';
  el.innerHTML=`<div class="row"><span class="mono"><span class="I" data-a="rise" data-d="250">I</span><span class="dash" data-a="draw" style="transform-origin:left center"></span></span><span class="sep" data-a="fade" data-d="300"></span><span class="word" data-a="letters" data-d="1350" data-st="60"><span class="wm-i"><span data-l="1">ı</span><span class="wm-dot" data-a="stamp" data-d="800"></span></span><span data-l="1">n</span><span data-l="1">c</span><span data-l="1">i</span><span data-l="1">s</span><span data-l="1">o</span></span></div><div class="tag" data-a="fade" data-d="2500" data-dur="700">Direto, incisivo.</div><button type="button">Pular abertura</button>`;
  document.body.appendChild(el);Motion.play(el);
  let done=false;const close=()=>{if(done)return;done=true;el.classList.add('out');setTimeout(()=>el.remove(),520)};
  el.addEventListener('click',close);setTimeout(close,3800);
}
/* recolher o menu lateral; a preferência fica neste navegador */
function setSidebar(hide){$('.app').classList.toggle('nosb',hide);document.body.classList.toggle('nosb',hide);try{localStorage.setItem('inciso-nosb',hide?'1':'')}catch(e){}}
$('#sbhide').addEventListener('click',()=>{setSidebar(true);$('#sbshow').focus()});
$('#sbshow').addEventListener('click',()=>{setSidebar(false);$('#sbhide').focus()});
try{if(localStorage.getItem('inciso-nosb'))setSidebar(true)}catch(e){}
window.addEventListener('hashchange',route);
load();route();splash();

})();
</script>
