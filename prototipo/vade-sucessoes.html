{id:`arrolamento`,group:`Sucessões no processo`,title:`Arrolamento, sobrepartilha e inventário negativo`,
intro:`Três figuras que simplificam ou completam o inventário.`,
blocks:[
{t:`vs`,h:`Arrolamento sumário × comum`,l:{t:`Sumário (arts. 659 a 663)`,i:[`Todos capazes e de acordo, ou herdeiro único (adjudicação)`,`Qualquer valor`,`Dispensa primeiras declarações e avaliação: basta o plano de partilha`,`Homologa primeiro; depois o fisco lança o imposto`,`Critério subjetivo: consenso`]},r:{t:`Comum (arts. 664 e 665)`,i:[`Bens até 1.000 salários mínimos`,`Não exige acordo`,`Inventariante apresenta declarações e plano de partilha`,`Paga-se o imposto antes da homologação`,`Com incapaz, se partes e MP concordarem`,`Critério objetivo: valor`]}},
{t:`callout`,kind:`brass`,title:`Para não confundir`,html:`<p><b>Sumário:</b> homologa primeiro, tributa depois. <b>Comum:</b> tributa primeiro, homologa depois.</p>`},
{t:`sorter`,h:`Qual rito?`,bins:[`Arrolamento sumário`,`Arrolamento comum`,`Inventário`],cards:[[`Três herdeiros maiores, todos de acordo, patrimônio de R$ 5 milhões.`,0,`Consenso pleno, valor irrelevante.`],[`Herdeiros brigam, mas os bens somam 300 salários mínimos.`,1,`Valor até 1.000 SM, sem precisar de acordo.`],[`Herdeiros brigam e o patrimônio vale 5.000 salários mínimos.`,2,`Nem consenso, nem valor pequeno.`],[`Herdeiro único, maior.`,0,`Adjudicação pelo rito sumário.`]]},
{t:`table`,h:`Sobrepartilha (arts. 669 e 670)`,hint:`Nova partilha de bens que ficaram de fora, pelo mesmo rito e nos mesmos autos.`,head:[`Bens`,`Por que ficaram de fora`],rows:[[`Sonegados`,`Ocultados de propósito`],[`Descobertos depois da partilha`,`Ninguém sabia`],[`Litigiosos ou de liquidação difícil`,`Atrasariam o resto`],[`Em lugar remoto`,`Difícil apurá-los`]]},
{t:`flips`,h:`Inventário negativo`,items:[[`O que é`,`Inventário para provar que não há bens a partilhar.`],[`Para quê`,`Proteger os herdeiros de credores, já que o herdeiro só responde até as forças da herança (${a(`CC, art. 1.792`)}), e dar publicidade aos credores.`],[`Casamento do viúvo`,`Afasta a causa suspensiva de quem tem filho do falecido e quer casar de novo (${a(`CC, art. 1.523, I`)}).`]]}],
quiz:[[`Arrolamento comum exige acordo?`,[`Sim`,`Não`],1,`O critério é o valor.`],[`Sobrepartilha corre em autos novos?`,[`Sim`,`Não, nos do inventário`],1,`${a(`art. 670, parágrafo único`)}.`]]},

{id:`juizados`,group:`Juizados e jurisdição voluntária`,title:`Juizados Especiais Cíveis`,
intro:`Os Juizados existem para causas menores e simples, com rito oral, rápido e gratuito em primeiro grau (CF, art. 98, I; Lei 9.099/95).`,
blocks:[
{t:`keys`,h:`O microssistema`,items:[[`40`,`salários mínimos`,`Juizado estadual (Lei 9.099/95)`],[`60`,`salários mínimos`,`Juizado federal (Lei 10.259/01) e da Fazenda Pública (Lei 12.153/09)`],[`20`,`salários mínimos`,`limite para litigar sem advogado`],[`10`,`dias`,`prazo do recurso inominado`]]},
{t:`flips`,h:`Critérios (art. 2º)`,items:[[`Oralidade`,`A palavra falada prevalece.`],[`Simplicidade`,`Menos formalidades.`],[`Informalidade`,`A forma cede à finalidade.`],[`Economia`,`Máximo resultado, mínimo de atos.`],[`Celeridade`,`Rapidez.`],[`Conciliação`,`Sempre que possível.`]]},
{t:`vs`,h:`Competência`,l:{t:`Cabe (art. 3º)`,i:[`Causas até 40 salários mínimos`,`Causas do antigo art. 275, II, do CPC/1973 (mantidas pelo ${a(`CPC, art. 1.063`)})`,`Despejo para uso próprio`,`Possessórias de imóveis até 40 SM`,`Dano moral não é, por si só, complexo (FONAJE 69)`]},r:{t:`Não cabe (§2º e enunciados)`,i:[`Alimentar, falimentar, fiscal, Fazenda Pública`,`Acidentes de trabalho`,`Resíduos (herança)`,`Estado e capacidade das pessoas`,`Procedimentos especiais, como monitória (FONAJE 8)`,`Causa que exige perícia complexa (FONAJE 54: complexidade se mede pela prova)`]}},
{t:`callout`,title:`Renúncia ao excedente`,html:`<p>Optar pelo Juizado significa renunciar ao que passar de 40 salários mínimos, <b>salvo em acordo</b> (${a(`art. 3º, §3º`)}). Por isso o juiz alerta as partes na abertura da sessão (${a(`art. 21`)}).</p>`},
{t:`table`,h:`Partes (arts. 8º a 10)`,head:[`Tema`,`Regra`],rows:[[`Não podem ser partes`,`Incapaz, preso, pessoa jurídica de direito público, empresa pública da União, massa falida, insolvente civil`],[`Podem propor`,`Pessoas físicas capazes; MEI, microempresas e empresas de pequeno porte; OSCIP; sociedades de crédito ao microempreendedor`],[`Advogado`,`Dispensável até 20 SM; obrigatório acima e sempre no recurso`],[`Preposto`,`O réu pessoa jurídica pode ser representado por preposto com carta de preposição e poderes para transigir, sem vínculo de emprego`],[`Terceiros`,`Vedada intervenção de terceiros e assistência; admite-se litisconsórcio e o incidente de desconsideração (${a(`CPC, art. 1.062`)})`]]},
{t:`steps`,h:`O rito`,items:[[`Pedido`,`Registrado sem distribuição; sessão de conciliação em 15 dias. Se ambas as partes comparecem, a sessão pode ocorrer na hora.`,`arts. 16 e 17`],[`Citação`,`Por carta com AR em mão própria, pessoa jurídica pelo encarregado da recepção identificado, ou oficial sem mandado. Sem edital (admitido na execução: FONAJE 37).`,`art. 18`],[`Conciliação`,`Conduzida por juiz togado, leigo ou conciliador; acordo homologado é título executivo.`,`arts. 21 e 22`],[`Defesa`,`Oral ou escrita; sem reconvenção, mas com pedido contraposto fundado nos mesmos fatos.`,`arts. 30 e 31`],[`Instrução`,`Até 3 testemunhas por parte, levadas sem intimação; debates não obrigatórios (FONAJE 35).`,`arts. 28 e 34`],[`Sentença`,`Dispensado o relatório; vedada condenação ilíquida.`,`art. 38`],[`Juiz leigo`,`Submete sua decisão ao togado, que homologa, substitui ou manda produzir provas.`,`art. 40`]]},
{t:`sorter`,h:`Quem faltou?`,bins:[`Extinção do processo`,`Revelia`],cards:[[`O autor não foi à sessão de conciliação.`,0,`${a(`art. 51, I`)}.`],[`O réu não foi à audiência de instrução.`,1,`${a(`art. 20`)}: fatos presumidos verdadeiros, salvo convicção do juiz.`]]},
{t:`table`,h:`Recurso inominado e custos`,head:[`Tema`,`Regra`],rows:[[`Cabimento`,`Contra sentença, exceto a homologatória de acordo ou laudo arbitral (${a(`art. 41`)})`],[`Julgamento`,`Turma Recursal de 3 juízes togados de primeiro grau`],[`Prazo`,`10 dias`],[`Preparo`,`Em 48 horas, sem intimação, sob pena de deserção, incluindo custas dispensadas em 1º grau (${a(`arts. 42, §1º e 54`)})`],[`Efeito`,`Em regra só devolutivo; o juiz pode dar efeito suspensivo para evitar dano irreparável (${a(`art. 43`)})`],[`Embargos de declaração`,`5 dias, interrompem o prazo (${a(`arts. 48 a 50`)})`],[`Custas em 1º grau`,`Nenhuma; sem honorários, salvo má-fé (${a(`arts. 54 e 55`)})`],[`Em 2º grau`,`O recorrente vencido paga custas e honorários de 10% a 20%`],[`Execução`,`No próprio Juizado; sem devedor ou bens, extingue-se e os documentos voltam ao autor, que pode cobrar depois (${a(`art. 53, §4º`)})`]]},
{t:`juris`,h:`Súmulas sobre a Turma Recursal`,items:[{court:`STJ`,year:`Súm. 203`,id:`Súmula 203 do STJ`,tese:`Não cabe recurso especial contra decisão de Turma Recursal.`},{court:`STF`,year:`Súm. 640`,id:`Súmula 640 do STF`,tese:`Cabe recurso extraordinário contra decisão de Turma Recursal.`}]}],
quiz:[[`Prazo do recurso inominado:`,[`15 dias`,`10 dias`],1,`${a(`art. 42`)}.`],[`Cabe recurso especial contra acórdão da Turma Recursal?`,[`Sim`,`Não`],1,`${a(`Súmula 203 do STJ`)}.`],[`Cabe reconvenção no Juizado?`,[`Sim`,`Não, só pedido contraposto`],1,`${a(`art. 31`)}.`],[`Mudança de endereço não comunicada: as intimações no antigo são:`,[`ineficazes`,`eficazes`],1,`${a(`art. 19, §2º`)}.`]]},
/* XIII */
{id:`curatela`,group:`Juizados e jurisdição voluntária`,title:`Tutela, curatela e interdição`,
intro:`Dois institutos para suprir capacidade: um pela idade, outro pela falta de discernimento. Processualmente, são jurisdição voluntária.`,
blocks:[
{t:`vs`,h:`Tutela × curatela`,l:{t:`Tutela`,i:[`Pressuposto: menoridade`,`Protegido: pupilo`,`Cabe com a morte dos pais, sua ausência ou perda do poder familiar (${a(`CC, art. 1.728`)})`,`${a(`CC, arts. 1.728 a 1.766`)}`]},r:{t:`Curatela`,i:[`Pressuposto: impossibilidade de exprimir a vontade, total ou parcial`,`Protegido: curatelado`,`Medida extraordinária, proporcional, restrita a atos patrimoniais e negociais (Lei 13.146/2015, arts. 84 e 85)`,`Alternativa: tomada de decisão apoiada (${a(`CC, art. 1.783-A`)})`]}},
{t:`vs`,h:`Guarda × tutela`,l:{t:`Guarda`,i:[`O poder familiar permanece`,`Só o exercício é limitado e transferido ao guardião`,`Família natural`,`Ex.: guarda unilateral, guarda com os avós`]},r:{t:`Tutela`,i:[`Não há poder familiar em exercício`,`Pressupõe morte, ausência, destituição ou suspensão`,`Família substituta`,`Ex.: menor órfão`]}},
{t:`steps`,h:`Interdição (arts. 747 a 758)`,items:[[`Quem pede`,`Cônjuge ou companheiro, parentes ou tutores, representante da entidade de acolhimento ou o MP (este só em doença mental grave ou falta dos demais).`,`arts. 747 e 748`],[`Entrevista`,`O juiz entrevista pessoalmente o interditando.`,`art. 751`],[`Impugnação`,`15 dias após a entrevista.`,`art. 752`],[`Perícia`,`Por equipe multidisciplinar.`,`art. 753`],[`Sentença`,`Fixa os limites da curatela conforme o estado do interditando; é registrada e publicada.`,`art. 755`],[`Levantamento`,`Cessada a causa, a curatela é levantada.`,`art. 756`]]},
{t:`flips`,h:`Regras finais`,items:[[`Compromisso`,`Tutor ou curador presta compromisso em 5 dias (${a(`art. 759`)}).`],[`Escusa`,`Em 5 dias (${a(`art. 760`)}).`],[`Responsabilidade`,`Responde pelos atos do pupilo ou curatelado sob sua autoridade e em sua companhia (${a(`CC, arts. 932, II e 933`)}).`],[`Apelação`,`Contra a sentença de interdição, sem efeito suspensivo (${a(`art. 1.012, §1º, VI`)}).`]]}],
quiz:[[`Na guarda, os pais perdem o poder familiar?`,[`Sim`,`Não`],1,`Só o exercício é limitado.`],[`O juiz deve entrevistar o interditando?`,[`Sim`,`Não`],0,`${a(`art. 751`)}.`]]},
/* XIV */
{id:`alvara`,group:`Juizados e jurisdição voluntária`,title:`Alvará judicial`,
intro:`Alvará é autorização judicial. Serve, entre outras coisas, para levantar pequenos valores deixados por quem morreu, sem inventário.`,
blocks:[
{t:`calc`,kind:`alvara`,h:`Cabe alvará?`,hint:`Marque a situação.`},
{t:`vs`,h:`Os dois artigos da Lei 6.858/80`,l:{t:`Art. 1º`,i:[`FGTS, PIS-PASEP e verbas trabalhistas`,`Independe de inventário, mesmo havendo outros bens (${a(`CPC, art. 666`)})`,`Sem limite de valor`,`Primeiro os dependentes habilitados no INSS; na falta, os sucessores civis`]},r:{t:`Art. 2º`,i:[`Restituição de tributos, saldos bancários, poupança e fundos`,`Só se não houver outros bens a inventariar`,`Até 500 OTN`]}},
{t:`table`,h:`Na prática`,head:[`Tema`,`Regra`],rows:[[`Natureza`,`Jurisdição voluntária (${a(`CPC, art. 725, VII`)})`],[`Custas`,`Devidas`],[`Réu`,`Em regra não há`],[`Justiça`,`Estadual (${a(`Súmula 161 do STJ`)})`],[`Foro`,`Domicílio do requerente; territorial e relativo, sem declinação de ofício`],[`Inicial`,`Origem e valor do crédito, óbito, vínculo, certidões de inexistência de dependentes e de testamento, todos os herdeiros no polo ativo`],[`Menores`,`Quotas depositadas em poupança até a maioridade (Lei 6.858/80, art. 1º, §1º)`]]},
{t:`juris`,h:`Na jurisprudência`,items:[
{court:`TJSC`,year:`2025`,id:`ApCiv 5001043-74.2020.8.24.0119`,tese:`FGTS e PIS se levantam por alvará ainda que haja bens a inventariar.`,html:`Só o art. 2º da Lei 6.858/80 exige ausência de outros bens.`},
{court:`TJSC`,year:`2021`,id:`ApCiv 5005492-75.2020.8.24.0022`,tese:`Alvará para transferir automóvel de pequeno valor, único bem, à viúva meeira.`,html:`Fundamento: art. 723, parágrafo único, do CPC, economia e fim social da norma.`},
{court:`TJSC`,year:`2015`,id:`ApCiv 2012.075423-4`,tese:`Dependentes habilitados excluem os demais sucessores, e o alvará não serve para discutir união estável.`,html:`As filhas menores habilitadas no INSS levantaram o FGTS; a companheira não habilitada, não.`},
{court:`TJSC`,year:`2023`,id:`CC 5058323-98.2022.8.24.0000`,tese:`O foro do alvará é o domicílio dos requerentes, e o juiz não pode declinar de ofício.`,html:`Competência territorial e relativa (${a(`Súmula 33 do STJ`)}).`}]}],
quiz:[[`FGTS do falecido com imóvel a inventariar pode sair por alvará?`,[`Sim`,`Não`],0,`Art. 1º da Lei 6.858/80.`],[`Saldo de poupança acima de 500 OTN sai por alvará?`,[`Sim`,`Não`],1,`Art. 2º.`],[`O alvará serve para provar união estável controvertida?`,[`Sim`,`Não`],1,`Exige ação contenciosa.`]]}
);

/* XV */
{id:`tribunais`,group:`Recursos`,title:`Precedentes e julgamento nos tribunais`,
intro:`O CPC de 2015 aproximou o Brasil, país de lei escrita, dos sistemas de precedentes. Os tribunais devem manter a jurisprudência estável, íntegra e coerente (art. 926).`,
blocks:[
{t:`vs`,h:`Dois sistemas`,l:{t:`Civil law`,i:[`A lei escrita é a fonte principal`,`Tradição brasileira`]},r:{t:`Common law`,i:[`Os casos julgados são fonte do direito`,`O CPC importou os precedentes vinculantes`]}},
{t:`table`,h:`Precedentes que vinculam (art. 927)`,head:[`Inciso`,`Precedente`],rows:[[`I`,`Decisões do STF em controle concentrado de constitucionalidade`],[`II`,`Súmulas vinculantes (${a(`CF, art. 103-A`)})`],[`III`,`Acórdãos em assunção de competência, IRDR e recursos repetitivos`],[`IV`,`Súmulas do STF em matéria constitucional e do STJ em infraconstitucional`],[`V`,`Orientação do plenário ou órgão especial a que estiverem vinculados`]]},
{t:`chooser`,h:`Como o juiz trata o precedente`,hint:`Em todos os casos ele deve se manifestar, até de ofício, ouvindo as partes (art. 10).`,items:[[`Caso análogo`,`Aplica`,`<p>Há dever jurídico de seguir a tese.</p>`],[`Caso diferente`,`Distinguishing`,`<p>Demonstra, fundamentadamente, que o caso tem particularidade que afasta a tese (${a(`art. 489, §1º, VI`)}).</p>`],[`Tese superada`,`Overruling`,`<p>Pode deixar de aplicar, fundamentando a superação; o tribunal pode modular efeitos (${a(`art. 927, §3º`)}).</p>`],[`Silêncio`,`Decisão omissa`,`<p>Não se manifestar sobre tese de repetitivo ou assunção de competência aplicável torna a decisão omissa: cabem embargos de declaração (${a(`art. 1.022, parágrafo único, I`)}).</p>`]]},
{t:`flips`,h:`O relator (arts. 929 a 932)`,items:[[`Distribuição`,`Por alternância, sorteio e publicidade.`],[`Prevenção`,`O primeiro recurso torna prevento o relator para recursos do mesmo processo ou de processo conexo (${a(`art. 930, parágrafo único`)}).`],[`Incumbências`,`Dirigir o processo, homologar acordos, apreciar tutela provisória, intimar o MP.`],[`Não conhecer`,`Recurso inadmissível, prejudicado ou que não impugnou os fundamentos da decisão; antes, 5 dias para sanar vício sanável (${a(`art. 932, III e parágrafo único`)}).`],[`Julgar o mérito sozinho`,`Negar provimento a recurso contrário a súmula, repetitivo ou IRDR; dar provimento, depois das contrarrazões, se a decisão recorrida for contrária a eles (${a(`IV e V`)}).`],[`Recurso`,`Contra a decisão monocrática: agravo interno ao colegiado.`]]},
{t:`callout`,kind:`sage`,title:`Caso: o acidente em Catanduvas`,html:`<p>A ação de danos materiais por um acidente é julgada e a apelação vai à 1ª Câmara de Direito Civil do TJSC. Depois, a vítima propõe outra ação pelo mesmo acidente, pedindo lucros cessantes. O recurso desta segunda ação vai ao <b>mesmo relator</b>: processos conexos, relator prevento.</p>`},
{t:`tl`,h:`A sessão de julgamento`,items:[[`Pauta`,`Publicada com pelo menos 5 dias de antecedência (${a(`art. 935`)}).`],[`Exposição`,`O relator resume a causa.`],[`Sustentação oral`,`15 minutos por parte, nos casos do art. 937, pedida até o início da sessão.`],[`Preliminares`,`Votadas antes do mérito e separadamente; acolhida preliminar incompatível, não se julga o mérito (${a(`art. 938`)}).`],[`Mérito`,`O vencido na preliminar também vota (${a(`art. 939`)}). Vista por até 10 dias (${a(`art. 940`)}).`],[`Resultado`,`Voto vencido é declarado e integra o acórdão; o voto pode mudar até a proclamação (${a(`art. 941`)}). Agravo se julga antes da apelação do mesmo processo (${a(`art. 946`)}).`]]},
{t:`callout`,kind:`brass`,title:`Julgamento decomposto`,html:`<p>Cada fundamento que sozinho sustenta o pedido é votado separadamente. Na apelação que alega pagamento e compensação, basta um fundamento acolhido pela maioria para prover o recurso; se todos acolhem o pagamento, não é preciso examinar a compensação.</p>`},
{t:`vs`,h:`Ampliação do colegiado (art. 942)`,l:{t:`O que é`,i:[`Técnica de julgamento, não recurso: aplica-se de ofício`,`Resultado não unânime: o julgamento prossegue com mais julgadores, em número que permita inverter o resultado`,`Quem já votou pode rever o voto`,`Substituiu os antigos embargos infringentes`]},r:{t:`Quando`,i:[`Apelação: basta não haver unanimidade`,`Ação rescisória: quando o resultado for rescindir a sentença`,`Agravo de instrumento: quando reformar decisão que julgou parcialmente o mérito`,`Não se aplica a IRDR, assunção de competência, remessa necessária e plenário`]}}],
quiz:[[`Súmula do STJ em matéria infraconstitucional vincula?`,[`Sim`,`Não`],0,`${a(`art. 927, IV`)}.`],[`Na apelação, a ampliação do colegiado exige reforma da sentença?`,[`Sim`,`Não, basta não ser unânime`],1,`${a(`art. 942`)}.`],[`Contra decisão monocrática do relator cabe:`,[`agravo de instrumento`,`agravo interno`],1,`${a(`art. 1.021`)}.`]]},
/* XVI */
{id:`teoria-recursos`,group:`Recursos`,title:`Teoria geral dos recursos`,
intro:`Recurso é o meio de pedir, no mesmo processo, que uma decisão seja revista. Só cabe contra o que decide alguma coisa.`,
blocks:[
{t:`table`,h:`Que recurso cabe contra o quê`,head:[`Pronunciamento`,`Recurso`],rows:[[`Despacho`,`Nenhum (${a(`art. 1.001`)})`],[`Interlocutória do rol do art. 1.015`,`Agravo de instrumento`],[`Interlocutória fora do rol`,`Preliminar de apelação ou contrarrazões (${a(`art. 1.009, §1º`)})`],[`Sentença`,`Apelação`],[`Monocrática do relator`,`Agravo interno`],[`Decisão que inadmite REsp ou RE`,`Agravo em REsp ou RE (${a(`art. 1.042`)})`],[`Acórdão sobre lei federal`,`Recurso especial`],[`Acórdão sobre a Constituição`,`Recurso extraordinário`],[`Acórdão em competência originária (casos da CF)`,`Recurso ordinário`],[`Divergência interna nos tribunais superiores`,`Embargos de divergência`],[`Qualquer decisão com omissão, contradição, obscuridade ou erro material`,`Embargos de declaração`]]},
{t:`flips`,h:`Características`,items:[[`Mesma relação processual`,`Recurso não é ação. Mandado de segurança e rescisória são ações autônomas de impugnação.`],[`Adia a coisa julgada`,`Enquanto há recurso pendente, a decisão não é definitiva.`],[`Erro de forma ou de fundo`,`Error in procedendo anula; error in iudicando reforma. Embargos de declaração só esclarecem.`],[`Sem inovação`,`Não se leva ao recurso o que não foi discutido, salvo fato novo (${a(`art. 493`)}), força maior (${a(`art. 1.014`)}), ordem pública e prescrição.`],[`A quo e ad quem`,`Interpõe-se no a quo e julga o ad quem. Exceções: embargos de declaração (mesmo órgão), agravo de instrumento (direto no tribunal) e REsp e RE (admissibilidade no a quo).`],[`Substituição`,`O acórdão que julga o mérito substitui a decisão no que foi impugnado (${a(`art. 1.008`)}); se anula, não substitui.`]]},
{t:`table`,h:`Princípios recursais`,head:[`Princípio`,`Sentido`],rows:[[`Taxatividade`,`Só existem os recursos da lei (${a(`art. 994`)})`],[`Singularidade`,`Um recurso por decisão. Exceções: embargos de declaração junto com outro; REsp e RE contra o mesmo acórdão`],[`Fungibilidade`,`Recurso errado aproveitado se houver dúvida objetiva, sem erro grosseiro, no prazo do certo`],[`Proibição da reformatio in pejus`,`Quem recorre não piora, salvo recurso da outra parte ou matéria de ordem pública`],[`Duplo grau`,`Implícito na Constituição; não absoluto`],[`Dialeticidade`,`O recurso deve atacar os fundamentos da decisão; repetir a inicial não basta (${a(`art. 932, III`)})`],[`Consumação`,`Interposto, não se adita. Exceção: complementaridade, se embargos de declaração da outra parte mudarem a decisão (${a(`art. 1.024, §4º`)})`]]},
{t:`sorter`,h:`Um ato ou dois?`,hint:`Singularidade: conte os atos decisórios.`,bins:[`Dois recursos`,`Um recurso`],cards:[[`Na audiência, o juiz indefere a denunciação da lide; depois, na mesma audiência, profere sentença.`,0,`Dois atos: a interlocutória (preliminar de apelação, se fora do rol) e a sentença. Na prática, a matéria da interlocutória fora do rol vai na própria apelação.`],[`Na sentença, o juiz indefere a denunciação e julga procedente.`,1,`Um ato só, com vários capítulos: apelação (${a(`art. 1.009, §3º`)}).`],[`O juiz concede tutela e, cinco dias depois, sentencia.`,0,`Dois atos: agravo contra a tutela e apelação contra a sentença.`],[`O juiz concede a tutela dentro da sentença.`,1,`Apelação (${a(`art. 1.013, §5º`)}).`]]},
{t:`vs`,h:`Preclusão`,l:{t:`Espécies`,i:[`Temporal: perdeu o prazo`,`Lógica: praticou ato incompatível`,`Consumativa: já praticou o ato`]},r:{t:`Onde reaparece`,i:[`Tempestividade (temporal)`,`Aquiescência (lógica)`,`Desistência e vedação de aditar (consumativa)`]}}],
quiz:[[`Mandado de segurança é recurso?`,[`Sim`,`Não`],1,`É ação autônoma.`],[`Agravo de instrumento é interposto:`,[`no juízo de origem`,`diretamente no tribunal`],1,`${a(`art. 1.016`)}.`],[`Apelação que só copia a contestação:`,[`é conhecida`,`não é conhecida por falta de dialeticidade`],1,`${a(`art. 932, III`)}.`]]},
/* XVII */
{id:`admissibilidade`,group:`Recursos`,title:`Juízo de admissibilidade`,
intro:`Antes de saber se o recorrente tem razão (mérito), o tribunal verifica se o recurso pode ser conhecido (admissibilidade). É matéria de ordem pública.`,
blocks:[
{t:`vs`,h:`Conhecer × prover`,l:{t:`Admissibilidade`,i:[`Conhece ou não conhece`,`Requisitos intrínsecos e extrínsecos`,`Primeiro passo`]},r:{t:`Mérito`,i:[`Dá ou nega provimento`,`Reforma, anula ou mantém`,`Só depois de conhecido`]}},
{t:`chooser`,h:`Requisitos intrínsecos`,hint:`Olham para a decisão recorrida.`,items:[[`Cabimento`,`Recurso previsto e adequado`,`<p>${a(`art. 994`)}.</p>`],[`Legitimidade`,`Quem pode recorrer`,`<p>Parte vencida, terceiro prejudicado com interesse jurídico, MP como parte ou fiscal (${a(`art. 996`)}). O advogado recorre em nome próprio quanto aos honorários. O amicus curiae, só embargos de declaração e no IRDR.</p>`],[`Interesse`,`Sucumbência e utilidade`,`<p>Recorre quem pode melhorar sua situação. O réu que pediu a extinção sem mérito e a obteve não tem interesse; se a extinção veio de ofício e ele queria improcedência, tem. Quem fez acordo homologado, em regra, não tem.</p>`]]},
{t:`chooser`,h:`Requisitos extrínsecos`,hint:`Fatores externos à decisão.`,items:[[`Tempestividade`,`15 dias úteis; embargos, 5`,`<p>Prazo em dobro para MP, Fazenda e Defensoria. Feriado local deve ser comprovado no ato, e o vício é sanável (${a(`art. 1.003, §6º`)}). Embargos de declaração interrompem o prazo para todos, salvo intempestivos (${a(`art. 1.026`)}).</p>`],[`Preparo`,`Custas comprovadas no ato`,`<p>Dispensados MP, Fazenda e beneficiário da gratuidade; embargos de declaração não têm preparo. Sem preparo: recolher em dobro em 5 dias. Preparo a menor: completar em 5 dias. Senão, deserção (${a(`art. 1.007, §§2º e 4º`)}).</p>`],[`Regularidade formal`,`Petição com razões e pedido`,`<p>Vedado aditar depois (preclusão consumativa), salvo complementaridade. Agravo com as peças exigidas (${a(`art. 1.017`)}).</p>`],[`Sem fato impeditivo`,`Renúncia, aquiescência, desistência`,`<p><b>Renúncia</b> ao direito de recorrer, antes de recorrer, sem aceitação da outra parte (${a(`art. 999`)}). <b>Aquiescência</b> expressa ou tácita à decisão (${a(`art. 1.000`)}). <b>Desistência</b> do recurso já interposto, sem anuência (${a(`art. 998`)}).</p>`]]},
{t:`juris`,h:`Preparo depois do expediente`,items:[{court:`STJ`,year:`Súm. 484`,id:`Súmula 484 do STJ`,tese:`Admite-se o preparo no primeiro dia útil seguinte quando o recurso for interposto depois do expediente bancário.`,html:`O STF tem decisões em sentido contrário.`}]},
{t:`callout`,kind:`sage`,title:`Caso: o depósito sem ressalva`,html:`<p>Condenado por danos materiais e morais, o réu deposita o valor total sem ressalva e, dez dias depois, apela só contra os danos morais. O depósito incondicional é ato incompatível com a vontade de recorrer: <b>aquiescência tácita, preclusão lógica</b>. E, mesmo se o recurso fosse conhecido, o tribunal não poderia julgar a ação improcedente, porque só os danos morais foram impugnados.</p>`}],

/* ================= estado ================= */
/* G: estado do aluno (matéria atual e atividade diária); S: estado da matéria aberta */
const GKEY='inciso-global-v3',CKEY=id=>'inciso-'+id+'-v3'+((COURSES[id]&&COURSES[id].ver)||'');
/* matérias liberadas no lançamento; as demais aparecem como "em breve" */
const LIVE=['tgp','conhecimento','procesp'],isLive=id=>LIVE.includes(id);
let G,S;
function blankLessons(){return Object.fromEntries(MODS.map(m=>[m.live,{seen:{},quiz:null}]))}
function seedCourse(){
  const T=today(),r=rng(20261010),c=COURSE.seed;
  const s={v:3,attempts:[],cards:{},newIntro:{},lessons:blankLessons(),lab:{solved:{}},lastLesson:MODS[0].live,filter:'all'};
  if(!c)return s;
  c.full.forEach(id=>{LESSONS[id].sections.forEach(x=>s.lessons[id].seen[x.id]=1);s.lessons[id].quiz=5});
  Object.entries(c.partial).forEach(([id,secs])=>secs.forEach(k=>s.lessons[id].seen[k]=1));
  s.lastLesson=c.last;
  const order=c.order,p=c.p;
  for(let back=30;back>=1;back--){
    const d=T-back;
    if(back>4&&r()<.35)continue;
    const reach=Math.min(order.length,1+Math.floor((30-back)/3.8));
    const n=3+Math.floor(r()*6);
    for(let i=0;i<n;i++){
      const t=order[Math.min(reach-1,Math.floor(Math.pow(r(),.6)*reach))];
      const pool=BANK.filter(q=>q.t===t),q=pool[Math.floor(r()*pool.length)];
      const prob=Math.min(.97,p[t]-.12+.24*(1-back/30));
      s.attempts.push({q:q.id,t:t,ok:r()<prob,d:d});
    }
    G.activity[d]=(G.activity[d]||0)+n+2+Math.floor(r()*6);
  }
  CARDS.forEach(cd=>{
    const idx=order.indexOf(cd.t);if(idx<0||idx>3)return;
    const ivl=1+Math.floor(r()*8),due=r()<.45?T-Math.floor(r()*3):T+1+Math.floor(r()*8);
    s.cards[cd.id]={ivl:ivl,ease:2.3+r()*.4,due:due,n:2+Math.floor(r()*4)};
  });
  return s;
}
function readJSON(k){try{const raw=localStorage.getItem(k);return raw?JSON.parse(raw):null}catch(e){return null}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let MEM={};
function loadCourse(id){
  useCourse(id);
  const o=MEM[id]||readJSON(CKEY(id));
  if(o&&o.v===3){S=o;MODS.forEach(m=>{if(!S.lessons[m.live])S.lessons[m.live]={seen:{},quiz:null}});S.lab=S.lab||{solved:{}}}
  else S=seedCourse();
  MEM[id]=S;save();
}
function load(){
  const g=readJSON(GKEY);G=g&&g.v===3?g:{v:3,course:LIVE[0],activity:{}};
  if(!isLive(G.course))G.course=LIVE[0];
  /* garante que toda matéria tenha estado; a de exemplo já vem com histórico */
  LIVE.forEach(id=>{if(!readJSON(CKEY(id))&&!MEM[id])loadCourse(id)});
  loadCourse(G.course);
}
function save(){if(S&&COURSE){MEM[COURSE.id]=S;writeJSON(CKEY(COURSE.id),S)}if(G)writeJSON(GKEY,G)}
function switchCourse(id){if(!COURSES[id]||!isLive(id))return;G.course=id;LAB=null;loadCourse(id);save();if(location.hash==='#painel')route();else location.hash='painel'}
function bump(n){if(!G)return;const T=today();G.activity[T]=(G.activity[T]||0)+(n||1)}

/* ================= métricas ================= */
function attemptsOf(t){return S.attempts.filter(a=>a.t===t)}
function mastery(t){
  const at=attemptsOf(t);if(!at.length)return null;
  const last=at.slice(-10),acc=last.filter(a=>a.ok).length/last.length;
  const cover=Math.min(1,new Set(at.map(a=>a.q)).size/Math.max(1,BANK.filter(q=>q.t===t).length));
  return acc*(.6+.4*cover);
}
function status(m){if(m==null)return['none','Não iniciado'];if(m<.5)return['bad','Atenção'];if(m<.8)return['warn','Em progresso'];return['ok','Dominado']}
function preparo(){return TOPICS.reduce((s,t)=>s+(mastery(t.id)||0),0)/TOPICS.length}
function streak(){const T=today();let d=G.activity[T]?T:T-1,n=0;while(G.activity[d]){n++;d--}return n}
function weakest(){let best=null;TOPICS.forEach(t=>{const m=mastery(t.id);if(m!=null&&(!best||m<best.m))best={id:t.id,m:m}});return best}
function weakSet(){
  const arr=TOPICS.map(t=>({id:t.id,m:mastery(t.id)})).filter(x=>x.m!=null).sort((a,b)=>a.m-b.m);
  const w=arr.filter(x=>x.m<.6).map(x=>x.id);
  return new Set(w.length?w:arr.slice(0,2).map(x=>x.id));
}
function lessonProgress(id){
  const def=LESSONS[id];if(def.progress)return Math.min(1,def.progress());
  const L=S.lessons[id],secs=def.sections.map(s=>s.id),seen=secs.filter(k=>L.seen[k]).length/secs.length;
  return def.noQuiz?seen:seen*.7+(L.quiz!=null?.3:0);
}
function modProg(m){return lessonProgress(m.live)}
function dueQueue(){
  const T=today(),studied=new Set(S.attempts.map(a=>a.t));
  const due=CARDS.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=T).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  const left=Math.max(0,5-(S.newIntro[T]||0));
  const fresh=CARDS.filter(c=>!S.cards[c.id]&&studied.has(c.t)).slice(0,left);
  return due.concat(fresh);
}
function record(q,ok,k){S.attempts.push({q:q.id,t:q.t,ok:ok,d:today(),c:k});bump(1);save();refreshNav()}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
function chip(m){const s=status(m);return `<span class="chip ${s[0]}">${s[1]}</span>`}
function dial(v,size,label){
  const C=326.73,off=(C*(1-v)).toFixed(2),n=Math.round(v*100);
  return `<div class="ring" style="width:${size}px;height:${size}px" role="img" aria-label="${label}: ${n}%"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--track)" stroke-width="8"/><circle data-a="ring" data-from="${C}" data-to="${off}" data-d="200" cx="60" cy="60" r="52" fill="none" stroke="var(--sage)" stroke-width="8" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><b data-a="count" data-to="${n}" data-suf="%" data-d="200">${n}%</b></div>`;
}

function mountLesson(m){

function updateLessonBar(id){const p=lessonProgress(id),b=$('#lprog'),t=$('#lpct');if(b)b.style.width=p*100+'%';if(t)t.textContent=pct(p)}
function lessonQuiz(id,topic){
  const root=$('#'+id+'-qz');if(!root)return;
  const qs=BANK.filter(q=>q.t===topic);
  function start(){mountQuiz(root,shuffle(qs),{onAnswer:record,onDone:(sc,n)=>{
    const L=S.lessons[id];L.quiz=Math.max(L.quiz||0,sc);bump(2);save();updateLessonBar(id);
    root.innerHTML=`<div class="qres swap"><p class="eyebrow">Resultado</p><p class="score num">${sc} de ${n}</p><p>${sc===n?'Gabaritou. O tema já conta como revisado no seu painel.':'Releia as seções em que errou e tente de novo. As questões erradas voltam primeiro nas suas sessões de prática.'}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary qagain">Refazer o teste</button><a class="btn" href="#painel" style="background:none;color:inherit;border-color:currentColor">Ver no painel</a></div></div>`;
    $('.qagain',root).onclick=start;toast('Resultado salvo no seu progresso');
  }})}
  start();
}
let cleanups=[];
function trackSections(id){
  if(!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const k=e.target.dataset.sec,L=S.lessons[id];if(!L.seen[k]){L.seen[k]=1;bump(1);save();updateLessonBar(id)}io.unobserve(e.target)}),{threshold:.2});
  $$('[data-sec]').forEach(s=>io.observe(s));cleanups.push(()=>io.disconnect());
}

function viewQuestoes(){
  const f=S.filter||'all';
  const opts=[['all','Todos os temas',BANK.length],['weak','Pontos fracos',null]].concat(TOPICS.map(t=>[t.id,t.nome,BANK.filter(q=>q.t===t.id).length]));
  const label=f==='all'?'Todos os temas':f==='weak'?'Pontos fracos: '+[...weakSet()].map(t=>TN[t]).join(', '):TN[f];
  return `<header class="vh"><div><p class="eyebrow">Banco de questões</p><h1>Questões</h1><p class="sub">${BANK.length} questões com correção comentada. Sessões de 5; cada resposta atualiza o seu domínio do tema.</p></div></header>
  <div class="filters" id="filters">${opts.map(([k,l,c])=>`<button data-f="${k}" aria-pressed="${k===f}">${l}${c!=null?`<small class="num">${c}</small>`:''}</button>`).join('')}</div>
  <div class="qz" id="qarea"><div class="qstart"><p class="eyebrow">Próxima sessão</p><h2>${label}</h2><p>Primeiro vêm as questões que você ainda não fez e as que errou da última vez.</p><button class="btn primary" id="qgo">Começar 5 questões</button></div></div>`;

function pickQs(f){
  let pool=f==='all'?BANK:f==='weak'?BANK.filter(q=>weakSet().has(q.t)):BANK.filter(q=>q.t===f);
  if(!pool.length)pool=BANK;
  const last={};S.attempts.forEach(a=>last[a.q]=a);const T=today();
  const sc=q=>{const l=last[q.id];if(!l)return Math.random();if(!l.ok)return 1+Math.random();return 2+(T-l.d>7?0:.5)+Math.random()*.5};
  return pool.map(q=>[sc(q),q]).sort((a,b)=>a[0]-b[0]).slice(0,5).map(x=>x[1]);
}
function startPractice(){

function previewIvl(id,g){const c=S.cards[id]||{ivl:0,ease:2.5};if(g===0)return 0;if(g===1)return c.ivl<1?1:Math.round(c.ivl*c.ease);return c.ivl<1?3:Math.round(c.ivl*c.ease*1.3)}
const ivlTxt=d=>d===0?'agora':d===1?'amanhã':`em ${d} dias`;
function rate(id,g){
  const T=today();if(!S.cards[id])S.newIntro={[T]:(S.newIntro[T]||0)+1};
  const c=S.cards[id]||{ivl:0,ease:2.5,due:T,n:0},nv=previewIvl(id,g);
  if(g===0){c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=T}else{c.ivl=nv;c.due=T+nv;if(g===2)c.ease+=.15}
  c.n=(c.n||0)+1;S.cards[id]=c;bump(1);save();refreshNav();
}

  <section class="card"><h2>Por tema</h2><p class="hint">Domínio considera o acerto nas últimas 10 tentativas e quantas questões diferentes do tema você já fez.</p>
    <div class="tablewrap"><table><thead><tr><th>Tema</th><th class="r">Tentativas</th><th class="r">Acerto</th><th>Domínio</th><th>Situação</th><th></th></tr></thead><tbody>
    ${TOPICS.map(t=>{const at=attemptsOf(t.id),m=mastery(t.id),s=status(m),ac=at.length?at.filter(a=>a.ok).length/at.length:null;
      return `<tr><td>${rom(t.mod)} – ${t.nome}</td><td class="r num">${at.length}</td><td class="r num">${ac==null?'—':pct(ac)}</td><td><div class="bar ${s[0]}"><i style="width:${(m||0)*100}%"></i></div></td><td>${chip(m)}</td><td class="r"><button class="btn small" data-practice="${t.id}">Praticar</button></td></tr>`}).join('')}
    </tbody></table></div>
  </section>`;
}

function turmaData(){
  const r=rng([...COURSE.id].reduce((h,c)=>h*31+c.charCodeAt(0)|0,7)),n=TOPICS.length,dado=Math.max(2,Math.ceil(n*.75));
  const temas={};TOPICS.forEach((t,i)=>temas[t.id]=i<dado?Math.round((.38+r()*.5)*100)/100:null);
  const fracos=TOPICS.filter(t=>temas[t.id]!=null).sort((a,b)=>temas[a.id]-temas[b.id]);
  const erradas=fracos.slice(0,4).map(t=>{const q=BANK.find(x=>x.t===t.id);const wrong=q.o.find((_,k)=>k!==q.a);return[q.id,Math.round((1-temas[t.id]+r()*.1)*100)/100,wrong]});
  return{alunos:42,ativos:28+Math.floor(r()*8),acerto:Math.round((.58+r()*.12)*100)/100,temas,erradas,dias:Array.from({length:14},()=>8+Math.floor(r()*26)),risco:5+Math.floor(r()*6),pior:fracos[0]};
}
function viewTurma(){
  const T=today(),TURMA=turmaData();
  return `<header class="vh"><div><p class="eyebrow">Visão do professor · turma de exemplo</p><h1>Turma</h1><p class="sub">O que quem ensina vê: onde a turma erra, quem está parado e o que retomar em sala. Dados agregados, sem expor a nota individual de ninguém.</p></div></header>
  <div class="kpis4">
    <div class="kpi"><small>Alunos</small><b class="num">${TURMA.alunos}</b><span>matriculados na plataforma</span></div>
    <div class="kpi"><small>Ativos em 7 dias</small><b class="num">${TURMA.ativos}</b><span>${pct(TURMA.ativos/TURMA.alunos)} da turma</span></div>
    <div class="kpi"><small>Acerto médio</small><b class="num">${pct(TURMA.acerto)}</b><span>nas questões da semana</span></div>
    <div class="kpi alert"><small>Sem estudar há 7+ dias</small><b class="num">${TURMA.risco}</b><span>alunos</span></div>
  </div>
  <div class="insight"><small>Sugestão para a próxima aula</small><p>Retomar "${TURMA.pior.nome}" em sala: é o tema em que a turma mais erra, com ${pct(TURMA.temas[TURMA.pior.id])} de acerto.</p><button class="btn" id="tsend">Enviar revisão do tema à turma</button></div>
  <div class="two">
    <section class="card"><h2>Acerto da turma por tema</h2><p class="hint">A linha tracejada marca 60%, abaixo do qual o tema pede revisão em sala. Temas sem barra ainda não foram dados.</p>
      <div class="hbars">${TOPICS.map(t=>{const v=TURMA.temas[t.id],c=v==null?'':v<.5?'bad':v<.6?'warn':'';return `<div class="hb"><span>${rom(t.mod)} – ${t.nome}</span><div class="track">${v!=null?`<i class="${c}" style="width:${v*100}%"></i>`:''}</div><em class="num">${v==null?'—':pct(v)}</em></div>`}).join('')}</div>
    </section>
    <section class="card"><h2>Questões que a turma mais erra</h2><p class="hint">Com a alternativa errada mais marcada, para saber qual confusão atacar.</p>
      <ul class="wrong">${TURMA.erradas.map(([id,p,alt])=>`<li><b class="num">${pct(p)}</b><div><p>${QB[id].q}</p><small>Mais marcada: "${alt}" · ${QB[id].art}</small></div></li>`).join('')}</ul>
    </section>
  </div>
  <section class="card"><h2>Alunos ativos por dia</h2><p class="hint">Últimos 14 dias.</p>
    <div class="days">${TURMA.dias.map((v,i)=>`<div title="${v} alunos"><i style="height:${v/42*100}%"></i><span class="num">${fmtDay(T-13+i,{day:'2-digit',month:undefined}).slice(0,2)}</span></div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px"><p class="hint" style="margin:0">${TURMA.risco} alunos não estudam há mais de uma semana.</p><button class="btn small" id="tnudge">Enviar lembrete a eles</button></div>
  </section>`;
}
function courseProgress(id){
  const c=COURSES[id],st=MEM[id]||readJSON(CKEY(id));if(!st)return 0;
  return c.mods.reduce((sum,m)=>{const def=LESSONS[m.live],L=st.lessons[m.live]||{seen:{}};if(def.progress&&id===COURSE.id)return sum+Math.min(1,def.progress());
    const secs=def.sections.map(x=>x.id),seen=secs.filter(k=>L.seen&&L.seen[k]).length/secs.length;return sum+(def.noQuiz?seen:seen*.7+(L.quiz!=null?.3:0))},0)/c.mods.length;
}
function viewMaterias(){
  const live=LIVE.map(id=>COURSES[id]),order=['Direito Civil','Direito Penal','Direito Processual','Direito Constitucional','Direito Público','Formação geral'];
  const areas=[];live.forEach(c=>{if(!areas.includes(c.area))areas.push(c.area)});
  const soon=Object.values(COURSES).filter(c=>!isLive(c.id)).sort((x,y)=>order.indexOf(x.area)-order.indexOf(y.area));
  return `<header class="vh banner">${patHTML(48)}<div><p class="eyebrow">Inciso</p><h1>Suas matérias</h1></div></header>
  ${areas.map(area=>`<section class="unit"><h2>${area}</h2><div class="courses">${live.filter(c=>c.area===area).map(c=>{const p=courseProgress(c.id),cur=c.id===COURSE.id;
    return `<article class="course-card${cur?' cur':''}"><div class="cc-top"><small>${c.area}</small>${cur?'<span class="chip ok">Estudando agora</span>':''}</div>
      <h2>${c.nome}</h2><p>${c.desc}</p>
      <dl class="cc-stats"><div><dt>${ic('aula','icd')}Aulas</dt><dd class="num">${c.mods.length}</dd></div><div><dt>${ic('questao','icd')}Questões</dt><dd class="num">${c.bank.length}</dd></div><div><dt>${ic('flash','icd')}Flashcards</dt><dd class="num">${c.cards.length}</dd></div></dl>
      <div class="bar"><i style="width:${p*100}%"></i></div><small class="num">${pct(p)} da trilha</small>
      <button class="btn ${cur?'':'primary'}" data-course="${c.id}">${cur?'Continuar':'Estudar esta matéria'}</button></article>`}).join('')}</div></section>`).join('')}
  <section class="unit soonu"><h2>${spinSeal()}Em breve</h2><p class="hint">Novas matérias em produção. Elas chegam à plataforma ao longo do semestre.</p><ul class="soonlist">${soon.map((c,i)=>`<li style="--i:${i}">${loader(i*230)}<span>${c.nome}</span><small>${c.area}</small></li>`).join('')}</ul></section>`;
}
function mountMaterias(){const v=$('#view'),h=e=>{const b=e.target.closest('[data-course]');if(!b)return;const id=b.dataset.course;if(id===COURSE.id)location.hash='painel';else{switchCourse(id);toast('Agora estudando '+COURSES[id].nome)}};v.addEventListener('click',h);cleanups.push(()=>v.removeEventListener('click',h))}
function mountTurma(){
  $('#tsend').onclick=()=>toast('No produto, a turma recebe a revisão do tema no painel de cada aluno');
  $('#tnudge').onclick=()=>toast('No produto, esses alunos recebem um lembrete');
}

/* ================= roteamento ================= */
function route(){
  cleanups.forEach(f=>f());cleanups=[];PEND=[];
  const h=(location.hash||'#painel').slice(1),mm=h.match(/^modulo-(\d+)$/),v=$('#view');
  let html,after=null;
  if(mm){currentNav='trilha';const m=MODS.find(x=>x.n===+mm[1]);if(m){html=lessonView(m);after=()=>mountLesson(m)}else html=viewTrilha()}
  else{
    currentNav=['materias','painel','trilha','revisao','questoes','desempenho'].includes(h)?h:'painel';
    html={materias:viewMaterias,painel:viewPainel,trilha:viewTrilha,revisao:viewRevisao,questoes:viewQuestoes,desempenho:viewDesempenho,turma:viewTurma}[currentNav]();
    after={materias:mountMaterias,painel:()=>animateDials(v),revisao:renderCard,questoes:mountQuestoes,turma:mountTurma}[currentNav]||null;
  }
  v.innerHTML=html;refreshNav();runPending();if(after)after();Motion.play(v);
  v.classList.remove('vin');void v.offsetWidth;v.classList.add('vin');
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-practice]');
  if(p){S.filter=p.dataset.practice;S.autoStart=true;save();if(location.hash==='#questoes')route();else location.hash='questoes';return}
  const j=e.target.closest('[data-to]');
  if(j){const el=document.getElementById(j.dataset.to);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const f=e.target.closest('.flip');
  if(f){f.setAttribute('aria-pressed',f.getAttribute('aria-pressed')==='true'?'false':'true');return}
  const st=e.target.closest('.steps button');
  if(st){st.setAttribute('aria-expanded',st.getAttribute('aria-expanded')==='true'?'false':'true')}
});
document.addEventListener('keydown',e=>{
  if(currentNav!=='revisao'||!$('#fc')||e.target.closest('input,textarea'))return;
  if(e.key===' '){e.preventDefault();$('#fc').click()}
  else if(['1','2','3'].includes(e.key)&&!$('#rate').hidden)doRate(+e.key-1);
});
let armed;
$('#reset')&&$('#reset').addEventListener('click',function(){
  if(!this.classList.contains('armed')){this.classList.add('armed');this.textContent='Confirmar: apagar meu progresso';clearTimeout(armed);armed=setTimeout(()=>{this.classList.remove('armed');this.textContent='Recomeçar demonstração'},4000);return}
  clearTimeout(armed);this.classList.remove('armed');this.textContent='Recomeçar demonstração';
  Object.keys(COURSES).forEach(id=>{try{localStorage.removeItem(CKEY(id))}catch(e){}});try{localStorage.removeItem(GKEY)}catch(e){};MEM={};LAB=null;load();if(location.hash==='#painel'||!location.hash)route();else location.hash='painel';toast('Demonstração recomeçada');
});
function splash(){
  let seen=false;try{seen=!!sessionStorage.getItem('inciso-splash');sessionStorage.setItem('inciso-splash','1')}catch(e){}
  if(seen||Motion.reduce())return;
  const el=document.createElement('div');el.className='splash';
  el.innerHTML=`<div class="row"><span class="mono"><span class="I" data-a="rise" data-d="250">I</span><span class="dash" data-a="draw" style="transform-origin:left center"></span></span><span class="sep" data-a="fade" data-d="300"></span><span class="word" data-a="letters" data-d="1350" data-st="60"><span class="wm-i"><span data-l="1">ı</span><span class="wm-dot" data-a="stamp" data-d="800"></span></span><span data-l="1">n</span><span data-l="1">c</span><span data-l="1">i</span><span data-l="1">s</span><span data-l="1">o</span></span></div><div class="tag" data-a="fade" data-d="2500" data-dur="700">Direto, incisivo.</div><button type="button">Pular abertura</button>`;
  document.body.appendChild(el);Motion.play(el);
  let done=false;const close=()=>{if(done)return;done=true;el.classList.add('out');setTimeout(()=>el.remove(),520)};
  el.addEventListener('click',close);setTimeout(close,3800);
}
/* recolher o menu lateral; a preferência fica neste navegador */
function setSidebar(hide){$('.app').classList.toggle('nosb',hide);document.body.classList.toggle('nosb',hide);try{localStorage.setItem('inciso-nosb',hide?'1':'')}catch(e){}}
$('#sbhide').addEventListener('click',()=>{setSidebar(true);$('#sbshow').focus()});
$('#sbshow').addEventListener('click',()=>{setSidebar(false);$('#sbhide').focus()});
try{if(localStorage.getItem('inciso-nosb'))setSidebar(true)}catch(e){}
window.addEventListener('hashchange',route);
load();route();splash();

})();
</script>
