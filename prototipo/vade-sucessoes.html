<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231B2540'/%3E%3Crect x='8' y='9' width='4' height='14' fill='%23EEF1F5'/%3E%3Crect x='6' y='8' width='8' height='2' fill='%23EEF1F5'/%3E%3Crect x='6' y='22' width='8' height='2' fill='%23EEF1F5'/%3E%3Crect x='16' y='16' width='9' height='2.5' fill='%23EEF1F5'/%3E%3Ccircle cx='23.5' cy='9' r='3.5' fill='%23A3263A'/%3E%3C/svg%3E">
<title>Inciso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de estudo — trilho de navegação à esquerda (barra inferior no celular) + área de trabalho; aulas em coluna de leitura com barra de progresso fixa */
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#1B2540; --muted:#5B6478; --line:#CBD2DE; --soft:#E2E7EF;
  --seal:#A3263A; --brass:#B98A2E; --brass-text:#86621A; --sage:#4F7464;
  --serif:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#131A2B;--sheet:#1B2438;--ink:#E7EBF3;--muted:#9AA4B8;--line:#33405A;--soft:#232E46;--seal:#E0566C;--brass:#D9AE55;--brass-text:#D9AE55;--sage:#7FB09A;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#131A2B;--sheet:#1B2438;--ink:#E7EBF3;--muted:#9AA4B8;--line:#33405A;--soft:#232E46;--seal:#E0566C;--brass:#D9AE55;--brass-text:#D9AE55;--sage:#7FB09A;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:22px;padding:26px 16px 20px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;padding:0 10px}
.brand b{font-family:var(--serif);font-size:1.75rem;font-weight:400;letter-spacing:-.01em}
.brand span{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.course{margin:0 10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
.course small{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.course strong{font-family:var(--serif);font-weight:400;font-size:1.15rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500;transition:background .2s,color .2s}
.nav a:hover{background:var(--soft);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav svg,.tabbar svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .badge{margin-left:auto;font-size:.72rem;font-weight:700;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--seal);color:#fff}
.nav .sep{height:1px;background:var(--line);margin:10px 10px}
.nav .tag{margin-left:auto;font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.demo{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.demo button{align-self:flex-start;border:1px solid var(--line);background:none;border-radius:6px;padding:5px 10px;font-size:.8rem}
.demo button.armed{border-color:var(--seal);color:var(--seal)}

main{min-width:0;overflow-x:clip;padding-block:28px 110px;padding-inline:clamp(16px,4vw,48px)}
.view{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.mtop{display:none}
.tabbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:14px 120px}
  .mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .mtop b{font-family:var(--serif);font-size:1.4rem;font-weight:400}
  .mtop span{font-size:.75rem;color:var(--muted)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--sheet);border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:.64rem;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
  .tabbar a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar a[aria-current="page"]{color:var(--ink)}
  .fc,.fc .in{min-height:340px}
  .fc .f,.fc .b{padding:22px}
  .tabbar a[aria-current="page"] svg{stroke-width:2.2}
  .tabbar .dot{position:absolute;top:2px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--seal)}
}

/* ---------- common ---------- */
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.vh h1{font-size:clamp(2rem,4.6vw,2.9rem);letter-spacing:-.015em}
.vh .sub{color:var(--muted);margin-top:6px;max-width:62ch}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}
.card>h2{font-size:1.45rem;margin-bottom:4px}
.card>.hint{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:9px 16px;font-weight:500;text-decoration:none;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.92}
.btn.small{padding:5px 12px;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--sage)} .chip.warn{color:var(--brass-text)} .chip.bad{color:var(--seal)} .chip.none{color:var(--muted)}
.chip.fill{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.warn i{background:var(--brass)} .bar.bad i{background:var(--seal)} .bar.none i{background:var(--line)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:.92rem;transition:opacity .3s,transform .3s;z-index:50;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:901px){.toast{bottom:32px}}

/* ---------- painel ---------- */
.exam{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:10px;padding:10px 16px;border:1px solid var(--seal);border-radius:8px;color:var(--seal)}
.exam span{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.exam b{font-family:var(--serif);font-size:1.5rem;font-weight:400}
.exam small{grid-column:1/-1;font-size:.75rem;color:var(--muted)}
.top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.prep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.dial{width:132px;height:132px}
.dial .v{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.dial text{font-family:var(--serif);fill:var(--ink)}
.prep h2{font-size:1.45rem}
.prep p{color:var(--muted);font-size:.92rem;margin-top:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi small{font-size:.75rem;color:var(--muted);font-weight:500}
.kpi b{font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi.alert b{color:var(--seal)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px}
.plan .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.plan li.done .ck{background:var(--sage);border-color:var(--sage)}
.plan li.done .ck::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.plan li.done strong{text-decoration:line-through;color:var(--muted)}
.plan strong{display:block;font-weight:600;font-size:.95rem}
.plan small{color:var(--muted);font-size:.82rem}
.cont{margin-top:16px;padding:16px;border-radius:8px;background:var(--ink);color:var(--paper);display:flex;flex-direction:column;gap:10px}
.cont small{opacity:.75;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.cont strong{font-family:var(--serif);font-weight:400;font-size:1.3rem}
.cont .bar{background:color-mix(in srgb,var(--paper) 22%,transparent)}
.cont .bar i{background:var(--brass)}
.cont .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cont .btn{background:var(--brass);border-color:var(--brass);color:#1B2540;font-weight:600}
.mastery{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 40px 104px;gap:12px;align-items:center;padding:9px 6px;border:0;border-bottom:1px solid var(--soft);background:none;text-align:left;border-radius:4px;transition:background .2s}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--soft)}
.mrow span{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow em{font-style:normal;font-size:.85rem;color:var(--muted);text-align:right}
.mrow .chip{justify-self:start}
.heat{display:grid;grid-template-columns:28px repeat(7,minmax(0,1fr));gap:5px;max-width:520px}
.heat .wd{font-size:.7rem;color:var(--muted);text-align:center}
.heat .wl{font-size:.68rem;color:var(--muted);align-self:center}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--soft);display:block}
.heat i.l1{background:color-mix(in srgb,var(--sage) 30%,var(--soft))}
.heat i.l2{background:color-mix(in srgb,var(--sage) 55%,var(--soft))}
.heat i.l3{background:color-mix(in srgb,var(--sage) 80%,var(--soft))}
.heat i.l4{background:var(--sage)}
.heat i.fut{background:none;border:1px dashed var(--line)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.heatwrap{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.heatstats{display:flex;flex-direction:column;gap:14px;min-width:160px}
.heatstats b{font-family:var(--serif);font-weight:400;font-size:1.6rem;display:block;line-height:1.1}
.heatstats small{color:var(--muted);font-size:.8rem}
.legend{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);margin-top:10px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}

/* ---------- trilha ---------- */
.unit{display:flex;flex-direction:column;gap:10px}
.unit h2{font-size:1.25rem;color:var(--muted);font-style:italic}
.mod{display:grid;grid-template-columns:52px minmax(0,1fr) 150px 120px;gap:16px;align-items:center;padding:16px 18px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;text-decoration:none;transition:border-color .2s,transform .2s}
.mod:hover{border-color:var(--ink);transform:translateX(3px)}
.mod .n{font-family:var(--serif);font-size:1.7rem;color:var(--muted);text-align:center}
.mod strong{font-family:var(--serif);font-weight:400;font-size:1.2rem;display:block}
.mod small{color:var(--muted);font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:2px}
.mod .live{color:var(--brass-text);font-weight:600}
.mod .pg{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.mod.lock{opacity:.6}
.mod.lock:hover{transform:none;border-color:var(--line)}
.mod.done .n{color:var(--sage)}
.mod.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}

.modpage{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.modpage .lead{font-family:var(--serif);font-size:1.3rem;line-height:1.45;max-width:52ch}
.arts-mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.arts-mini span{font-size:.82rem;padding:4px 10px;border:1px solid var(--line);border-radius:4px;border-top:3px solid var(--ink)}
.note{border-left:4px solid var(--brass);background:var(--sheet);padding:14px 18px;border-radius:0 8px 8px 0;font-size:.92rem;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}

/* ---------- quiz component ---------- */
.qz{--qbg:var(--sheet);--qfg:var(--ink);background:var(--qbg);color:var(--qfg);border-radius:12px;padding:26px;border:1px solid var(--line)}
.qz.dark{--qbg:var(--ink);--qfg:var(--paper);border-color:var(--ink)}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;opacity:.8;flex-wrap:wrap}
.qbar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--qfg) 15%,transparent);margin:10px 0 20px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brass);transition:width .5s}
.qtext{font-size:1.12rem;line-height:1.5;max-width:64ch}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid color-mix(in srgb,var(--qfg) 25%,transparent);background:none;border-radius:8px;padding:11px 14px;transition:background .2s,border-color .2s}
.opt:hover:not(:disabled){background:color-mix(in srgb,var(--qfg) 8%,transparent)}
.opt .key{width:28px;height:28px;border-radius:50%;border:1px solid color-mix(in srgb,var(--qfg) 35%,transparent);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.opt.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.opt.no{background:var(--seal);border-color:var(--seal);color:#fff;animation:shake .4s}
.opt.ok .key,.opt.no .key{border-color:#fff}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:16px;font-size:.95rem;line-height:1.55;max-width:66ch}
.why .art{display:inline-block;margin-left:6px;font-size:.78rem;padding:1px 8px;border-radius:4px;border:1px solid color-mix(in srgb,var(--qfg) 35%,transparent)}
.qfoot .btn{margin-top:16px}
.qz.dark .btn.primary{background:var(--brass);border-color:var(--brass);color:#1B2540;font-weight:600}
.qres{display:flex;flex-direction:column;gap:14px}
.qres .score{font-family:var(--serif);font-size:2.6rem;line-height:1}
.qres ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.qres li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:.92rem}
.swap{animation:swap .4s}
@keyframes swap{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* ---------- questões ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:.88rem;transition:background .2s,color .2s}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.filters button small{opacity:.7;margin-left:4px}
.qstart{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.qstart h2{font-size:1.6rem}
.qstart p{color:var(--muted);max-width:60ch}

/* ---------- revisão ---------- */
.fcwrap{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.fcmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.fc{perspective:1200px;border:0;background:none;padding:0;width:100%;min-height:300px;text-align:left}
.fc .in{position:relative;width:100%;min-height:300px;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc[aria-pressed="true"] .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.fc .f{background:var(--sheet);border:1px solid var(--line)}
.fc .f p{font-family:var(--serif);font-size:clamp(1.4rem,3.4vw,1.9rem);line-height:1.25}
.fc .f small{color:var(--muted)}
.fc .b{background:var(--ink);color:var(--paper);transform:rotateY(180deg)}
.fc .b p{font-size:1.1rem;line-height:1.55}
.fc .b small{opacity:.7}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rate button{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;transition:border-color .2s}
.rate button small{font-weight:400;font-size:.78rem;color:var(--muted)}
.rate button:nth-child(1):hover{border-color:var(--seal)}
.rate button:nth-child(2):hover{border-color:var(--brass)}
.rate button:nth-child(3):hover{border-color:var(--sage)}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 22px}
.empty h2{font-size:1.8rem}
.empty p{color:var(--muted);max-width:46ch}
.keys{font-size:.78rem;color:var(--muted);text-align:center}
.keys kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--sheet)}

/* ---------- desempenho / turma ---------- */
.kpis4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .delta{font-size:.8rem;font-weight:600}
.delta.up{color:var(--sage)} .delta.down{color:var(--seal)}
.vbars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:end;height:220px;padding-top:24px;border-bottom:1px solid var(--line);position:relative}
.vbars .gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:.68rem;color:var(--muted)}
.vbars .gl span{position:absolute;right:0;top:-16px}
.vb{position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;z-index:1}
.vb i{display:block;border-radius:5px 5px 0 0;background:var(--line);transition:height .8s cubic-bezier(.2,.8,.2,1)}
.vb i.last{background:var(--brass)}
.vb i.has{background:var(--sage)}
.vb b{position:absolute;left:0;right:0;text-align:center;font-size:.85rem;font-weight:600}
.vlab{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:8px;font-size:.75rem;color:var(--muted);text-align:center}
.vlab span small{display:block;opacity:.8}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:560px}
th{text-align:left;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
td.r,th.r{text-align:right}
td .bar{width:110px}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.errs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px}
.errs p{font-size:.92rem}
.errs small{color:var(--muted);font-size:.8rem}
.hbars{display:flex;flex-direction:column;gap:10px;position:relative}
.hb{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:.9rem}
.hb .track{position:relative;height:14px;background:var(--soft);border-radius:4px}
.hb .track i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--sage)}
.hb .track i.warn{background:var(--brass)} .hb .track i.bad{background:var(--seal)}
.hb .track::after{content:"";position:absolute;left:60%;top:-4px;bottom:-4px;border-left:2px dashed var(--ink);opacity:.4}
.hb em{font-style:normal;text-align:right;color:var(--muted)}
.insight{background:var(--ink);color:var(--paper);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:10px}
.insight small{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.insight p{font-family:var(--serif);font-size:1.3rem;line-height:1.4;max-width:60ch}
.insight .btn{align-self:flex-start;background:var(--brass);border-color:var(--brass);color:#1B2540;font-weight:600}
.days{display:flex;gap:6px;align-items:flex-end;height:120px}
.days div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.days i{display:block;width:100%;background:var(--sage);border-radius:3px 3px 0 0}
.days span{font-size:.62rem;color:var(--muted)}
.wrong{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.wrong li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start;padding-bottom:12px;border-bottom:1px solid var(--soft)}
.wrong li:last-child{border-bottom:0}
.wrong b{font-family:var(--serif);font-weight:400;font-size:1.7rem;color:var(--seal);line-height:1}
.wrong p{font-size:.92rem}
.wrong small{color:var(--muted);font-size:.82rem;display:block;margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}

/* ---------- aulas ---------- */
.lbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;gap:14px;padding:10px 14px;margin:0 0 6px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px}
.lbar a{text-decoration:none;font-size:.88rem;font-weight:500;white-space:nowrap}
.lbar .t{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lbar .bar{flex:1;min-width:60px}
.lbar .bar i{background:var(--brass)}
.lbar b{font-size:.85rem;min-width:38px;text-align:right}
.ls{display:flex;flex-direction:column;gap:64px}
.ls p{max-width:66ch}
.lhead{position:relative;display:grid;gap:22px;padding:36px 0 8px}
.ltitle{font-size:clamp(2.6rem,7.4vw,5.6rem);letter-spacing:-.02em}
.ltitle span{display:block;overflow:hidden}
.ltitle span i{display:block;font-style:normal;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.ltitle span:nth-child(2) i{animation-delay:.12s;font-style:italic;color:var(--muted)}
@keyframes rise{to{transform:none}}
.lhead .lead{font-size:1.12rem;color:var(--muted);max-width:52ch}
.lseal{position:absolute;right:0;top:20px;width:min(28vw,250px);aspect-ratio:1;animation:stamp .7s .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{opacity:0;transform:scale(1.5) rotate(-20deg)}100%{opacity:1;transform:scale(1) rotate(-8deg)}}
.lseal svg{width:100%;height:100%}
.lseal .spin{transform-origin:150px 150px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.jump{display:flex;flex-wrap:wrap;gap:8px}
.jump button{border:1px solid var(--line);background:none;padding:7px 14px;border-radius:999px;font-size:.88rem;transition:background .2s,border-color .2s}
.jump button:hover{background:var(--sheet);border-color:var(--ink)}
.lsec{scroll-margin-top:84px}
.lsec>h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:10px}
.lsec>.lead{color:var(--muted);margin-bottom:24px}
.callout{margin-top:20px;border-left:4px solid var(--seal);background:var(--sheet);padding:14px 18px;border-radius:0 8px 8px 0}
.callout b{color:var(--seal)}

.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.flip{perspective:900px;height:190px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip[aria-pressed="true"] .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;padding:20px;display:flex;flex-direction:column;justify-content:space-between}
.flip .f{background:var(--sheet);border:1px solid var(--line)}
.flip .f strong{font-family:var(--serif);font-size:1.5rem;font-weight:400}
.flip .f small{color:var(--muted)}
.flip .b{background:var(--ink);color:var(--paper);transform:rotateY(180deg);font-size:.97rem}
.flip .b em{font-style:normal;color:var(--brass);font-weight:600}

.sim{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:24px}
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
.root{text-align:center;margin-bottom:6px;font-family:var(--serif);font-size:1.2rem}
.root small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--muted)}
.branch{display:flex;flex-direction:column;gap:10px;min-width:0}
.heir{border:1px solid var(--line);border-radius:8px;padding:12px;position:relative;transition:opacity .4s,filter .4s}
.heir.out{opacity:.5;filter:grayscale(1)}
.heir.out::after{content:"Renunciou";position:absolute;top:8px;right:8px;font-size:.7rem;color:var(--seal);border:1.5px solid var(--seal);padding:1px 6px;border-radius:3px;transform:rotate(6deg)}
.heir h4{font-family:var(--sans);font-weight:600;font-size:1rem;margin:0 0 8px}
.pct{font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted);margin-top:4px;display:block}
.heir button{margin-top:10px;border:1px solid var(--ink);background:none;border-radius:999px;padding:4px 12px;font-size:.84rem}
.heir.out button{border-color:var(--seal);color:var(--seal)}
.netos{display:flex;flex-wrap:wrap;gap:6px}
.neto{flex:1 1 60px;border:1px dashed var(--line);border-radius:6px;padding:8px;font-size:.82rem;transition:border-color .4s,background .4s;min-width:0}
.neto.on{border-style:solid;border-color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,transparent)}
.neto .bar i{background:var(--brass)}
.verdict{margin-top:18px;padding:14px 16px;border-radius:6px;background:var(--soft);min-height:56px}
.verdict.flash{animation:flash .6s}
@keyframes flash{0%{background:color-mix(in srgb,var(--brass) 35%,var(--soft))}100%{background:var(--soft)}}
.simctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

.flow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.lane{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:12px}
.lane h3{font-size:1.5rem}
.lane svg{width:100%;height:auto;display:block}
.lane ul{margin:0;padding-left:18px;color:var(--muted);font-size:.95rem}
.coin{transition:transform 1.4s cubic-bezier(.5,0,.2,1)}
.tax{opacity:0;transition:opacity .3s}
.tax.show{opacity:1}

.regimes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.regimes button{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:8px 15px;font-size:.9rem;transition:background .25s,color .25s}
.regimes button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.answer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
.answer .dial{width:96px;height:96px}
.answer .t{font-family:var(--serif);font-size:1.6rem}
.answer p{margin-top:6px;color:var(--muted)}
.answer .art{font-size:.8rem;color:var(--muted);margin-top:8px;display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 8px}

.arts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.art{border:0;background:var(--sheet);border-top:3px solid var(--ink);padding:14px;text-align:left;border-radius:0 0 6px 6px;transition:border-color .2s,transform .2s}
.art:hover,.art[aria-expanded="true"]{border-color:var(--brass);transform:translateY(-3px)}
.art b{font-family:var(--serif);font-size:1.25rem;font-weight:400;display:block}
.art span{font-size:.84rem;color:var(--muted)}
.artdetail{margin-top:12px;background:var(--sheet);border-radius:6px;padding:0 18px;max-height:0;overflow:hidden;transition:max-height .5s,padding .5s}
.artdetail.open{max-height:300px;padding:16px 18px}

/* cônjuge */
.pie{position:absolute;right:0;top:24px;width:min(26vw,230px);aspect-ratio:1}
.pie circle.s{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:st}
.steps li{counter-increment:st}
.steps button{width:100%;height:100%;text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,background .3s}
.steps button::before{content:counter(st);font-family:var(--serif);font-size:2rem;line-height:1;color:var(--brass-text)}
.steps strong{font-weight:600;font-size:.98rem}
.steps span{font-size:.88rem;color:var(--muted);display:none}
.steps button[aria-expanded="true"]{border-color:var(--ink)}
.steps button[aria-expanded="true"] span{display:block;animation:swap .4s}
.calc{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.cin{display:flex;flex-direction:column;gap:14px}
.cin label,.cin .lab{font-weight:600;font-size:.9rem;display:block}
.cin small{display:block;color:var(--muted);font-size:.8rem;margin-top:-2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;background:var(--paper);margin-top:6px;overflow:hidden}
.money span{padding:0 10px;color:var(--muted);font-size:.9rem}
.money input{flex:1;min-width:0;border:0;background:none;padding:9px 10px 9px 0;font:inherit;color:var(--ink);font-variant-numeric:tabular-nums}
.money input:focus{outline:none}
.money:focus-within{outline:3px solid var(--brass);outline-offset:2px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stp{display:flex;align-items:center;gap:8px;margin-top:6px}
.stp button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.1rem;line-height:1}
.stp output{font-family:var(--serif);font-size:1.5rem;min-width:28px;text-align:center}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cout{display:flex;flex-direction:column;gap:16px}
.stack{display:flex;height:44px;border-radius:6px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%;transition:width .7s cubic-bezier(.2,.8,.2,1);border-right:2px solid var(--sheet);min-width:0}
.stack i:last-child{border-right:0}
.seg-meacao{background:repeating-linear-gradient(135deg,var(--brass) 0 6px,color-mix(in srgb,var(--brass) 55%,var(--sheet)) 6px 12px)}
.seg-conj{background:var(--brass)}
.seg-fc{background:var(--sage)}
.seg-fo{background:var(--muted)}
.who{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.who li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.93rem}
.who li i{width:14px;height:14px;border-radius:3px;display:block}
.who b{font-variant-numeric:tabular-nums;font-weight:600}
.who small{color:var(--muted)}
.rule{margin:0;padding:14px 16px 14px 34px;background:var(--soft);border-radius:8px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.rule li::marker{color:var(--brass-text);font-weight:700}
.reserva{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:center}
.reserva input[type=range]{width:100%;accent-color:var(--brass)}
.chk{display:flex;gap:10px;align-items:center;font-size:.92rem;margin-top:14px}
.chk input{width:18px;height:18px;accent-color:var(--seal)}
.rbars{display:flex;flex-direction:column;gap:14px}
.rb{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:.92rem}
.rb .track{height:22px;background:var(--soft);border-radius:4px;overflow:hidden;position:relative}
.rb .track i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.rb .quarter{position:absolute;top:0;bottom:0;left:25%;border-left:2px dashed var(--seal)}
.rb b{text-align:right;font-variant-numeric:tabular-nums}
.rmsg{margin-top:14px;font-size:.93rem;padding:12px 14px;border-radius:6px;background:var(--soft)}

@media (max-width:1000px){
  .top,.cols,.two,.modpage,.calc{grid-template-columns:minmax(0,1fr)}
  .kpis4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .tree,.flow,.reserva{grid-template-columns:minmax(0,1fr)}
  .answer{grid-template-columns:minmax(0,1fr)}
  .lseal,.pie{position:static;width:140px;justify-self:end;margin-top:-10px}
  .prep{grid-template-columns:minmax(0,1fr);justify-items:start}
  .mod{grid-template-columns:40px minmax(0,1fr);gap:10px 12px}
  .mod .pg{grid-column:2}
  .mod .st{grid-column:2}
  .mrow{grid-template-columns:minmax(0,1fr) 40px 96px}
  .mrow .bar{display:none}
  .steps{grid-template-columns:minmax(0,1fr)}
  .steppers{grid-template-columns:minmax(0,1fr)}
  .hb{grid-template-columns:minmax(0,1fr) 44px}
  .hb .track{grid-column:1/-1;grid-row:2}
  .rb{grid-template-columns:90px minmax(0,1fr) 56px}
  .qz{padding:20px}
  .lbar .t{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

/* ================= widgets das aulas ================= */
.lab{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
.hint{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.quote{border-left:4px solid var(--brass);padding:6px 0 6px 20px;margin-bottom:20px}
.quote p{font-family:var(--serif);font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.25;font-style:italic}
.quote small{color:var(--muted)}
.lnext{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}
.lnext .btn{max-width:100%;white-space:normal}

/* classificar */
.cls{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px}
.clshead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:14px}
.clshead span{font-weight:600}
.clshead b{font-size:.85rem;color:var(--muted);font-weight:500}
.clsitems{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.clsitems li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;transition:border-color .3s,background .3s}
.clsitems li.right{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 8%,transparent)}
.clsitems li.wrong{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 7%,transparent)}
.clsb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.clsb button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.84rem;transition:background .2s,border-color .2s}
.clsb button:hover:not(:disabled){border-color:var(--ink)}
.clsb button.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.clsb button.no{background:var(--seal);border-color:var(--seal);color:#fff;animation:shake .4s}
.clsb button:disabled:not(.ok):not(.no){opacity:.45}
.clswhy{grid-column:1/-1;font-size:.9rem;color:var(--muted);animation:swap .35s}
.clswhy b{color:var(--ink)}
.clsend{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;background:var(--soft)}
.clsend[hidden]{display:none}

/* linha do tempo */
.tl{display:flex;flex-direction:column;gap:14px}
.tltrack{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.tlline{position:absolute;left:10%;right:10%;top:11px;height:3px;background:var(--line);border-radius:2px}
.tlfill{display:block;height:100%;width:0;background:var(--brass);border-radius:2px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tlstep{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;text-align:center;min-width:0}
.tlstep .dot{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);background:var(--paper);transition:border-color .3s,background .3s,transform .3s}
.tlstep.on .dot{border-color:var(--brass);background:var(--brass)}
.tlstep[aria-current="step"] .dot{transform:scale(1.25);box-shadow:0 0 0 5px color-mix(in srgb,var(--brass) 25%,transparent)}
.tlstep .lab{font-size:.8rem;font-weight:500;color:var(--muted);line-height:1.25;margin:0}
.tlstep.on .lab{color:var(--ink)}
.tld h3{font-size:1.5rem;margin:2px 0 8px}
.tld p:last-child{max-width:62ch}
.tlnav{display:flex;justify-content:space-between;gap:10px}

/* perguntas sim/não */
.wz{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.wzqs{display:flex;flex-direction:column;gap:8px}
.wzq{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.card .wzq{background:var(--paper)}
.wzq span{font-size:.95rem;flex:1;min-width:180px}
.wzq .seg{margin:0;flex-wrap:nowrap}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 10px;font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.wzout{border-radius:10px;padding:20px;border:2px solid var(--line);background:var(--sheet)}
.wzout b{font-family:var(--serif);font-weight:400;font-size:1.5rem;display:block;line-height:1.2;margin-bottom:6px}
.wzout p{color:var(--muted);font-size:.95rem}
.wzout.ok{border-color:var(--sage)} .wzout.ok b{color:var(--sage)}
.wzout.warn{border-color:var(--brass)} .wzout.warn b{color:var(--brass-text)}
.wzout.bad{border-color:var(--seal)} .wzout.bad b{color:var(--seal)}
.card .wzout{margin-top:16px}

/* abas */
.tabs{display:flex;flex-direction:column;gap:12px}
.tabh{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabh button{border:0;background:none;padding:10px 16px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabh button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:0}
.props div{padding:10px 12px;border:1px solid var(--soft);border-radius:8px}
.props dt{font-size:.75rem;color:var(--muted);margin-bottom:4px}
.props dd{margin:0}
.props .chip{white-space:normal}

/* seletor e contador compactos, árvore */
.seg.mini{margin:4px 0 8px;gap:4px}
.seg.mini button{padding:3px 7px;font-size:.74rem}
.stp.mini{gap:4px;margin:0}
.stp.mini button{width:26px;height:26px;font-size:.9rem}
.stp.mini output{font-size:1.1rem;min-width:18px}
.stp.mini small{color:var(--muted);font-size:.75rem}
.heir[data-st="premorto"]::after{content:"Morreu antes"}
.heir[data-st="indigno"]::after{content:"Indigno"}
.heir[data-st="renunciou"]::after{content:"Renunciou"}
.heir[data-st].out{opacity:.7;filter:none}
.heir[data-st].out h4{text-decoration:line-through}

/* saisine */
.scrub{display:flex;flex-direction:column;gap:14px}
input[type=range]{width:100%;accent-color:var(--brass)}
.szlab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-size:.8rem;color:var(--muted);text-align:center}
.szlab span:first-child{text-align:left}.szlab span:last-child{text-align:right}
.szlab span.on{color:var(--ink);font-weight:600}
.szbens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bem{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bem .row{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.bem small{color:var(--muted);font-size:.8rem}
.own{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--soft)}
.own i{display:block;height:100%;width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.o0{background:var(--ink)}.o1{background:var(--sage)}.o2{background:var(--brass)}.o3{background:var(--seal)}
.szleg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.szleg span{display:flex;align-items:center;gap:6px}
.szleg i{width:12px;height:12px;border-radius:3px;display:block}
.szmsg{padding:12px 14px;border-radius:8px;background:var(--soft);font-size:.95rem;min-height:72px}
.scrub .szplay{align-self:flex-start}

/* comoriência */
.cm{display:flex;flex-direction:column;gap:14px}
.cmstage{position:relative}
.cmrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.p{border:1px solid var(--line);border-radius:8px;padding:14px 10px 38px;text-align:center;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.p b{font-size:.92rem}
.p small{color:var(--muted);font-size:.78rem}
.p span{position:absolute;left:0;right:0;bottom:10px;font-weight:600;font-size:.9rem;color:var(--sage)}
.p.dead{border-style:dashed;background:var(--soft)}
.cm .coin{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--brass) 60%,#fff);transition:transform 1.3s cubic-bezier(.5,0,.2,1);z-index:2}
.cm .coin2{background:var(--sage);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--sage) 60%,#fff)}
.cmmsg{padding:12px 14px;border-radius:8px;background:var(--soft);font-size:.95rem}

/* legítima */
.lg{display:flex;flex-direction:column;gap:16px}
.lgtop{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.lgwrap{position:relative;margin-top:10px}
.lgbar{display:flex;height:52px;border-radius:6px;overflow:hidden;background:var(--soft)}
.lgbar i{display:flex;align-items:center;justify-content:center;height:100%;font-style:normal;font-size:.8rem;font-weight:600;color:#fff;transition:width .6s cubic-bezier(.2,.8,.2,1);overflow:hidden;white-space:nowrap}
.lg-leg{background:var(--sage)}
.lgbar .lg-am{background:var(--brass);color:#1B2540}
.lgbar .lg-her{background:color-mix(in srgb,var(--sage) 45%,var(--sheet));color:var(--ink)}
.lgexc{position:absolute;top:-8px;bottom:-8px;border:2px dashed var(--seal);border-radius:6px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--seal) 25%,transparent) 0 6px,transparent 6px 12px);display:flex;align-items:flex-start;justify-content:center;transition:width .6s;pointer-events:none}
.lgexc span{background:var(--seal);color:#fff;font-size:.7rem;font-weight:700;padding:1px 6px;border-radius:3px;transform:translateY(-60%) rotate(-4deg);text-transform:uppercase;letter-spacing:.06em}
.lgmsg{padding:12px 14px;border-radius:8px;background:var(--soft);font-size:.95rem}

/* dívidas */
.dv{display:flex;flex-direction:column;gap:16px}
.dvin{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dvbars{display:flex;flex-direction:column;gap:8px}
.dvbars>div{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;align-items:center;font-size:.88rem}
.dvbars .track{height:18px;background:var(--soft);border-radius:4px;overflow:hidden}
.dvbars .track i{display:block;height:100%;transition:width .5s}
.dvb-h{background:var(--sage)}.dvb-d{background:var(--seal)}
.dvheirs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dvheirs div{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:2px}
.dvheirs span{font-family:var(--serif);font-size:1.3rem}
.dvheirs small{color:var(--muted);font-size:.78rem}
.dvmsg{padding:12px 14px;border-radius:8px;background:var(--soft);font-size:.95rem}

/* inventariante */
.ivlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ivrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;transition:opacity .3s,border-color .3s,background .3s,transform .3s}
.ivrow.off{opacity:.45}
.ivrow.off b{text-decoration:line-through}
.ivrow.pick{border-color:var(--brass);background:color-mix(in srgb,var(--brass) 12%,transparent);transform:translateX(6px)}
.ivn{font-family:var(--serif);font-size:1.2rem;color:var(--muted);text-align:center}
.ivrow b{display:block;font-weight:600;font-size:.95rem}
.ivrow small{color:var(--muted);font-size:.8rem}
.ivmsg{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--soft);font-size:.95rem}
.sw{position:relative;display:inline-block;width:42px;height:24px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+span{background:var(--sage)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:3px solid var(--brass);outline-offset:2px}

/* preferência e prazos */
.pftrack,.pitrack{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,color-mix(in srgb,var(--brass) 45%,var(--soft)) 0 49.3%,var(--soft) 49.3%);margin:30px 0 8px}
.pitrack{background:linear-gradient(90deg,color-mix(in srgb,var(--sage) 45%,var(--soft)) 0 62.5%,color-mix(in srgb,var(--seal) 30%,var(--soft)) 62.5%)}
.pf180,.pi5{position:absolute;left:49.3%;top:-6px;bottom:-6px;border-left:2px dashed var(--seal)}
.pi5{left:62.5%}
.pf180 span,.pi5 span{position:absolute;bottom:100%;left:-30px;width:60px;text-align:center;font-size:.72rem;color:var(--seal);font-weight:600}
.pfmark,.pimark,.jcmark{position:absolute;top:-5px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--ink);border:3px solid var(--sheet);box-shadow:0 1px 4px rgba(0,0,0,.25);transition:left .25s}

/* monte-mor */
.mw{display:flex;flex-direction:column;gap:16px}
.mwin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.mwrows{display:flex;flex-direction:column;gap:8px}
.mwr{display:grid;grid-template-columns:170px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:.9rem}
.mwr .track{position:relative;height:24px;background:var(--soft);border-radius:4px}
.mwr .track i{position:absolute;top:0;bottom:0;border-radius:4px;transition:left .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1)}
.mwr b{text-align:right;font-weight:600}
.mwr.total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.mwmsg{font-size:.95rem;color:var(--muted)}

/* escada */
.ldt{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}
.ldt button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:.88rem;text-decoration:line-through;color:var(--muted)}
.ldt button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);text-decoration:none}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rung{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:8px;transition:all .4s cubic-bezier(.2,.8,.2,1)}
.rung .rn{font-family:var(--serif);font-size:1.6rem;color:var(--muted);text-align:center}
.rung b{display:block;font-weight:600}
.rung small{color:var(--muted);font-size:.82rem}
.rung em{display:block;font-style:normal;font-size:.82rem;color:var(--brass-text);font-weight:600;margin-top:2px}
.rung .rtag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rung.called{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 12%,transparent);transform:scale(1.02)}
.rung.called .rn,.rung.called .rtag{color:var(--sage)}
.rung.absent{opacity:.4;border-style:dashed}
.rung.below{opacity:.55}
.ldmsg{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--soft);font-size:.95rem}

/* representação no tempo */
.rttrack{position:relative;height:6px;background:var(--line);border-radius:3px;margin:70px 12px 40px}
.rtpai{position:absolute;left:50%;top:-12px;bottom:-12px;border-left:3px solid var(--ink)}
.rtpai span{position:absolute;bottom:calc(100% + 4px);left:-60px;width:120px;text-align:center;font-size:.75rem;font-weight:600;line-height:1.2;font-style:normal}
.rtmark{position:absolute;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--brass);border:3px solid var(--sheet);transition:left .25s}
.rtmark span{position:absolute;top:26px;left:-50px;width:100px;text-align:center;font-size:.75rem;color:var(--brass-text);font-weight:600;font-style:normal}
.rtlegend{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}

/* ascendentes */
.atgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:6px}
.atline{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border-radius:10px}
.atline small{grid-column:1/-1;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.atline.p{background:color-mix(in srgb,var(--sage) 9%,transparent)}
.atline.m{background:color-mix(in srgb,var(--brass) 10%,transparent)}
.atpar{display:flex;justify-content:center}
.atego{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px}
.ego{padding:12px 20px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:600}
.an{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left;min-width:0;width:100%;max-width:220px;transition:border-color .3s,opacity .3s,transform .3s}
.an b{font-size:.88rem;font-weight:600}
.an .av{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.an .ab{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.an .ab i{display:block;height:100%;background:var(--sage);width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.an[data-k="conj"] .ab i{background:var(--brass)}
.an.heir{border-color:var(--sage);transform:translateY(-2px)}
.an.heir .av{color:var(--ink);font-weight:700}
.an.dead{opacity:.45;border-style:dashed}
.an.dead b{text-decoration:line-through}
.atmsg{margin-top:16px}

/* graus de parentesco */
.kin{display:flex;flex-direction:column;gap:10px}
.kintop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kc{display:flex;align-items:baseline;gap:6px}
.kc b{font-family:var(--serif);font-weight:400;font-size:2.4rem;color:var(--brass-text);line-height:1}
.kc small{color:var(--muted)}
.kinsvg{overflow-x:auto}
.kinsvg svg{width:100%;max-width:560px;min-width:300px;display:block;margin:0 auto}
.ke{stroke:var(--line);stroke-width:3;transition:stroke .3s,stroke-width .3s}
.ke.on{stroke:var(--brass);stroke-width:6}
.kn rect{fill:var(--sheet);stroke:var(--line);stroke-width:1.5;transition:fill .3s,stroke .3s}
.kn text{font-family:var(--sans);font-size:14px;fill:var(--ink);pointer-events:none}
.kn{cursor:pointer}
.kn:hover rect,.kn:focus-visible rect{stroke:var(--ink)}
.kn.sel rect{fill:var(--brass);stroke:var(--brass)}
.kn.sel text{fill:#1B2540;font-weight:600}
.kn.ego rect{fill:var(--ink);stroke:var(--ink)}
.kn.ego text{fill:var(--paper);font-weight:600}
.kn.ego{cursor:default}
.kmsg{padding:12px 14px;border-radius:8px;background:var(--soft);font-size:.95rem;min-height:66px}

/* jacente */
.jc{display:flex;flex-direction:column;gap:12px}
.jctrack{position:relative;height:40px;margin-top:6px}
.jcseg{position:absolute;top:18px;height:14px;background:var(--soft);border-right:2px solid var(--sheet);transition:background .3s}
.jcseg:first-child{border-radius:7px 0 0 7px}
.jcseg span{position:absolute;bottom:100%;left:4px;font-size:.68rem;color:var(--muted);white-space:nowrap}
.jcseg.on{background:var(--brass)}
.jcseg.on span{color:var(--ink);font-weight:600}
.jcmark{top:13px}
.jcout{padding:14px 16px;border-radius:8px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.jcwho{font-size:.92rem}

/* formas de testamento */
.scene{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.actor{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:8px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*.12s);min-width:0}
.actor span{font-size:.78rem;line-height:1.25}
.ics{display:flex;gap:2px;justify-content:center}
.ics svg{width:28px;height:28px;fill:none;stroke:var(--brass-text);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.actor.off{border-style:dashed;animation-name:popoff}
.actor.off .ics svg{stroke:var(--muted)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
@keyframes popoff{from{opacity:0}to{opacity:.45}}
.tabp .rule{margin-bottom:16px}

/* laboratório */
.labw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.lb-in{display:flex;flex-direction:column;gap:16px}
.lbrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.lb-filhos{list-style:none;margin:6px 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.lb-filhos li{display:grid;grid-template-columns:56px minmax(0,1fr) auto 28px;gap:6px 10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.lb-filhos li .stp.mini{grid-column:2/4}
.lb-filhos .seg.mini{margin:0}
.lb-filhos .chip{cursor:pointer;background:none}
.lb-del{border:0;background:none;font-size:1.2rem;color:var(--muted);width:28px;height:28px;border-radius:50%;grid-column:4;grid-row:1}
.lb-del:hover{background:var(--soft);color:var(--seal)}
.who li.tot{border-top:1px solid var(--line);padding-top:8px}
.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.case{display:flex;flex-direction:column;gap:12px}
.csq{font-size:1rem;line-height:1.5}
.csopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.csopt{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px;font-weight:600;transition:background .2s,border-color .2s}
.csopt:hover:not(:disabled){border-color:var(--ink)}
.csopt.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.csopt.no{background:var(--seal);border-color:var(--seal);color:#fff;animation:shake .4s}
.cswhy{font-size:.92rem;display:flex;flex-direction:column;gap:10px;animation:swap .4s}
.cswhy[hidden]{display:none}
.cswhy .btn{align-self:flex-start}

@media (max-width:1000px){
  .wz,.labw,.cases{grid-template-columns:minmax(0,1fr)}
  .mwin{grid-template-columns:1fr 1fr}
  .scene{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:720px){
  .clsitems li{grid-template-columns:minmax(0,1fr)}
  .clsb{justify-content:flex-start}
  .szbens,.dvheirs{grid-template-columns:minmax(0,1fr)}
  .cmrow{grid-template-columns:1fr 1fr}
  .dvin,.lbrow{grid-template-columns:minmax(0,1fr)}
  .mwr{grid-template-columns:minmax(0,1fr) 100px}
  .mwr .track{grid-column:1/-1;grid-row:2}
  .mwin{grid-template-columns:minmax(0,1fr)}
  .tlstep .lab{font-size:.68rem}
  .tlnav .btn{flex:1;justify-content:center}
  .lb-filhos li{grid-template-columns:minmax(0,1fr) 28px}
  .lb-filhos li .seg.mini,.lb-filhos li .chip,.lb-filhos li .stp.mini{grid-column:1/-1}
  .lb-del{grid-column:2}
  .csopts{grid-template-columns:minmax(0,1fr)}
  .scene{grid-template-columns:repeat(2,minmax(0,1fr))}
  .atgrid{grid-template-columns:minmax(0,1fr)}
  .lnext .btn{flex:1 1 100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .actor,.actor.off{animation:none}
  .actor.off{opacity:.45}
}

/* ================= Identidade visual Inciso (manual "Inciso Identidade") =================
   Layout: mesma casca do app; o que muda é a pele — tinta sobre papel, cantos retos, réguas de 2px,
   numerais romanos com travessão em latão, selo vermelho só onde há carimbo. */
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#1B2540; --muted:#59627A; --line:#C8CFDB; --soft:#E5E9F0; --track:#DCE1EA;
  --rule:#1B2540; --seal:#A3263A; --brass:#B98A2E; --brass-text:#86621A; --sage:#4F7464; --sage-soft:#E3EDE8; --sage-ink:#33503F;
  --inv-bg:#1B2540; --inv-fg:#EEF1F5; --inv-muted:#C9D0DE; --inv-line:#3A4562; --inv-brass:#D9AE57;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#131A2B;--sheet:#1B2540;--ink:#EEF1F5;--muted:#A3ADC2;--line:#2E3A58;--soft:#222D48;--track:#3A4766;--rule:#EEF1F5;--seal:#E0566B;--brass:#D9AE57;--brass-text:#D9AE57;--sage:#82B29B;--sage-soft:#20342C;--sage-ink:#A9D3BE;--inv-bg:#25314F;--inv-fg:#EEF1F5;--inv-muted:#C9D0DE;--inv-line:#3A4766;--inv-brass:#D9AE57;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#131A2B;--sheet:#1B2540;--ink:#EEF1F5;--muted:#A3ADC2;--line:#2E3A58;--soft:#222D48;--track:#3A4766;--rule:#EEF1F5;--seal:#E0566B;--brass:#D9AE57;--brass-text:#D9AE57;--sage:#82B29B;--sage-soft:#20342C;--sage-ink:#A9D3BE;--inv-bg:#25314F;--inv-fg:#EEF1F5;--inv-muted:#C9D0DE;--inv-line:#3A4766;--inv-brass:#D9AE57;color-scheme:dark}

/* cantos retos em tudo; só o que é ponto, moeda ou marcador continua redondo */
*,*::before,*::after{border-radius:0!important}
.coin,.tlstep .dot,.pfmark,.pimark,.jcmark,.rtmark,.tabbar .dot,.wm-dot,.nowdot{border-radius:50%!important}
::selection{background:color-mix(in srgb,var(--seal) 22%,transparent)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* marca */
.wm{font:400 30px/1 var(--serif);color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.wm-i{position:relative;display:inline-block}
.wm-dot{position:absolute;left:50%;top:-.02em;width:.21em;height:.21em;margin-left:-.08em;background:var(--seal)}
.brand{flex-direction:column;align-items:flex-start;gap:6px}
.brand small{font:italic 400 14px/1 var(--serif);color:var(--muted)}
.mtop .wm{font-size:26px}
.inc{font-family:var(--serif);font-weight:400;white-space:nowrap}
.inc i{font-style:normal;color:var(--brass)}
.dash{display:inline-block;width:.5em;height:.07em;background:var(--brass);vertical-align:.29em;margin-left:.14em}

/* casca */
.side{border-right:2px solid var(--rule)}
.course{border:2px solid var(--rule);background:transparent}
.nav a{border-radius:0;color:var(--muted)}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav svg,.tabbar svg{stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.nav .badge{background:var(--seal);font-weight:600}
.demo{border-top:2px solid var(--rule)}
.demo button{border:2px solid var(--rule);font-weight:600}
@media (max-width:900px){.tabbar{border-top:2px solid var(--rule);background:var(--paper)}}

/* superfícies e réguas */
.card,.kpi,.mod,.sim,.lane,.answer,.cls,.qz,.exam,.note,.callout{border:2px solid var(--rule)}
.card,.kpi,.mod,.sim,.lane,.answer,.cls{background:var(--sheet)}
.kpis,.kpis4{gap:2px;background:var(--rule);border:2px solid var(--rule)}
.kpis .kpi,.kpis4 .kpi{border:0}
.kpi b{font-size:2rem}
.exam{color:var(--seal);border-color:var(--seal)}
.callout{border-left:6px solid var(--seal)}
.note{border-left:6px solid var(--brass)}
.eyebrow{color:var(--muted);letter-spacing:.1em}

/* botões: rótulo à esquerda, régua de 2px */
.btn{border:2px solid var(--rule);background:transparent;color:var(--ink);font-weight:600;justify-content:flex-start;transition:background .12s,color .12s,border-color .12s}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{background:color-mix(in srgb,var(--ink) 84%,var(--paper));opacity:1}
.cont .btn,.insight .btn,.qz.dark .btn.primary{background:var(--inv-fg);color:var(--inv-bg);border-color:var(--inv-fg)}
.cont .btn:hover,.insight .btn:hover,.qz.dark .btn.primary:hover{background:transparent;color:var(--inv-fg)}
.qz.dark .qres .btn:not(.primary){color:var(--inv-fg);border-color:var(--inv-fg)}

/* blocos invertidos (tinta) */
.cont,.insight,.fc .b,.flip .b,.ego,.kn.ego rect{background:var(--inv-bg);color:var(--inv-fg)}
.kn.ego rect{fill:var(--inv-bg);stroke:var(--inv-bg)}.kn.ego text{fill:var(--inv-fg)}
.flip .b em{color:var(--inv-brass)}
.qz.dark{--qbg:var(--inv-bg);--qfg:var(--inv-fg);border-color:var(--inv-bg)}
.cont small{color:var(--inv-muted);opacity:1}
.cont .bar{background:var(--inv-line)}
.insight small{color:var(--inv-muted);opacity:1}

/* progresso e acerto em sálvia */
.bar{background:var(--track)}
.lbar .bar i,.cont .bar i,.qbar i,.tlfill{background:var(--sage)}
.mod .bar.warn i{background:var(--sage)}
.plan li.done .ck{background:var(--sage);border-color:var(--sage)}
.plan .ck{border-width:2px}
.chip{border-width:1.5px;font-weight:600}
.chip.ok{background:var(--sage-soft);color:var(--sage-ink);border-color:var(--sage-soft)}
.vb i.has{background:var(--sage)} .vb i.last{background:var(--ink)}
.tlstep.on .dot{border-color:var(--sage);background:var(--sage)}
.tlstep[aria-current="step"] .dot{box-shadow:0 0 0 5px color-mix(in srgb,var(--sage) 25%,transparent)}

/* listas e escolhas */
.seg button,.regimes button,.filters button,.clsb button,.ldt button,.tabh button{font-weight:600}
.seg button[aria-pressed="true"],.regimes button[aria-pressed="true"],.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.regimes button,.filters button{border:2px solid var(--rule)}
.opt{border-width:1.5px}
.mrow{border-bottom:1px solid var(--line)}
.rule{list-style:none;padding:14px 16px;counter-reset:r;background:var(--soft);border-left:2px solid var(--rule)}
.rule li{counter-increment:r;display:grid;grid-template-columns:44px minmax(0,1fr);align-items:baseline}
.rule li::before{content:counter(r,upper-roman) " –";font-family:var(--serif);color:var(--brass-text);white-space:nowrap}
.rule li::marker{content:none}
.steps button::before{content:counter(st,upper-roman) " –";font-size:1.6rem}
.mod .n{font-family:var(--serif);font-size:1.25rem;color:var(--ink);text-align:left;white-space:nowrap}
.mod .n i{font-style:normal;color:var(--brass)}
.mod.done .n{color:var(--ink)}
.mod.cur{border-color:var(--seal);box-shadow:none}
.mod:hover{border-color:var(--ink);transform:translateX(4px)}
.ivn{color:var(--ink)}

/* cabeçalhos com padrão de algarismos */
.pat{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px 14px;padding:14px 0 0 30%;pointer-events:none;overflow:hidden;user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 80%);mask-image:linear-gradient(90deg,transparent 30%,#000 80%)}
.pat span{display:block;height:4px;background:var(--seal);opacity:.28}
.pat span.o{background:transparent;outline:2px solid var(--seal);outline-offset:-2px;height:4px}
.vh.banner{position:relative;overflow:hidden;border:2px solid var(--rule);padding:28px clamp(18px,3vw,32px);background:var(--paper)}
.vh.banner>*{position:relative}

/* barra da aula */
.lbar{border:2px solid var(--rule);background:color-mix(in srgb,var(--paper) 92%,transparent)}
.lbar a{font-weight:600}

/* capa da aula (aplicação "capa de aula" do manual) */
.lhead{position:relative;overflow:hidden;background:var(--inv-bg);color:var(--inv-fg);padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:22px;margin-top:4px}
.lhead>*{position:relative}
.lhead .pat{position:absolute}
.lhead .pat span{opacity:.55}
.ctop{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--inv-fg);font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase}
.ltitle{max-width:68%;font-size:clamp(2.6rem,7vw,5.6rem);line-height:.98}
.ltitle span i{transform:none;animation:none;color:var(--inv-fg)}
.ltitle span:nth-child(2) i{color:var(--inv-fg);font-style:italic}
.lhead .lead{color:var(--inv-muted);max-width:56ch}
.lincs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 26px;max-width:80%}
.lincs div{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--inv-brass);padding-top:10px;font-size:.88rem;line-height:1.35}
.lincs b{font:400 1.05rem/1 var(--serif);color:var(--inv-brass)}
.jump button{border:2px solid var(--inv-fg);color:var(--inv-fg);font-weight:600;background:transparent}
.jump button:hover{background:var(--inv-fg);color:var(--inv-bg)}
.lseal{position:absolute;right:5%;top:96px;width:clamp(130px,19vw,240px);animation:none;transform:rotate(-8deg)}
.lseal .spin{transform-origin:100px 100px;animation:spin 30s linear infinite}
.lsec{border-top:2px solid var(--rule);padding-top:24px;scroll-margin-top:84px}
.lsec>h2{display:flex;align-items:baseline;gap:.45em;flex-wrap:wrap}
.lsec>h2 .inc{font-size:.72em;color:var(--ink)}
.ls{gap:56px}
.lnext{border-top:2px solid var(--rule)}

/* abertura animada (splash) */
.splash{position:fixed;inset:0;z-index:100;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:.5em;padding:0 9%;transition:opacity .48s var(--ease)}
.splash.out{opacity:0;pointer-events:none}
.splash .row{display:flex;align-items:center;gap:.32em;font-size:clamp(48px,9vw,124px)}
.splash .mono{font-family:var(--serif);line-height:1;white-space:nowrap}
.splash .mono .I{display:inline-block}
.splash .sep{width:2px;height:.8em;background:var(--ink)}
.splash .word{font-family:var(--serif);line-height:1;white-space:nowrap}
.splash .word span{display:inline-block}
.splash .wm-dot{box-shadow:inset 0 0 0 .026em var(--seal),inset 0 0 0 .042em var(--paper);transform:rotate(-8deg)}
.splash .tag{font:italic 400 clamp(18px,2.4vw,32px)/1.2 var(--serif)}
.splash button{position:absolute;left:clamp(16px,4vw,32px);bottom:calc(24px + env(safe-area-inset-bottom,0px));border:2px solid var(--rule);background:transparent;padding:9px 12px;font:600 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.splash button:hover{background:var(--ink);color:var(--paper)}

/* ícones da marca no cabeçalho de conceito */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter;flex:none}

@media (max-width:720px){
  .ltitle{max-width:100%}
  .lincs{max-width:100%}
  .lseal{position:static;width:120px;order:10;margin:-6px 0 0 auto}
}
@media (prefers-reduced-motion:reduce){
  .splash{display:none}
  .lseal .spin{animation:none}
}

.lincs button{background:none;border:0;border-top:2px solid var(--inv-brass);color:var(--inv-fg);text-align:left;padding:10px 0 0;font:500 .9rem/1.35 var(--sans);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .12s}
.lincs button:hover{border-top-color:var(--inv-fg)}
.lincs button b{font:400 1.05rem/1 var(--serif);color:var(--inv-brass)}
.ring{position:relative;flex:none}
.ring svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 2.1rem/1 var(--serif)}
.wm-i [data-l]{display:inline-block}
.lsec>h2>span:last-child{flex:1;min-width:0}
.vh.banner>.pat{position:absolute}
.brand .wm,.mtop .wm{text-transform:none;letter-spacing:-.01em;color:var(--ink)}
.brand .wm{font-size:30px}
.brand .wm span,.mtop .wm span{font-size:inherit;text-transform:none;letter-spacing:0;color:inherit}
.brand .wm .wm-dot,.mtop .wm .wm-dot{background:var(--seal)}
.lhead .lead{max-width:min(56ch,62%)}
@media (max-width:720px){.lhead .lead{max-width:100%}}

/* ===== acentos: menos azul, mais Selo / Latão / Sálvia =====
   Selo = ação e destaque; Latão = numerais e títulos de seção; Sálvia = progresso e acerto */
:root{--on-seal:#FFFFFF;--seal-soft:#F6E4E7;--brass-soft:#F5ECDA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on-seal:#131A2B;--seal-soft:#3A2233;--brass-soft:#3A3426}}
:root[data-theme="dark"]{--on-seal:#131A2B;--seal-soft:#3A2233;--brass-soft:#3A3426}

/* ações */
.btn.primary{background:var(--seal);color:var(--on-seal);border-color:var(--seal)}
.btn:hover,.btn.primary:hover{background:color-mix(in srgb,var(--seal) 85%,#000);color:var(--on-seal);border-color:color-mix(in srgb,var(--seal) 85%,#000)}
.nav a[aria-current="page"]{background:var(--seal-soft);color:var(--ink);box-shadow:inset 4px 0 0 var(--seal)}
.seg button[aria-pressed="true"],.regimes button[aria-pressed="true"],.filters button[aria-pressed="true"],.ldt button[aria-pressed="true"]{background:var(--seal);color:var(--on-seal);border-color:var(--seal)}
.chip.fill{background:var(--seal);color:var(--on-seal);border-color:var(--seal)}

/* cabeçalhos e títulos */
.eyebrow{color:var(--seal)}
.vh.banner{border-color:var(--rule);border-top:6px solid var(--seal)}
.unit>h2{color:var(--brass-text);font-style:normal;display:flex;align-items:center;gap:10px}
.unit>h2::before{content:"";width:22px;height:3px;background:var(--seal);flex:none}
.course-card{border-top:6px solid var(--seal)}
.course-card.cur{background:var(--sheet);border-top-color:var(--sage)}
.course-card h2{color:var(--ink)}
.cc-stats{border-top-color:var(--brass)}
.cc-stats dd{color:var(--brass-text)}

/* números do painel: cada indicador com sua cor */
.kpi{border-top:4px solid var(--brass)}
.kpis .kpi,.kpis4 .kpi{border-top:4px solid var(--brass)}
.kpis .kpi:nth-child(3n+1),.kpis4 .kpi:nth-child(3n+1){border-top-color:var(--sage)}
.kpis .kpi:nth-child(3n+2),.kpis4 .kpi:nth-child(3n+2){border-top-color:var(--brass)}
.kpis .kpi:nth-child(3n),.kpis4 .kpi:nth-child(3n){border-top-color:var(--seal)}
.kpi b{color:var(--ink)}
.kpi.alert b{color:var(--seal)}

/* blocos que eram azul-marinho */
.flip .b,.fc .b{background:var(--seal);color:var(--on-seal)}
.insight{background:var(--brass-soft);color:var(--ink);border-left:6px solid var(--brass)}
.cont{background:var(--sage-soft);color:var(--sage-ink);border-left:6px solid var(--sage)}
.cont .bar{background:color-mix(in srgb,var(--sage) 25%,transparent)}
.cont .bar i{background:var(--sage)}
.lbar .bar i{background:var(--sage)}

/* menu lateral recolhível (só no computador; no celular a navegação é a barra inferior) */
.sbtog{position:absolute;top:22px;right:12px;background:none;border:0;color:var(--muted);font:600 .72rem/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:6px 4px}
.sbtog:hover{color:var(--seal)}
.side{position:sticky}
.sbopen{display:none;position:fixed;top:16px;left:16px;z-index:40;align-items:center;gap:8px;background:var(--sheet);color:var(--ink);border:2px solid var(--rule);border-left:5px solid var(--seal);font:600 .8rem/1 var(--sans);padding:9px 12px;cursor:pointer}
.sbopen:hover{background:var(--seal-soft)}
.app.nosb{grid-template-columns:minmax(0,1fr)}
.app.nosb .side{display:none}
.app.nosb main{padding-top:64px}
body.nosb .sbopen{display:inline-flex}
@media (max-width:900px){.sbtog,.sbopen,body.nosb .sbopen{display:none}.app.nosb main{padding-top:28px}}

/* ================= matérias e simuladores das novas matérias ================= */
a.course{display:block;text-decoration:none;color:var(--ink);transition:background .12s}
a.course:hover{background:var(--soft)}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.course-card{background:var(--sheet);border:2px solid var(--rule);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.course-card.cur{background:color-mix(in srgb,var(--sage) 7%,var(--sheet))}
.course-card.soon{background:var(--paper);color:var(--muted)}
.course-card h2{font-size:1.7rem}
.course-card p{color:var(--muted);font-size:.93rem}
.course-card .btn{align-self:flex-start;margin-top:auto}
.cc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cc-top .inc{font-size:1.2rem}
.cc-top small{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cc-top .chip{margin-left:auto}
.cc-stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0;border-top:2px solid var(--rule);border-bottom:1px solid var(--line)}
.cc-stats div{padding:8px 0}
.cc-stats dt{font-size:.72rem;color:var(--muted)}
.cc-stats dd{margin:0;font:400 1.4rem/1.1 var(--serif)}

/* regime, substituição e sursis */
.exsim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.exin{display:flex;flex-direction:column;gap:12px}
.exout{display:flex;flex-direction:column;gap:2px;background:var(--rule);border:2px solid var(--rule)}
.exreg{background:var(--inv-bg);color:var(--inv-fg);padding:18px}
.exreg .eyebrow{color:var(--inv-muted)}
.exreg b{font:400 2.2rem/1 var(--serif);display:block;margin:4px 0 8px}
.exreg p{color:var(--inv-muted);font-size:.92rem}
.exrow{background:var(--sheet);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.exrow span{font-weight:600}
.exrow b{font-family:var(--serif);font-weight:400;font-size:1.2rem}
.exrow.ok b{color:var(--sage)} .exrow.no b{color:var(--seal)}
.exrow small{grid-column:1/-1;color:var(--muted);font-size:.85rem}

/* dosimetria */
.ds{display:flex;flex-direction:column;gap:14px}
.ds .seg button small{display:block;font-weight:400;font-size:.72rem;opacity:.75}
.dsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dscirc{display:flex;flex-wrap:wrap;gap:6px}
.dscirc button{border:1.5px solid var(--line);background:var(--paper);padding:6px 10px;font-size:.84rem;font-weight:600;transition:background .12s,border-color .12s}
.dscirc button[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:#fff}
.dsscale{display:flex;flex-direction:column;gap:18px}
.dstrack{position:relative;height:56px;margin:22px 8px 0;border-bottom:2px solid var(--rule)}
.dsrange{position:absolute;bottom:0;height:18px;background:var(--track);transition:left .5s var(--ease),width .5s var(--ease)}
.dsrange span{position:absolute;bottom:22px;font-size:.72rem;color:var(--muted);white-space:nowrap}
.dsmin{left:0;transform:translateX(-50%)} .dsmax{right:0;transform:translateX(50%)}
.dsm{position:absolute;bottom:-12px;width:24px;height:24px;margin-left:-12px;display:grid;place-items:center;font:600 .72rem/1 var(--sans);font-style:normal;color:#fff;background:var(--muted);border-radius:50%!important;transition:left .7s var(--ease);z-index:1}
.dsm.m2{background:var(--brass)} .dsm.m3{background:var(--ink);color:var(--paper);z-index:2}
.dsph{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--rule);border:2px solid var(--rule)}
.dsph li{background:var(--sheet);padding:14px;display:flex;flex-direction:column;gap:4px}
.dsph span{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dsph b{font:400 1.35rem/1.15 var(--serif)}
.dsph small{color:var(--muted);font-size:.82rem}
.dsph li:last-child{background:var(--inv-bg);color:var(--inv-fg)}
.dsph li:last-child span,.dsph li:last-child small{color:var(--inv-muted)}
.dsreg{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:6px}
.dsreg span{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dsreg b{font:400 1.6rem/1 var(--serif)}
.dsreg small{flex-basis:100%;color:var(--muted)}

/* livramento e período depurador */
.lvtrack{position:relative;height:16px;background:var(--track);margin:34px 0 10px}
.lvfill{position:absolute;left:0;top:0;bottom:0;background:var(--sage);transition:width .6s var(--ease)}
.lvmark{position:absolute;top:-8px;bottom:-8px;border-left:2px solid var(--ink);transition:left .6s var(--ease)}
.lvmark span{position:absolute;bottom:100%;left:-20px;width:40px;text-align:center;font:400 1rem/1.3 var(--serif)}
.dptrack{background:linear-gradient(90deg,color-mix(in srgb,var(--seal) 30%,var(--soft)) 0 50%,color-mix(in srgb,var(--brass) 30%,var(--soft)) 50%)}
.dptrack .pi5{left:50%}

/* prescrição */
.prw{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
.prres{margin-top:16px;padding:16px;background:var(--inv-bg);color:var(--inv-fg)}
.prres b.num{font:400 2rem/1 var(--serif);display:block;margin-bottom:6px}
.prres p{color:var(--inv-muted);font-size:.92rem}
.prres p b{color:var(--inv-fg)}
.prtab tr{transition:background .3s}
.prtab tr.on td{background:color-mix(in srgb,var(--brass) 22%,transparent);font-weight:600}
.pr-reinc[hidden]{display:none}

/* pressupostos */
.pps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--rule);border:2px solid var(--rule);margin-bottom:16px}
.pp{background:var(--sheet);border:0;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .2s,opacity .2s}
.pp b{font:400 1.1rem/1 var(--serif);color:var(--brass-text)}
.pp strong{font-weight:600}
.pp small{color:var(--muted);font-size:.8rem}
.pp .ppst{margin-top:6px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--seal)}
.pp.on .ppst{color:var(--sage)}

<script>
(function(){
'use strict';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const fmtDay=(d,o)=>new Date(d*86400000).toLocaleDateString('pt-BR',Object.assign({day:'2-digit',month:'short'},o||{},{timeZone:'UTC'}));
const pct=x=>Math.round(x*100)+'%';

const money=x=>BRL.format(Math.round(x));
const fmtP=x=>(x*100).toFixed(1).replace('.0','').replace('.',',')+'%';

/* Montagem tardia: widgets devolvem HTML e registram aqui o código que roda depois que o HTML entra na página */

    <circle cx="100" cy="100" r="97" fill="var(--seal)"/><circle cx="100" cy="100" r="66" fill="none" stroke="#EEF1F5" stroke-width="1.5"/>
