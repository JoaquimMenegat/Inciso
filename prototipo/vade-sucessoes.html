let CUR_N=1;
/* Selo giratório usado no topo das aulas */
function heroSeal(ring){
  const id=uid('ring'),t=ring.repeat(Math.max(1,Math.round(512/(ring.length*10.5))));
  return `<div class="lseal" data-a="stamp" data-d="650" aria-hidden="true"><svg viewBox="0 0 200 200" style="overflow:visible"><defs><path id="${id}" d="M100,18 a82,82 0 1,1 0,164 a82,82 0 1,1 0,-164"/></defs>
    <circle cx="100" cy="100" r="97" fill="var(--seal)"/><circle cx="100" cy="100" r="66" fill="none" stroke="#EEF1F5" stroke-width="1.5"/>
    <g class="spin"><text font-family="Archivo,sans-serif" font-size="14" font-weight="600" fill="#EEF1F5"><textPath href="#${id}" textLength="${(2*Math.PI*82-3).toFixed(1)}" lengthAdjust="spacing">${t}</textPath></text></g>
    <text x="100" y="104" text-anchor="middle" dominant-baseline="middle" font-family="Libre Caslon Text,serif" font-size="${rom(CUR_N).length<=2?52:rom(CUR_N).length<=3?44:36}" fill="#EEF1F5">${rom(CUR_N)} –</text></svg></div>`;
}

/* ================= movimento da marca (adaptado de inciso-motion.js do manual) =================
   Elementos com data-a="draw|grow|rise|up|fade|stamp|letters|ring|count" + data-d (atraso em ms).
   O HTML sempre descreve o estado final; com movimento reduzido nada se move. */
const Motion=(function(){
  const E='cubic-bezier(.2,.8,.2,1)';
  const reduce=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
  const K={
    draw:[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],
    grow:[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],
    rise:[{transform:'translateY(100%)',clipPath:'inset(0 0 100% 0)'},{transform:'translateY(0)',clipPath:'inset(0 0 0% 0)'}],
    up:[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0)'}],
    fade:[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}]
  };
  const DUR={draw:600,grow:900,rise:640,up:480,fade:600};
  function stampK(r){const R='rotate('+r+'deg)';return[
    {opacity:0,transform:'scale(1.9) '+R,easing:'cubic-bezier(.55,0,.9,.45)'},
    {opacity:1,transform:'scale(.92) '+R,offset:.5,easing:E},
    {transform:'scale(1.05) '+R+' translate(1.5px,-1px)',offset:.64},
    {transform:'scale(.98) '+R+' translate(-1.5px,1px)',offset:.76},
    {transform:'scale(1.01) '+R+' translate(.5px,0)',offset:.88},
    {opacity:1,transform:'scale(1) '+R}]}

    if(!el||reduce()||!el.animate)return;
    if(t==='stamp')return el.animate(stampK(el.dataset.r?+el.dataset.r:-8),{duration:dur||620,delay:d||0,fill:'backwards'});
    if(K[t])return el.animate(K[t],{duration:dur||DUR[t],delay:d||0,easing:E,fill:'backwards'});
  }
  function play(root){
    if(!root||reduce())return;
    root.querySelectorAll('[data-a]').forEach(el=>{
      el.getAnimations&&el.getAnimations().forEach(a=>a.cancel());
      const t=el.dataset.a,d=+el.dataset.d||0,dur=+el.dataset.dur||0;
      if(t==='letters'){el.querySelectorAll('[data-l]').forEach((c,i)=>c.animate([{opacity:0,transform:'translateY(.2em)'},{opacity:1,transform:'translateY(0)'}],{duration:dur||360,delay:d+i*(+el.dataset.st||55),easing:E,fill:'backwards'}));return}
      if(t==='ring'){el.animate([{strokeDashoffset:el.dataset.from+'px'},{strokeDashoffset:el.dataset.to+'px'}],{duration:dur||1400,delay:d,easing:E,fill:'backwards'});return}
      if(t==='count'){const to=+el.dataset.to,suf=el.dataset.suf||'',D=dur||1400,t0=performance.now()+d,tok=(el._tok=(el._tok||0)+1);
        el.textContent='0'+suf;const f=now=>{if(tok!==el._tok)return;const p=Math.min(1,Math.max(0,(now-t0)/D));el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suf;if(p<1)requestAnimationFrame(f);else el.textContent=to+suf};

    });

  function enter(els){if(reduce())return;[...els].forEach((el,i)=>anim(el,'up',Math.min(i,6)*70))}
  return {play,anim,enter,reduce};
})();

/* algarismos romanos */
function rom(n){let s='';for(const [v,r] of [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']])while(n>=v){s+=r;n-=v}return s}
const inc=n=>`<span class="inc">${rom(n)} <i>–</i></span>`;
/* padrão de incisões: traços no vermelho-selo, como cortes de texto, que se adensam à direita */
const patHTML=(n)=>`<div class="pat" aria-hidden="true">${Array.from({length:(n||72)*2},(_,i)=>{const w=[14,26,40,58,22,34][(i*7+(i>>3))%6],o=(i*5)%9===0;return `<span${o?' class="o"':''} style="width:${w}px"></span>`}).join('')}</div>`;
const WORDMARK='<span class="wm" aria-label="Inciso"><span class="wm-i">ı<span class="wm-dot"></span></span>nciso</span>';

/* ================= ícones da marca =================
   Grade de 24, traço de 1,5 px, pontas retas (manual, seção V). Cada traço tem pathLength=1,
   então o CSS pode "desenhar" o ícone quando ele entra na tela (classe .icd). */

const SUC_BANK=[
 {id:'s1',t:'saisine',q:'Em que momento a herança se transmite aos herdeiros?',o:['Na abertura do inventário','No momento da morte do autor da herança','Na sentença de partilha'],a:1,e:'Pelo princípio da saisine, aberta a sucessão (a morte), a herança se transmite desde logo aos herdeiros.',art:'Art. 1.784'},
 {id:'s2',t:'saisine',q:'O falecido deixou apenas dinheiro em conta corrente. Para a lei, o direito à sucessão aberta é bem:',o:['Móvel, porque o acervo é dinheiro','Imóvel, por determinação legal','Fungível'],a:1,e:'O direito à sucessão aberta é considerado bem imóvel, qualquer que seja a natureza dos bens da herança.',art:'Art. 80, II'},
 {id:'s3',t:'saisine',q:'Até a partilha, como os herdeiros se relacionam com os bens da herança?',o:['Cada um é dono de bens determinados','São condôminos de um todo indivisível','Os bens pertencem ao inventariante'],a:1,e:'A herança é um todo unitário até a partilha; o direito dos coerdeiros é indivisível e regido pelas normas do condomínio.',art:'Art. 1.791'},
 {id:'s4',t:'saisine',q:'Quem tem legitimidade para suceder?',o:['Só quem já havia nascido na data da morte','Pessoas nascidas ou já concebidas no momento da abertura da sucessão','Qualquer parente até o 6º grau'],a:1,e:'Legitimam-se a suceder as pessoas nascidas ou já concebidas no momento da abertura da sucessão.',art:'Art. 1.798'},
 {id:'s5',t:'saisine',q:'A morte que abre a sucessão, o reconhecimento voluntário de um filho e a elaboração de um testamento são, respectivamente:',o:['Ato, negócio e fato jurídico','Fato, ato e negócio jurídico','Negócio, fato e ato jurídico'],a:1,e:'A morte é evento natural (fato). Reconhecer filho é ato jurídico simples. O testamento é vontade dirigida a produzir efeitos: negócio jurídico.',art:'Arts. 6º e 1.857'},
 {id:'s6',t:'saisine',q:'Uma pessoa desaparece sem notícias e sem representante. Em que etapa da ausência a sucessão é aberta pela primeira vez?',o:['Na curadoria dos bens do ausente','Na sucessão provisória','Só na sucessão definitiva'],a:1,e:'A curadoria apenas conserva os bens. A sucessão provisória, um ano após a arrecadação, já abre a sucessão.',art:'Arts. 22 e 26'},
 {id:'s7',t:'saisine',q:'O direito de herança está garantido:',o:['Só no Código Civil','Na Constituição, como direito fundamental','Em lei estadual'],a:1,e:'O art. 5º, XXX da Constituição garante o direito de herança entre os direitos fundamentais, com eficácia imediata.',art:'CF, art. 5º, XXX'},

 {id:'c1',t:'comoriencia',q:'Dois parentes morrem no mesmo acidente e não se sabe quem morreu primeiro. O que a lei presume?',o:['Que o mais velho morreu antes','Que morreram ao mesmo tempo','Que o mais novo morreu antes'],a:1,e:'Presumem-se simultaneamente mortos, e nenhum herda do outro.',art:'Art. 8º'},
 {id:'c2',t:'comoriencia',q:'João e Maria, casados em separação convencional, sem descendentes nem ascendentes, morrem no impacto de um acidente. Cada um tem um irmão. Quem fica com o patrimônio de João?',o:['Maria, e depois o irmão dela','O irmão de João','Os dois irmãos, em partes iguais'],a:1,e:'Com a comoriência, Maria não herda de João. A herança dele vai ao seu próprio sucessor vivo: o irmão.',art:'Arts. 8º e 1.829, IV'},
 {id:'c3',t:'comoriencia',q:'Mesmo caso, mas Maria é levada ao hospital e morre horas depois. Para onde vai, ao final, o patrimônio de João?',o:['Para o irmão de João','Para o irmão de Maria','Metade para cada irmão'],a:1,e:'Maria sobreviveu e herdou tudo de João, porque o cônjuge afasta os colaterais. Com a morte dela, o patrimônio somado passa ao irmão de Maria.',art:'Arts. 1.829, III e 1.838'},
 {id:'c4',t:'comoriencia',q:'O pai tem três filhos e quer deixar bens a um amigo por testamento. De quanto do patrimônio ele pode dispor?',o:['De tudo, se fizer testamento público','Da metade: a outra metade é a legítima dos herdeiros necessários','De um terço'],a:1,e:'Havendo herdeiros necessários, o testador só pode dispor da metade da herança.',art:'Arts. 1.789 e 1.846'},
 {id:'c5',t:'comoriencia',q:'Herdeiros maiores, capazes e de acordo; sem testamento; com advogado. O inventário pode ser feito:',o:['Só em juízo','Por escritura pública, em cartório','Só se o juiz autorizar'],a:1,e:'Preenchidos os requisitos, o inventário pode ser extrajudicial, por escritura pública.',art:'CPC, art. 610, §1º'},
 {id:'c6',t:'comoriencia',q:'Onde se abre a sucessão de quem morreu numa viagem ao exterior, mas tinha domicílio em Curitiba (PR)?',o:['No local da morte','No último domicílio do falecido, Curitiba','Onde estiver o imóvel de maior valor'],a:1,e:'A sucessão abre-se no lugar do último domicílio do falecido, ainda que o óbito ocorra no estrangeiro.',art:'Art. 1.785; CPC, art. 48'},
 {id:'c7',t:'comoriencia',q:'Maria tem uma filha e deixa, em testamento, todo o patrimônio a um amigo. O que acontece?',o:['O testamento é nulo','A disposição é reduzida à metade disponível','O amigo recebe tudo'],a:1,e:'O excesso não anula o testamento: a disposição é reduzida para preservar a legítima da filha.',art:'Arts. 1.846 e 1.967'},

 {id:'a1',t:'aceitacao',q:'Como deve ser feita a aceitação expressa da herança?',o:['Por escritura pública','Por qualquer declaração escrita','Por termo nos autos, obrigatoriamente'],a:1,e:'A aceitação expressa se faz por declaração escrita. Escritura pública é exigência da renúncia, não da aceitação.',art:'Art. 1.805'},
 {id:'a2',t:'aceitacao',q:'A filha paga o funeral do pai e faz reparos urgentes na casa dele. Ela aceitou tacitamente a herança?',o:['Sim, agiu como herdeira','Não: são atos oficiosos e de conservação','Só se gastou mais de 10% do monte'],a:1,e:'Atos oficiosos, como o funeral, e atos meramente conservatórios não exprimem aceitação.',art:'Art. 1.805, §1º'},
 {id:'a3',t:'aceitacao',q:'O herdeiro declara: "aceito os imóveis, mas não as dívidas". O que vale?',o:['Aceitação parcial válida','Não se aceita em parte nem sob condição','Vale só para os imóveis'],a:1,e:'A herança não se aceita em parte, sob condição ou a termo.',art:'Art. 1.808'},
 {id:'a4',t:'aceitacao',q:'Um interessado pede que o herdeiro diga se aceita. O juiz fixa prazo de até 30 dias e o herdeiro fica em silêncio. Resultado?',o:['Presume-se a renúncia','Presume-se a aceitação','O prazo é reaberto'],a:1,e:'Decorrido o prazo sem resposta, a herança se haverá por aceita.',art:'Art. 1.807'},
 {id:'a5',t:'aceitacao',q:'A herança vale R$ 100 mil e as dívidas somam R$ 150 mil. Quanto os herdeiros pagam do próprio bolso?',o:['R$ 50 mil, divididos entre eles','Nada: respondem só até as forças da herança','Tudo, solidariamente'],a:1,e:'O herdeiro não responde por encargos superiores às forças da herança. O excesso é prejuízo do credor.',art:'Art. 1.792'},
 {id:'a6',t:'aceitacao',q:'Quem o juiz nomeia inventariante em primeiro lugar?',o:['O herdeiro mais velho','O cônjuge ou companheiro que convivia com o falecido','O testamenteiro'],a:1,e:'A ordem do art. 617 do CPC começa pelo cônjuge ou companheiro sobrevivente que convivia com o falecido ao tempo da morte.',art:'CPC, art. 617, I'},

 {id:'r1',t:'renuncia',q:'João renuncia à herança do pai por documento particular com firma reconhecida. A renúncia vale?',o:['Sim, a firma reconhecida basta','Não: exige instrumento público ou termo judicial','Sim, se os irmãos concordarem'],a:1,e:'A forma é da substância do ato: instrumento público ou termo judicial.',art:'Art. 1.806'},
 {id:'r2',t:'renuncia',q:'Três filhos; só Maria renuncia. Os dois filhos dela recebem a parte da mãe?',o:['Sim, por representação','Não: a parte acresce aos irmãos de Maria','Metade vai aos netos'],a:1,e:'Ninguém sucede representando herdeiro renunciante. A quota acresce aos outros herdeiros da mesma classe.',art:'Arts. 1.810 e 1.811'},
 {id:'r3',t:'renuncia',q:'Todos os filhos renunciam. Como os netos herdam?',o:['Por estirpe, cada ramo com sua fração','Por direito próprio e por cabeça','Não herdam; a herança vai ao Município'],a:1,e:'Se todos da classe renunciam, os filhos deles vêm à sucessão por direito próprio, partilhando por cabeça.',art:'Art. 1.811'},
 {id:'r4',t:'renuncia',q:'Pedro "renuncia em favor do irmão Lucas". O que acontece?',o:['Renúncia válida, sem imposto','É cessão de direitos, e incide ITCMD','É nula e nada muda'],a:1,e:'Indicar beneficiário transforma o ato em cessão (renúncia translativa): Pedro aceitou e transmitiu, com incidência de imposto.',art:'Art. 1.793'},
 {id:'r5',t:'renuncia',q:'Herdeiro casado em separação convencional precisa da anuência do cônjuge para renunciar?',o:['Não','Sim, sempre','Só se houver filhos'],a:0,e:'Na separação convencional, os bens são exclusivos de cada cônjuge; não há comunicação.',art:'Art. 1.687'},

 {id:'ce1',t:'cessao',q:'Qual a forma exigida para ceder direitos hereditários?',o:['Instrumento particular','Escritura pública','Basta acordo verbal entre os coerdeiros'],a:1,e:'O direito à sucessão aberta e o quinhão podem ser objeto de cessão por escritura pública.',art:'Art. 1.793'},
 {id:'ce2',t:'cessao',q:'Um coerdeiro vende sua quota a um estranho sem oferecê-la aos irmãos. O que um irmão pode fazer?',o:['Nada, a venda é livre','Depositar o preço e haver a quota para si em até 180 dias','Anular a venda a qualquer tempo'],a:1,e:'O coerdeiro preterido pode, depositado o preço, haver para si a quota cedida, se o requerer até 180 dias após a transmissão.',art:'Arts. 1.794 e 1.795'},
 {id:'ce3',t:'cessao',q:'Antes da partilha, um herdeiro cede "o apartamento da praia" a um amigo. Essa cessão:',o:['É plenamente eficaz','É ineficaz: não se cede bem singular enquanto a herança é indivisa','Vale se o ITCMD for pago'],a:1,e:'É ineficaz a cessão, pelo coerdeiro, de bem da herança considerado singularmente, enquanto pendente a indivisibilidade.',art:'Art. 1.793, §2º'},
 {id:'ce4',t:'cessao',q:'Qual a diferença tributária entre renunciar e ceder?',o:['Nenhuma','Renúncia pura não gera ITCMD; cessão gera','Só a renúncia gera imposto'],a:1,e:'Na renúncia abdicativa a quota volta ao monte sem nova transmissão. Na cessão há transmissão do herdeiro ao cessionário, e incide imposto.',art:'Arts. 1.793 e 1.804'},
 {id:'ce5',t:'cessao',q:'João cede gratuitamente sua quota ao irmão Pedro. Isso é:',o:['Renúncia abdicativa','Cessão gratuita de direitos hereditários','Ato nulo'],a:1,e:'A cessão pode ser gratuita ou onerosa; o que a define é haver um beneficiário escolhido.',art:'Art. 1.793'},

 {id:'e1',t:'exclusao',q:'O filho que tentou matar o pai fica excluído da herança automaticamente?',o:['Sim, sempre','Em regra, depende de ação proposta em até 4 anos da abertura da sucessão','Só se o pai deixou testamento'],a:1,e:'A indignidade é declarada por sentença, em ação proposta em 4 anos. A exceção é o art. 1.815-A: com condenação penal transitada em julgado, a exclusão é imediata.',art:'Arts. 1.815 e 1.815-A'},
 {id:'e2',t:'exclusao',q:'O filho indigno tem uma filha. Ela herda?',o:['Não, a pena se estende aos descendentes','Sim, como se o indigno fosse morto antes da abertura','Só metade da quota'],a:1,e:'Os efeitos da exclusão são pessoais: os descendentes do excluído sucedem como se ele morto fosse.',art:'Art. 1.816'},
 {id:'e3',t:'exclusao',q:'A deserdação pode atingir:',o:['Qualquer herdeiro ou legatário','Apenas herdeiros necessários, por testamento com causa expressa','Apenas colaterais'],a:1,e:'Deserdação é ato do testador contra herdeiro necessário, com declaração expressa da causa no testamento.',art:'Arts. 1.961 e 1.964'},
 {id:'e4',t:'exclusao',q:'Quem deve provar a causa da deserdação depois da morte do testador?',o:['O deserdado, que deve provar inocência','O herdeiro instituído ou quem aproveite a deserdação','O Ministério Público'],a:1,e:'Ao herdeiro instituído, ou àquele a quem aproveite a deserdação, incumbe provar a veracidade da causa alegada.',art:'Art. 1.965'},
 {id:'e5',t:'exclusao',q:'Indignidade e deserdação: qual a diferença de origem?',o:['As duas decorrem da lei','Indignidade decorre da lei; deserdação, da vontade do testador','As duas decorrem do testamento'],a:1,e:'A indignidade é sanção legal. A deserdação depende de testamento com causa expressa.',art:'Arts. 1.814 e 1.961'},

 {id:'v1',t:'vocacao',q:'Qual é a ordem de vocação hereditária do art. 1.829?',o:['Cônjuge, descendentes, ascendentes, colaterais','Descendentes (com cônjuge), ascendentes (com cônjuge), cônjuge, colaterais','Descendentes, cônjuge, ascendentes, colaterais'],a:1,e:'O cônjuge concorre com descendentes (conforme o regime) e com ascendentes (sempre); sozinho, é a 3ª classe.',art:'Art. 1.829'},
 {id:'v2',t:'vocacao',q:'Até que grau os colaterais são chamados a suceder?',o:['3º grau','4º grau','6º grau'],a:1,e:'Na falta de cônjuge, são chamados os colaterais até o quarto grau.',art:'Art. 1.839'},
 {id:'v5',t:'vocacao',q:'João fez testamento só sobre um terreno, em favor da igreja. O resto do patrimônio:',o:['Vai também para a igreja','Segue a sucessão legítima','Fica jacente'],a:1,e:'A sucessão legítima é residual: incide sobre o que o testamento não alcança.',art:'Art. 1.788'},
 {id:'v6',t:'vocacao',q:'Monte-mor de R$ 1 milhão, meação de R$ 300 mil, dívidas de R$ 100 mil. Qual o monte-partível?',o:['R$ 1 milhão','R$ 600 mil','R$ 700 mil'],a:1,e:'Do monte-mor saem a meação (que não é herança), as dívidas e os legados. Sobra o monte-partível.',art:'Monte-mor e monte-partível'},
 {id:'v7',t:'vocacao',q:'O falecido deixa um filho vivo e um neto, filho desse mesmo filho. Quem herda?',o:['Os dois, por cabeça','Só o filho: o grau mais próximo exclui o mais remoto','O neto, por representação'],a:1,e:'Na classe dos descendentes, os de grau mais próximo excluem os mais remotos.',art:'Art. 1.833'},

 {id:'v3',t:'modos',q:'O filho morreu antes do pai. Como o neto entra na herança do avô?',o:['Por direito próprio','Por representação, recebendo o que caberia ao pai','Por transmissão'],a:1,e:'A pré-morte autoriza representação na linha reta descendente, com partilha por estirpe.',art:'Arts. 1.851 e 1.852'},
 {id:'v4',t:'modos',q:'O filho morreu um mês depois do pai, sem ter dito se aceitava a herança. O neto:',o:['Representa o pai na herança do avô','Recebe, por transmissão, o poder de aceitar ou renunciar','Fica excluído'],a:1,e:'O filho já tinha adquirido pela saisine. O poder de aceitar passa aos herdeiros dele: é direito de transmissão.',art:'Art. 1.809'},
 {id:'m1',t:'modos',q:'Três filhos; um deles morreu antes do pai, deixando dois filhos. Herança de R$ 120 mil. Quanto recebe cada neto?',o:['R$ 30 mil','R$ 20 mil','R$ 40 mil'],a:1,e:'Contam-se estirpes, não pessoas: 3 estirpes de R$ 40 mil. Os netos dividem a estirpe do pai: R$ 20 mil cada.',art:'Arts. 1.835 e 1.855'},
 {id:'m2',t:'modos',q:'Há direito de representação na linha ascendente?',o:['Sim, sempre','Não, nunca','Só em favor dos avós'],a:1,e:'O direito de representação dá-se na linha reta descendente, mas nunca na ascendente.',art:'Art. 1.852'},
 {id:'m3',t:'modos',q:'Até onde vai a representação na linha colateral?',o:['Até o 4º grau','Só em favor dos filhos de irmãos','Não existe'],a:1,e:'Na linha colateral, só os filhos de irmãos representam, quando concorrem com irmãos do falecido.',art:'Art. 1.853'},
 {id:'m4',t:'modos',q:'Quem renunciou à herança do pai pode representá-lo na herança do avô?',o:['Não, a renúncia o exclui de tudo','Sim: o renunciante de uma herança pode representar na sucessão de outra','Só com autorização judicial'],a:1,e:'A renúncia vale só para aquela herança.',art:'Art. 1.856'},

 {id:'cj1',t:'conjuge',q:'Comunhão parcial; o falecido só deixou bens adquiridos onerosamente durante o casamento; dois filhos. O cônjuge herda?',o:['Sim, em partes iguais com os filhos','Não: fica só com a meação','Sim, mas no mínimo 1/4'],a:1,e:'Sem bens particulares, não há concorrência na comunhão parcial. O cônjuge leva a meação, e a herança é toda dos filhos.',art:'Art. 1.829, I'},
 {id:'cj2',t:'conjuge',q:'Comunhão parcial com bens particulares. Sobre o que o cônjuge concorre com os descendentes?',o:['Sobre toda a herança','Apenas sobre os bens particulares','Apenas sobre os bens comuns'],a:1,e:'Ele já tem a meação dos bens comuns; a concorrência recai só sobre os bens particulares do falecido.',art:'Art. 1.829, I'},
 {id:'cj3',t:'conjuge',q:'Separação convencional, dois filhos comuns, herança de R$ 900 mil. Quanto cabe ao cônjuge?',o:['Nada','R$ 300 mil','R$ 450 mil'],a:1,e:'Na separação convencional o cônjuge concorre, com quinhão igual ao dos filhos: 900 ÷ 3.',art:'Arts. 1.829, I e 1.832'},
 {id:'cj4',t:'conjuge',q:'Separação convencional, quatro filhos, todos também do cônjuge sobrevivente; herança de R$ 100 mil. Quota do cônjuge?',o:['R$ 20 mil','R$ 25 mil','R$ 50 mil'],a:1,e:'Sendo ascendente de todos, o cônjuge tem reserva mínima de 1/4. Os filhos dividem os 3/4 restantes.',art:'Art. 1.832'},
 {id:'cj5',t:'conjuge',q:'Mesmo caso, mas um dos quatro filhos é de relacionamento anterior do falecido. Quota do cônjuge?',o:['R$ 20 mil','R$ 25 mil','R$ 33 mil'],a:0,e:'Filiação híbrida: o cônjuge não é ascendente de todos, então não há reserva. Divide-se por cabeça: 100 ÷ 5.',art:'Art. 1.832'},
 {id:'cj6',t:'conjuge',q:'O falecido casou aos 72 anos (separação obrigatória) e deixou filhos. O cônjuge concorre na herança?',o:['Sim','Não','Só se não houver testamento'],a:1,e:'Separação obrigatória é um dos "salvo se" do inciso I: não há concorrência com descendentes.',art:'Arts. 1.641, II e 1.829, I'},

 {id:'as1',t:'ascendentes',q:'Sem descendentes, o falecido deixa cônjuge, pai e mãe. Quota do cônjuge?',o:['1/2','1/3','1/4'],a:1,e:'Concorrendo com ascendentes em primeiro grau (pai e mãe), cabe ao cônjuge um terço.',art:'Art. 1.837'},
 {id:'as2',t:'ascendentes',q:'Sem descendentes, o falecido deixa cônjuge e só a mãe. Quota do cônjuge?',o:['1/3','1/2','Tudo'],a:1,e:'Havendo um só ascendente, ou se maior for o grau, o cônjuge fica com metade.',art:'Art. 1.837'},
 {id:'as3',t:'ascendentes',q:'Casado em comunhão universal, sem filhos, com pais vivos. O cônjuge herda junto com os pais?',o:['Não, porque já tem meação','Sim: com ascendentes, a concorrência independe do regime','Só sobre os bens particulares'],a:1,e:'Os "salvo se" do inciso I não se aplicam ao inciso II. O regime só define a meação.',art:'Art. 1.829, II'},
 {id:'as4',t:'ascendentes',q:'Sem descendentes nem cônjuge, o falecido deixa a mãe e os dois avós paternos. Quem herda?',o:['Mãe e avós, por linha','Só a mãe','Mãe e avós, por cabeça'],a:1,e:'Na classe dos ascendentes, o grau mais próximo exclui o mais remoto, sem distinção de linhas.',art:'Art. 1.836, §1º'},
 {id:'as5',t:'ascendentes',q:'Sem descendentes nem cônjuge, restam os dois avós paternos e a avó materna. Quanto recebe a avó materna?',o:['1/3','1/2','1/4'],a:1,e:'Igual grau e linhas diferentes: metade para cada linha. A linha materna tem só a avó, que fica com 1/2.',art:'Art. 1.836, §2º'},
 {id:'as6',t:'ascendentes',q:'Pelo Enunciado 642, como se divide a herança entre três genitores (multiparentalidade), sem cônjuge?',o:['Metade à linha paterna, metade à materna','Em três linhas, 1/3 para cada','Tudo ao genitor biológico'],a:1,e:'Na multiparentalidade, divide-se em tantas linhas quantos sejam os genitores.',art:'Enunciado 642, CJF'},

 {id:'co3',t:'habitacao',q:'O cônjuge estava separado de fato havia três anos quando o outro morreu, sem prova de que a convivência se tornou impossível sem culpa sua. Ele herda?',o:['Sim, o casamento não tinha sido dissolvido','Não, pelo art. 1.830','Só a meação'],a:1,e:'Separado de fato há mais de dois anos, o cônjuge só herda provando que a convivência se tornou impossível sem culpa sua.',art:'Art. 1.830'},
 {id:'h1',t:'habitacao',q:'Sem descendentes e sem ascendentes, casado em separação convencional. O cônjuge:',o:['Não herda, por causa do regime','Herda toda a herança','Herda metade; o resto vai aos irmãos'],a:1,e:'Na 3ª classe, o cônjuge recebe tudo, qualquer que seja o regime.',art:'Art. 1.838'},
 {id:'h2',t:'habitacao',q:'O direito real de habitação depende do regime de bens?',o:['Sim, só existe na comunhão','Não: vale qualquer que seja o regime','Só existe na separação'],a:1,e:'É assegurado ao cônjuge qualquer que seja o regime, sobre o imóvel residencial da família, se for o único dessa natureza a inventariar.',art:'Art. 1.831'},
 {id:'h3',t:'habitacao',q:'A viúva com direito real de habitação quer alugar o imóvel. Pode?',o:['Sim, o direito é de usufruto','Não: o direito é só de morar','Sim, se dividir o aluguel com os herdeiros'],a:1,e:'A habitação abrange só o uso para moradia: não inclui fruir (alugar) nem dispor (vender).',art:'Arts. 1.414 e 1.831'},
 {id:'h4',t:'habitacao',q:'Ao renunciar ao direito real de habitação, o cônjuge perde a herança?',o:['Sim','Não: são direitos independentes','Perde metade'],a:1,e:'Pode-se renunciar à habitação sem prejuízo da participação na herança.',art:'Enunciado 271, CJF'},

 {id:'co1',t:'colaterais',q:'Concorrem à herança um irmão bilateral e um irmão unilateral. Como se divide?',o:['Em partes iguais','O bilateral recebe o dobro do unilateral','Só o bilateral herda'],a:1,e:'Cada irmão unilateral herda metade do que herdar cada irmão bilateral.',art:'Art. 1.841'},
 {id:'co2',t:'colaterais',q:'Sem cônjuge, descendentes, ascendentes nem irmãos, concorrem sobrinhos e tios do falecido, todos de 3º grau. Quem herda?',o:['Todos, por cabeça','Os sobrinhos','Os tios'],a:1,e:'Na falta de irmãos, herdam os filhos destes; só na falta deles, os tios.',art:'Art. 1.843'},
 {id:'cl3',t:'colaterais',q:'O falecido deixa um tio e quatro primos. Quem herda?',o:['Todos, por cabeça','Só o tio, de 3º grau','Só os primos'],a:1,e:'Entre colaterais, os mais próximos excluem os mais remotos: o tio, de 3º grau, afasta os primos, de 4º.',art:'Art. 1.840'},
 {id:'cl4',t:'colaterais',q:'Um sobrinho morreu antes do falecido. O filho dele (sobrinho-neto) o representa?',o:['Sim','Não: na colateral, só filhos de irmãos representam','Só se não houver tios'],a:1,e:'A representação colateral para nos filhos de irmãos. Não há representação de sobrinho.',art:'Art. 1.853'},
 {id:'cl5',t:'colaterais',q:'Os colaterais podem ser afastados por testamento?',o:['Não, são herdeiros necessários','Sim: não são herdeiros necessários','Só os irmãos não podem'],a:1,e:'Herdeiros necessários são só descendentes, ascendentes e cônjuge. Para afastar os colaterais, basta testar sem contemplá-los.',art:'Arts. 1.845 e 1.850'},

 {id:'co4',t:'jacente',q:'Ninguém se habilita à herança e não há herdeiro conhecido. Os bens:',o:['Vão de imediato ao Estado','Ficam como herança jacente, sob curador, até a declaração de vacância','São divididos entre os credores'],a:1,e:'A herança jacente fica sob guarda de curador; declarada vacante, passa ao Município ou ao DF após 5 anos da abertura.',art:'Arts. 1.819 a 1.822'},
 {id:'j1',t:'jacente',q:'De quando se conta o prazo de 1 ano para declarar a herança vacante?',o:['Da morte','Da primeira publicação do edital','Da nomeação do curador'],a:1,e:'Passado 1 ano da primeira publicação do edital, sem herdeiro habilitado nem habilitação pendente, declara-se a vacância.',art:'CPC, art. 743'},
 {id:'j2',t:'jacente',q:'E os 5 anos para os bens passarem definitivamente ao Município?',o:['Da declaração de vacância','Da abertura da sucessão','Do último edital'],a:1,e:'Os bens passam ao domínio do Município ou do DF decorridos 5 anos da abertura da sucessão.',art:'Art. 1.822'},
 {id:'j3',t:'jacente',q:'Antes da vacância, o curador pode vender os retratos e livros do falecido?',o:['Sim, se forem de pouco valor','Não: bens de valor de afeição só depois da vacância','Sim, com autorização do MP'],a:1,e:'Retratos, objetos de uso pessoal, livros e obras de arte só são alienados depois de declarada a vacância.',art:'CPC, art. 742, §2º'},
 {id:'j4',t:'jacente',q:'Depois do trânsito em julgado da sentença de vacância, um herdeiro aparece. Como ele reclama?',o:['Habilitando-se no mesmo processo','Só por ação direta','Não pode mais reclamar'],a:1,e:'Transitada a sentença de vacância, cônjuge, herdeiros e credores só reclamam por ação direta, dentro dos 5 anos da abertura.',art:'CPC, art. 743, §2º'},

 {id:'t1',t:'testamento',q:'A partir de que idade se pode testar?',o:['18 anos','16 anos','21 anos'],a:1,e:'Podem testar os maiores de dezesseis anos.',art:'Art. 1.860, p.u.'},
 {id:'t2',t:'testamento',q:'Testou lúcido em 2020; em 2023 perdeu o discernimento por doença. O testamento:',o:['É nulo','Continua válido: a capacidade se afere no momento do ato','Precisa ser confirmado pelos herdeiros'],a:1,e:'A incapacidade superveniente não invalida o testamento, nem o testamento do incapaz se valida com a capacidade posterior.',art:'Art. 1.861'},
 {id:'t3',t:'testamento',q:'Qual destes NÃO pode ser nomeado herdeiro no testamento?',o:['Um amigo de infância','Uma das testemunhas do testamento','Uma ONG já constituída'],a:1,e:'Não podem ser nomeados herdeiros nem legatários as testemunhas do testamento.',art:'Art. 1.801, II'},
 {id:'t4',t:'testamento',q:'Cláusula: "deixo minha casa a quem tiver bom coração no bairro". Ela é:',o:['Válida','Nula: beneficiário indeterminável','Reduzida'],a:1,e:'É nula a disposição em favor de pessoa incerta, cuja identidade não se possa averiguar.',art:'Art. 1.900, II'},
 {id:'t5',t:'testamento',q:'Qual é a natureza do testamento?',o:['Bilateral e irrevogável','Unilateral, personalíssimo, revogável e solene','Contrato entre testador e herdeiros'],a:1,e:'O testamento é ato personalíssimo, que o testador pode mudar a qualquer tempo, e cuja forma é da sua essência.',art:'Arts. 1.857 e 1.858'},

 {id:'fo1',t:'formas',q:'Quantas testemunhas exige o testamento particular?',o:['Duas','Três','Nenhuma'],a:1,e:'O particular deve ser lido e assinado por quem o escreveu, na presença de pelo menos três testemunhas, que também assinam.',art:'Art. 1.876, §1º'},
 {id:'fo2',t:'formas',q:'Marido e mulher fazem um único testamento, cada um deixando tudo ao outro. Ele é:',o:['Válido, se for público','Proibido: é testamento conjuntivo','Válido como cerrado'],a:1,e:'É proibido o testamento conjuntivo, seja simultâneo, recíproco ou correspectivo.',art:'Art. 1.863'},
 {id:'fo3',t:'formas',q:'Qual forma garante sigilo do conteúdo até a morte?',o:['Público','Cerrado','Particular'],a:1,e:'No cerrado, o tabelião aprova o documento lacrado sem conhecer o conteúdo; ele é aberto pelo juiz após a morte.',art:'Arts. 1.868 a 1.875'},
 {id:'fo4',t:'formas',q:'Qual o prazo para impugnar a validade do testamento?',o:['2 anos da morte','5 anos do registro do testamento','10 anos da abertura da sucessão'],a:1,e:'Extingue-se em cinco anos o direito de impugnar a validade do testamento, contado da data do seu registro.',art:'Art. 1.859'},
 {id:'fo5',t:'formas',q:'O nome de um herdeiro facilmente identificável foi grafado errado. Pelo favor testamenti:',o:['O testamento é anulado','A cláusula vale, se a vontade é clara','Anula-se só a cláusula'],a:1,e:'Quando a cláusula admite mais de uma interpretação, prevalece a que melhor assegure a vontade do testador.',art:'Art. 1.899'},
 {id:'fo6',t:'formas',q:'Uma pessoa cega quer testar. Qual forma a lei lhe permite?',o:['Só o particular','Só o público','Só o cerrado'],a:1,e:'Ao cego só se permite o testamento público, lido duas vezes em voz alta.',art:'Art. 1.867'}
];

const SUC_CARDS=[
 {id:'f1',t:'saisine',f:'O que diz o princípio da saisine?',b:'Aberta a sucessão (a morte), a herança se transmite desde logo aos herdeiros legítimos e testamentários.',art:'Art. 1.784'},
 {id:'f2',t:'saisine',f:'Qual a natureza do direito à sucessão aberta?',b:'Bem imóvel, por força de lei, mesmo que a herança seja só dinheiro.',art:'Art. 80, II'},
 {id:'f25',t:'saisine',f:'Fato, ato ou negócio jurídico?',b:'Fato: evento natural (a morte). Ato: vontade simples (reconhecer filho). Negócio: vontade dirigida a efeitos (o testamento).',art:'Arts. 6º e 1.857'},
 {id:'f3',t:'comoriencia',f:'Onde se abre a sucessão?',b:'No lugar do último domicílio do falecido.',art:'Art. 1.785'},
 {id:'f4',t:'comoriencia',f:'Comoriência: conceito e efeito',b:'Mortes na mesma ocasião, sem prova de quem morreu antes, presumem-se simultâneas. Os comorientes não herdam entre si.',art:'Art. 8º'},
 {id:'f5',t:'comoriencia',f:'Quem são os herdeiros necessários e o que é a legítima?',b:'Descendentes, ascendentes e cônjuge. Pertence a eles, de pleno direito, metade dos bens da herança.',art:'Arts. 1.845 e 1.846'},
 {id:'f26',t:'comoriencia',f:'Requisitos do inventário extrajudicial',b:'Herdeiros capazes e de acordo, sem testamento (salvo autorização judicial) e com advogado. Faz-se por escritura pública.',art:'CPC, art. 610, §1º'},
 {id:'f6',t:'aceitacao',f:'Quais são as formas de aceitação?',b:'Expressa (declaração escrita), tácita (atos próprios de herdeiro) e presumida (silêncio após a interpelação judicial).',art:'Arts. 1.805 e 1.807'},
 {id:'f7',t:'aceitacao',f:'Que atos NÃO importam aceitação?',b:'Atos oficiosos, como o funeral, e atos meramente conservatórios, de administração e guarda provisória.',art:'Art. 1.805, §1º'},
 {id:'f8',t:'aceitacao',f:'Pode-se aceitar a herança em parte?',b:'Não. Nem em parte, nem sob condição ou termo. Quem herda por títulos diferentes pode aceitar um e renunciar ao outro.',art:'Art. 1.808'},
 {id:'f27',t:'aceitacao',f:'Até onde o herdeiro responde pelas dívidas?',b:'Até as forças da herança. O que exceder é prejuízo do credor.',art:'Art. 1.792'},
 {id:'f9',t:'renuncia',f:'Qual a forma da renúncia?',b:'Instrumento público ou termo judicial. Por escrito particular, não vale.',art:'Art. 1.806'},
 {id:'f10',t:'renuncia',f:'Há representação do herdeiro renunciante?',b:'Não. A quota acresce aos da mesma classe. Se todos renunciam, os filhos deles herdam por direito próprio e por cabeça.',art:'Arts. 1.810 e 1.811'},
 {id:'f11',t:'renuncia',f:'Renúncia abdicativa × translativa',b:'Abdicativa: pura, sem beneficiário, a quota volta ao monte. Translativa: "em favor de alguém"; é cessão, pressupõe aceitação e paga ITCMD.',art:'Arts. 1.805 e 1.793'},
 {id:'f12',t:'renuncia',f:'O que podem fazer os credores do renunciante?',b:'Aceitar a herança em nome dele, com autorização do juiz, em 30 dias do conhecimento do fato.',art:'Art. 1.813'},
 {id:'f13',t:'cessao',f:'Cessão de direitos hereditários: forma e preferência',b:'Escritura pública. Cedida a estranho, o coerdeiro pode haver a quota depositando o preço em até 180 dias.',art:'Arts. 1.793 a 1.795'},
 {id:'f28',t:'cessao',f:'Pode-se ceder um bem específico antes da partilha?',b:'Não: a cessão de bem considerado singularmente é ineficaz enquanto a herança for indivisa.',art:'Art. 1.793, §2º'},
 {id:'f14',t:'exclusao',f:'Quais as causas de indignidade?',b:'Homicídio doloso ou tentativa contra o autor da herança ou família próxima; acusação caluniosa ou crime contra sua honra; violência ou fraude contra a liberdade de testar.',art:'Art. 1.814'},
 {id:'f15',t:'exclusao',f:'Indignidade × deserdação',b:'Indignidade: sanção da lei, contra herdeiro ou legatário, declarada por sentença. Deserdação: ato do testador, só contra herdeiro necessário, com causa expressa.',art:'Arts. 1.814 e 1.961'},
 {id:'f16',t:'exclusao',f:'O que mudou com o art. 1.815-A?',b:'Com condenação penal transitada em julgado por fato de indignidade, a exclusão é imediata, sem ação civil própria.',art:'Lei 14.661/2023'},
 {id:'f29',t:'vocacao',f:'Monte-mor × monte-partível',b:'Monte-mor é o valor bruto. Tirando meação, dívidas, despesas e legados, sobra o monte-partível, que se divide entre os herdeiros.',art:'Arts. 1.829 e ss.'},
 {id:'f17',t:'modos',f:'Representação × transmissão',b:'Representação: o herdeiro morreu ANTES do autor da herança. Transmissão: morreu DEPOIS, antes de aceitar ou renunciar.',art:'Arts. 1.851 e 1.809'},
 {id:'f18',t:'modos',f:'Há representação na linha colateral?',b:'Só em favor dos filhos de irmãos do falecido, quando concorrerem com irmãos deste.',art:'Art. 1.853'},
 {id:'f30',t:'modos',f:'Por cabeça, por estirpe, por linha',b:'Cabeça: cada pessoa uma parte. Estirpe: cada ramo uma parte, dividida dentro do ramo. Linha: metade paterna, metade materna.',art:'Arts. 1.835 e 1.836'},
 {id:'f19',t:'conjuge',f:'Os três "salvo se" do art. 1.829, I',b:'Não concorre com descendentes: comunhão universal, separação obrigatória e comunhão parcial sem bens particulares.',art:'Art. 1.829, I'},
 {id:'f20',t:'conjuge',f:'Reserva de 1/4',b:'O cônjuge recebe quinhão igual ao dos filhos, nunca menos de 1/4 se for ascendente de todos. Só muda a conta com 4 ou mais filhos comuns.',art:'Art. 1.832'},
 {id:'f21',t:'conjuge',f:'O que é filiação híbrida?',b:'Há filho que não é do cônjuge sobrevivente. A reserva de 1/4 não se aplica e a divisão é por cabeça.',art:'Art. 1.832'},
 {id:'f22',t:'ascendentes',f:'Quota do cônjuge com ascendentes',b:'Com pai e mãe: 1/3. Com um só ascendente, ou de grau maior: 1/2. Independe do regime de bens.',art:'Art. 1.837'},
 {id:'f31',t:'ascendentes',f:'Entre ascendentes, quem herda?',b:'O grau mais próximo exclui o mais remoto, sem distinção de linhas. Não há representação. Em igual grau, metade para cada linha.',art:'Art. 1.836'},
 {id:'f32',t:'habitacao',f:'Direito real de habitação',b:'O cônjuge mora, vitaliciamente, no único imóvel residencial a inventariar, qualquer que seja o regime. Não aluga nem vende.',art:'Art. 1.831'},
 {id:'f33',t:'habitacao',f:'Quando o cônjuge não herda (art. 1.830)',b:'Se estava separado judicialmente, ou de fato há mais de 2 anos, salvo prova de que a convivência se tornou impossível sem culpa sua.',art:'Art. 1.830'},
 {id:'f23',t:'colaterais',f:'Irmãos bilaterais e unilaterais',b:'O irmão unilateral recebe metade do que recebe o bilateral.',art:'Art. 1.841'},
 {id:'f34',t:'colaterais',f:'Ordem entre os colaterais',b:'Irmãos (2º grau), sobrinhos (3º), tios (3º) e, por fim, o 4º grau, em que todos recebem igual.',art:'Arts. 1.840 a 1.843'},
 {id:'f24',t:'jacente',f:'Herança jacente × vacante',b:'Jacente: sem herdeiro conhecido, fica sob curador. Vacante: declarada após os editais; passa ao Município ou ao DF 5 anos após a abertura.',art:'Arts. 1.819 a 1.822'},
 {id:'f35',t:'jacente',f:'Os dois prazos da vacância',b:'1 ano da primeira publicação do edital: declara-se a vacância. 5 anos da abertura da sucessão: propriedade definitiva do poder público.',art:'CPC, art. 743; CC, art. 1.822'},
 {id:'f36',t:'testamento',f:'Quem pode testar?',b:'Os maiores de 16 anos com pleno discernimento no momento do ato. A incapacidade posterior não invalida o testamento.',art:'Arts. 1.860 e 1.861'},
 {id:'f37',t:'testamento',f:'Quem não pode ser nomeado herdeiro ou legatário?',b:'Quem escreveu o testamento a rogo (e seu cônjuge, ascendentes e irmãos), as testemunhas, o concubino do testador casado e o tabelião que fez ou aprovou o testamento.',art:'Art. 1.801'},
 {id:'f38',t:'formas',f:'Testemunhas por forma de testamento',b:'Público: 2. Cerrado: 2. Particular: 3.',art:'Arts. 1.864, 1.868 e 1.876'},
 {id:'f39',t:'formas',f:'Prazo para impugnar o testamento',b:'5 anos, contados do registro do testamento.',art:'Art. 1.859'}
];

/* ================= registro de matérias ================= */
const COURSES={};
function defCourse(id,c){c.id=id;COURSES[id]=c}
defCourse('sucessoes',{nome:'Direito das Sucessões',area:'Direito Civil',desc:'Herança, partilha e testamento: da saisine ao laboratório de partilha, com simuladores para cada regra.',topics:SUC_TOPICS,mods:SUC_MODS,units:SUC_UNITS,bank:SUC_BANK,cards:SUC_CARDS,
  seed:{order:['saisine','comoriencia','aceitacao','renuncia','exclusao','cessao','vocacao','modos'],p:{saisine:.9,comoriencia:.45,aceitacao:.78,renuncia:.55,exclusao:.5,cessao:.62,vocacao:.7,modos:.48},full:['nivelamento','abertura','espolio'],partial:{renuncia:['base','sim'],cessao:['tres'],exclusao:['comparar','caminho'],vocacao:['residual']},last:'renuncia'}});
let COURSE,TOPICS,TN,MODS,NMODS,UNITS,BANK,QB,CARDS,CB;
function useCourse(id){COURSE=COURSES[id]||COURSES.sucessoes;TOPICS=COURSE.topics;TN=Object.fromEntries(TOPICS.map(t=>[t.id,t.nome]));MODS=COURSE.mods;NMODS=MODS.length;UNITS=COURSE.units;BANK=COURSE.bank;QB=Object.fromEntries(BANK.map(q=>[q.id,q]));CARDS=COURSE.cards;CB=Object.fromEntries(CARDS.map(c=>[c.id,c]))}

/* ================= widgets reutilizáveis das aulas ================= */
const W={};

/* Cartões que viram: [[frente, verso], ...] */
W.flips=cards=>`<div class="flips">${cards.map(([f,b])=>`<button class="flip" aria-pressed="false"><div class="in"><div class="f"><strong>${f}</strong><small>Toque para virar</small></div><div class="b">${b}</div></div></button>`).join('')}</div>`;

/* Artigos em acordeão: [[número, título, texto], ...] */
W.arts=list=>{
  const id=uid('arts');

/* ---------- motor de partilha entre descendentes ---------- */
/* filhos: [{n:nome, st:'vivo'|'premorto'|'renunciou'|'indigno', comum:bool, netos:[nomes]}]
   conj: null | {regime, aq, pt}; total: patrimônio (sem cônjuge) */
function partilhaDesc(filhos,conj,total){
  const why=[];let meacao=0,heranca=total,base=0,conc=false;
  if(conj){const x=conjRegime(conj.regime,conj.aq,conj.pt);meacao=x.meacao;heranca=x.heranca;base=x.base;conc=x.conc;why.push(...x.why)}
  const units=[];
  filhos.forEach(f=>{
    if(f.st==='vivo')units.push({tipo:'cabeça',pessoas:[{n:f.n,how:'por direito próprio'}],comum:f.comum});
    else if((f.st==='premorto'||f.st==='indigno')&&f.netos.length)units.push({tipo:'estirpe',de:f.n,pessoas:f.netos.map(n=>({n,how:`representa ${f.n}`+(f.st==='indigno'?' (art. 1.816)':' (art. 1.851)')})),comum:f.comum});
  });
  const rows=[];let todosRen=false;
  if(!units.length){
    const netos=filhos.filter(f=>f.st==='renunciou').flatMap(f=>f.netos.map(n=>({n,comum:f.comum})));
    if(filhos.length&&filhos.every(f=>f.st==='renunciou')&&netos.length){
      todosRen=true;netos.forEach(x=>units.push({tipo:'cabeça',pessoas:[{n:x.n,how:'por direito próprio e por cabeça (art. 1.811)'}],comum:x.comum}));
      why.push('Todos os filhos renunciaram: os netos vêm à sucessão por direito próprio, dividindo por cabeça (art. 1.811).');
    } else return {vazio:true,meacao,heranca,why:why.concat(['Nenhum descendente vai herdar. A herança passa à classe seguinte: ascendentes (com o cônjuge), depois o cônjuge sozinho, depois os colaterais.'])};
  } else {
    const ren=filhos.filter(f=>f.st==='renunciou'),semRamo=filhos.filter(f=>(f.st==='premorto'||f.st==='indigno')&&!f.netos.length);
    if(units.some(u=>u.tipo==='estirpe'))why.push('Há filho pré-morto ou indigno com descendentes: conta-se uma estirpe para ele, e os netos dividem a parte dela (arts. 1.835 e 1.855).');
    if(ren.length)why.push(`${ren.map(f=>f.n).join(' e ')} renunci${ren.length>1?'aram':'ou'}: não há representação, a parte acresce aos demais (arts. 1.810 e 1.811).`);
    if(semRamo.length)why.push(`${semRamo.map(f=>f.n).join(' e ')} não deix${semRamo.length>1?'aram':'ou'} descendentes: não forma estirpe.`);
  }
  const k=units.length;let conjHer=0,fromBase=0,reserva=false;
  if(conc){reserva=units.every(u=>u.comum)&&k>=4;
    if(reserva){conjHer=base/4;fromBase=base*3/4/k;why.push(`O cônjuge é ascendente de todos os herdeiros e há ${k} ${todosRen?'netos':'estirpes'}: reserva de 1/4 sobre a base de concorrência (art. 1.832).`)}
    else{conjHer=base/(k+1);fromBase=base/(k+1);why.push(units.some(u=>!u.comum)&&k>=4?'Filiação híbrida: há herdeiro que não descende do cônjuge, então não há reserva de 1/4.':`O cônjuge conta como mais uma cabeça: a base de concorrência se divide em ${k+1}.`)}}
  const rest=heranca-(conc?base:0),perUnit=rest/k+fromBase;
  units.forEach(u=>u.pessoas.forEach(p=>rows.push({n:p.n,how:p.how,v:perUnit/u.pessoas.length})));
  if(!conc&&!conj)why.unshift(`${k} ${k===1?'parte':'partes'} iguais: ${units.filter(u=>u.tipo==='cabeça').length} por cabeça${units.some(u=>u.tipo==='estirpe')?' e '+units.filter(u=>u.tipo==='estirpe').length+' por estirpe':''}.`);
  return {meacao,heranca,conj:conjHer,rows,why,k};
}
function conjRegime(r,aq,pt){
  const total=aq+pt,why=[];let meacao=0,heranca=total,base=0,conc=false;
  if(r==='cu'){meacao=total/2;heranca=total/2;why.push('Comunhão universal: o cônjuge retira a meação de tudo e não concorre com os descendentes (art. 1.829, I).')}
  else if(r==='cp'){meacao=aq/2;heranca=aq/2+pt;if(pt>0){conc=true;base=pt;why.push('Comunhão parcial com bens particulares: meação dos bens comuns e concorrência só sobre os particulares.')}else why.push('Comunhão parcial sem bens particulares: o cônjuge fica só com a meação (art. 1.829, I).')}
  else if(r==='sc'){conc=true;base=total;why.push('Separação convencional: não há meação, e o cônjuge concorre sobre toda a herança.')}
  else if(r==='so'){why.push('Separação obrigatória: sem meação (sem prova de esforço comum) e sem concorrência (art. 1.829, I).')}
  else if(r==='pf'){meacao=aq/2;heranca=aq/2+pt;conc=true;base=heranca;why.push('Participação final nos aquestos: metade dos aquestos e concorrência sobre a herança.')}
  return {meacao,heranca,base,conc,why};
}
const REGS=[['cp','Comunhão parcial'],['cu','Comunhão universal'],['sc','Separação convencional'],['so','Separação obrigatória'],['pf','Participação final']];

function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function mountQuiz(root,qs,opt){
  opt=opt||{};let i=0,score=0;const res=[];
  function show(){
    if(i>=qs.length){opt.onDone&&opt.onDone(score,qs.length,res,root);return}
    const q=qs[i],order=shuffle(q.o.map((_,k)=>k));

    $('.opts',root).addEventListener('click',e=>{
      const b=e.target.closest('.opt');if(!b||b.disabled)return;
      const k=+b.dataset.k,ok=k===q.a;if(ok)score++;res.push({q:q,ok:ok});
      const bs=$$('.opt',root);bs.forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('ok')});if(!ok)b.classList.add('no');
      opt.onAnswer&&opt.onAnswer(q,ok,k);
      $('.qfoot',root).innerHTML=`<p class="why"><b>${ok?'Correto.':'Não é essa.'}</b> ${q.e}<span class="art">${q.art}</span></p><button class="btn primary nx">${i+1<qs.length?'Próxima questão':'Ver resultado'}</button>`;
      const nx=$('.nx',root);nx.onclick=()=>{i++;show()};nx.focus({preventScroll:true});
    });
  }
  show();
}

/* ---------- Aula 2 · Abertura, comoriência e legítima ---------- */
function comorienciaAnim(){
  const id=uid('cm');
  later(()=>{
    const root=$('#'+id),stage=$('.cmstage',root),coins=[$('.coin1',root),$('.coin2',root)];let ts=[];
    function center(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return [r.left-s.left+r.width/2,r.top-s.top+r.height/2]}
    function place(c,el,dx){const [x,y]=center(el);c.style.transform=`translate(${x-14+(dx||0)}px,${y-14}px)`}
    function tally(a,b){$('.t-ij',root).textContent=money(a);$('.t-im',root).textContent=money(b)}
    function run(sc){ts.forEach(clearTimeout);ts=[];
      $$('.cmbtn',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===sc));
      coins.forEach(c=>c.style.transition='none');place(coins[0],$('.p-j',root));place(coins[1],$('.p-m',root));tally(0,0);
      $('.p-m',root).classList.toggle('dead',sc==='a');$('.p-m small',root).textContent=sc==='a'?'morreu no impacto':'morreu 2 horas depois';
      setTimeout(()=>{coins.forEach(c=>c.style.transition='');
        if(sc==='a'){place(coins[0],$('.p-ij',root));place(coins[1],$('.p-im',root));ts.push(setTimeout(()=>tally(1e6,1e6),1300))}
        else{place(coins[0],$('.p-m',root),18);ts.push(setTimeout(()=>{place(coins[0],$('.p-im',root),-10);place(coins[1],$('.p-im',root),10)},1500));ts.push(setTimeout(()=>tally(0,2e6),2800))}
      },40);
      const m=$('.cmmsg',root);m.innerHTML=sc==='a'?'<b>Comoriência.</b> Não se sabe quem morreu antes: presume-se morte simultânea (art. 8º). Nenhum herda do outro, e cada herança vai ao próprio irmão.':'<b>Sem comoriência.</b> Maria sobreviveu a João e herdou tudo dele, porque o cônjuge afasta os colaterais (arts. 1.829, III e 1.838). Quando ela morre, os R$ 2 milhões vão ao irmão dela.';swapAnim(m);
    }
    root.addEventListener('click',e=>{const b=e.target.closest('.cmbtn');if(b)run(b.dataset.s)});
    cleanups.push(()=>ts.forEach(clearTimeout));
    setTimeout(()=>run('a'),200);
  });
  return `<div class="card cm" id="${id}"><div class="regimes"><button class="cmbtn" data-s="a" aria-pressed="true">Os dois morrem no impacto</button><button class="cmbtn" data-s="b" aria-pressed="false">Maria morre no hospital</button></div>
    <div class="cmstage"><div class="cmrow">
      <div class="p p-ij"><b>Irmão de João</b><small>colateral</small><span class="t-ij num">R$ 0</span></div>
      <div class="p p-j dead"><b>João</b><small>R$ 1 milhão</small></div>
      <div class="p p-m dead"><b>Maria</b><small>morreu no impacto</small></div>
      <div class="p p-im"><b>Irmão de Maria</b><small>colateral</small><span class="t-im num">R$ 0</span></div></div>
      <i class="coin coin1"></i><i class="coin coin2"></i></div>
    <p class="cmmsg" aria-live="polite"></p><p class="hint" style="margin:0">Casados em separação convencional, sem descendentes nem ascendentes. Cada um tinha R$ 1 milhão.</p></div>`;
}
function legitimaSlider(){
  const id=uid('lg');
  later(()=>{
    const root=$('#'+id),r=$('input[type=range]',root);let nec=true;
    function render(){const p=+r.value/100,T=1e6;$('.lgv',root).textContent=Math.round(p*100)+'%';
      $$('.lgnec button',root).forEach(b=>b.setAttribute('aria-pressed',String(nec)===b.dataset.v));
      const disp=nec?.5:1,amigo=Math.min(p,disp),exc=Math.max(0,p-disp);
      const seg=$('.lgbar',root);
      seg.innerHTML=`${nec?`<i class="lg-leg" style="width:50%"><span>Legítima</span></i>`:''}<i class="lg-am" style="width:${amigo*100}%"><span>${amigo>.08?'Amigo':''}</span></i><i class="lg-her" style="width:${(disp-amigo)*100}%"><span>${disp-amigo>.12?'Herdeiros':''}</span></i>`;
      $('.lgexc',root).style.width=exc*100+'%';$('.lgexc',root).style.right=(disp>=1?0:50)+'%';$('.lgexc',root).hidden=!exc;
      const m=$('.lgmsg',root);
      m.innerHTML=!nec?`<b>Sem herdeiros necessários, pode deixar tudo.</b> O amigo recebe ${money(p*T)}. Irmãos e sobrinhos podem ser afastados: basta não contemplá-los (art. 1.850).`:
        exc?`<b>Excede a parte disponível.</b> O testamento pede ${money(p*T)} para o amigo, mas ele recebe ${money(disp*T)}. Os ${money(exc*T)} a mais são reduzidos (art. 1.967). O testamento não é anulado.`:
        `<b>Dentro da parte disponível.</b> O amigo recebe ${money(p*T)}. A legítima de ${money(.5*T)} fica com os herdeiros necessários (art. 1.846).`;}
    r.addEventListener('input',render);$('.lgnec',root).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;nec=b.dataset.v==='true';render()});render();
  });
  return `<div class="card lg" id="${id}"><div class="lgtop"><div><span class="lab">Tem descendentes, ascendentes ou cônjuge?</span><div class="seg lgnec"><button data-v="true">Sim</button><button data-v="false">Não</button></div></div>
    <div style="flex:1;min-width:200px"><label class="lab" for="${id}-r">Deixar ao amigo: <output class="lgv num">60%</output> de R$ 1 milhão</label><input id="${id}-r" type="range" min="0" max="100" step="5" value="60"></div></div>
    <div class="lgwrap"><div class="lgbar"></div><i class="lgexc" hidden><span>reduzido</span></i></div><p class="lgmsg" aria-live="polite"></p></div>`;
}

function preferencia(){
  const id=uid('pf');
  later(()=>{
    const root=$('#'+id),r=$('input',root);const s={quem:'estranho',ofer:false};
    function render(){const d=+r.value;$('.pfd',root).textContent=d+' dias';
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      $('.pfmark',root).style.left=Math.min(d,365)/365*100+'%';
      let v;
      if(s.quem==='herdeiro')v={tone:'ok',t:'Cessão livre',d:'Entre coerdeiros não há preferência a respeitar.'};
      else if(s.ofer)v={tone:'ok',t:'Cessão válida',d:'Os coerdeiros foram consultados em igualdade de condições e não quiseram a quota (art. 1.794).'};
      else if(d<=180)v={tone:'warn',t:'Um coerdeiro pode tomar a quota',d:`Faltam ${180-d} dias. Ele deposita o preço e pede a quota para si em juízo (art. 1.795).`};
      else v={tone:'bad',t:'O prazo acabou',d:'Passados 180 dias da transmissão, o coerdeiro preterido decaiu do direito. A cessão ao estranho se consolida.'};
      const o=$('.wzout',root);o.className='wzout '+v.tone;o.innerHTML=`<b>${v.t}</b><p>${v.d}</p>`}
    root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.k==='ofer'?b.dataset.v==='true':b.dataset.v;render()});
    r.addEventListener('input',render);render();
  });
  return `<div class="card" id="${id}"><div class="wzqs">
    <div class="wzq"><span>Para quem a quota foi cedida?</span><div class="seg"><button data-k="quem" data-v="herdeiro">Outro herdeiro</button><button data-k="quem" data-v="estranho">Um estranho</button></div></div>

    <div class="wzout" aria-live="polite"></div></div>`;
}

      const M=+ins[0].value;let rem=M;const ded=[];
      [['Meação do cônjuge','brass'],['Dívidas e despesas','seal'],['Legados','muted']].forEach(([l,c],k)=>{const v=Math.min(+ins[k+1].value,rem);ded.push({l,c,v,left:(rem-v)/M});rem-=v});
      $$('output',root).forEach((o,k)=>o.textContent=money(+ins[k].value));
      $('.mwrows',root).innerHTML=`<div class="mwr"><span>Monte-mor</span><div class="track"><i style="left:0;width:100%;background:var(--ink)"></i></div><b class="num">${money(M)}</b></div>`+
        ded.map(d=>`<div class="mwr"><span>− ${d.l}</span><div class="track"><i style="left:${d.left*100}%;width:${d.v/M*100}%;background:var(--${d.c})"></i></div><b class="num">${money(d.v)}</b></div>`).join('')+
        `<div class="mwr total"><span>= Monte-partível</span><div class="track"><i style="left:0;width:${rem/M*100}%;background:var(--sage)"></i></div><b class="num">${money(rem)}</b></div>`;
      $('.mwmsg',root).innerHTML=`Os herdeiros dividem <b>${money(rem)}</b>, não ${money(M)}. ${ded[0].v?'A meação sai primeiro porque nunca foi herança: já era do cônjuge.':''}`;
    }
    ins.forEach(i=>i.addEventListener('input',render));render();
  });
  const rg=(l,v,max)=>`<div><label class="lab">${l}: <output class="num"></output></label><input type="range" min="0" max="${max}" step="25000" value="${v}"></div>`;
  return `<div class="card mw" id="${id}"><div class="mwin">${rg('Monte-mor',1000000,2000000)}${rg('Meação',300000,1000000)}${rg('Dívidas e despesas',100000,1000000)}${rg('Legados',50000,1000000)}</div><div class="mwrows"></div><p class="mwmsg"></p></div>`;
}
function ladder(){
  const id=uid('ld');
  const C=[['desc','Descendentes','I','filhos, netos, bisnetos'],['asc','Ascendentes','II','pais, avós, bisavós'],['conj','Cônjuge','III','ou companheiro'],['col','Colaterais','IV','irmãos, sobrinhos, tios, primos']];
  later(()=>{
    const root=$('#'+id),s={desc:true,asc:true,conj:true,col:true};
    function render(){
      $$('.ldt button',root).forEach(b=>b.setAttribute('aria-pressed',s[b.dataset.k]));
      const called=C.find(c=>s[c[0]]);
      $$('.rung',root).forEach(r=>{const k=r.dataset.k;const isC=called&&called[0]===k;r.className='rung'+(isC?' called':'')+(!s[k]?' absent':called&&!isC&&C.findIndex(c=>c[0]===k)>C.findIndex(c=>c[0]===called[0])?' below':'');
        const tag=$('.rtag',r);tag.textContent=isC?'Chamados':!s[k]?'Não há':called&&C.findIndex(c=>c[0]===k)>C.findIndex(c=>c[0]===called[0])?'Excluídos':'';
        const cj=$('.rconj',r);cj.hidden=!(isC&&s.conj&&(k==='desc'||k==='asc'));cj.textContent=k==='desc'?'+ cônjuge, conforme o regime (aula 9)':'+ cônjuge, em qualquer regime (aula 10)'});
      const m=$('.ldmsg',root);m.innerHTML=!called?'<b>Ninguém foi chamado.</b> A herança fica jacente e, depois, vacante, indo ao Município (aula 13).':called[0]==='desc'?'<b>Descendentes primeiro.</b> Os de grau mais próximo excluem os mais remotos (art. 1.833).':called[0]==='asc'?'<b>Sem descendentes, sobem os ascendentes.</b> Não há representação na linha ascendente (art. 1.852).':called[0]==='conj'?'<b>O cônjuge herda tudo</b>, qualquer que seja o regime (art. 1.838).':'<b>Colaterais até o 4º grau</b>, os mais próximos excluindo os mais remotos (arts. 1.839 e 1.840).';swapAnim(m)}
    $('.ldt',root).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;s[b.dataset.k]=!s[b.dataset.k];render()});render();
  });
  return `<div class="card ld" id="${id}"><span class="lab">Quem sobreviveu ao falecido? Toque para ligar ou desligar.</span><div class="ldt">${C.map(c=>`<button data-k="${c[0]}" aria-pressed="true">${c[1]}</button>`).join('')}</div>
    <ol class="ladder">${C.map(c=>`<li class="rung" data-k="${c[0]}"><span class="rn">${c[2]}</span><div><b>${c[1]}</b><small>${c[3]}</small><em class="rconj" hidden></em></div><span class="rtag"></span></li>`).join('')}</ol><p class="ldmsg" aria-live="polite"></p></div>`;
}

function conjugeCalc(){
  const id=uid('cj');
  later(()=>{
    const root=$('#'+id),st={r:'cp',aq:800000,pt:300000,fc:2,fo:0};
    const P=[{r:'cp',aq:800000,pt:300000,fc:2,fo:0},{r:'cp',aq:600000,pt:0,fc:2,fo:0},{r:'sc',aq:0,pt:1000000,fc:4,fo:0},{r:'sc',aq:0,pt:1000000,fc:3,fo:1},{r:'cu',aq:600000,pt:0,fc:2,fo:0}];
    const aqI=$('.cj-aq',root),ptI=$('.cj-pt',root);
    function sync(){aqI.value=st.aq;ptI.value=st.pt;$('.cj-fc',root).textContent=st.fc;$('.cj-fo',root).textContent=st.fo;$$('.cj-reg button',root).forEach(b=>b.setAttribute('aria-pressed',b.dataset.r===st.r))}
    function calc(){
      const o=$('.cout',root),n=st.fc+st.fo;
      if(n===0){o.innerHTML='<p class="eyebrow">Sem descendentes</p><p>Sem filhos, o cônjuge concorre com os ascendentes (art. 1.837, aula 10) ou herda tudo (art. 1.838, aula 11).</p>';return}
      const total=st.aq+st.pt;if(total<=0){o.innerHTML='<p class="eyebrow">Monte-mor vazio</p><p>Informe ao menos um valor de bens.</p>';return}
      const F=[];for(let i=0;i<st.fc;i++)F.push({n:'c'+i,st:'vivo',comum:true,netos:[]});for(let i=0;i<st.fo;i++)F.push({n:'o'+i,st:'vivo',comum:false,netos:[]});
      const x=partilhaDesc(F,{regime:st.r,aq:st.aq,pt:st.pt},0),per=x.rows[0].v;
      const W_=v=>(v/total*100)+'%';
      let segs=`<i class="seg-meacao" style="width:${W_(x.meacao)}" title="Meação"></i><i class="seg-conj" style="width:${W_(x.conj)}" title="Herança do cônjuge"></i>`;
      for(let i=0;i<st.fc;i++)segs+=`<i class="seg-fc" style="width:${W_(per)};opacity:${1-i%2*.18}" title="Filho do casal"></i>`;
      for(let i=0;i<st.fo;i++)segs+=`<i class="seg-fo" style="width:${W_(per)}" title="Filho só do falecido"></i>`;
      o.innerHTML=`<div><p class="eyebrow">Monte-mor</p><p style="font-family:var(--serif);font-size:1.8rem" class="num">${money(total)}</p></div>
        <div class="stack" role="img" aria-label="Divisão do patrimônio">${segs}</div>
        <ul class="who"><li><i class="seg-meacao"></i><span>Meação do cônjuge <small>(não é herança)</small></span><b>${money(x.meacao)}</b></li>
          <li><i class="seg-conj"></i><span>Herança do cônjuge</span><b>${money(x.conj)}</b></li>
          ${st.fc?`<li><i class="seg-fc"></i><span>Cada filho do casal <small>× ${st.fc}</small></span><b>${money(per)}</b></li>`:''}
          ${st.fo?`<li><i class="seg-fo"></i><span>Cada filho só do falecido <small>× ${st.fo}</small></span><b>${money(per)}</b></li>`:''}
          <li class="tot"><i></i><span><b>Total do cônjuge</b></span><b>${money(x.meacao+x.conj)}</b></li></ul>
        <ol class="rule">${x.why.map(w=>`<li>${w}</li>`).join('')}</ol><p style="font-size:.8rem;color:var(--muted)">Simplificação didática: sem dívidas, despesas, legados ou testamento.</p>`;
    }
    sync();calc();
    root.addEventListener('click',e=>{const b=e.target.closest('.cj-reg button');if(b){st.r=b.dataset.r;sync();calc()}
      const p=e.target.closest('[data-p]');if(p){Object.assign(st,P[+p.dataset.p]);sync();calc()}
      const s=e.target.closest('[data-s]');if(s){const k=s.dataset.s;st[k]=Math.max(0,Math.min(8,st[k]+(+s.dataset.d)));sync();calc()}});
    aqI.addEventListener('input',()=>{st.aq=Math.max(0,+aqI.value||0);calc()});ptI.addEventListener('input',()=>{st.pt=Math.max(0,+ptI.value||0);calc()});
  });
  return `<div id="${id}"><div class="presets"><button class="btn small" data-p="0">Caso da aula: comunhão parcial</button><button class="btn small" data-p="1">Sem bens particulares</button><button class="btn small" data-p="2">Quatro filhos em comum</button><button class="btn small" data-p="3">Filiação híbrida</button><button class="btn small" data-p="4">Comunhão universal</button></div>
    <div class="calc"><div class="card cin">
      <div><span class="lab">Regime de bens</span><div class="seg cj-reg">${REGS.map(r=>`<button data-r="${r[0]}">${r[1]}</button>`).join('')}</div></div>
      <div><label class="lab" for="${id}-aq">Bens adquiridos onerosamente no casamento</label><small>compras feitas durante a união</small><div class="money"><span>R$</span><input id="${id}-aq" class="cj-aq" type="number" min="0" step="50000" inputmode="numeric"></div></div>
      <div><label class="lab" for="${id}-pt">Bens particulares do falecido</label><small>anteriores ao casamento, herdados ou recebidos em doação</small><div class="money"><span>R$</span><input id="${id}-pt" class="cj-pt" type="number" min="0" step="50000" inputmode="numeric"></div></div>
      <div class="steppers"><div><span class="lab">Filhos do casal</span><div class="stp"><button data-s="fc" data-d="-1" aria-label="Menos um filho do casal">−</button><output class="num cj-fc">2</output><button data-s="fc" data-d="1" aria-label="Mais um filho do casal">+</button></div></div>
        <div><span class="lab">Filhos só do falecido</span><div class="stp"><button data-s="fo" data-d="-1" aria-label="Menos um filho só do falecido">−</button><output class="num cj-fo">0</output><button data-s="fo" data-d="1" aria-label="Mais um filho só do falecido">+</button></div></div></div>
    </div><div class="card cout" aria-live="polite"></div></div></div>`;
}

}

function ascTree(){
  const id=uid('at');
  const N={avoP:'Avô paterno',avaP:'Avó paterna',avoM:'Avô materno',avaM:'Avó materna',pai:'Pai',mae:'Mãe',conj:'Cônjuge'};
  later(()=>{
    const root=$('#'+id),s={avoP:true,avaP:true,avoM:true,avaM:true,pai:false,mae:true,conj:true};
    function calc(){const r={};let msg;const g1=['pai','mae'].filter(k=>s[k]);
      if(g1.length){
        if(s.conj){if(g1.length===2){r.conj=r.pai=r.mae=1/3;msg='Pai e mãe vivos, com cônjuge: 1/3 para cada um (art. 1.837).'}else{r.conj=.5;r[g1[0]]=.5;msg='Um só ascendente de 1º grau com o cônjuge: metade para cada (art. 1.837).'}}
        else{g1.forEach(k=>r[k]=1/g1.length);msg=g1.length===2?'Pai e mãe herdam por direito próprio, metade cada.':'O único ascendente de 1º grau herda tudo.'}
        if(g1.length===1&&['avoP','avaP','avoM','avaM'].some(k=>s[k]))msg+=' Os avós ficam de fora, mesmo os do outro lado: o grau mais próximo exclui o mais remoto, sem distinção de linhas, e não há representação (arts. 1.836, §1º e 1.852).';
      }else{const P=['avoP','avaP'].filter(k=>s[k]),M=['avoM','avaM'].filter(k=>s[k]);
        if(!P.length&&!M.length){if(s.conj){r.conj=1;msg='Sem descendentes nem ascendentes, o cônjuge herda tudo (art. 1.838).'}else msg='Sem ascendentes nem cônjuge: chamam-se os colaterais (aula 12).'}
        else{const pool=s.conj?.5:1;if(s.conj)r.conj=.5;const lines=[P,M].filter(l=>l.length);lines.forEach(l=>l.forEach(k=>r[k]=pool/lines.length/l.length));
          msg=(s.conj?'Com ascendentes de grau maior, o cônjuge fica com metade (art. 1.837). ':'')+(lines.length===2?'O que cabe aos avós se divide por linha: metade paterna, metade materna, e por cabeça dentro de cada linha (art. 1.836, §2º).':'Só uma linha tem avós vivos, e ela leva tudo o que cabe aos ascendentes.')}}
      return {r,msg}}
    function render(){const x=calc();
      $$('.an',root).forEach(b=>{const k=b.dataset.k,v=x.r[k];b.classList.toggle('dead',!s[k]);b.classList.toggle('heir',!!v);$('.av',b).textContent=!s[k]?(k==='conj'?'não há':'falecido'):v?fmtP(v):'não herda';$('.ab i',b).style.width=(v||0)*100+'%'});
      const m=$('.atmsg',root);m.textContent=x.msg;swapAnim(m)}
    root.addEventListener('click',e=>{const b=e.target.closest('.an');if(b){s[b.dataset.k]=!s[b.dataset.k];render()}
      const p=e.target.closest('[data-p]');if(p){const P={a:{avoP:1,avaP:1,avoM:1,avaM:1,pai:1,mae:1,conj:1},b:{avoP:1,avaP:1,avoM:1,avaM:1,pai:0,mae:1,conj:0},c:{avoP:1,avaP:1,avoM:0,avaM:1,pai:0,mae:0,conj:0},d:{avoP:1,avaP:1,avoM:1,avaM:1,pai:0,mae:0,conj:1}}[p.dataset.p];Object.keys(P).forEach(k=>s[k]=!!P[k]);render()}});
    render();
  });
  const node=k=>`<button class="an" data-k="${k}"><b>${N[k]}</b><span class="av"></span><span class="ab"><i></i></span></button>`;
  return `<div class="card at" id="${id}"><div class="presets"><button class="btn small" data-p="a">Pais vivos e cônjuge</button><button class="btn small" data-p="b">Só a mãe e os avós</button><button class="btn small" data-p="c">Três avós</button><button class="btn small" data-p="d">Avós e cônjuge</button></div>
    <p class="hint">Toque em uma pessoa para marcá-la como viva ou falecida. O falecido não deixou descendentes.</p>
    <div class="atgrid"><div class="atline p"><small>Linha paterna</small>${node('avoP')}${node('avaP')}</div><div class="atline m"><small>Linha materna</small>${node('avoM')}${node('avaM')}</div>
      <div class="atpar">${node('pai')}</div><div class="atpar">${node('mae')}</div>
      <div class="atego"><div class="ego">Falecido</div>${node('conj')}</div></div>
    <p class="atmsg verdict" aria-live="polite"></p></div>`;
}
function multiParent(){
  const id=uid('mp');
  later(()=>{
    const root=$('#'+id);let conj=false;
    function render(){const n=+$('#'+id+'-n').textContent;$$('.seg button',root).forEach(b=>b.setAttribute('aria-pressed',String(conj)===b.dataset.v));
      const rows=[];if(conj)rows.push(['Cônjuge',1/3,'brass']);const each=(conj?2/3:1)/n;for(let i=0;i<n;i++)rows.push([['Mãe biológica','Pai biológico','Mãe socioafetiva','Pai socioafetivo'][i],each,'sage']);
      $('.mprows',root).innerHTML=rows.map(r=>`<div class="rb"><span>${r[0]}</span><div class="track"><i style="width:${r[1]*100}%;background:var(--${r[2]})"></i></div><b class="num">${fmtP(r[1])}</b></div>`).join('');
      $('.rmsg',root).innerHTML=!conj?`<b>${n} genitores, ${n} linhas.</b> Pelo Enunciado 642, a herança se divide em tantas linhas quantos sejam os genitores: ${fmtP(1/n)} para cada.`:
        n===2?'<b>Dois genitores com o cônjuge:</b> é a conta clássica do art. 1.837, 1/3 para cada.':`<b>Questão em aberto.</b> Pela letra do art. 1.837, o cônjuge fica com 1/3 e os ${n} genitores dividem 2/3 (${fmtP(each)} cada). Parte da doutrina critica essa conta, e a solução tem ficado com o juiz, caso a caso.`}
    onStep(root,render);$('.seg',root).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;conj=b.dataset.v==='true';render()});render();
  });
  return `<div class="card" id="${id}"><div class="steppers">${stepper(id+'-n','Genitores registrados',3,2,4)}<div><span class="lab">Deixou cônjuge?</span><div class="seg" style="margin-top:6px"><button data-v="true">Sim</button><button data-v="false">Não</button></div></div></div>
    <div class="rbars mprows" style="margin-top:18px"></div><p class="rmsg" aria-live="polite"></p></div>`;
}

function kinship(){
  const id=uid('kn');
  const NO={bis:[300,40,'Bisavô'],avo:[220,110,'Avô'],tioavo:[380,110,'Tio-avô'],pai:[140,180,'Pai'],tio:[300,180,'Tio'],irmao:[80,250,'Irmão'],ego:[200,250,'Falecido'],primo:[320,250,'Primo'],sob:[80,320,'Sobrinho'],fprimo:[320,320,'Filho do primo'],sobneto:[80,390,'Sobrinho-neto']};
  const E=[['bis','avo'],['bis','tioavo'],['avo','pai'],['avo','tio'],['pai','ego'],['pai','irmao'],['tio','primo'],['irmao','sob'],['sob','sobneto'],['primo','fprimo']];
  const RETA={pai:1,avo:2,bis:3};
  later(()=>{
    const root=$('#'+id);let ts=[];
    function path(to){const adj={};E.forEach(([a,b])=>{(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a)});const prev={ego:null},q=['ego'];while(q.length){const c=q.shift();(adj[c]||[]).forEach(n=>{if(!(n in prev)){prev[n]=c;q.push(n)}})}const p=[];let c=to;while(c){p.unshift(c);c=prev[c]}return p}
    function pick(k){ts.forEach(clearTimeout);ts=[];$$('.ke',root).forEach(e=>e.classList.remove('on'));$$('.kn',root).forEach(n=>n.classList.toggle('sel',n.dataset.k===k));
      const p=path(k),g=p.length-1;const cnt=$('.kcount',root);cnt.textContent='0';
      for(let i=1;i<p.length;i++)ts.push(setTimeout(()=>{const a=p[i-1],b=p[i];const e=$(`.ke[data-e="${a}-${b}"]`,root)||$(`.ke[data-e="${b}-${a}"]`,root);e&&e.classList.add('on');cnt.textContent=i},i*420));
      const reta=RETA[k];const m=$('.kmsg',root);
      ts.push(setTimeout(()=>{m.innerHTML=reta?`<b>${NO[k][2]}: linha reta, ${g}º grau.</b> Ascendente, não colateral: herda na 2ª classe (aula 10).`:g<=4?`<b>${NO[k][2]}: colateral de ${g}º grau.</b> Sobe-se até o ancestral comum e desce-se até o parente, contando uma geração por traço. Pode herdar (art. 1.839).`:`<b>${NO[k][2]}: colateral de ${g}º grau.</b> Passa do 4º grau: não herda.`;swapAnim(m)},p.length*420));}
    root.addEventListener('click',e=>{const n=e.target.closest('.kn');if(n&&n.dataset.k!=='ego')pick(n.dataset.k)});
    cleanups.push(()=>ts.forEach(clearTimeout));setTimeout(()=>pick('primo'),300);
  });
  return `<div class="card kin" id="${id}"><div class="kintop"><p class="hint" style="margin:0">Toque em um parente para contar o grau.</p><div class="kc"><b class="kcount num">0</b><small>graus</small></div></div>
    <div class="kinsvg"><svg viewBox="0 0 460 420" role="img" aria-label="Árvore de parentesco para contar graus">
      ${E.map(([a,b])=>`<line class="ke" data-e="${a}-${b}" x1="${NO[a][0]}" y1="${NO[a][1]}" x2="${NO[b][0]}" y2="${NO[b][1]}"/>`).join('')}
      ${Object.entries(NO).map(([k,[x,y,l]])=>`<g class="kn${k==='ego'?' ego':''}" data-k="${k}" tabindex="${k==='ego'?-1:0}" role="button" aria-label="${l}"><rect x="${x-54}" y="${y-17}" width="108" height="34" rx="6"/><text x="${x}" y="${y+5}" text-anchor="middle">${l}</text></g>`).join('')}
    </svg></div><p class="kmsg" aria-live="polite"></p></div>`;
}

/* ---------- Aula 14 · Testamento: validade, limites e capacidade ---------- */
function capacidade(){
  const id=uid('cp');
  later(()=>{
    const root=$('#'+id),r=$('input',root),s={luc:true,dep:false};
    function render(){const age=+r.value;$('.cpa',root).textContent=age+' anos';
      $$('[data-k]',root).forEach(b=>b.setAttribute('aria-pressed',String(s[b.dataset.k])===b.dataset.v));
      const v=age<16?{tone:'bad',t:'Não pode testar',d:'Só os maiores de 16 anos podem testar (art. 1.860, p.u.).'}:
        !s.luc?{tone:'bad',t:'Testamento inválido',d:'Sem pleno discernimento no momento do ato, o testamento não vale, nem se valida se a pessoa recuperar a lucidez depois (arts. 1.860 e 1.861).'}:
        s.dep?{tone:'ok',t:'Testamento válido',d:'A capacidade se afere no momento do ato. A incapacidade superveniente não invalida o testamento (art. 1.861).'}:
        {tone:'ok',t:'Pode testar',d:age<18?'Aos '+age+' anos já pode testar, e sem assistência dos pais: o testamento é ato personalíssimo.':'Maior de 16 anos e com discernimento no ato.'};
      const o=$('.wzout',root);o.className='wzout '+v.tone;o.innerHTML=`<b>${v.t}</b><p>${v.d}</p>`}
    r.addEventListener('input',render);root.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;s[b.dataset.k]=b.dataset.v==='true';render()});render();
  });
  return `<div class="card" id="${id}"><label class="lab" for="${id}-r">Idade no dia do testamento: <output class="cpa num"></output></label><input id="${id}-r" type="range" min="12" max="95" value="17">
    <div class="wzqs" style="margin-top:14px"><div class="wzq"><span>Tinha pleno discernimento no momento do ato?</span><div class="seg"><button data-k="luc" data-v="true">Sim</button><button data-k="luc" data-v="false">Não</button></div></div>
    <div class="wzq"><span>Perdeu a lucidez anos depois, por doença?</span><div class="seg"><button data-k="dep" data-v="true">Sim</button><button data-k="dep" data-v="false">Não</button></div></div></div>
    <div class="wzout" aria-live="polite"></div></div>`;
}
